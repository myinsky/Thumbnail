<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Shorts Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap');

  :root{
    --bg:#EEF3FB;
    --panel:#FFFFFF;
    --card:#FFFFFF;
    --border:#E1E8F5;
    --violet:#2955C8;
    --coral:#F0781E;
    --mint:#18A063;
    --text-hi:#1C2740;
    --text-lo:#5C6A88;
    --text-faint:#9AA6C0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-hi);
    font-family:'Inter',sans-serif; font-size:15px;
    display:flex; height:100vh; overflow:hidden;
  }
  ::selection{background:rgba(41,85,200,0.18);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:272px; flex-shrink:0;
    background:linear-gradient(180deg, #FBFCFF, #F1F5FD);
    border-right:1px solid var(--border);
    box-shadow:2px 0 14px rgba(28,39,64,0.04);
    display:flex; flex-direction:column;
    padding:32px 16px 22px;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:800; font-size:15px; color:var(--text-hi);
    padding:8px 10px 16px; letter-spacing:-0.01em; cursor:pointer;
    border-bottom:1px solid var(--border); margin-bottom:14px;
  }
  .brand-badge{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg, var(--violet), #4C7BEF);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0;
    box-shadow:0 3px 10px rgba(41,85,200,0.3);
  }
  .brand span{color:var(--coral);}
  .nav-home{
    display:flex; align-items:center; gap:10px; padding:11px 13px;
    border-radius:9px; cursor:pointer; color:var(--text-hi); font-size:13.5px;
    margin-bottom:8px; font-weight:700; transition:all .15s;
    background:#fff; border:1px solid var(--border);
  }
  .nav-home:hover{border-color:var(--violet); box-shadow:0 2px 8px rgba(41,85,200,0.12);}
  .nav-home.active{
    background:linear-gradient(135deg, var(--violet), #4C7BEF);
    color:#fff; border-color:transparent;
    box-shadow:0 4px 14px rgba(41,85,200,0.32);
  }
  .nav-divider{border-top:1px solid var(--border); margin:6px 4px 12px;}

  .steps{list-style:none; margin:0; padding:0; flex:1;}
  .step-item{
    display:flex; align-items:center; gap:10px;
    padding:12px 10px 12px 13px; border-radius:9px; margin-bottom:5px;
    cursor:pointer; transition:all .15s ease;
    color:var(--text-hi); font-size:13.5px; font-weight:500;
    background:#fff; border:1px solid var(--border); border-left:3px solid var(--border);
  }
  .step-item:hover{border-color:var(--violet); border-left-color:var(--violet); box-shadow:0 2px 8px rgba(41,85,200,0.1);}
  .step-item.active{
    background:linear-gradient(135deg, var(--violet), #4C7BEF);
    color:#fff; font-weight:700; border-color:transparent; border-left-color:#D8B978;
    box-shadow:0 4px 16px rgba(41,85,200,0.34);
  }
  .step-item.active .num{background:#D8B978; border-color:#D8B978; color:#1C2740; box-shadow:none;}
  .step-item.done{border-left-color:var(--mint);}
  .step-item.done .num{background:var(--mint); border-color:var(--mint); color:#fff;}
  .num{
    width:23px; height:23px; border-radius:50%; border:1.5px solid #C7D3EC;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; flex-shrink:0;
    color:var(--violet); background:#EAF0FE; transition:all .15s ease;
  }
  .step-item.done .num::after{content:'✓'; }
  .step-item.done .num span{display:none;}

  .sidebar-foot{
    border-top:1px solid var(--border); padding-top:14px; margin-top:8px;
  }
  .foot-btn{
    width:100%; background:#FFF1E4; border:1px solid #FBD9AF; color:var(--coral);
    padding:10px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .foot-btn:hover{background:var(--coral); color:#fff; box-shadow:0 3px 10px rgba(240,120,30,0.3);}

  /* ---------- MAIN ---------- */
  .main{flex:1; overflow-y:auto; padding:32px 40px 60px;}
  .main-inner{max-width:1012px; margin:0 auto;}
  .main-inner.wide{max-width:none;}

  .stage-header{
    padding-bottom:20px; margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .stage-eyebrow{
    font-size:13px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--violet); margin-bottom:8px;
  }
  .stage-title{
    font-size:27px; font-weight:800;
    letter-spacing:-0.02em; margin-bottom:0; color:var(--text-hi);
  }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:24px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(28,39,64,0.03), 0 6px 18px rgba(28,39,64,0.045);
  }
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:#FFF4E9; border:1px solid #FBD9AF; border-radius:12px;
    padding:13px 18px; margin-bottom:18px; font-size:13.5px; color:#9A5410;
  }
  .card h3{
    font-size:15.5px; font-weight:700;
    margin:0 0 12px; color:var(--text-hi);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:13px; color:var(--text-lo); margin-bottom:6px;
  }
  input[type=text], input[type=password], textarea, select{
    width:100%; background:#fff; border:2px solid #8FA3C7; color:var(--text-hi);
    padding:11px 13px; border-radius:9px; font-family:'Inter',sans-serif; font-size:14.5px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(41,85,200,0.16);
  }
  #huntKeywordInput, #youtubeQueryInput, #tiktokQueryInput, #douyinQueryInput, #xhsQueryInput, #coupangQueryInput,
  #ytMaterialKw{
    border-color:#6F89B8; border-width:2.5px;
  }
  textarea{resize:vertical; min-height:80px;}
  /* 대본·스토리 아이디어는 길게 붙여넣는 칸이라 기본 높이를 크게 (드래그로 더 조절 가능) */
  #storyInputBox{min-height:360px; line-height:1.65;}

  .upload-zone{
    border:1.5px dashed #C7D3EC; border-radius:14px; padding:36px 20px;
    text-align:center; cursor:pointer; transition:all .15s; background:#F8FAFE;
  }
  .upload-zone:hover{border-color:var(--violet); background:#EEF3FE;}
  .upload-zone img{max-width:100%; max-height:220px; border-radius:8px;}
  .upload-zone .hint{color:var(--text-faint); font-size:12.5px; margin-top:8px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--violet); color:#fff; border:none; padding:11px 22px;
    border-radius:10px; font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; transition:transform .1s, box-shadow .15s;
    box-shadow:0 2px 6px rgba(41,85,200,0.25);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(41,85,200,0.3);}
  .btn:disabled{background:#DDE4F1; color:var(--text-faint); cursor:not-allowed; box-shadow:none; transform:none;}
  .btn.secondary{background:#fff; border:2px solid #8FA3C7; color:var(--text-lo); box-shadow:none;}
  .btn.secondary:hover{border-color:var(--violet); color:var(--violet); box-shadow:none;}
  .btn.coral{background:var(--coral); box-shadow:0 2px 6px rgba(240,120,30,0.3);}
  .btn.coral:hover{box-shadow:0 4px 12px rgba(240,120,30,0.35);}

  .status{
    display:flex; align-items:flex-start; gap:8px; font-size:13.5px; color:var(--text-lo);
    margin-top:12px; line-height:1.5; max-width:100%;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); margin-top:6px; flex-shrink:0;}
  .status.loading{
    align-items:stretch; gap:12px;
    margin-top:14px; padding:14px 14px 12px;
    border-radius:14px;
    border:1.5px solid #9BB6F0;
    background:linear-gradient(135deg, #EEF4FF 0%, #F8FBFF 55%, #FFF7F0 100%);
    box-shadow:0 8px 24px rgba(41,85,200,0.10);
    color:var(--text-hi);
    animation:statusGlow 2.4s ease-in-out infinite;
  }
  .status.loading .dot{display:none;}
  .status.ok .dot{background:var(--mint);}
  .status.err{
    color:#9A3412; background:#FFF7ED; border:1px solid #FDBA74; border-radius:10px;
    padding:10px 12px; font-size:14px; font-weight:600; white-space:pre-wrap; word-break:break-word;
  }
  .status.err .dot{background:var(--coral); margin-top:7px;}
  .status-spinner{
    width:28px; height:28px; flex-shrink:0; margin-top:2px;
    border-radius:50%;
    border:3px solid #C7D7F5;
    border-top-color:var(--violet);
    border-right-color:#F0781E;
    animation:statusSpin .75s linear infinite;
  }
  .status-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
  .status-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .status-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:800; letter-spacing:0.02em;
    color:#1D4ED8; background:#DBEAFE; border:1px solid #93C5FD;
    border-radius:999px; padding:3px 9px; line-height:1.2;
  }
  .status-badge::before{
    content:''; width:6px; height:6px; border-radius:50%; background:#2955C8;
    animation:pulse .9s ease-in-out infinite;
  }
  .status-text{font-size:14px; font-weight:700; color:#1C2740; line-height:1.4;}
  .status-track{
    position:relative; height:8px; border-radius:999px; overflow:hidden;
    background:#D9E4F7;
  }
  .status-bar{
    position:absolute; inset:0 auto 0 0; width:36%;
    border-radius:inherit;
    background:linear-gradient(90deg, #2955C8, #4C7BEF, #F0781E);
    animation:statusIndeterminate 1.35s ease-in-out infinite;
  }
  .status-bar.is-determinate{
    animation:none;
    transition:width .35s ease;
  }
  .status-meta{font-size:12px; color:#5C6A88; font-weight:600;}
  .status-steps{display:flex; gap:4px; margin-top:2px;}
  .status-step{
    flex:1; height:4px; border-radius:999px; background:#D5E0F4;
  }
  .status-step.on{background:linear-gradient(90deg,#2955C8,#4C7BEF);}
  .status-step.now{background:#F0781E; animation:pulse .9s ease-in-out infinite;}
  .thumb.is-working, .cast-working{
    position:relative; overflow:hidden;
  }
  .thumb.is-working::after, .cast-working::after{
    content:'생성 중'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(28,39,64,0.45); color:#fff;
    font-size:12px; font-weight:800; letter-spacing:0.02em;
    backdrop-filter:blur(1px);
    animation:pulse 1.2s ease-in-out infinite;
  }
  .btn.is-working{
    position:relative; pointer-events:none; opacity:0.92;
    background:linear-gradient(90deg,#2955C8,#4C7BEF,#2955C8);
    background-size:200% 100%;
    animation:btnShimmer 1.4s linear infinite;
  }
  @keyframes pulse{50%{opacity:0.3;}}
  @keyframes statusSpin{to{transform:rotate(360deg);}}
  @keyframes statusIndeterminate{
    0%{transform:translateX(-70%); width:35%;}
    50%{width:55%;}
    100%{transform:translateX(220%); width:35%;}
  }
  @keyframes statusGlow{
    0%,100%{box-shadow:0 8px 24px rgba(41,85,200,0.08);}
    50%{box-shadow:0 10px 28px rgba(41,85,200,0.18);}
  }
  @keyframes btnShimmer{to{background-position:200% 0;}}

  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  th{
    text-align:left; color:var(--text-faint); font-weight:700; font-size:11px;
    text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--text-lo);}
  td:first-child{color:var(--violet); font-weight:700; font-size:12.5px; white-space:nowrap; width:28%;}

  .ax-scores{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 4px;}
  .ax-score{
    background:#F4F8FF; border:1px solid #C7D7F5; border-radius:12px; padding:12px 10px; text-align:center;
  }
  .ax-score b{display:block; font-size:22px; font-weight:800; color:var(--violet); line-height:1.1; margin-bottom:4px;}
  .ax-score span{font-size:11px; color:var(--text-lo); font-weight:600;}
  .ax-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .ax-chip{
    background:#EEF3FB; border:1px solid var(--border); color:var(--text-hi);
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px;
  }
  .ax-chip.pro{background:#EBFBF3; border-color:#9EDCC0; color:#0F7B52;}
  .ax-chip.con{background:#FFF1F0; border-color:#F5C2C0; color:#B42318;}
  .ax-chip.hook{background:#FFF7E8; border-color:#F3D98B; color:#8A5A00;}
  .ax-section{margin-top:14px;}
  .ax-section h4{font-size:12.5px; font-weight:800; margin:0 0 8px; color:var(--text-hi);}
  .ax-p{font-size:13px; line-height:1.65; color:var(--text-lo); margin:0;}
  .ax-list{margin:0; padding-left:18px; color:var(--text-lo); font-size:13px; line-height:1.65;}
  .ax-meta{font-size:11.5px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
  @media (max-width:720px){
    .ax-scores{grid-template-columns:repeat(2,1fr);}
  }

  /* 크로스 플랫폼 영상/콘텐츠 찾기 */
  .ph-card{margin-top:16px; border:1.5px solid #A9C6FA;}
  .ph-head{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
  .ph-kw-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 12px;}
  .ph-kw-grid .field{margin:0;}
  .ph-plats{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:12px;}
  .ph-plat{
    border:1.5px solid var(--border); background:#fff; border-radius:12px; padding:10px 8px;
    cursor:pointer; text-align:center; font:inherit; color:inherit; min-width:0;
  }
  .ph-plat:hover{border-color:var(--violet); background:#F4F8FF;}
  .ph-plat.active{border-color:var(--violet); background:#EAF0FC; box-shadow:0 0 0 1px var(--violet);}
  .ph-plat .ico{display:block; font-size:18px; line-height:1.2; margin-bottom:4px;}
  .ph-plat .nm{display:block; font-size:12px; font-weight:800; color:var(--text-hi);}
  .ph-plat .kd{display:block; font-size:10px; color:var(--text-faint); margin-top:2px;}
  .ph-plat .st{display:block; font-size:10px; font-weight:700; margin-top:5px; color:var(--violet);}
  .ph-body{background:#F7FAFF; border:1px solid #D5E0F2; border-radius:12px; padding:14px;}
  .ph-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;}
  .ph-result{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .ph-item{
    display:flex; gap:10px; text-decoration:none; color:inherit; padding:8px;
    border:1px solid var(--border); border-radius:10px; background:#fff;
  }
  .ph-item:hover{border-color:var(--violet);}
  @media (max-width:900px){
    .ph-plats{grid-template-columns:repeat(3,minmax(0,1fr));}
    .ph-kw-grid{grid-template-columns:1fr;}
  }
  @media (max-width:560px){
    .ph-plats{grid-template-columns:repeat(2,minmax(0,1fr));}
  }

  /* 영상 소재 찾기 */
  .hunt-period-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px;}
  .hunt-period{
    border:2px solid #8FA3C7; background:#fff; border-radius:999px;
    padding:7px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:var(--text-lo);
  }
  .hunt-period:hover{border-color:var(--violet); color:var(--text-hi);}
  .hunt-period.active{border-color:var(--violet); background:#EAF0FC; color:var(--violet); box-shadow:0 0 0 2px rgba(41,85,200,0.2);}
  .hunt-period:disabled{opacity:.4; cursor:not-allowed;}
  .hunt-track-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;}
  .hunt-track{
    border:2.5px solid #8FA3C7; background:#fff; border-radius:12px; padding:14px 16px;
    text-align:left; font:inherit; cursor:pointer; color:inherit; user-select:none;
  }
  .hunt-track:hover{border-color:var(--violet); background:#F4F8FF;}
  .hunt-track.active{
    border-color:var(--violet); background:#EAF0FC;
    box-shadow:0 0 0 2px rgba(41,85,200,0.22);
  }
  .hunt-track b, .hunt-track span{pointer-events:none;}
  .hunt-track b{display:block; font-size:14px; margin-bottom:4px; color:var(--text-hi);}
  .hunt-track span{display:block; font-size:12.5px; color:var(--text-lo); line-height:1.45;}
  .hunt-plat-badge{
    display:inline-block; font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px;
    margin-left:6px; vertical-align:middle;
  }
  .hunt-plat-badge.ok{background:#EBFBF3; color:#0F7B52;}
  .hunt-plat-badge.review{background:#FFF7E8; color:#8A5A00;}
  .hunt-plat-badge.off{background:#F1F5FC; color:var(--text-faint);}
  .hunt-plat-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .hunt-plat-toggles{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px;}
  .hunt-plat-toggle{
    border:2px solid #8FA3C7; background:#fff; border-radius:12px; padding:10px 14px;
    font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--text-lo);
    user-select:none; min-width:108px; text-align:center;
  }
  .hunt-plat-toggle:hover{border-color:var(--violet); color:var(--text-hi); background:#F4F8FF;}
  .hunt-plat-toggle.active{
    border-color:var(--violet); background:var(--violet); color:#fff;
    box-shadow:0 2px 8px rgba(41,85,200,0.28);
  }
  .hunt-plat-toggle .sub{display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:3px; pointer-events:none;}
  .hunt-plat-toggle > span{pointer-events:none;}
  .hunt-main-row{
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(240px,0.85fr);
    gap:14px; align-items:stretch; margin-bottom:14px;
  }
  .hunt-main-left{
    border:2px solid #D5E0F2; border-radius:14px; padding:14px; background:#F8FAFE;
  }
  .hunt-main-right{
    border:2.5px solid var(--violet); border-radius:14px; padding:16px;
    background:linear-gradient(180deg,#F4F8FF,#EEF3FE); display:flex; flex-direction:column; gap:10px;
  }
  .hunt-main-right h4{margin:0; font-size:15px; font-weight:800; color:var(--text-hi);}
  .hunt-limit-row{display:flex; flex-wrap:wrap; gap:6px;}
  .hunt-limit{
    border:2px solid #8FA3C7; background:#fff; border-radius:999px;
    padding:7px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; color:var(--text-lo);
  }
  .hunt-limit:hover{border-color:var(--violet); color:var(--text-hi);}
  .hunt-limit.active{border-color:var(--violet); background:var(--violet); color:#fff;}
  .hunt-search-big{
    width:100%; justify-content:center; padding:16px 18px !important;
    font-size:16px !important; margin-top:4px;
  }
  .hunt-search-meta{font-size:12.5px; color:var(--text-lo); line-height:1.55;}
  .hunt-search-meta b{color:var(--text-hi);}
  .ph-plat.review{opacity:.95;}
  .ph-plat.disabled-plat{opacity:.45; cursor:not-allowed;}
  .src-pick{
    display:flex; gap:10px; align-items:flex-start; padding:8px; border:2px solid #8FA3C7;
    border-radius:10px; background:#fff; margin-bottom:8px;
  }
  .src-pick.selected{border-color:var(--violet); background:#F4F8FF;}
  .src-pick input{margin-top:4px; flex-shrink:0;}
  .src-pick .src-thumb{
    display:block; flex-shrink:0; border-radius:6px; overflow:hidden; line-height:0;
    border:1px solid #D5E0F2; transition:box-shadow .12s, border-color .12s;
  }
  .src-pick .src-thumb:hover{border-color:var(--violet); box-shadow:0 0 0 2px rgba(41,85,200,.18);}
  .src-pick .src-thumb img{display:block; width:80px; height:45px; object-fit:cover; background:#F1F5FC;}
  .src-pick .src-title{
    font-size:13.5px; font-weight:700; color:var(--text-hi); text-decoration:none;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .src-pick .src-title:hover{color:var(--violet); text-decoration:underline;}
  .src-pick .src-meta-extra{
    font-size:11.5px; color:var(--text-lo); margin-top:3px; line-height:1.45;
  }
  .src-pick .src-meta-extra b{color:var(--text-hi); font-weight:700;}
  .src-pick .shorts-badge{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 6px; border-radius:999px;
    background:#EAF0FC; color:var(--violet); margin-left:4px; vertical-align:middle;
  }
  @media (max-width:900px){
    .hunt-main-row{grid-template-columns:1fr;}
  }
  @media (max-width:720px){
    .hunt-track-row{grid-template-columns:1fr;}
  }

  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .thumb{
    aspect-ratio:9/16; background:#F1F5FC; border:1px solid var(--border);
    border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:11px; position:relative;
  }
  .thumb img, .thumb video{width:100%; height:100%; object-fit:cover;}
  .thumb .tag{
    position:absolute; top:6px; left:6px; background:rgba(28,39,64,0.65);
    padding:2px 7px; border-radius:5px; font-size:10px; color:#fff; font-weight:600;
  }

  /* 제품 찾기: 추가 칸과 같은 정사각 썸네일 (원본 크기와 무관) */
  #imgGrid.img-pick-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 140px));
    gap:12px; align-items:start;
  }
  #imgGrid .img-pick{
    aspect-ratio:1 / 1; width:100%; max-width:140px;
    background:#F1F5FC; border:1px solid var(--border); border-radius:12px;
    overflow:hidden; position:relative; display:grid; place-items:stretch;
    padding:0; margin:0; cursor:zoom-in; box-sizing:border-box;
    font:inherit; color:inherit; -webkit-appearance:none; appearance:none;
  }
  #imgGrid .img-pick > *{grid-area:1 / 1;}
  #imgGrid .img-pick img{
    width:100%; height:100%; min-width:0; min-height:0;
    object-fit:cover; display:block; max-width:none; max-height:none;
  }
  #imgGrid .img-pick .tag{
    justify-self:start; align-self:start; margin:6px; z-index:2; width:auto; height:fit-content;
    background:rgba(28,39,64,0.72); padding:2px 8px; border-radius:5px;
    font-size:10px; color:#fff; font-weight:700; cursor:pointer; line-height:1.4;
  }
  #imgGrid .img-pick .tag:hover{background:rgba(180,40,40,0.9);}
  #imgGrid .img-pick-zoom{
    justify-self:end; align-self:end; margin:6px; z-index:2; width:auto; height:fit-content;
    background:rgba(28,39,64,0.55); color:#fff; font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:5px; pointer-events:none;
  }
  #imgGrid .upload-zone.img-pick{
    cursor:pointer; place-items:center;
    border-style:dashed; text-align:center; color:var(--text-faint);
    padding:0; background:#F8FAFE;
  }
  #imgGrid .upload-zone.img-pick:hover{border-color:var(--violet); background:#EEF3FE;}
  #imgGrid .upload-zone.img-pick img{display:none;}
  #imgGrid .upload-zone.img-pick .hint{margin-top:4px; font-size:11px;}


  /* Product auto: keep the reference-image uploader readable and unclipped. */
  .product-auto-media-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(240px,0.42fr);
    gap:14px;
    align-items:start;
  }
  .product-auto-image-panel{min-width:0;}
  .product-auto-image-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:8px;
    color:var(--text-hi);
  }
  .product-auto-image-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:10px;
    align-items:stretch;
    width:100%;
    min-width:0;
  }
  .product-auto-image-grid .img-pick{
    aspect-ratio:1 / 1;
    width:100%;
    min-width:0;
    background:#F7FAFF;
    border:1.5px solid #C7D3EC;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    display:grid;
    place-items:center;
    padding:0;
    margin:0;
    box-sizing:border-box;
    color:var(--text-hi);
    font:inherit;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }
  .product-auto-image-grid button.img-pick{cursor:zoom-in;}
  .product-auto-image-grid .img-pick img{
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    object-fit:contain;
    display:block;
    background:#fff;
  }
  .product-auto-image-grid .img-pick .tag{
    position:absolute;
    top:7px;
    left:7px;
    z-index:2;
    background:rgba(28,39,64,0.72);
    color:#fff;
    border-radius:5px;
    padding:2px 7px;
    font-size:10px;
    font-weight:800;
    line-height:1.35;
  }
  .product-auto-image-grid .img-pick-zoom{
    position:absolute;
    right:7px;
    bottom:7px;
    z-index:2;
    background:rgba(28,39,64,0.58);
    color:#fff;
    border-radius:5px;
    padding:2px 7px;
    font-size:10px;
    font-weight:800;
    line-height:1.35;
    pointer-events:none;
  }
  .product-auto-upload{
    cursor:pointer;
    min-height:132px;
    padding:14px 12px !important;
    border-style:dashed !important;
    overflow:visible !important;
    background:#F8FAFE;
  }
  .product-auto-upload-copy{
    width:100%;
    max-width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:13px;
    font-weight:800;
    line-height:1.35;
    color:var(--text-lo);
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:keep-all;
  }
  .product-auto-upload .hint{
    margin-top:2px;
    font-size:11.5px;
    font-weight:700;
    line-height:1.35;
  }
  .product-auto-current-box{
    min-width:0;
    padding:12px;
    border:1px solid #D7E3F8;
    border-radius:12px;
    background:#FFFFFF;
  }
  @media (max-width: 860px){
    .product-auto-media-row{grid-template-columns:1fr;}
    .product-auto-image-grid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));}
  }

  .img-lightbox{
    position:fixed; inset:0; z-index:9999; background:rgba(10,16,32,0.82);
    display:flex; align-items:center; justify-content:center; padding:24px;
    cursor:zoom-out;
  }
  .img-lightbox img{
    max-width:min(92vw, 960px); max-height:88vh; width:auto; height:auto;
    object-fit:contain; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,0.45);
    background:#0B1220; cursor:default;
  }
  .img-lightbox-close{
    position:fixed; top:16px; right:18px; z-index:10000;
    width:36px; height:36px; border:none; border-radius:50%;
    background:rgba(255,255,255,0.92); color:#16233D; font-size:18px; font-weight:700;
    cursor:pointer; line-height:1;
  }

  .src-pick{position:relative;}
  .src-find-btn{
    flex-shrink:0; align-self:center; margin-left:6px;
    padding:8px 10px; border-radius:9px; border:1.5px solid #8FA3C7;
    background:#F4F8FF; color:#1E3A8A; font-size:12px; font-weight:700;
    line-height:1.25; white-space:nowrap; cursor:pointer;
    transition:background .12s, border-color .12s, color .12s;
  }
  .src-find-btn:hover{background:#E8F0FF; border-color:var(--violet); color:var(--violet);}
  .src-find-btn:disabled{opacity:.55; cursor:wait;}

  .src-find-modal{
    position:fixed; inset:0; z-index:10050; background:rgba(10,16,32,0.72);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .src-find-panel{
    width:min(920px, 96vw); max-height:90vh; overflow:auto;
    background:#fff; border-radius:16px; border:2px solid #A9C6FA;
    box-shadow:0 18px 50px rgba(16,30,70,.28); padding:18px 18px 14px;
  }
  .src-find-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .src-find-head h3{margin:0; font-size:18px; font-weight:800; color:#16233D; flex:1;}
  .src-find-close{
    width:34px; height:34px; border:none; border-radius:50%;
    background:#EEF2FF; color:#16233D; font-size:17px; font-weight:700; cursor:pointer;
  }
  .src-find-note{font-size:13px; color:#5B6B8C; line-height:1.55; margin:0 0 12px;}
  .src-find-seed{
    display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px;
    background:#F7FAFF; border:1px solid #D5E0F2; margin-bottom:12px;
  }
  .src-find-seed img{width:72px; height:40px; object-fit:cover; border-radius:6px; background:#E8EEF8;}
  .src-find-list{display:flex; flex-direction:column; gap:8px;}
  .src-find-item{
    display:flex; gap:10px; align-items:flex-start; padding:10px;
    border:1.5px solid #C5D4EF; border-radius:10px; background:#fff;
  }
  .src-find-item img{width:96px; height:54px; object-fit:cover; border-radius:6px; background:#E8EEF8; flex-shrink:0;}
  .src-find-item .meta{font-size:12px; color:#5B6B8C; margin-top:3px;}
  .src-find-item .tag{
    display:inline-block; margin-top:5px; padding:2px 8px; border-radius:999px;
    background:#E8F0FF; color:#1E3A8A; font-size:11px; font-weight:700;
  }
  .src-find-empty{padding:28px 12px; text-align:center; color:#6B7A99; font-size:14px;}

  .nav-row{display:flex; justify-content:space-between; margin-top:24px;}
  .settings-note{
    font-size:13.5px; color:var(--text-lo); line-height:1.7; margin-top:10px;
  }

  /* ---------- HOME / HERO ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, #2955C8, #4C7BEF 60%, #6E9BFA);
    border-radius:22px; padding:32px 40px 28px; margin-bottom:24px;
    color:#fff;
  }
  .hero::before, .hero::after{
    content:''; position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .hero::before{width:220px; height:220px; top:-90px; right:-60px;}
  .hero::after{width:120px; height:120px; bottom:-50px; right:120px; background:rgba(255,255,255,0.08);}
  .hero-eyebrow{font-size:12.5px; font-weight:700; letter-spacing:0.04em; opacity:0.85; margin-bottom:10px;}
  .hero-title{font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.35; margin-bottom:12px; position:relative;}
  .hero-sub{font-size:14px; opacity:0.9; max-width:480px; line-height:1.6; margin-bottom:22px; position:relative;}
  .hero .btn{background:#fff; color:var(--violet); box-shadow:0 4px 14px rgba(0,0,0,0.15);}
  .hero .btn:hover{box-shadow:0 6px 18px rgba(0,0,0,0.2);}

  .quick-row{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:28px;}
  .quick-card{
    background:#fff; border:1px solid var(--border); border-radius:16px;
    padding:22px; box-shadow:0 1px 2px rgba(28,39,64,0.03), 0 6px 18px rgba(28,39,64,0.045);
  }
  .quick-card h3{font-size:15px; font-weight:700; margin:0 0 6px;}
  .quick-card p{font-size:13px; color:var(--text-lo); line-height:1.6; margin:0 0 16px;}
  .support-card{background:#FFF7ED; border-color:#FBD9AF;}
  .support-card .phone{font-size:20px; font-weight:800; color:var(--coral); margin:4px 0 10px;}

  .feature-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
  }
  .feature-card{
    background:#fff; border:1px solid var(--border); border-radius:16px;
    padding:22px 18px; text-align:center;
    box-shadow:0 1px 2px rgba(28,39,64,0.03), 0 6px 18px rgba(28,39,64,0.045);
    transition:transform .15s ease;
  }
  .feature-card:hover{transform:translateY(-3px);}
  .feature-icon{
    width:52px; height:52px; margin:0 auto 14px; border-radius:14px;
    background:#EAF0FE; display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .feature-card h4{font-size:13.5px; font-weight:700; margin:0 0 6px;}
  .feature-card p{font-size:11.5px; color:var(--text-lo); line-height:1.5; margin:0 0 14px; min-height:32px;}
  .feature-go{
    display:inline-flex; align-items:center; gap:4px;
    background:#FFF1E4; color:var(--coral); border:none;
    padding:7px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .feature-go:hover{background:var(--coral); color:#fff;}
  .section-label{font-size:15px; font-weight:800; margin:0 0 14px; color:var(--text-hi);}

  /* ---------- VIDEO EDITOR (직접 소스 영상 조립) ---------- */
  .editor-layout{display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start;}
  .editor-main{min-width:0;}
  .editor-sidebar{display:flex; flex-direction:column; gap:16px;}
  .editor-preview{
    background:#0E1220; border-radius:16px; overflow:hidden; margin-bottom:16px;
    aspect-ratio:9/16; max-height:460px; display:flex; align-items:center; justify-content:center;
  }
  .editor-preview video{width:100%; height:100%; object-fit:contain;}
  .editor-preview-empty{color:#5C6A88; text-align:center; font-size:13px; line-height:1.8;}

  .editor-source-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .source-monitor-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; margin-bottom:20px;
  }
  .source-monitor{
    background:#fff; border:2px solid var(--border); border-radius:12px; overflow:hidden;
    transition:border-color .15s, box-shadow .15s;
  }
  .source-monitor.active{border-color:var(--violet); box-shadow:0 3px 12px rgba(41,85,200,0.18);}
  .source-monitor video{width:100%; aspect-ratio:9/16; object-fit:contain; background:#0E1220; display:block; max-height:220px;}
  .source-monitor-body{padding:8px 9px 10px;}
  .source-monitor-title{
    font-size:11px; color:var(--text-lo); margin-bottom:7px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .source-mark-row{display:flex; align-items:center; gap:4px; margin-bottom:7px;}
  .source-mark-row .btn{padding:5px 8px; font-size:11px; box-shadow:none;}
  .source-mark-val{font-size:10.5px; color:var(--text-faint); margin-left:auto; white-space:nowrap;}

  /* ---------- STUDIO SECTIONS ---------- */
  .studio-section{
    border-left:3px solid var(--border); padding-left:18px; margin-bottom:28px;
  }
  .studio-section.locked{opacity:0.5;}
  .studio-section-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .studio-step-badge{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background:#EAF0FE; color:var(--violet); border:1.5px solid #C7D3EC;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .studio-step-badge.done{background:var(--mint); border-color:var(--mint); color:#fff;}

  /* ---------- 전문 영상 편집기 (VisionEdit 스타일) ---------- */
  body.studio-mode .sidebar{display:none;}
  body.studio-mode .main{padding:0;}
  body.studio-mode .main-inner{max-width:none; margin:0;}

  .vp{
    --bg:#EEF3FB; --panel:#FFFFFF; --panel2:#F7FAFF; --line:#D5E0F2;
    --txt:#16233D; --dim:#5E7095; --accent:#2563EB; --accent2:#F97316;
    --v:#2563EB; --t:#7C3AED; --a:#0D9488;
    background:var(--bg); color:var(--txt); font-size:13px;
    /* header | 미리보기·패널 | 편집바 | 세로리사이저 | 타임라인 */
    --vp-tl-h: minmax(160px, 28vh);
    display:grid;
    grid-template-rows: auto minmax(200px, 1fr) auto 5px var(--vp-tl-h);
    height:100vh; height:100dvh; overflow:hidden;
  }
  .vp button{font-family:inherit;}
  .vp input, .vp select, .vp textarea{
    background:#FFFFFF; border:1px solid var(--line); color:var(--txt);
    padding:8px 10px; border-radius:7px; font-size:12px; font-family:inherit; width:100%;
  }
  .vp input[type=file]{padding:6px; font-size:11px; color:var(--dim);}
  .vp input[type=range]{padding:0; accent-color:var(--accent);}
  .vp input[type=color]{padding:2px; height:32px; cursor:pointer;}

  /* 헤더 — 컴팩트하게 고정해 아래 작업 영역을 위로 */
  .vp-header{
    display:flex; align-items:center; gap:8px; padding:6px 12px; flex-wrap:nowrap;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
    box-shadow:0 1px 4px rgba(22,35,61,0.06); z-index:10; min-height:44px;
  }
  .vp-back{
    background:#EAF0FC; border:1px solid var(--line); color:var(--accent);
    width:32px; height:32px; border-radius:8px; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .vp-back:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .vp-steps{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .vp-step{
    background:#FFFFFF; border:1.5px solid #B7C7E4; color:var(--txt);
    padding:7px 12px 7px 8px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
    white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
    box-shadow:0 1px 2px rgba(22,35,61,0.05);
  }
  .vp-step-no{
    background:#DCE4F3; color:var(--dim); border-radius:50%;
    width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:800; flex-shrink:0;
  }
  .vp-step:hover{background:#EAF0FC; color:var(--accent); border-color:var(--accent);}
  .vp-step.done{color:#0F7B52; border-color:#9EDCC0; background:#EBFBF3;}
  .vp-step.done .vp-step-no{background:#0F7B52; color:#fff;}
  .vp-step.current{
    background:var(--accent); border-color:var(--accent); color:#fff; cursor:default;
    box-shadow:0 2px 8px rgba(37,99,235,0.28);
  }
  .vp-step.current .vp-step-no{background:rgba(255,255,255,0.28); color:#fff;}
  .vp-step-arrow{color:var(--dim); font-size:12px; margin:0 2px;}
  .vp-ws{display:flex; gap:2px; background:#EDF2FB; border-radius:9px; padding:3px;}
  .vp-ws-insp{margin:10px 10px 0; }
  .vp-ws-insp .vp-ws-tab{padding:6px 8px; font-size:11px; flex:1; text-align:center;}
  .vp-ws-tab{
    background:none; border:none; color:var(--dim); cursor:pointer;
    padding:6px 15px; border-radius:7px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .vp-ws-tab:hover{color:var(--accent);}
  .vp-ws-tab.active{background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(22,35,61,0.12);}

  .vp-proj{display:flex; flex-direction:column; gap:2px;}
  .vp-proj input{
    background:#F4F8FF !important; border:1px solid var(--line); color:var(--txt);
    padding:5px 10px !important; border-radius:6px; font-size:12px !important;
    font-weight:700; width:170px !important;
  }
  .vp-proj-state{font-size:10px; color:var(--dim); padding-left:2px;}
  .vp-steps-mini{display:flex; gap:4px; flex-wrap:wrap;}
  .vp-step-mini{
    height:28px; padding:0 11px; border-radius:7px; cursor:pointer;
    background:#F4F8FF; border:1px solid var(--line); color:var(--dim);
    font-size:11.5px; font-weight:600; white-space:nowrap;
    display:inline-flex; align-items:center; gap:4px;
  }
  .vp-step-mini:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .vp-step-mini.done{background:#EBFBF3; border-color:#9EDCC0; color:#0F7B52;}
  .vp-step-check{font-weight:800;}

  .vp-track-btn{
    margin-left:auto; background:none; border:none; cursor:pointer;
    font-size:12px; padding:3px 5px; border-radius:5px; opacity:0.75;
  }
  .vp-track-btn:hover{background:#E4EEFE; opacity:1;}
  .vp-track-btn.off{opacity:0.4;}

  .vp-brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px;}
  .vp-logo{
    width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,var(--accent),#7C3AED);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
  }
  .vp-project{
    background:#F1F5FD; border:1px solid var(--line); padding:6px 12px;
    border-radius:7px; font-size:12px; color:var(--dim); font-weight:600;
  }
  .vp-header-center{display:flex; align-items:center; gap:12px; margin:0 auto;}
  .vp-next{
    background:#EAF0FC; border:1px solid #B9CEF0; color:var(--accent);
    padding:6px 14px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .vp-next b{font-weight:800;}
  .vp-icon-btn{
    background:none; border:none; color:var(--dim); font-size:15px;
    width:28px; height:28px; border-radius:6px; cursor:pointer;
  }
  .vp-icon-btn:hover{background:#EAF0FC; color:var(--accent);}
  .vp-saved{font-size:11.5px; color:var(--dim);}
  .vp-header-right{display:flex; gap:8px; margin-left:auto; align-items:center; flex-wrap:wrap;}
/* __SSS_STUDIO_BTN_VIS_V1__ */
  .vp-btn{
    background:#FFFFFF; border:1.5px solid #B7C7E4; color:var(--txt);
    padding:9px 14px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 1px 2px rgba(22,35,61,0.06);
    transition:background .12s, border-color .12s, color .12s, box-shadow .12s;
  }
  .vp-btn:hover{background:#EAF0FC; border-color:var(--accent); color:var(--accent); box-shadow:0 2px 8px rgba(37,99,235,0.12);}
  .vp-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(37,99,235,0.22);}
  .vp-btn.primary:hover{filter:brightness(1.08); color:#fff;}
  .vp-btn.ghost{background:#F1F5FD;}
  .vp-btn.block{width:100%; margin-bottom:8px;}
  .vp-btn:disabled{opacity:0.42; cursor:not-allowed; box-shadow:none;}
  /* 좌측 패널 주요 액션(소스/분석 등) — 또렷하고 짝이 맞게 */
  .vp-btn.tool{
    min-height:40px; padding:10px 12px; font-size:13px; font-weight:800;
    color:#1E3A8A; border:1.5px solid #8FA3C7; background:#FFFFFF;
  }
  .vp-btn.tool .vp-btn-ic{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; font-size:12px; line-height:1; flex-shrink:0;
  }
  .vp-btn.tool:hover{background:#EEF4FF; border-color:#2563EB; color:#1D4ED8;}
  .vp-btn.tool.accent{
    background:#F5F3FF; border-color:#A78BFA; color:#5B21B6;
  }
  .vp-btn.tool.accent:hover{background:#EDE9FE; border-color:#7C3AED; color:#5B21B6;}
  .vp-grid2{gap:8px;}
  .vp-grid2 .vp-btn{padding:10px 8px; font-size:13px; margin:0;}

  /*
   * 균형 레이아웃: 미리보기·작업영역이 주, 타임라인은 하단 약 1/3.
   * vh clamp로 모니터 높이에 맞춰 비율 유지.
   */
  .vp-body{
    --vp-panel-w: 400px;
    --vp-insp-w: 380px;
    --vp-preview-h: clamp(240px, 38vh, 480px);
    --vp-stage-max: 960px;
    display:grid;
    grid-template-columns:
      64px
      minmax(var(--vp-panel-w), 1.4fr)
      5px
      minmax(360px, var(--vp-stage-max))
      5px
      minmax(var(--vp-insp-w), 1.3fr);
    min-height:0;
    height:100%;
    max-height:none;
    overflow:hidden;
  }
  .vp-resizer{
    position:relative; z-index:3; cursor:col-resize;
    background:var(--line); transition:background .12s;
  }
  .vp-resizer:hover, .vp-resizer.active{background:var(--accent);}
  .vp-resizer::after{
    content:''; position:absolute; inset:-2px -3px; cursor:col-resize;
  }
  /* 미리보기 ↔ 타임라인 세로 경계 (좌우 리사이저와 동일 UX) */
  .vp-resizer-v{
    position:relative; z-index:8; cursor:row-resize;
    width:100%; height:5px; min-height:5px; max-height:5px;
    background:var(--line); transition:background .12s;
    flex:0 0 5px;
  }
  .vp-resizer-v:hover, .vp-resizer-v.active{background:var(--accent);}
  .vp-resizer-v::after{
    content:''; position:absolute; left:0; right:0; top:-4px; bottom:-4px; cursor:row-resize;
  }
  .vp-resizer-v::before{
    content:''; position:absolute; left:50%; top:50%; width:36px; height:3px;
    margin:-1.5px 0 0 -18px; border-radius:2px; background:rgba(94,112,149,0.45);
    pointer-events:none;
  }
  .vp-resizer-v:hover::before, .vp-resizer-v.active::before{background:rgba(255,255,255,0.85);}

  .vp-rail{background:var(--panel); border-right:1px solid var(--line); padding:10px 0; display:flex; flex-direction:column; gap:3px;}
  .vp-nav-btn{
    background:none !important; border:none !important; box-shadow:none !important;
    color:var(--dim); cursor:pointer; width:100%; padding:12px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    font-size:11px; font-weight:600; line-height:1.15; white-space:nowrap;
    border-left:3px solid transparent !important; border-radius:0 !important; transform:none !important;
  }
  .vp-nav-btn span{font-size:19px; line-height:1;}
  .vp-nav-btn:hover{color:var(--accent); background:#EAF0FC !important;}
  .vp-nav-btn.active{color:var(--accent); border-left-color:var(--accent) !important; background:linear-gradient(90deg,#DCE8FE,var(--panel2)) !important; font-weight:700;}

  .vp-panel{background:var(--panel2); padding:12px; overflow-y:auto; min-width:0;}
  .vp-panel-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; font-weight:800; margin:0 0 12px; color:var(--txt);
    letter-spacing:-0.01em;
  }
  .vp-panel-title span{font-size:11.5px; color:var(--dim); font-weight:600;}
  .vp-sep{height:1px; background:var(--line); margin:14px 0;}
  .vp-empty{color:#93A3C2; font-size:11.5px; text-align:center; padding:28px 10px; line-height:1.9;}
  .vp-monitor .vp-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin:0; padding:20px;
  }
  .vp-hint{font-size:11px; color:var(--dim); line-height:1.6; margin:8px 0;}
  .vp-ok{font-size:11.5px; color:#0F7B52; font-weight:600; margin-top:8px;}
  .vp-grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
  .vp-grid2 .vp-btn{padding:10px 8px; font-size:13px;}

  .vp-drop{
    border:1.5px dashed #B9CEF0; border-radius:10px; padding:9px 10px; text-align:center;
    background:#F4F8FF; transition:all .15s; margin-bottom:10px;
  }
  .vp-drop.over{border-color:var(--accent); background:#E4EEFE;}
  .vp-drop-hint{font-size:10px; color:var(--dim); margin-top:6px;}
  .vp-media-badge.sel{left:auto; right:30px; background:rgba(37,99,235,0.92);}
  .vp-media-check{position:absolute; top:5px; right:5px; z-index:2; width:20px; height:20px; display:flex; align-items:center; justify-content:center; background:rgba(11,18,32,0.55); border-radius:5px; cursor:pointer;}
  .vp-media-check input{width:15px; height:15px; cursor:pointer; accent-color:var(--accent);}

  /* 미디어 빈: 1열 4칸 고정 틀 — 썸네일만 원본 비율로 contain */
  .vp-media-grid{
    display:grid; grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:8px; align-items:start;
  }
  .vp-media-grid > .vp-empty{grid-column:1 / -1;}
  .vp-media{
    background:#FFFFFF; box-shadow:0 1px 3px rgba(22,35,61,0.07);
    border:2px solid transparent; border-radius:8px; overflow:hidden;
    cursor:pointer; position:relative; min-width:0;
    display:flex; flex-direction:column;
  }
  .vp-ai-tag{
    position:absolute; top:4px; left:4px; z-index:2;
    background:rgba(37,99,235,0.92); color:#fff; font-size:8px; font-weight:800;
    padding:2px 4px; border-radius:3px; letter-spacing:0.03em;
  }
  .vp-media.active{border-color:var(--accent);}
  .vp-media-thumb{
    position:relative; width:100%; aspect-ratio:16/9; height:auto;
    background:#0B1220; flex-shrink:0;
  }
  .vp-media-thumb video, .vp-media-thumb img{
    width:100%; height:100%; object-fit:contain; object-position:center;
    display:block; background:#0B1220;
  }
  .vp-media-badge{
    position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,0.75);
    font-size:8.5px; padding:1px 5px; border-radius:3px; color:#fff;
  }
  .vp-media-add{
    position:absolute; right:4px; bottom:4px; z-index:3;
    width:20px; height:20px; border:none; border-radius:5px;
    background:rgba(37,99,235,0.95); color:#fff;
    font-size:14px; font-weight:700; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .vp-media-add:hover{filter:brightness(1.12); transform:scale(1.06);}
  .vp-media-name{
    font-size:9px; padding:4px 5px 1px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; line-height:1.25;
  }
  .vp-media-tools{display:flex; gap:2px; padding:0 3px 4px;}
  .vp-mini{
    flex:1; background:#FFFFFF; color:var(--txt); border:1.5px solid #B7C7E4; border-radius:7px;
    padding:5px 6px; font-size:11.5px; cursor:pointer; min-width:0; font-weight:700;
    box-shadow:0 1px 2px rgba(22,35,61,0.05);
  }
  .vp-mini:hover{background:#EAF0FC; color:var(--accent); border-color:var(--accent);}
  .vp-mini.go{background:var(--accent); color:#fff; border-color:var(--accent);}
  .vp-mini.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .vp-mini.primary-dl{background:#0F9D58; color:#fff; border-color:#0F9D58; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;}
  .vp-mini.primary-dl:hover{background:#0C7C46;}
  .vp-mini:disabled{opacity:0.38; cursor:not-allowed; box-shadow:none;}

  /* 쇼핑쇼츠 AI 추천 구간 */
  .vp-suggest-wrap{margin-top:12px; padding-top:10px; border-top:1px solid var(--line);}
  .vp-suggest-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .vp-suggest-head .vp-panel-title{margin:0;}
/* __SSS_DEEP_ANALYZE_V1__ */
  .vp-suggest-badge{
    font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:0.02em;
    white-space:nowrap;
  }
  .vp-suggest-badge.err{background:#FEE2E2; color:#B91C1C; border:1px solid #FECACA;}
  .vp-suggest-badge.empty{background:#FEF3C7; color:#B45309; border:1px solid #FDE68A;}
  .vp-suggest-badge.ok{background:#DCFCE7; color:#166534; border:1px solid #BBF7D0;}
  .vp-suggest-badge.style{background:#EDE9FE; color:#5B21B6; border:1px solid #DDD6FE;}
  .vp-suggest-badge.link-high{background:#DBEAFE; color:#1D4ED8; border:1px solid #BFDBFE;}
  .vp-suggest-badge.link-mid{background:#E0E7FF; color:#4338CA; border:1px solid #C7D2FE;}
  .vp-suggest-badge.link-low{background:#F1F5F9; color:#64748B; border:1px solid #E2E8F0;}
  .vp-suggest-badge.cut-high{background:#FFEDD5; color:#C2410C; border:1px solid #FED7AA;}
  .vp-suggest-badge.cut-mid{background:#FEF3C7; color:#B45309; border:1px solid #FDE68A;}
  .vp-suggest-badge.cut-low{background:#F1F5F9; color:#64748B; border:1px solid #E2E8F0;}
  .vp-suggest-summary{
    background:#F8FAFF; border:1.5px solid #C5D4EF; border-radius:10px;
    padding:10px 12px; margin:0 0 10px; font-size:12px; line-height:1.55; color:var(--txt);
  }
  .vp-suggest-summary .sum-head{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px;
  }
  .vp-suggest-summary .sum-row{margin-top:3px; color:var(--dim);}
  .vp-suggest-summary .sum-row b{color:var(--txt);}
  .vp-suggest-item .style-tag{
    display:inline-block; margin-top:3px; margin-right:4px;
    padding:2px 7px; border-radius:999px; font-size:10px; font-weight:800;
    background:#EDE9FE; color:#5B21B6; border:1px solid #DDD6FE;
  }
  .vp-suggest-item .score-tag{
    display:inline-block; margin-top:3px; margin-right:4px;
    padding:2px 7px; border-radius:999px; font-size:10px; font-weight:800;
    background:#EAF0FC; color:#1E3A8A; border:1px solid #C5D4EF;
  }
  .vp-suggest-item .score-tag.cut{background:#FFF7ED; color:#9A3412; border-color:#FED7AA;}

  .vp-suggest-result{
    border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.5;
  }
  .vp-suggest-result.err{background:#FEF2F2; border:1px solid #FECACA; color:#7F1D1D;}
  .vp-suggest-result.empty{background:#FFFBEB; border:1px solid #FDE68A; color:#78350F;}
  .vp-suggest-result .vp-suggest-result-title{font-weight:800; margin-bottom:4px; font-size:12.5px;}
  .vp-suggest-result .vp-suggest-result-tip{margin-top:6px; font-size:11px; opacity:0.88;}
  .vp-suggest-rail{
    position:relative; height:28px; border-radius:6px; background:#E8EEF8;
    border:1px solid var(--line); margin-bottom:10px; overflow:hidden;
  }
  .vp-suggest-tick{
    position:absolute; top:0; bottom:0; width:0; border-left:1px dashed #C5D3EC; pointer-events:none;
  }
  .vp-suggest-seg{
    position:absolute; top:4px; height:20px; border-radius:4px; border:none;
    background:linear-gradient(180deg,#3B82F6,#2563EB); color:#fff;
    font-size:9px; font-weight:700; padding:0 4px; cursor:pointer; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; line-height:20px; min-width:8px;
  }
  .vp-suggest-seg:hover, .vp-suggest-seg.active{background:linear-gradient(180deg,#F59E0B,#D97706); z-index:2;}
  .vp-suggest-list{display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto;}
  .vp-suggest-item{
    display:grid; grid-template-columns:auto 1fr auto auto; gap:6px; align-items:center;
    background:#FFFFFF; border:1.5px solid var(--line); border-radius:8px;
    padding:8px 8px; cursor:grab; text-align:left; width:100%;
    font:inherit; color:inherit; box-sizing:border-box;
  }
  .vp-suggest-item:active{cursor:grabbing;}
  .vp-suggest-item:hover{border-color:var(--accent); background:#F4F8FF;}
  .vp-suggest-item.active{border-color:var(--accent); background:#EAF0FC; box-shadow:0 0 0 1px var(--accent);}
  .vp-suggest-item .idx{
    width:22px; height:22px; border-radius:6px; background:#DCE8FE; color:var(--accent);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .vp-suggest-item.active .idx{background:var(--accent); color:#fff;}
  .vp-suggest-item .meta{min-width:0;}
  .vp-suggest-item .time{font-size:11px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
  .vp-suggest-item .desc{font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}
  .vp-suggest-add, .vp-suggest-playbtn{
    width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
    background:#EDF2FC; color:var(--accent); font-size:14px; font-weight:800;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;
  }
  .vp-suggest-add{background:var(--accent); color:#fff; border-color:var(--accent);}
  .vp-suggest-add:hover, .vp-suggest-playbtn:hover{filter:brightness(1.08);}
  .vp-media-layer{
    position:absolute; inset:0; z-index:1;
    transform-origin:center center;
    cursor:grab; user-select:none;
  }
  .vp-media-layer:active{cursor:grabbing;}
  .vp-media-layer.editable{outline:1.5px dashed rgba(96,165,250,0.55); outline-offset:-2px;}
  .vp-media-layer video, .vp-media-layer img{
    position:absolute; inset:0; width:100%; height:100%;
    max-width:none; max-height:none; object-fit:contain; display:block; background:#0B1220;
    pointer-events:none;
  }
  .vp-media-handle{
    position:absolute; width:12px; height:12px; z-index:5;
    background:#60A5FA; border:2px solid #fff; border-radius:2px;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .vp-media-handle.nw{left:-5px; top:-5px; cursor:nwse-resize;}
  .vp-media-handle.ne{right:-5px; top:-5px; cursor:nesw-resize;}
  .vp-media-handle.sw{left:-5px; bottom:-5px; cursor:nesw-resize;}
  .vp-media-handle.se{right:-5px; bottom:-5px; cursor:nwse-resize;}
  .vp-media-handle.e{right:-5px; top:50%; margin-top:-6px; cursor:ew-resize;}
  .vp-media-handle.w{left:-5px; top:50%; margin-top:-6px; cursor:ew-resize;}
  .vp-media-handle.n{top:-5px; left:50%; margin-left:-6px; cursor:ns-resize;}
  .vp-media-handle.s{bottom:-5px; left:50%; margin-left:-6px; cursor:ns-resize;}
  .vp-suggest-detail{
    margin-top:8px; padding:10px; border-radius:8px; background:#FFFFFF;
    border:1px solid var(--line); display:flex; flex-direction:column; gap:7px;
  }
  .vp-suggest-detail .row{font-size:11px; line-height:1.45; color:var(--txt);}
  .vp-suggest-detail .row b{display:inline-block; min-width:52px; color:var(--accent); font-size:10.5px;}
  .vp-suggest-actions{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;}
  .vp-suggest-actions .vp-btn{margin:0; padding:8px 6px; font-size:11px;}
  .vp-suggest-flow{
    margin-top:8px; padding:8px 10px; border-radius:8px; background:#F4F8FF;
    border:1px dashed #B9CEF0; font-size:10.5px; color:var(--dim); line-height:1.5;
  }
  .vp-vol{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    padding:2px 4px 2px 8px; border-left:1px solid var(--line); margin-left:4px;
  }
  .vp-vol input[type=range]{
    width:88px; min-width:72px; padding:0; cursor:pointer;
  }
  .vp-vol-label{
    font-size:10.5px; font-weight:700; color:var(--dim);
    min-width:34px; font-variant-numeric:tabular-nums;
  }
  .vp-edit-bar .vp-vol .vp-play{width:28px; height:28px; min-width:28px; font-size:12px;}

  .vp-sub-list{display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; margin-bottom:10px;}
  .vp-sub-item{background:#FFFFFF; box-shadow:0 1px 3px rgba(22,35,61,0.07); border:1.5px solid transparent; border-radius:8px; padding:8px; cursor:pointer;}
  .vp-sub-item.is-title{background:#FFFBEF; border-color:#F3D98B;}
  .vp-sub-kind{flex-shrink:0; border:none; border-radius:5px; padding:3px 7px; font-size:10px; font-weight:700; cursor:pointer; background:#EAF0FC; color:var(--dim);}
  .vp-sub-item.is-title .vp-sub-kind{background:#FFE9A8; color:#7A5B00;}
  .vp-sub-item.active{border-color:var(--accent);}
  .vp-sub-head{display:flex; align-items:center; gap:5px; margin-bottom:6px;}
  .vp-sub-head input{width:50px !important; font-size:10.5px !important; padding:5px !important; text-align:center;}
  .vp-sub-head span{color:var(--dim); font-size:10px;}
  .vp-sub-no{background:#EAF0FC; color:var(--accent); border-radius:4px; padding:3px 6px; font-size:10px; font-weight:800; color:var(--dim);}
  .vp-sub-item textarea{font-size:11.5px !important; resize:vertical; line-height:1.5;}

  /* 중앙 스테이지 — 남는 높이를 미리보기 랩이 채우고, 모니터는 화면비로 contain */
  .vp-stage{
    display:flex; flex-direction:column; justify-content:stretch; align-items:stretch;
    background:var(--bg); padding:4px 6px 2px; gap:3px;
    min-width:0; min-height:0; overflow:hidden; width:100%; height:100%;
  }
  .vp-stage-head{
    display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim);
    line-height:1; flex:0 0 20px; height:20px; min-height:20px; max-height:20px;
    overflow:hidden; white-space:nowrap;
  }
  .vp-stage-status{
    flex:0 0 16px; height:16px; min-height:16px; max-height:16px; overflow:hidden;
  }
  .vp .status{margin:0; font-size:10.5px; line-height:16px; padding:0; border:none; background:transparent;}
  .vp .status:empty{display:block; visibility:hidden; height:16px; min-height:16px;}

function maxUsedVideoTrack(){
  let m = 1;
  (state.sourceEDL || []).forEach(e => { m = Math.max(m, Number(e.track) || 1); });
  return Math.min(MAX_VIDEO_TRACKS, m);
}
function visibleVideoTrackCount(){
  // 사용 중인 트랙 + 드롭용 빈 줄 1개 (최대치 미만일 때)
  const used = maxUsedVideoTrack();
  return Math.min(MAX_VIDEO_TRACKS, Math.max(1, used) + (used < MAX_VIDEO_TRACKS ? 1 : 0));
}
function maxUsedSubLane(){
  const subs = state.subtitles || [];
  if(!subs.length) return 1;
  let m = 1;
  subs.forEach(s => { m = Math.max(m, Number(s.lane) || 1); });
  return Math.min(MAX_SUB_LANES, m);
}
function visibleSubLaneCount(){
  const used = (state.subtitles || []).length ? maxUsedSubLane() : 1;
  return Math.min(MAX_SUB_LANES, used + (used < MAX_SUB_LANES ? 1 : 0));
}
function rangesOverlap(a0, a1, b0, b1){
  return Number(a0) < Number(b1) && Number(b0) < Number(a1);
}
function findFreeSubLane(start, end, exceptIndex = -1){
  const used = new Set();
  (state.subtitles || []).forEach((s, i)=>{
    if(i === exceptIndex) return;
    if(rangesOverlap(start, end, s.start, s.end)) used.add(Number(s.lane) || 1);
  });
  let lane = 1;
  while(used.has(lane) && lane < MAX_SUB_LANES) lane++;
  return lane;
}

/** __SSS_DIRECTION_V1__ — vo 씬은 대사 자막/말풍선 필수 */
function ensureDirectionDefaultsOnScript(){
  const rows = state.scriptTable || [];
  rows.forEach((r, i)=>{
    const line = String(r.line || '').trim();
    const isSfx = r.audio === 'sfx' || (!line && r.audio !== 'vo');
    r.audio = isSfx ? 'sfx' : 'vo';
    if(r.audio === 'vo'){
      if(!String(r.caption || '').trim()) r.caption = line;
      // 기본: 하단 자막. 말풍선은 사용자가 선택. vo는 none 금지
      if(!['bottom','bubble'].includes(r.captionStyle)) r.captionStyle = 'bottom';
    }else{
      if(!r.captionStyle) r.captionStyle = 'none';
    }
    if(r.targetDur == null && r.duration != null) r.targetDur = Number(r.duration) || null;
  });
  return rows;
}

function applyCaptionStyleToSubRow(sub, scriptRow){
  if(!sub) return sub;
  const style = scriptRow?.captionStyle || sub.captionStyle || 'bottom';
  sub.captionStyle = style;
  if(style === 'none'){
    sub.text = '';
    return sub;
  }
  if(style === 'bubble'){
    sub.kind = 'caption';
    sub.x = sub.x != null ? sub.x : 50;
    sub.y = sub.y != null ? sub.y : 42;
    sub.bubble = true;
  }else{
    sub.bubble = false;
    if(sub.y == null){
      const pos = defaultCaptionPos('bottom');
      sub.x = sub.x != null ? sub.x : pos.x;
      sub.y = sub.y != null ? sub.y : pos.y;
    }
  }
  return sub;
}

function buildSubtitlesFromDirectionPlan(edl){
  ensureDirectionDefaultsOnScript();
  const rows = state.scriptTable || [];
  let t = 0;
  const subs = [];
  (edl || []).forEach((e, i)=>{
    if((e.track || 1) !== 1) return;
    const clipDur = Math.max(0.5, e.end - e.start) / (e.speed ?? 1);
    const clipAt = (e.at != null) ? Number(e.at) : t;
    const row = rows[i] || {};
    const style = row.captionStyle || (row.audio === 'sfx' ? 'none' : 'bottom');
    const text = style === 'none' ? '' : String(row.caption || e.line || row.line || '').trim();
    if(text){
      const sub = {
        start: Number(clipAt.toFixed(2)),
        end: Number((clipAt + clipDur).toFixed(2)),
        text,
        kind: 'caption',
        lane: 1,
        captionStyle: style,
      };
      applyCaptionStyleToSubRow(sub, row);
      subs.push(sub);
    }
    t = Math.max(t + clipDur, clipAt + clipDur);
  });
  return subs;
}

function resolveCaptionPos(sub, st){
  if(sub && sub.x != null && sub.y != null) return { x:Number(sub.x), y:Number(sub.y) };
  const base = (st && st.x != null && st.y != null)
    ? { x:Number(st.x), y:Number(st.y) }
    : defaultCaptionPos(st?.position || 'bottom');
  const laneOff = Math.max(0, (Number(sub?.lane) || 1) - 1) * 10;
  return { x: base.x, y: Math.max(8, base.y - laneOff) };
}

function captionTextShadowCss(st){
  const outline = st.outline || '#000000';
  const w = Math.max(0, Number(st.outlineWidth ?? 2));
  const parts = [];
  if(st.glow) parts.push(`0 0 8px ${outline}`, `0 0 14px ${outline}`);
  for(let i = 0; i < Math.max(1, w); i++) parts.push(`0 0 ${1 + i}px ${outline}`);
  if(st.shadow) parts.push(`0 ${st.shadow}px ${Math.max(2, st.shadow)}px rgba(0,0,0,0.55)`);
  return parts.join(',');
}

  const playing = !!(v && !v.paused && !v.ended);
  // 멈춘 편집 중이면 선택 자막을 미리보기에 고정
  if(!playing && sel != null && subs[sel] && (state.workspace === 'graphic' || state.nlePanel === 'text')){
    if(!isSubLaneHidden(subs[sel].lane || 1)){
      return [{ sub: subs[sel], index: sel, editing: true }];
    }
  }
  const active = [];
  subs.forEach((s, i)=>{
    if(isSubLaneHidden(s.lane || 1)) return;
    if(t >= Number(s.start) && t < Number(s.end)){
      active.push({ sub: s, index: i, editing: sel === i });
    }
  });
  if(active.length) return active;
  if(sel != null && subs[sel] && state.workspace === 'graphic' && !isSubLaneHidden(subs[sel].lane || 1)){
    return [{ sub: subs[sel], index: sel, editing: true }];
  }
  return [];
}
function resolvePreviewCaption(t){
  return resolvePreviewCaptions(t)[0] || null;
}

function captionBoxInlineStyle(sub, st, pos){
  const fs = Math.max(10, Number(st.fontSize) || 20);
  const scale = Math.min(1, (document.querySelector('.vp-monitor')?.clientWidth || 360) / 360);
  const px = Math.max(12, Math.round(fs * Math.max(0.6, scale)));
  const bg = !!st.bg;
  return [
    `left:${pos.x}%`,
    `top:${pos.y}%`,
    `font-size:${px}px`,
    `color:${st.color || '#fff'}`,
    `font-weight:${st.bold ? 800 : 500}`,
    `font-family:${fontCss(st.fontFamily)}`,
    `line-height:1.15`,
    `width:max-content`,
    `max-width:90%`,
    bg ? `background:${st.bgColor || '#000'}; border-radius:0.35em;` : 'background:transparent;',
    `text-shadow:${bg && !st.glow ? 'none' : captionTextShadowCss(st)}`,
  ].filter(Boolean).join(';');
}

function matchStylePresetKey(st){
  if(!st) return null;
  for(const [key, p] of Object.entries(TEXT_STYLE_PRESETS)){
    if(p.color === st.color && p.fontFamily === st.fontFamily && !!p.bg === !!st.bg
      && p.bgColor === st.bgColor && !!p.glow === !!st.glow && p.bold === st.bold){
      return key;
    }
  }
  return st.activePreset || null;
}

function buildCaptionOverlayHtml(){
  const hits = resolvePreviewCaptions(getPreviewTimeSec());
  if(!hits.length) return `<div class="vp-caption-layer" id="vpCaptionLayer" hidden></div>`;
  const boxes = hits.map((hit, hi)=>{
    const st = styleForSubtitle(hit.sub);
    const pos = resolveCaptionPos(hit.sub, st);
    const text = (hit.sub.text || '').trim() || (hit.editing ? '자막을 입력하세요' : '');
    if(!text && !hit.editing) return '';
    const isBubble = !!(hit.sub.bubble || hit.sub.captionStyle === 'bubble');
    const bubbleSt = isBubble ? { ...st, bg:true, bgColor:'#FFFFFF', color:'#111111', glow:false, outlineWidth:0 } : st;
    const bubblePos = isBubble ? { x: pos.x, y: Math.min(70, Math.max(28, pos.y || 42)) } : pos;
    return `<div class="vp-caption-box ${hit.editing ? 'editing' : ''} ${bubbleSt.bg ? 'has-bg' : ''} ${isBubble ? 'is-bubble' : ''}" ${hi===0?'id="vpCaptionBox"':''} data-caption-index="${hit.index}"
      style="${captionBoxInlineStyle(hit.sub, bubbleSt, bubblePos)}" title="드래그로 이동 · 더블클릭으로 글자 수정">
      <span class="vp-caption-text" ${hit.editing ? 'contenteditable="true" spellcheck="false"' : ''}>${escHtml(text)}</span>
      ${hit.editing ? '<span class="vp-caption-resize" data-caption-resize title="크기 조절"></span>' : ''}
    </div>`;
  }).filter(Boolean).join('');
  if(!boxes) return `<div class="vp-caption-layer" id="vpCaptionLayer" hidden></div>`;
  return `<div class="vp-caption-layer" id="vpCaptionLayer">${boxes}</div>`;
}

function refreshCaptionOverlay(){
  const mon = document.querySelector('.vp-monitor');
  if(!mon) return;
  let layer = document.getElementById('vpCaptionLayer');
  const html = buildCaptionOverlayHtml();
  if(!layer){
    mon.insertAdjacentHTML('beforeend', html);
    return;
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const next = tmp.firstElementChild;
  layer.replaceWith(next);
}

const SSS_LOCAL_SETTINGS_CANDIDATES = [

function buildKeysBundle(){
  const bundle = { _updatedAt: Date.now(), sections: {} };
  Object.keys(SETTINGS_SECTIONS).forEach(section=>{
    const data = {};
    SETTINGS_SECTIONS[section].forEach(f => { data[f] = state.keys[f]; });
    bundle.sections[section] = data;
  });
  return bundle;
}

function applyKeysBundle(bundle, { writeLocal = true } = {}){
  if(!bundle || typeof bundle !== 'object') return false;
  const sections = bundle.sections || bundle;
  let applied = false;
  Object.keys(SETTINGS_SECTIONS).forEach(section=>{
    const data = sections[section];
    if(!data || typeof data !== 'object') return;
    Object.assign(state.keys, data);
    if(writeLocal){
      try{ localStorage.setItem('sss_'+section, JSON.stringify(data)); }catch(_){}
    }
    applied = true;
  });
  if(applied && bundle._updatedAt){
    try{ localStorage.setItem('sss_keys_meta', JSON.stringify({ _updatedAt: bundle._updatedAt })); }catch(_){}
  }
  return applied;
}

function saveSection(section, { quiet = false } = {}){
  collectSettingsFromInputs();
  const data = {};
  SETTINGS_SECTIONS[section].forEach(f => data[f] = state.keys[f]);
  try{ localStorage.setItem('sss_'+section, JSON.stringify(data)); }catch(e){}
  // 전체 번들도 같이 갱신 (새로고침·다른 origin 대비)
  saveAllKeySections({ quiet:true, fromSection: section });
  if(!quiet) setStatus(`save-${section}`, 'ok', '저장됨 — 새로고침해도 유지됩니다 (초기화 전까지)');
}

function saveAllKeySections({ quiet = false, fromSection = null } = {}){
  try{ collectSettingsFromInputs(); }catch(_){}
  const bundle = buildKeysBundle();
  Object.keys(SETTINGS_SECTIONS).forEach(section=>{
    try{ localStorage.setItem('sss_'+section, JSON.stringify(bundle.sections[section])); }catch(_){}
  });
  try{ localStorage.setItem('sss_keys_bundle', JSON.stringify(bundle)); }catch(_){}
  try{ localStorage.setItem('sss_keys_meta', JSON.stringify({ _updatedAt: bundle._updatedAt })); }catch(_){}
  // 로컬 프록시 파일이 있으면 file:// ↔ http://127.0.0.1:8787 키 공유
  pushKeysToLocalProxy(bundle);
  if(!quiet){
    const target = fromSection ? `save-${fromSection}` : 'import-export';
    setStatus(target, 'ok', '모든 API 키 저장됨 — 새로고침해도 유지 (초기화 시 삭제)');
  }
}

async function pushKeysToLocalProxy(bundle){
  if(_sssKeysSaveBusy) return;
  _sssKeysSaveBusy = true;
  try{
    const body = bundle || buildKeysBundle();
    const root = await pingLocalProxy();
    const urls = root
      ? [`${root}/local-settings`]
      : SSS_LOCAL_SETTINGS_CANDIDATES;
    for(const url of urls){
      try{
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if(res.ok) break;
      }catch(_){}
    }
  }catch(_){ /* 프록시 미실행이면 무시 — localStorage만으로도 유지 */ }
  finally{ _sssKeysSaveBusy = false; }
}

async function pullKeysFromLocalProxy(){
  try{
    const root = await pingLocalProxy();
    const urls = root
      ? [`${root}/local-settings`]
      : SSS_LOCAL_SETTINGS_CANDIDATES;
    for(const url of urls){
      try{
        const res = await fetch(url, { method:'GET', cache:'no-store' });
        if(!res.ok) continue;
        const bundle = await res.json();
        if(!bundle || typeof bundle !== 'object' || !bundle.sections) continue;
        let localUpdated = 0;
        try{ localUpdated = Number(JSON.parse(localStorage.getItem('sss_keys_meta')||'{}')._updatedAt||0); }catch(_){}
        const remoteUpdated = Number(bundle._updatedAt||0);
        const localHasKey = !!(
          String(state.keys.claudeApiKey||'').trim() ||
          String(state.keys.gemini||'').trim() ||
          String(state.keys.openaiApiKey||'').trim() ||
          String(state.keys.youtubeApiKey||'').trim()
        );
        if(remoteUpdated >= localUpdated || !localHasKey){
          applyKeysBundle(bundle, { writeLocal:true });
          return true;
        }
      }catch(_){}
    }
  }catch(_){}
  return false;
}

function resetSection(section){
  SETTINGS_SECTIONS[section].forEach(f => { state.keys[f] = DEFAULT_KEYS[f]; });
  try{ localStorage.removeItem('sss_'+section); }catch(e){}
  // 초기화한 섹션을 반영해 번들/프록시도 갱신
  try{
    const bundle = buildKeysBundle();
    localStorage.setItem('sss_keys_bundle', JSON.stringify(bundle));
    localStorage.setItem('sss_keys_meta', JSON.stringify({ _updatedAt: bundle._updatedAt }));
    pushKeysToLocalProxy(bundle);
  }catch(_){}
  if(section === 'googleTts'){ state.googleTtsPreviewUrl = null; state.googleTtsPreviewVoice = null; }
  render();

  try{
    const raw = localStorage.getItem('sss_keys_bundle');
    if(raw) applyKeysBundle(JSON.parse(raw), { writeLocal:false });
  }catch(_){}
}

function statusHtml(id){
  return `<div class="status" id="status-${id}"></div>`;

const __statusTimers = Object.create(null);
const __statusBusy = Object.create(null);

function parseStatusProgress(text){
  const m = String(text||'').match(/\((\d+)\s*\/\s*(\d+)\)/);
  if(!m) return null;
  const cur = Number(m[1]), total = Number(m[2]);
  if(!Number.isFinite(cur) || !Number.isFinite(total) || total <= 0) return null;
  return { cur: Math.min(cur, total), total };
}

function stopStatusTimer(id){
  if(__statusTimers[id]){
    clearInterval(__statusTimers[id]);
    delete __statusTimers[id];
  }
}

function startStatusTimer(id){
  stopStatusTimer(id);
  __statusTimers[id] = setInterval(()=>{
    const info = __statusBusy[id];
    if(!info || info.mode !== 'loading'){ stopStatusTimer(id); return; }
    const el = document.getElementById(`status-${id}`);
    const meta = el?.querySelector('[data-status-timer]');
    const elapsed = Math.max(0, Math.floor((Date.now() - info.startedAt)/1000));
    if(meta){
      const prog = info.progress;
      meta.textContent = prog
        ? `진행 ${prog.cur}/${prog.total} · 경과 ${elapsed}초 · AI 서버 응답 대기 중`
        : `경과 ${elapsed}초 · AI 서버 응답 대기 중 · 창을 닫지 마세요`;
    }
  }, 500);
}

function setCharacterWorkVisual(busy, label=''){
  const ids = ['charBtn','castAutoAllBtn','heroRedrawBtn','castAutoDrawMajorsBtn','castRedrawAllBtn','castAnalyzeBtn'];
  for(const bid of ids){
    const btn = document.getElementById(bid);
    if(!btn) continue;
    if(busy){
      if(btn.dataset.prevDisabled == null) btn.dataset.prevDisabled = btn.disabled ? '1' : '0';
      btn.disabled = true;
      btn.classList.add('is-working');
      if(bid === 'charBtn' || bid === 'castAutoAllBtn' || bid === 'heroRedrawBtn'){
        if(btn.dataset.prevLabel == null) btn.dataset.prevLabel = btn.textContent;
        btn.textContent = label || '생성 중…';
      }
    }else{
      btn.classList.remove('is-working');
      if(btn.dataset.prevLabel != null){
        btn.textContent = btn.dataset.prevLabel;
        delete btn.dataset.prevLabel;
      }
      if(btn.dataset.prevDisabled != null){
        btn.disabled = btn.dataset.prevDisabled === '1';
        delete btn.dataset.prevDisabled;
      }
    }
  }
  const heroThumb = document.querySelector('#heroRedrawBtn')?.closest?.('.card')?.querySelector?.('.thumb, [style*="width:80px"]');
  if(heroThumb){
    if(busy) heroThumb.classList.add('is-working','cast-working');
    else heroThumb.classList.remove('is-working','cast-working');
  }
}

function setStatus(id, mode, text){
  const el = document.getElementById(`status-${id}`);
  if(!el) return;
  const prev = __statusBusy[id];
  const startedAt = (mode === 'loading' && prev?.mode === 'loading' && prev.text)
    ? prev.startedAt
    : Date.now();
  if(mode === 'loading'){
    const progress = parseStatusProgress(text);
    __statusBusy[id] = { mode, text: String(text||''), progress, startedAt };
    el.className = 'status loading';
    el.setAttribute('aria-live','polite');
    const pct = progress ? Math.max(8, Math.round((progress.cur/progress.total)*100)) : null;
    const steps = progress ? Array.from({length: progress.total}, (_,i)=>{
      const n = i+1;
      const cls = n < progress.cur ? 'on' : (n === progress.cur ? 'now' : '');
      return `<span class="status-step ${cls}"></span>`;
    }).join('') : '';
    el.innerHTML = `
      <div class="status-spinner" aria-hidden="true"></div>
      <div class="status-body">
        <div class="status-top">
          <span class="status-badge">작업 중</span>
          ${progress ? `<span style="font-size:12px; font-weight:800; color:#2955C8;">${progress.cur} / ${progress.total}</span>` : ''}
        </div>
        <div class="status-text">${escHtml(String(text||'작업 중…'))}</div>
        <div class="status-track"><div class="status-bar ${pct!=null?'is-determinate':''}" style="${pct!=null?`width:${pct}%`:''}"></div></div>
        ${steps ? `<div class="status-steps" aria-hidden="true">${steps}</div>` : ''}
        <div class="status-meta" data-status-timer="${escHtml(id)}">경과 0초 · AI 서버 응답 대기 중</div>
      </div>`;
    startStatusTimer(id);
    if(id === 'character' || id === 'world-assets' || id === 'images' || id === 'video' || id === 'auto-gen'){
      setCharacterWorkVisual(true, String(text||'생성 중…').slice(0, 22));
    }
    return;
  }

  stopStatusTimer(id);
  delete __statusBusy[id];
  if(id === 'character' || id === 'world-assets'){
    const stillBusy = Object.keys(__statusBusy).some(k => (k==='character'||k==='world-assets') && __statusBusy[k]?.mode==='loading');
    if(!stillBusy) setCharacterWorkVisual(false);
  }else if(id === 'images' || id === 'video' || id === 'auto-gen'){
    const stillBusy = ['images','video','auto-gen'].some(k => __statusBusy[k]?.mode==='loading');
    if(!stillBusy) setCharacterWorkVisual(false);
  }

  el.className = `status ${mode}`;
  let body = text;
  if(mode === 'err' && typeof text === 'string' && text.startsWith('CREDIT_ERR::')){
    const parts = text.split('::');
    body = hfCreditsHelpHtml(parts[1] || '');
    el.className = 'status err';
  }else if(mode === 'err' && typeof text === 'string' && /not_enough_credits|CREDIT_ERR/i.test(text)){
    body = hfCreditsHelpHtml();
  }
  el.innerHTML = `<div class="dot"></div><div style="flex:1; min-width:0;">${body}</div>`;
}

/** loading 상태에 폴링/세부 진행을 덧붙일 때 사용 (DOM 전체를 다시 그리지 않음) */
function setStatusProgress(id, text, frac){
  const base = String(text||__statusBusy[id]?.text||'작업 중…').replace(/\s*·\s*서버\s*\d+%/, '');
  let el = document.getElementById(`status-${id}`);
  if(!el || !el.classList.contains('loading') || !__statusBusy[id]){
    setStatus(id, 'loading', base);
    el = document.getElementById(`status-${id}`);
  }
  const info = __statusBusy[id];
  if(!info || !el) return;
  info.text = base;
  const textEl = el.querySelector('.status-text');
  if(textEl) textEl.textContent = base;
  if(frac != null && Number.isFinite(frac) && !info.progress){
    const pct = Math.max(8, Math.min(99, Math.round(frac * 100)));
    const bar = el.querySelector('.status-bar');
    if(bar){
      bar.classList.add('is-determinate');
      bar.style.width = `${pct}%`;
    }
  }
}

/** 미리보기 모니터를 랩 안에 선택 화면비(16:9 등)로 contain 맞춤 */
function syncPreviewMonitorSize(){
  if(state.current !== 'studio') return;
  const wrap = document.querySelector('.vp-monitor-wrap');
  const mon = document.querySelector('.vp-monitor');
  if(!wrap || !mon) return;
  const [aw, ah] = ASPECT_RATIOS[state.aspectRatio] || ASPECT_RATIOS['9:16'];
  wrap.style.setProperty('--vp-ar-w', String(aw));
  wrap.style.setProperty('--vp-ar-h', String(ah));
  mon.style.setProperty('--vp-ar-w', String(aw));
  mon.style.setProperty('--vp-ar-h', String(ah));
  const boxW = wrap.clientWidth;
  const boxH = wrap.clientHeight;
  if(boxW < 8 || boxH < 8) return;
  const ar = aw / ah;
  let w = boxW, h = w / ar;
  if(h > boxH){ h = boxH; w = h * ar; }
  w = Math.max(1, Math.round(w));
  h = Math.max(1, Math.round(h));
  mon.style.width = w + 'px';
  mon.style.height = h + 'px';
  mon.style.aspectRatio = aw + ' / ' + ah;
}
