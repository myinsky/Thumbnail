function normalizeStorySceneRow(row, index, total, plan, sourceInput){
  const phase = storyPhaseDefault(index, total);
  const raw = row || {};
  const line = compactStoryText(raw.line || raw.dialogue || raw.narration || '');
  let audio = compactStoryText(raw.audio || '').toLowerCase();
  audio = (audio === 'vo' || audio === 'sfx') ? audio : (line ? 'vo' : 'sfx');
  const visualSeed = compactStoryText(raw.visual || raw.sceneVisual || raw.description || raw.image || '');
  const storySeed = compactStoryText(sourceInput || plan.logline || plan.synopsis || plan.title || '');
  const visual = visualSeed || (phase.dramaticFunction + ' — ' + storySeed);
  const caption = compactStoryText(raw.caption || raw.subtitle || (audio === 'vo' ? line : phase.caption));
  const targetDur = Number(raw.targetDur ?? raw.duration);
  const shot = compactStoryText(raw.shot || raw.cameraShot || phase.shot);
  const angle = compactStoryText(raw.angle || raw.cameraAngle || phase.angle);
  const composition = compactStoryText(raw.composition || phase.composition);
  const cameraMotion = compactStoryText(raw.cameraMotion || raw.motion || phase.motion);
  const beat = compactStoryText(raw.beat || raw.storyBeat || raw.phase || phase.beat);
  const dramaticFunction = compactStoryText(raw.dramaticFunction || raw.purpose || phase.dramaticFunction);
  const emotion = compactStoryText(raw.emotion || raw.mood || phase.emotion);
  const continuityNote = compactStoryText(raw.continuityNote || raw.continuity || plan.visualContinuity || plan.storyBible || '');
  const soundCue = compactStoryText(raw.soundCue || raw.sfxCue || raw.sfx || raw.effect || raw.impactSound || '');
  const musicCue = compactStoryText(raw.musicCue || raw.bgmCue || raw.bgm || raw.music || '');
  const editRhythm = compactStoryText(raw.editRhythm || raw.rhythm || raw.pace || '');
  const spectacle = compactStoryText(raw.spectacle || raw.genreBlend || raw.genre || raw.visualImpact || '');
  const rawImagePrompt = compactStoryText(raw.imagePrompt || raw.prompt || joinStoryParts([
    visual,
    dramaticFunction,
    emotion,
    shot,
    angle,
    composition,
    cameraMotion,
    soundCue ? '소리큐:' + soundCue : '',
    musicCue ? '음악무드:' + musicCue : '',
    spectacle ? '장르융합:' + spectacle : ''
  ]));
  const sourceQuote = compactStoryText(sourceInput).slice(0, 240);
  const imagePrompt = (sourceQuote && !rawImagePrompt.includes(sourceQuote.slice(0, 20)))
    ? rawImagePrompt + ' · 원본 스토리 기반: ' + sourceQuote
    : rawImagePrompt;
  return {
    ...raw,
    scene: Number(raw.scene) || index + 1,
    group: index + 1,
    audio,
    line,
    visual,
    caption,
    captionStyle: raw.captionStyle || (caption ? 'bottom' : (audio === 'vo' ? 'bottom' : 'none')),
    beat,
    dramaticFunction,
    emotion,
    shot,
    angle,
    composition,
    cameraMotion,
    continuityNote,
    soundCue,
    musicCue,
    editRhythm,
    spectacle,
    imagePrompt,
    negativePrompt: compactStoryText(raw.negativePrompt || '텍스트, 자막, 워터마크, 로고, 포스터형 타이포그래피, 콜라주, 여러 장면 분할, 무작위 인물 변경 금지'),
    targetDur: Number.isFinite(targetDur) && targetDur > 0 ? Number(targetDur.toFixed(2)) : phase.duration
  };
}

function normalizeStoryPlanForCinema(plan, index=0){
  const p = plan || {};
  const sourceInput = compactStoryText(state.storyInput || '');
  const base = {
    ...p,
    title: compactStoryText(p.title || p.name, '미니 영화 ' + (index + 1)),
    logline: compactStoryText(p.logline || p.summary || p.synopsis || sourceInput, sourceInput || '짧은 줄거리에서 확장한 미니 영화'),
    synopsis: compactStoryText(p.synopsis || p.summary || p.story || ''),
    tone: compactStoryText(p.tone || p.genre || ''),
    protagonist: compactStoryText(p.protagonist || p.hero || p.mainCharacter || ''),
    centralConflict: compactStoryText(p.centralConflict || p.conflict || ''),
    twistOrPayoff: compactStoryText(p.twistOrPayoff || p.twist || p.payoff || ''),
    visualContinuity: compactStoryText(p.visualContinuity || p.continuity || ''),
    storyBible: compactStoryText(p.storyBible || p.world || p.worldview || ''),
    keyProps: Array.isArray(p.keyProps) ? p.keyProps.map(v => compactStoryText(v)).filter(Boolean) : storyArrayText(p.keyProps || p.props || '')
  };
  let rows = Array.isArray(p.scriptTable) ? p.scriptTable
    : Array.isArray(p.scenes) ? p.scenes
    : Array.isArray(p.script) ? p.script
    : [];
  if(!rows.length) rows = fallbackMiniFilmRows(sourceInput || base.logline);
  rows = rows.slice(0, 10);
  const normalized = rows.map((row, i) => normalizeStorySceneRow(row, i, rows.length, base, sourceInput));
  base.scriptTable = normalized;
  return base;
}

function normalizeStoryPlansForCinema(plans){
  const arr = Array.isArray(plans) ? plans : [plans];
  return arr.slice(0, 3).map((plan, i) => normalizeStoryPlanForCinema(plan, i));
}

async function parseOrRecoverStoryPlans(textValue, idea){
  const parsed = tryParseStoryPlansJson(textValue);
  if(parsed) return parsed;
  try{
    const repaired = await repairStoryPlansJson(textValue, idea);

  }catch(err){

  return fallbackStoryPlanSet(idea);

function heroSuggestionFromStoryPlan(plan){
  if(!plan) return null;
  const protagonist = compactStoryText(plan.protagonist || '');
  const isAnimalHero = state.heroType === 'animal';
  const species = compactStoryText(state.heroAnimalSpecies || '');
  const look = isAnimalHero
    ? compactStoryText([species, plan.visualContinuity, protagonist].filter(Boolean).join(' · '))
    : compactStoryText(plan.protagonistLook || plan.visualContinuity || protagonist);
  const wardrobe = isAnimalHero ? '' : compactStoryText(plan.protagonistWardrobe || plan.wardrobe || plan.visualContinuity);
  const desire = compactStoryText(plan.protagonistDesire || plan.desire || plan.logline);
  const conflict = compactStoryText(plan.centralConflict || plan.conflict);
  const arc = compactStoryText(plan.arc || plan.twistOrPayoff);
  const vibe = compactStoryText(plan.tone || plan.genre);
  const labelBase = isAnimalHero
    ? (species.split(/[,·]/)[0] || protagonist.split(/[,·—-]/)[0] || '동물 주인공')
    : (plan.protagonistName || protagonist.split(/[,·—-]/)[0] || '주인공');
  return sanitizeCharacterSuggestion({
    id: 'hero',
    label: compactStoryText(labelBase).slice(0, 30) || (isAnimalHero ? '동물 주인공' : '주인공'),
    gender: 'neutral',
    roleInStory: compactStoryText(plan.protagonistRole || protagonist || (isAnimalHero ? '동물 주인공' : '주인공')),
    desire,
    conflict,
    arc,
    vibe,
    look,
    identityLock: look,
    wardrobe,
    signatureProp: '',
    species: isAnimalHero ? species : undefined,
  });
}

function selectStoryPlanForProduction(index){
  const plan = normalizeStoryPlanForCinema(state.storyPlans?.[index], index);
  if(!plan?.scriptTable?.length) throw new Error('선택한 기획안에 대본 씬이 없어요.');
  if(Array.isArray(state.storyPlans)) state.storyPlans[index] = plan;
  state.selectedStoryPlan = index;
  state.selectedVariant = null;
  state.scriptMode = 'story';
  state.scriptTable = plan.scriptTable;
  state.visualStyle = 'narrative';
  state.shotPlanReady = false;
  const heroSug = heroSuggestionFromStoryPlan(plan);
  if(heroSug){
    state.charSuggestions = [heroSug];
    state.selectedCharSuggestion = heroSug;
  }
  applyShotPlanToScript();
  state.done.script = true;
  return plan;
}

async function callGeminiStoryPlans(){
  const idea = compactStoryText(state.storyInput || '');
  const successes = [];
  const errors = [];
  for(let i = 0; i < STORY_PLAN_VARIANTS.length; i++){
    try{
      const plan = await callGeminiStoryPlanOne(idea, i);
      if(plan) successes.push(plan);
    }catch(err){
      console.warn('기획안 ' + (i+1) + ' 실패:', err?.message || err);
      errors.push(err);
    }
  }
  if(!successes.length){
    if(errors.length === STORY_PLAN_VARIANTS.length && !idea){
      throw errors[0];
    }
    return fallbackStoryPlanSet(idea);
  }
  const fallbackSet = fallbackStoryPlanSet(idea);
  while(successes.length < 3 && fallbackSet.length){
    successes.push(fallbackSet[successes.length] || fallbackSet[0]);
  }
  const normalized = normalizeStoryPlansForCinema(successes);
  return normalized.length ? normalized : fallbackStoryPlanSet(idea);
}

}

function readOriginalProductStoryInput(){
  const ui = document.getElementById('productBriefInput')?.value;
  const raw = String(ui || state.productDescription || '').trim();
  if(raw) state.productDescription = raw;
  return raw;
}

function sourceStoryKeywordTokens(text){
  const stop = new Set(['그리고','그러나','하지만','그래서','이것','저것','제품','상품','스토리','줄거리','홍보','영상','장면','사용','모습','사람']);
  return Array.from(new Set(String(text || '').match(/[가-힣A-Za-z0-9]{2,}/g) || []))
    .map(t => t.trim())
    .filter(t => t.length >= 2 && !stop.has(t))
    .slice(0, 36);
}

function sourceStoryCoverageScore(rows, source){
  const tokens = sourceStoryKeywordTokens(source);
  if(!tokens.length) return 1;
  const hay = JSON.stringify(rows || []);
  const hit = tokens.filter(t => hay.includes(t)).length;
  return hit / tokens.length;
}

function normalizeProductScriptVariantsForSource(parsed){
  const source = readOriginalProductStoryInput();
  const hasRef = productScriptHasReferenceImage();
  const out = {};
  ['purchase','info','story'].forEach(key => {
    const rows = Array.isArray(parsed?.[key]) ? parsed[key] : [];
    const tooShort = rows.length < (hasRef ? 6 : 7);
    const tooDetached = source.length > 25 && sourceStoryCoverageScore(rows, source) < 0.08;
    out[key] = (tooShort || tooDetached) ? fallbackSourceExpansionScript(key, source, hasRef) : rows.map((r, i) => ({
      scene: r.scene ?? i + 1,
      group: r.group ?? i + 1,
      audio: r.audio === 'vo' ? 'vo' : 'sfx',
      line: String(r.line || ''),
      visual: String(r.visual || r.image || r.sceneVisual || ''),
      caption: String(r.caption || ''),
      beat: String(r.beat || r.storyBeat || ''),
      dramaticFunction: String(r.dramaticFunction || ''),
      emotion: String(r.emotion || ''),
      shot: String(r.shot || ''),
      angle: String(r.angle || ''),
      composition: String(r.composition || ''),
      cameraMotion: String(r.cameraMotion || ''),
      continuityNote: String(r.continuityNote || ''),
      soundCue: String(r.soundCue || ''),
      musicCue: String(r.musicCue || ''),
      editRhythm: String(r.editRhythm || ''),
      spectacle: String(r.spectacle || ''),
      targetDur: Number(r.targetDur || 1.2)
    }));
  });
  return out;
}

async function callGeminiScript(){
  const hasProductReferenceImage = productScriptHasReferenceImage();
  const sourceBrief = buildProductScriptSourceBrief(hasProductReferenceImage);
  const versionRules = buildProductScriptVersionRules(hasProductReferenceImage);
  const analysisJson = JSON.stringify(state.analysis || {});
  const reviewNote = state.reviewText
    ? '\n실제 리뷰/정보 보조 참고(원본과 충돌하면 원본 우선):\n' + state.reviewText
    : '';
  const categoryNote = state.categoryType && state.categoryType !== 'auto'
    ? '\n카테고리 보조 참고: ' + state.categoryType
    : '';

  const prompt = SYSTEM_INSTRUCTION + `

당신은 광고 카피라이터가 아니라, 원본 줄거리/설명을 영화적으로 확장하는 숏폼 시네마 감독이다.
목표는 "원본을 축소한 광고 대본"이 아니라 "원본을 이해하고 더 선명한 장면, 인물, 소품, 사운드로 확장한 미니 영화 대본"이다.

${sourceBrief}

분석 결과는 보조 참고일 뿐이다. 원본 입력을 덮어쓰거나 축소하지 말 것:
${analysisJson}
${categoryNote}${reviewNote}

${versionRules}

공통 출력 규칙:
- 각 버전은 7~9개 씬으로 작성한다. 정말 단순한 원본도 7개 미만으로 줄이지 말 것.
- 각 씬은 하나의 물리적 행동 또는 시각적 발견이어야 한다.
- visual은 이미지 생성기가 바로 이해할 수 있게 "누가/어디서/무엇을/왜"가 들어가야 한다.
- 등장인물은 원본 맥락에서 필요한 인물만 배치하고, 무관한 새 인물을 만들지 않는다.
- 제품 이미지가 없는 경우 제품 외형을 단정하지 말고 스토리 사건을 우선한다.
- 제품 이미지가 있는 경우 그 제품은 실제 물체로만 등장하고, 인물 얼굴·의상·배경 장식으로 변형하지 않는다.
- 대사는 거의 없는 영상이다. audio는 대부분 "sfx"로 두고, vo는 최대 2개 씬만 사용한다.
- soundCue, musicCue, editRhythm, cameraMotion을 반드시 채워 효과음/BGM/영상 리듬이 맞게 한다.
- caption은 짧은 자막 1~2줄 느낌으로 쓰되, 화면 설명을 대신하지 않는다.
- 구매 CTA, 특가, 링크, 댓글 확인 같은 상투적 광고 엔딩으로 원본 결말을 덮지 말 것.

아래 JSON 형식으로만 출력한다. 키 이름은 유지하되 의미는 위 버전 규칙을 따른다.
{
  "purchase": [{"scene":1,"group":1,"audio":"sfx","line":"","visual":"","caption":"","beat":"","dramaticFunction":"","emotion":"","shot":"","angle":"","composition":"","cameraMotion":"","continuityNote":"","soundCue":"","musicCue":"","editRhythm":"","spectacle":"","targetDur":1.2}],
  "info": [{"scene":1,"group":1,"audio":"sfx","line":"","visual":"","caption":"","beat":"","dramaticFunction":"","emotion":"","shot":"","angle":"","composition":"","cameraMotion":"","continuityNote":"","soundCue":"","musicCue":"","editRhythm":"","spectacle":"","targetDur":1.2}],
  "story": [{"scene":1,"group":1,"audio":"sfx","line":"","visual":"","caption":"","beat":"","dramaticFunction":"","emotion":"","shot":"","angle":"","composition":"","cameraMotion":"","continuityNote":"","soundCue":"","musicCue":"","editRhythm":"","spectacle":"","targetDur":1.2}]
}`;

  const text = await callTextAi({ userText: prompt, maxTokens: 10000 });
  return normalizeProductScriptVariantsForSource(parseAiJson(text));
}

function typecastUrl(path){
  if(state.keys.useWorkerProxy && state.keys.workerProxyUrl){
    return `${state.keys.workerProxyUrl.replace(/\/$/,'')}/typecast/${path.replace(/^\//,'')}`;
  }
  return `${state.keys.typecastBase}/${path.replace(/^\//,'')}`;
}
function typecastHeaders(){
  if(state.keys.useWorkerProxy && state.keys.workerProxyUrl){
    return { 'Content-Type':'application/json' };
  }
  return { 'Content-Type':'application/json', 'X-API-KEY': state.keys.typecastApiKey };
}

function isProxyEnabled(){
  return !!(state.keys.useWorkerProxy && String(state.keys.workerProxyUrl||'').trim());

 * http → 직접 호출 우선 / file:// → 프록시 우선
 * 설정된 프록시 → 127.0.0.1:8787 폴백

async function fetchGeminiGenerateContent(body, { model, persistProxyFallback = false } = {}){
  const m = model || resolveGeminiModel();
  if(!String(state.keys.gemini||'').trim()){
    throw new Error('설정에서 Gemini API 키를 입력해주세요.');
  }
  const attempts = [];
  const seen = new Set();
  const push = (a)=>{
    if(!a?.url || seen.has(a.url)) return;
    seen.add(a.url);
    attempts.push(a);
  };

  const localProxyRoot = await pingLocalProxy();
  if(location.protocol === 'file:'){
    if(isProxyEnabled()){
      push({ url: geminiProxyUrl(proxyBase(), m), via: isLocalProxy() ? '로컬 프록시' : 'Worker 경유' });
    }
    if(localProxyRoot){
      push({ url: geminiProxyUrl(localProxyRoot, m), via: '로컬 프록시(폴백)', requiresLocal: true });
    }
    push({ url: geminiDirectUrl(m), via: '직접 호출' });
  }else{
    push({ url: geminiDirectUrl(m), via: '직접 호출' });
    if(isProxyEnabled()){
      push({ url: geminiProxyUrl(proxyBase(), m), via: isLocalProxy() ? '로컬 프록시' : 'Worker 경유' });
    }
    if(localProxyRoot){
      push({ url: geminiProxyUrl(localProxyRoot, m), via: '로컬 프록시(폴백)', requiresLocal: true });
    }
  }

  let lastNetErr = null;
  let lastHttp = null;
  for(const attempt of attempts){
    if(attempt.requiresLocal && !localProxyRoot) continue;
    try{
      const res = await fetch(attempt.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if(persistProxyFallback && attempt.requiresLocal && res && localProxyRoot && !isProxyEnabled()){
        enableLocalProxySetting(true, localProxyRoot);
      }
      if(!res.ok){
        const text = await res.text().catch(()=> '');
        lastHttp = { status: res.status, text, model: m, via: attempt.via };
        const proxyPath = /프록시|Worker/i.test(String(attempt.via||''));
        // 일시 오류·잘못된 로컬 프록시(포트 충돌)는 다음 경로 시도
        if(
          res.status >= 500 ||
          res.status === 429 ||
          (proxyPath && (res.status === 404 || isWrongLocalProxyBody(text)))
        ) continue;
        throw new Error(formatGeminiHttpError(res.status, text, m, attempt.via));
      }
      const data = await res.json();
      return { res, data, via: attempt.via };
    }catch(err){
      if(err && /Gemini HTTP|API 키|모델 ID|사용량|용량/i.test(String(err.message||''))) throw err;
      lastNetErr = err;
    }
  }
  throw new Error(formatGeminiNetworkError(lastNetErr || new Error('Failed to fetch'), lastHttp));
}

async function pingLocalProxy(base){
  const roots = [];
  const push = (u)=>{
    const b = String(u||'').replace(/\/$/,'');
    if(b && !roots.includes(b)) roots.push(b);
  };
  push(base);
  push(state.keys.workerProxyUrl);
  push('http://127.0.0.1:8791');
  push('http://127.0.0.1:8788');
  push('http://127.0.0.1:8787');
  for(const root of roots){
    try{
      const res = await fetch(`${root}/health`, { method:'GET', cache:'no-store' });
      if(!res.ok) continue;
      const data = await res.json().catch(()=>({}));
      // adobe-pdf-proxy 등 다른 앱이 같은 포트의 /health 를 응답하는 경우 제외
      if(data && data.ok && (data.service === 'sss-local-proxy' || data.gemini === true || data.app === 'shopping-shorts-studio')){
        return root;
      }
      // 구버전 sss 프록시(service 필드 없음): /gemini 경로 존재 여부로 판별하지 않고 ok만 보되 adobe 명시 시 거부
      if(data && data.ok && !data.service && !/adobe|pdf/i.test(JSON.stringify(data))){
        return root;
      }
    }catch(_){}
  }
  return '';
}

/** file:// 에서는 Anthropic 직접 호출이 CORS로 막힘 → 로컬 프록시를 자동 사용 */
function isFileProtocol(){

function enableLocalProxySetting(persist = true, baseUrl){
  const url = String(baseUrl || state.keys.workerProxyUrl || 'http://127.0.0.1:8791').replace(/\/$/,'');

  }

async function ensureClaudeTransport(){
  const localUp = await pingLocalProxy();
  if(isFileProtocol()){
    if(localUp){
      enableLocalProxySetting(true, localUp);
      return { mode: 'local-proxy', localUp };
    }
    return { mode: 'blocked-file', localUp: '' };
  }
  if(localUp && isProxyEnabled() && isLocalProxy()){
    return { mode: 'local-proxy', localUp };
  }
  return { mode: 'direct', localUp };
}

/**
 * Claude 연결 순서:
 * - file:// : 로컬 프록시 필수(자동 설정) → 8791
 * - http(s): 직접 호출 → 설정 프록시 → 로컬 프록시 폴백
 */
async function fetchClaudeMessages(body, { persistProxyFallback = true } = {}){
  const transport = await ensureClaudeTransport();
  const localRoot = transport.localUp || (await pingLocalProxy());

  const attempts = [];
  const seen = new Set();
  const push = (a)=>{
    if(!a?.url || seen.has(a.url)) return;
    seen.add(a.url);
    attempts.push(a);
  };

  const file = isFileProtocol();
  const localFirst = file || (isProxyEnabled() && isLocalProxy());

  if(localFirst){
    if(isProxyEnabled()){
      push({
        url: `${proxyBase()}/claude/v1/messages`,
        headers: claudeHeaders(isLocalProxy() ? 'local-proxy' : 'remote-proxy'),
        via: isLocalProxy() ? '로컬 프록시' : 'Worker 경유',
      });
    }
    if(localRoot){
      push({
        url: `${localRoot}/claude/v1/messages`,
        headers: claudeHeaders('temp-local'),
        via: '로컬 프록시(자동)',
        requiresLocal: true,
      });
    }
  }

  if(!file){
    push({
      url: claudeDirectUrl(),
      headers: claudeHeaders('direct'),
      via: '직접 호출',
    });
  }

  if(!localFirst){
    if(isProxyEnabled()){
      push({
        url: `${proxyBase()}/claude/v1/messages`,
        headers: claudeHeaders(isLocalProxy() ? 'local-proxy' : 'remote-proxy'),
        via: isLocalProxy() ? '로컬 프록시' : 'Worker 경유',
      });
    }
    if(localRoot){
      push({
        url: `${localRoot}/claude/v1/messages`,
        headers: claudeHeaders('temp-local'),
        via: '로컬 프록시(폴백)',
        requiresLocal: true,
      });
    }
  }

  let lastNetErr = null;
  for(const attempt of attempts){
    if(attempt.requiresLocal && !localRoot) continue;
    try{
      const res = await fetch(attempt.url, {
        method: 'POST',
        headers: attempt.headers,
        body: JSON.stringify(body),
      });
      // 성공 응답일 때만 로컬 프록시 설정을 고정 (404 받는 다른 앱 포트는 제외)
      if(res.ok && (persistProxyFallback || file) && (attempt.requiresLocal || /127\.0\.0\.1|localhost/i.test(attempt.url))){
        const root = String(attempt.url).replace(/\/claude\/.*$/i, '').replace(/\/$/,'');
        enableLocalProxySetting(true, root || undefined);
      }
      return { res, via: attempt.via };
    }catch(err){
      lastNetErr = err;
    }
  }
  throw new Error(formatClaudeNetworkError(lastNetErr || new Error('Failed to fetch')));
}

function parseAiJson(text){
  const cleaned = String(text || '').replace(/```json|```/g, '').trim();
  const start = cleaned.search(/[\{\[]/);
  if(start < 0) return JSON.parse(cleaned);
  const open = cleaned[start];
  const close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false, end = -1;
  for(let i = start; i < cleaned.length; i++){
    const ch = cleaned[i];
    if(inStr){
      if(esc){ esc = false; continue; }
      if(ch === '\\'){ esc = true; continue; }
      if(ch === '"') inStr = false;
      continue;
    }
    if(ch === '"'){ inStr = true; continue; }
    if(ch === open) depth++;
    else if(ch === close){
      depth--;
      if(depth === 0){ end = i; break; }
    }
  }
  const payload = end >= 0 ? cleaned.slice(start, end + 1) : cleaned.slice(start);
  return JSON.parse(payload);
}

  }
  const userContent = [];
  if(userText) userContent.push({ type: 'text', text: userText });
  for(const part of imageParts){
    const mime = part.inline_data?.mime_type || part.mime_type || 'image/jpeg';
    const data = part.inline_data?.data || part.data;
    if(!data) continue;
    userContent.push({ type: 'image_url', image_url: { url: `data:${mime};base64,${data}` } });
  }
  if(!userContent.length) userContent.push({ type: 'text', text: '(empty)' });

  const messages = [];
  if(system) messages.push({ role: 'system', content: system });
  messages.push({
    role: 'user',
    content: userContent.length === 1 && userContent[0].type === 'text' ? userContent[0].text : userContent,
  });

  const model = String(state.keys.openaiModel || 'gpt-5.6-terra').trim();
  const body = {
    model,
    messages,
    max_completion_tokens: maxTokens,
  };
  const { res } = await fetchOpenAIChat(body);
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(formatOpenAIHttpError(res.status, errText));
  }
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content;
  if(!text) throw new Error('ChatGPT 응답이 비어 있어요.');
  return typeof text === 'string' ? text : JSON.stringify(text);
}

async function callGeminiText({ system, userText, imageParts = [], maxTokens = 4096 }){
  if(!String(state.keys.gemini||'').trim()){
    throw new Error('설정에서 Gemini API 키를 입력해주세요.');
  }
  const parts = [];
  const joined = [system, userText].filter(Boolean).join('\n\n');
  if(joined) parts.push({ text: joined });
  for(const part of imageParts){
    if(part?.inline_data || part?.text) parts.push(part);
  }
  const { data } = await fetchGeminiGenerateContent(
    {
      contents: [{ parts }],
      generationConfig: { maxOutputTokens: maxTokens },
    },
    { model: resolveGeminiModel(), persistProxyFallback: false }
  );
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n');
  if(!text) throw new Error('Gemini 응답이 비어 있어요.');
  return text;
}

/**
 * @param {object} opts
 * @param {'claude'|'chatgpt'|'gemini'|null} [opts.forceProvider] 지정 시 그 엔진만 사용
 * @param {boolean} [opts.geminiFallback] Claude 실패 시 Gemini로 1회 재시도 (이미지·유튜브 연계 분석용)
 */
async function callTextAi({ system, userText, imageParts = [], maxTokens = 4096, forceProvider = null, geminiFallback = false } = {}){
  const pref = (()=>{
    let p = forceProvider || state.keys.textAiProvider || 'claude';
    if(p === 'openai') p = 'chatgpt';
    return p;
  })();
  const isNetworkFail = (err)=>{
    const m = String(err?.message || err || '');
    // 안내 문구의 '로컬 프록시'는 매칭하지 않음 — 실제 네트워크 실패만
    return /Failed to fetch|NetworkError|Load failed|CORS|file:\/\//i.test(m)
      || /네트워크\/CORS로 .+에 닿지 못했어요/i.test(m);
  };
  const run = async (name)=>{
    if(name === 'claude'){
      if(!String(state.keys.claudeApiKey||'').trim()){
        throw new Error('Claude가 선택됐지만 API 키가 없어요. 설정에서 키를 넣으세요.');
      }
      return callClaudeText({ system, userText, imageParts, maxTokens });
    }
    if(name === 'chatgpt'){
      if(!String(state.keys.openaiApiKey||'').trim()){
        throw new Error('ChatGPT가 선택됐지만 API 키가 없어요. 설정에서 키를 넣으세요.');
      }
      return callOpenAIText({ system, userText, imageParts, maxTokens });
    }
    if(name === 'gemini'){
      if(!String(state.keys.gemini||'').trim()){
        throw new Error('Gemini가 선택됐지만 API 키가 없어요. 설정에서 키를 넣으세요.');
      }
      return callGeminiText({ system, userText, imageParts, maxTokens });
    }
    throw new Error('지원하지 않는 AI입니다: '+name);
  };

  // 영상 분석 등 — Gemini 강제
  if(forceProvider === 'gemini'){
    return run('gemini');
  }

  // Claude 명시 + geminiFallback: Claude 실패 시에만 Gemini
  if(pref === 'claude' && geminiFallback && String(state.keys.gemini||'').trim()){
    try{
      return await run('claude');
    }catch(err){
      console.warn('[callTextAi] Claude 실패 → Gemini 폴백', err);
      try{
        return await run('gemini');
      }catch(gErr){
        throw new Error(`Claude 실패 후 Gemini도 실패했어요. Claude: ${err.message} / Gemini: ${gErr.message}`);
      }
    }
  }

  // Claude/ChatGPT/Gemini를 명시 선택한 경우 — 다른 엔진으로 조용히 바꾸지 않음
  if(pref === 'claude' || pref === 'chatgpt' || pref === 'gemini'){
    return run(pref);
  }

  // 자동: Claude → ChatGPT → Gemini (네트워크 실패 시에만 다음 엔진)
  const order = ['claude', 'chatgpt', 'gemini'].filter(name=>{
    if(name === 'claude') return !!String(state.keys.claudeApiKey||'').trim();
    if(name === 'chatgpt') return !!String(state.keys.openaiApiKey||'').trim();
    if(name === 'gemini') return !!String(state.keys.gemini||'').trim();
    return false;
  });
  if(!order.length){
    throw new Error('설정에서 Claude / ChatGPT / Gemini 중 하나를 선택하고 키를 입력해주세요.');
  }
  let lastErr = null;
  for(let i = 0; i < order.length; i++){
    const name = order[i];
    try{
      return await run(name);
    }catch(err){
      lastErr = err;
      const hasNext = i < order.length - 1;
      if(hasNext && isNetworkFail(err)){
        console.warn(`[callTextAi] 자동: ${name} 실패 → ${order[i+1]} 시도`, err);
        continue;
      }
      throw err;
    }
  }
  throw lastErr || new Error('AI 호출에 실패했어요.');
}

async function callClaudeText({ system, userText, imageParts = [], maxTokens = 4096 }){
  if(!String(state.keys.claudeApiKey||'').trim()){
    throw new Error('설정에서 Claude API 키를 입력해주세요.');
  }
  const content = [];
  for(const part of imageParts){
    const mime = part.inline_data?.mime_type || part.mime_type || 'image/jpeg';
    const data = part.inline_data?.data || part.data;
    if(!data) continue;
    content.push({
      type: 'image',
      source: { type: 'base64', media_type: mime, data }
    });
  }
  content.push({ type: 'text', text: userText });
  state.keys.claudeModel = resolveClaudeModel();
  const body = {
    model: state.keys.claudeModel,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content }],
  };
  if(system) body.system = system;
  const { res } = await fetchClaudeMessages(body, { persistProxyFallback:true });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(formatClaudeHttpError(res.status, errText, state.keys.claudeModel));
  }
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  if(!text) throw new Error('Claude 응답이 비어 있어요.');
  return text;
}

function hfAuthHeader(){
  return `Key ${state.keys.higgsfieldKeyId}:${state.keys.higgsfieldKeySecret}`;
}

function hfBaseUrl(){
  const base = String(state.keys.higgsfieldBase || 'https://platform.higgsfield.ai').trim().replace(/\/$/,'');
  // 예전에 프록시 URL이 Base에 들어간 경우 복구
  if(/127\.0\.0\.1|localhost/i.test(base) || /\/higgsfield$/i.test(base)){
    return 'https://platform.higgsfield.ai';
  }
  return base || 'https://platform.higgsfield.ai';
}
function hfHeaders(){
  return {
    'Content-Type': 'application/json',
    'Authorization': hfAuthHeader(),
  };
}

/* ------------------------------------------------------------
   Higgsfield Platform API는 서버 전용입니다.
   브라우저에서 직접 POST하면 403이 납니다 — 반드시 로컬 프록시
   (User-Agent: higgsfield-server-js/2.0)로 중계해야 합니다.

   상태코드 의미 (실측):
   - 401 {"detail":"Invalid credentials"} → 키·시크릿이 틀림
   - 403 → 브라우저 직접 호출, 또는 웹앱 전용 모델(soul/v2/*), 또는 권한/크레딧
   - 404 → 모델 슬러그 오류 / 구버전 프록시에 /higgsfield 경로 없음
------------------------------------------------------------ */
function hfLocalProxyBase(){
  const configured = String(state.keys.workerProxyUrl||'').trim().replace(/\/$/,'');
  if(configured && /^(https?:\/\/)?(127\.0\.0\.1|localhost)(:\d+)?/i.test(configured)){
    return /^https?:\/\//i.test(configured) ? configured : `http://${configured}`;
  }
  if(/^https?:$/.test(location.protocol) && /^(127\.0\.0\.1|localhost)$/i.test(location.hostname)){
    return location.origin;
  }
  return 'http://127.0.0.1:8791';
}

let hfProxyState = null; // null=미확인 · true/false=사용 가능 여부
async function hfProxyBase({ force = false } = {}){
  if(force) hfProxyState = null;
  if(hfProxyState === false) return null;
  if(hfProxyState === true) return hfLocalProxyBase();
  // sss-local-proxy 만 인정 (8787 PDF Studio 제외)
  const discovered = await pingLocalProxy();
  const base = discovered || hfLocalProxyBase();
  try{
    const res = await fetch(`${base}/health`, { method:'GET', cache:'no-store' });
    const data = res.ok ? await res.json().catch(()=>({})) : {};
    hfProxyState = !!(data.ok && (data.service === 'sss-local-proxy' || !data.service));
    if(hfProxyState && discovered){
      state.keys.workerProxyUrl = discovered;
    }
  }catch(_){
    hfProxyState = false;
  }
  return hfProxyState ? base : null;
}

/** 생성 전에 프록시가 떠 있는지 확인. 없으면 즉시 안내. */
async function ensureHfProxyReady(){
  const proxy = await hfProxyBase({ force:true });
  if(!proxy){
    throw new Error(
      'Higgsfield 로컬 프록시가 꺼져 있어요. 영상·이미지 생성은 브라우저 직접 호출이 403으로 막힙니다. '
      + '터미널에서 이 폴더로 이동한 뒤 node sss-local-proxy.mjs 를 실행하고 다시 시도하세요. '
      + `(기대 주소: ${hfLocalProxyBase()}/health)`
    );
  }
  return proxy;
}

/**
 * 생성·업로드는 로컬 프록시만 사용합니다.
 * 연결 테스트(opts.allowDirect)일 때만 직접 호출을 보조로 허용합니다.
 */
async function hfFetch(path, init={}, opts={}){
  const rel = String(path||'').replace(/^\//,'');
  const allowDirect = !!opts.allowDirect;
  const proxy = await hfProxyBase();
  const attempts = [];
  if(proxy) attempts.push({ url:`${proxy}/higgsfield/${rel}`, via:'로컬 프록시' });
  if(allowDirect || !proxy) attempts.push({ url:`${hfBaseUrl()}/${rel}`, via:'직접 호출' });

  if(!attempts.length){
    throw new Error('Higgsfield에 연결할 경로가 없어요. node sss-local-proxy.mjs 를 실행하세요.');
  }

  let last = null;
  let lastErr = null;
  for(const a of attempts){
    try{
      const res = await fetch(a.url, init);
      // 구버전 프록시는 /higgsfield 라우트가 없어 plain "not found" 404를 냅니다
      if(a.via === '로컬 프록시' && res.status === 404){
        const body = await res.clone().text().catch(()=> '');
        if(/not found|HTML 파일/i.test(body) || !body.trim()){
          throw new Error(
            '로컬 프록시에 Higgsfield 중계 경로가 없어요. 터미널의 프록시를 종료(Ctrl+C)한 뒤 '
            + '최신 sss-local-proxy.mjs 로 다시 실행하세요. (콘솔에 "Higgsfield: POST /higgsfield/..." 가 보여야 합니다)'
          );
        }
      }
      if(res.ok) return { res, via:a.via };
      // 생성 POST의 직접 호출 403은 예상 동작 — 프록시가 있으면 그걸 우선 반환
      if(a.via === '직접 호출' && res.status === 403 && last?.via === '로컬 프록시'){
        return last;
      }
      last = { res, via:a.via };
    }catch(err){
      if(err && /로컬 프록시에 Higgsfield|프록시가 꺼져/i.test(String(err.message||''))) throw err;
      lastErr = err;
    }
  }
  if(last) return last;
  throw lastErr || new Error('Higgsfield에 연결하지 못했어요. node sss-local-proxy.mjs 를 실행한 뒤 다시 시도하세요.');
}

/** __SSS_CREDITS_HELP_V1__ */
function isHfCreditsErrorBody(bodyText){
  const s = String(bodyText||'');
  return /not_enough_credits|insufficient[_ ]?credits|credit.*insufficient|잔액|크레딧.*부족/i.test(s);
}

    <div style="font-size:13.5px; font-weight:500; line-height:1.55;">

      <b>중요:</b> 웹앱(higgsfield.ai) 구독 크레딧과 <b>API(cloud) 크레딧은 별도</b>라서, 웹에서 잔액이 있어도 API는 거절될 수 있어요.<br>
      <a href="https://cloud.higgsfield.ai" target="_blank" rel="noopener" style="color:#1D4ED8; font-weight:700;">cloud.higgsfield.ai</a>에서 API 크레딧을 충전한 뒤 다시 시도하세요.

    </div>`;
}

/** 403·연결 실패를 사용자가 조치할 수 있는 문구로 */
function hfErrorMessage(status, via, bodyText, where){
  const raw = String(bodyText||'');
  const tail = raw.replace(/\s+/g,' ').slice(0, 180);
  const slugHint = /soul\/v2/i.test(where)
    ? ' 모델이 soul/v2/* 이면 웹앱 전용입니다 — 설정의 캐릭터 모델을 higgsfield-ai/soul/standard 로 바꾸세요.'
    : '';

  // 크레딧 부족은 403으로도 옴 — 키/권한 안내보다 먼저 분기
  if(status === 402 || isHfCreditsErrorBody(raw) || isHfCreditsErrorBody(tail)){
    return `CREDIT_ERR::${where}::not_enough_credits`;
  }

  if(status === 403){
    if(via === '로컬 프록시'){
      return `${where} 거부됨 (403 · 로컬 프록시 경유).${slugHint}`
        + ' Key ID·Secret·모델 권한을 platform.higgsfield.ai / cloud.higgsfield.ai 에서 확인하세요.'
        + (tail ? ` 응답: ${tail}` : '');
    }
    return `${where} 거부됨 (403). Higgsfield는 브라우저 직접 호출을 차단합니다.`
      + ' 터미널에서 node sss-local-proxy.mjs 를 실행한 뒤 다시 시도하세요.'
      + slugHint
      + (tail ? ` 응답: ${tail}` : '');
  }
  if(status === 401){
    return `${where} 인증 실패 (401). API 설정의 Key ID·Secret을 platform.higgsfield.ai에서 다시 발급·복사하세요. ${tail}`;
  }
  if(status === 404){
    return `${where} 실패 (404) — 모델 슬러그가 없거나 계정에서 막을 수 있어요. 이미지: higgsfield-ai/popcorn/auto · 캐릭터: higgsfield-ai/soul/standard · 영상: higgsfield-ai/dop/lite. (seedream 은 이 계정에서 model_not_found) ${tail}`;
  }
  if(status === 429){
    return `${where} 실패 (429) — 요청이 몰렸어요. 잠시 후 다시 시도하세요. ${tail}`;
  }
  if([500,502,503,504,520,522,524].includes(Number(status))){
    return `${where} 일시 실패 (${status} · ${via}) — 로컬 프록시가 상위 Higgsfield/Cloudflare 응답을 기다리다 게이트웨이 오류를 받았어요. 앱이 자동 재시도했지만 계속 실패했습니다. 프록시를 켠 상태로 잠시 후 다시 시도하세요. ${tail}`;
  }
  if(status === 422){
    if(/resolution|720p|1080p|2K/i.test(tail)){
      return `${where} 파라미터 오류 (422). Soul 캐릭터 모델 resolution은 720p 또는 1080p만 됩니다 (2K 불가). 앱이 1080p로내도록 수정됐는지 새로고침 후 다시 시도하세요. ${tail}`;
    }
    return `${where} 파라미터 오류 (422 · ${via}). 요청 값 형식을 확인하세요. ${tail}`;
  }
  return `${where} 실패 (${status} · ${via}) ${tail}`;
}

function isHfTransientStatus(status, bodyText=''){
  return [500,502,503,504,520,522,524].includes(Number(status))
    || /bad gateway|gateway|cloudflare|temporar|timeout|overloaded/i.test(String(bodyText||''));
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

// 모델 슬러그 하나를 submit → 완료까지 폴링 → 결과 반환
async function hfSubmit(applicationSlug, args, opts={}){
  const primary = migrateHfModelSlug(applicationSlug, '');
  if(!primary) throw new Error('모델 슬러그가 비어있어요. 설정에서 입력해주세요.');
  if(!String(state.keys.higgsfieldKeyId||'').trim() || !String(state.keys.higgsfieldKeySecret||'').trim()){
    throw new Error('Higgsfield Key ID·Secret이 비어 있어요. API 설정에서 입력해주세요.');
  }
  const onProgress = typeof opts.onProgress === 'function' ? opts.onProgress : null;
  const fallbacks = (opts.fallbackModels || [])
    .map(s => migrateHfModelSlug(s, ''))
    .filter(s => s && s !== primary);
  const candidates = [primary, ...fallbacks];
  await ensureHfProxyReady();

  let lastErr = null;
  for(let ci=0; ci<candidates.length; ci++){
    let slug = candidates[ci];
    let bodyArgs = { ...args };
    // 폴백 모델에 맞춰 resolution 등 정리
    if(/popcorn/i.test(slug)){
      if(bodyArgs.resolution && !/^(720p|1600p)$/.test(bodyArgs.resolution)) bodyArgs.resolution = '1600p';
      if(!bodyArgs.resolution) bodyArgs.resolution = '1600p';
      delete bodyArgs.camera_fixed;
      delete bodyArgs.num_images;
      if(bodyArgs.reference_images && !bodyArgs.input_images){
        bodyArgs.input_images = bodyArgs.reference_images;
        delete bodyArgs.reference_images;
      }
    }else if(/soul/i.test(slug)){
      if(bodyArgs.resolution && !/^(720p|1080p)$/.test(bodyArgs.resolution)) bodyArgs.resolution = '1080p';
      if(!bodyArgs.resolution) bodyArgs.resolution = '1080p';
      bodyArgs.num_images = bodyArgs.num_images || 1;
      delete bodyArgs.camera_fixed;
      delete bodyArgs.input_images;
      delete bodyArgs.image_urls;
      delete bodyArgs.reference_images;
    }

    onProgress?.({ phase:'submit', frac:0.05, status:'queued', model: slug });
    const { res: submitRes, via } = await hfFetch(slug, {
      method:'POST',
      headers: hfHeaders(),
      body: JSON.stringify(bodyArgs)
    });
    if(!submitRes.ok){
      const body = await submitRes.text().catch(()=> '');
      lastErr = new Error(hfErrorMessage(submitRes.status, via, body, `Higgsfield 제출(${slug})`));
      // model_not_found 만 다음 후보 시도
      if(submitRes.status === 404 && /model_not_found/i.test(body) && ci < candidates.length - 1){
        console.warn('[hfSubmit] model_not_found → fallback', slug, '→', candidates[ci+1]);
        continue;
      }
      throw lastErr;
    }
    const submitData = await submitRes.json();
    const requestId = submitData.request_id || submitData.id;
    if(!requestId) throw new Error('request_id를 응답에서 찾을 수 없어요.');
    // 폴백으로 성공한 이미지 모델은 기억
    if(ci > 0 && /popcorn|soul|seedream|image/i.test(slug)){
      state.keys.hfImageModel = slug;
    }
    onProgress?.({ phase:'poll', frac:0.12, status: 'submitted', requestId, model: slug });

    // 완료될 때까지 폴링 (0.7초 간격, 최대 90초)
    const maxTries = 130;
    let transientStatusErrors = 0;
    for(let i=0;i<maxTries;i++){
      const { res: statusRes, via: statusVia } = await hfFetch(`requests/${requestId}/status`, { headers: hfHeaders() });
      if(!statusRes.ok){
        const body = await statusRes.text().catch(()=> '');
        if(isHfTransientStatus(statusRes.status, body) && transientStatusErrors < 10){
          transientStatusErrors++;
          const backoff = Math.min(5500, 900 + transientStatusErrors * 650);
          onProgress?.({ phase:'poll-retry', frac:Math.min(0.92, 0.12 + (1 - Math.exp(-i/28)) * 0.75), status:`gateway_retry_${statusRes.status}`, requestId, try:i+1, retry:transientStatusErrors, maxTries, model: slug });
          console.warn('[hfSubmit] transient status poll error, retrying', statusRes.status, body.slice(0, 160));
          await wait(backoff);
          continue;
        }
        throw new Error(hfErrorMessage(statusRes.status, statusVia, body, '생성 상태 조회'));
      }
      transientStatusErrors = 0;
      const statusData = await statusRes.json();
      const status = (statusData.status || '').toLowerCase();
      const frac = Math.min(0.95, 0.12 + (1 - Math.exp(-i/28)) * 0.8);
      onProgress?.({ phase:'poll', frac, status: status || 'processing', requestId, try:i+1, maxTries, model: slug });
      if(status === 'completed'){
        onProgress?.({ phase:'done', frac:1, status:'completed', requestId, model: slug });
        return statusData.output || statusData.result || statusData;
      }
      if(['failed','nsfw','cancelled'].includes(status)){
        throw new Error(`생성 실패 (${status}): ${statusData.error || '알 수 없는 오류'}`);
      }
      await new Promise(r => setTimeout(r, 700));
      if(i === maxTries-1) throw new Error('시간 초과: 생성이 너무 오래 걸려요.');
    }
  }
  throw lastErr || new Error('Higgsfield 제출에 실패했어요.');
}

// base64 이미지를 힉스필드 스토리지에 업로드하고 공개 URL 반환 (2단계: presign → PUT)
async function hfUploadBase64(b64, mime){
  const { res: presignRes, via } = await hfFetch('files/generate-upload-url', {
    method:'POST',
    headers: hfHeaders(),
    body: JSON.stringify({ content_type: mime })
  });
  if(!presignRes.ok){
    const body = await presignRes.text().catch(()=> '');
    throw new Error(hfErrorMessage(presignRes.status, via, body, '업로드 URL 발급'));
  }
  const { public_url, upload_url } = await presignRes.json();

  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const putDirect = ()=> fetch(upload_url, { method:'PUT', headers:{ 'Content-Type': mime }, body: bytes });
  let putRes = null;
  try{
    putRes = await putDirect();
  }catch(_){ /* 스토리지 CORS면 프록시로 재시도 */ }
  if(!putRes || !putRes.ok){
    const proxy = await hfProxyBase();
    if(proxy){
      putRes = await fetch(`${proxy}/hf-upload?url=${encodeURIComponent(upload_url)}`, {
        method:'PUT', headers:{ 'Content-Type': mime }, body: bytes,
      });
    }
  }
  if(!putRes || !putRes.ok){
    throw new Error(`파일 업로드 실패: ${putRes ? putRes.status : '연결 불가'} — node sss-local-proxy.mjs 를 실행하면 스토리지 CORS를 우회합니다.`);
  }
  return public_url;
}

// 업로드된 제품 이미지 URL 캐시 (한 번만 업로드하고 재사용)
async function getUploadedProductImageUrls(){
  if(state.productImageUrls && state.productImageUrls.length === state.productImages.length){
    return state.productImageUrls;
  }
  const urls = [];
  for(const img of state.productImages){
    urls.push(await hfUploadBase64(img.b64, img.mime));
  }
  state.productImageUrls = urls;
  return urls;
}

// output 객체에서 미디어 URL을 유연하게 추출 (모델마다 필드명이 조금씩 다를 수 있음)
function extractMediaUrl(output){
  if(!output) return null;
  if(typeof output === 'string' && /^https?:\/\//i.test(output)) return output;
  return output.media_url?.[0] || output.image_url || output.video_url || output.audio_url
    || output.images?.[0]?.url || output.videos?.[0]?.url || output.audios?.[0]?.url
    || output.video?.url || output.image?.url
    || output.jobs?.[0]?.results?.raw?.url || output.jobs?.[0]?.results?.min?.url
    || output.url || null;
}

const __SSS_CAST_DIRECTOR_V1__ = true;
const STORY_CHARACTER_PROP_NOISE_RE = /(TV|텔레비전|모니터|스크린|박스|상자|택배|카톤|carton|box|SUV|자동차|차량|경찰차|순찰차|승용차|트럭|제품|상품|패키지|포장|가격표|영수증|로고|자막|텍스트|글자|문구|포스터|광고판|빵|베이글|커피|컵|봉투|총|무기|폭발|충돌|차키|리모컨|계산서|영수표|간판)/i;

function cleanCastText(value, max=180){
  return String(value||'')
    .replace(/\s+/g, ' ')
    .replace(/[“”]/g, '"')
    .trim()
    .slice(0, max);
}

function stripStoryPropsFromPersonText(value, max=180){
  let text = cleanCastText(value, max * 2);
  if(!text) return '';
  text = text
    .replace(/손에\s*[^,.，。;；]*(TV|텔레비전|모니터|스크린|박스|상자|SUV|자동차|차량|제품|상품|빵|커피|봉투|가격표|영수증)[^,.，。;；]*/gi, '')
    .replace(/(TV|텔레비전|모니터|스크린|박스|상자|택배|카톤|carton|box|SUV|자동차|차량|경찰차|순찰차|승용차|트럭|제품|상품|패키지|포장|가격표|영수증|로고|자막|텍스트|글자|문구|포스터|광고판|빵|베이글|커피|컵|봉투|총|무기|폭발|충돌|차키|리모컨|계산서|영수표|간판)[\w가-힣\s-]{0,18}/gi, '')
    .replace(/\s*[·,，;；/|-]\s*(?=[·,，;；/|-])/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return text.slice(0, max);
}

function safePersonalSignatureProp(value){
  const text = cleanCastText(value, 80);
  if(!text || STORY_CHARACTER_PROP_NOISE_RE.test(text)) return '';
  if(/시계|반지|목걸이|안경|선글라스|배지|명찰|스카프|넥타이|핀|브로치|이어피스|작은 펜|소형 펜/i.test(text)) return text;
  return '';
}

function cleanRoleIntentText(value, max=160){
  let text = cleanCastText(value, max * 2);
  text = text.replace(/TV\s*쇼핑|홈쇼핑/gi, '방송 쇼핑');
  text = text.replace(/대형\s*(TV|박스|상자|SUV|자동차|차량)[^,.，。;；]*/gi, '');
  return cleanCastText(text, max);
}

    '감독 규칙: 캐릭터는 얼굴·복장·감정의 주체이고, TV·박스·SUV·자동차·제품은 실제 물체다. 인물 초상에는 섞지 말고, 장면에서는 실제 크기와 형태로 배치한다.'
  ];
  for(const raw of wa.cast){
    const c = sanitizeCastSlotForPortrait(raw);
    if(c.draw === false || c.isMajor === false) continue;
    if(!String(c.name||'').trim() && !String(c.look||c.identityLock||'').trim() && !c.imageUrl) continue;
    parts.push(('주목 인물 등장: ' + formatPersonIdentity(c) + ' (역할:' + (c.role||'조연') + ', 성별:' + genderLabelKo(c.gender) + '). ' + (c.notes||'') + ' 주인공과 다른 얼굴. 참고 초상과 동일 인물 유지.').trim());
  }
  for(const p of keyPropsList()){
    if(p.useInScene === false) continue;
    const identity = [p.brand, p.model, p.label].filter(x=>String(x||'').trim()).join(' ');
    if(!identity && !String(p.notes||'').trim() && !p.imageUrl) continue;
    const kindLabel = WORLD_PROP_KINDS.find(k=>k.id===p.kind)?.label || '소품';
    const holder = resolvePropHolder(p);
    if(holder){
      parts.push('핵심 소품(' + kindLabel + '): ' + (identity||'이름 미정') + ' — 반드시 ' + formatPersonIdentity(holder) + '가 장면에서 다룬다. 소품은 캐릭터 몸/얼굴이 아니라 별도 실제 물체로 배치. ' + (p.notes||''));
    }else{
      parts.push('핵심 소품(' + kindLabel + '): ' + (identity||'이름 미정') + '. ' + (p.notes||'') + '. 사람 없이 제품/차량만 명확하게.');
    }
    parts.push(buildPropFidelityPrompt(p, { holder }));
  }
  for(const hint of (wa.sceneHints||[]).slice(0, 8)){
    parts.push('장면 소품(사전 이미지 없이 자연스럽게 배치): ' + hint);
  }
  if(wa.crowdNote){
    parts.push('군중·배경 인물(얼굴 클로즈업·개별 초상 금지): ' + wa.crowdNote);
  }else{
    parts.push('군중·행인은 필요하면 얼굴이 생기지 않는 배경 실루엣으로만 처리.');
  }
  return '월드 에셋(장면에 반영): ' + parts.join(' / ');
}

function buildStoryContextForCharacter(){
  const isStory = (state.scriptMode==='story') && state.selectedStoryPlan!=null;
  const plan = isStory ? state.storyPlans?.[state.selectedStoryPlan] : null;
  const rows = (state.scriptTable||[]).slice(0, 18);
  const sceneBeats = rows.map((r,i)=>({
    scene: r.scene ?? i+1,
    beat: r.beat || r.line || '',
    dramaticFunction: r.dramaticFunction || r.emotion || '',
    caption: r.caption || '',
    visual: String(r.visual||'').split(' · 금지:')[0].slice(0,220),
    audio: r.audio || '',
    soundCue: r.soundCue || '',
    musicCue: r.musicCue || '',
    editRhythm: r.editRhythm || '',
    spectacle: r.spectacle || '',
    propAction: r.propAction || '',
  }));
  const planScenes = (plan?.scenes || []).slice(0, 12).map((s,i)=>({
    scene: s.scene ?? i+1,
    beat: s.beat || s.line || s.caption || '',
    dramaticFunction: s.dramaticFunction || s.emotion || '',
    visual: s.visual || '',
    soundCue: s.soundCue || '',
    musicCue: s.musicCue || '',
    editRhythm: s.editRhythm || '',
    spectacle: s.spectacle || '',
  }));
  const keyProps = keyPropsList().map(p=>({
    kind: p.kind || '',
    label: [p.brand, p.model, p.label].filter(Boolean).join(' '),
    notes: p.notes || '',
    heldBy: p.heldBy || 'none',
  }));
  return {
    mode: state.scriptMode||'product',
    product: state.analysis?.product || state.analysis?.title || '',
    target: state.analysis?.target || '',
    storyTitle: plan?.title || '',
    logline: plan?.logline || '',
    synopsis: plan?.synopsis || plan?.summary || '',
    tone: plan?.tone || plan?.genre || '',
    protagonist: plan?.protagonist || '',
    centralConflict: plan?.centralConflict || plan?.conflict || '',
    twistOrPayoff: plan?.twistOrPayoff || plan?.payoff || '',
    visualContinuity: plan?.visualContinuity || '',
    storyBible: plan?.storyBible || '',
    keyProps,
    sceneBeats: sceneBeats.length ? sceneBeats : planScenes,
    lines: sceneBeats.length ? sceneBeats : planScenes,
  };
}


async function recommendCharactersFromStory(){
  const ctx = buildStoryContextForCharacter();
  const system = [
    '당신은 영화 감독 겸 캐스팅 디렉터다. 짧은 줄거리라도 먼저 하나의 미니영화로 재구성한 뒤 주인공 후보 3명을 제안한다.',
    '반드시 JSON 배열만 출력한다.',
    '[{"id":"a","label":"짧은 이름","gender":"female|male|neutral","age":"20대 초반","roleInStory":"스토리 안 역할","desire":"인물이 원하는 것","conflict":"부딪히는 갈등","arc":"시작-반전-끝 변화","look":"얼굴·헤어·나이·체형만","identityLock":"얼굴·헤어·나이·체형 고정문구","wardrobe":"전 장면 동일 복장","signatureProp":"시계/배지 같은 작은 개인 소품만 또는 빈문자","vibe":"연기 톤","prompt":"인물 단독 상반신 초상 프롬프트"}]',
    '중요 규칙:',
    '- TV, 모니터, 박스, SUV, 자동차, 제품, 가격표, 영수증, 빵, 커피, 로고, 글자는 인물 특징이 아니라 장면 소품이다. prompt와 look/identityLock/wardrobe/signatureProp에 넣지 않는다.',
    '- 후보마다 줄거리 속 기능이 달라야 한다. 예: 추격을 끌고 가는 인물, 반전을 만드는 인물, 감정 중심 인물.',
    '- prompt는 단독 상반신 포트레이트만. 손에 큰 물건 금지, 배경 단순, 텍스트/워터마크 금지.'
  ].join('\n');
  const userText = '아래 줄거리/씬 비트를 감독처럼 분석해서 주인공 후보 3명을 추천해줘.\n' + JSON.stringify(ctx, null, 0);
  const text = await callTextAi({ system, userText, maxTokens: 2200 });
  const fenceRe = new RegExp(String.fromCharCode(96,96,96) + 'json|' + String.fromCharCode(96,96,96), 'g');
  const raw = String(text||'').replace(fenceRe,'').trim();
  const start = raw.indexOf('[');
  const end = raw.lastIndexOf(']');
  const json = JSON.parse(raw.slice(start, end+1));
  if(!Array.isArray(json) || !json.length) throw new Error('캐릭터 추천 결과가 비었어요.');
  return json.slice(0,3).map((c,i)=>sanitizeCharacterSuggestion({
    ...c,
    id: String(c.id||'c' + (i+1)),
    label: String(c.label||'후보 ' + (i+1)),
  }));
}

async function inferCharGenderFromStory(){
  const ctx = buildStoryContextForCharacter();
  const system = `숏폼 캐스팅 어시스턴트. 대본·줄거리에서 주인공의 성별만 추론한다.
JSON만 출력: {"gender":"female"|"male"|"neutral","reason":"한줄"}
- 대명사·호칭·직업·관계로 판단. 불명확하면 neutral.`;
  const userText = `주인공 성별만 추론해줘.\n${JSON.stringify(ctx, null, 0)}`;
  const text = await callTextAi({ system, userText, maxTokens: 200 });
  const raw = String(text||'').replace(/```json|```/g,'').trim();
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  if(start < 0 || end <= start) return 'neutral';
  const json = JSON.parse(raw.slice(start, end+1));
  return ['female','male','neutral'].includes(json.gender) ? json.gender : 'neutral';
}

async function resolveCharGenderForPrompt(gender){
  const sug = state.selectedCharSuggestion;
  if(sug?.gender === 'female' || sug?.gender === 'male') return sug.gender;
  if(gender && gender !== 'auto') return gender;
  try{
    const inferred = await inferCharGenderFromStory();
    if(inferred === 'female' || inferred === 'male') return inferred;
  }catch(err){
    console.warn('성별 대본 분석 실패:', err?.message || err);
  }
  return 'auto';
}

function emptyCastSlot(partial={}){
  let role = ['조연','조력','엑스트라','군중','적대','상대','기타'].includes(partial.role) ? partial.role : (partial.role||'조연');
  if(role === '군중') role = '엑스트라';
  const crowd = role === '엑스트라' || /군중|행인|배경|엑스트라/i.test(`${partial.role||''} ${partial.notes||''}`);
  const isMajor = typeof partial.isMajor === 'boolean'
    ? partial.isMajor
    : !crowd; // 주목 인물만 캐릭터로 그림 · 군중/엑스트라는 OFF
  return {
    id: partial.id || newWorldAssetId('cast'),
    name: String(partial.name||''),
    role: crowd ? '엑스트라' : role,
    gender: ['female','male','auto'].includes(partial.gender) ? partial.gender : 'auto',
    look: String(partial.look||''),
    identityLock: String(partial.identityLock||partial.look||''),
    wardrobe: String(partial.wardrobe||''),
    signatureProp: String(partial.signatureProp||''),
    notes: String(partial.notes||''),
    isMajor,
    draw: typeof partial.draw === 'boolean' ? partial.draw : isMajor, // 주목이면 기본 ON
    source: partial.source === 'upload' ? 'upload' : 'ai',
    imageUrl: partial.imageUrl || null,
    uploaded: !!partial.uploaded,
  };
}

function normalizeCastDrawFlags(){
  const wa = ensureWorldAssets();
  wa.cast = wa.cast.map(c=>emptyCastSlot(c));
  if(typeof state.drawHero !== 'boolean') state.drawHero = true;
  if(state.heroSource !== 'upload') state.heroSource = 'ai';
  return wa;
}

function getCastDrawPlan(){
  normalizeCastDrawFlags();
  const wa = ensureWorldAssets();
  const sel = state.selectedCharSuggestion;
  const heroName = sel?.label || '주인공';
  const support = wa.cast.map((c,i)=>({
    id: c.id,
    index: i + 2,
    name: c.name || c.role || `조연 ${i+1}`,
    role: c.role || '조연',
    look: c.look || '',
    isMajor: c.isMajor !== false,
    draw: c.draw !== false,
    source: c.source === 'upload' ? 'upload' : 'ai',
    hasImage: !!c.imageUrl,
  }));
  const hero = {
    id: 'hero',
    index: 1,
    name: heroName,
    role: '주인공',
    look: sel?.look || '',
    isMajor: true,
    draw: state.drawHero !== false,
    source: state.heroSource === 'upload' ? 'upload' : 'ai',
    hasImage: !!state.character?.imageUrl,
  };
  const all = [hero, ...support];
  const major = all.filter(x=>x.isMajor);
  const drawList = all.filter(x=>x.draw);
  const aiPending = drawList.filter(x=>x.source==='ai' && !x.hasImage);
  return {
    hero,
    support,
    all,
    major,
    total: all.length,
    majorCount: major.length,
    drawCount: drawList.length,
    drawList,
    aiPending,
    skipList: all.filter(x=>!x.draw),
  };
}

function syncCastSlotsToCount(count){
  const n = Math.max(1, Math.min(5, Number(count) || 2));
  state.castCount = n;
  const wa = ensureWorldAssets();
  const need = n - 1; // 주인공 제외 주목 인물 칸
  while(wa.cast.length < need){
    wa.cast.push(emptyCastSlot({ role:'상대', isMajor:true, draw:true, source:'ai' }));
  }
  if(wa.cast.length > need) wa.cast = wa.cast.slice(0, need);
  // 목록에는 주목 인물만 둠(군중 슬롯 금지)
  wa.cast = wa.cast.map(c=>{
    const slot = emptyCastSlot(c);
    if(slot.role === '엑스트라' || slot.role === '군중'){
      slot.role = '상대';
      slot.isMajor = true;
      slot.draw = true;
    }
    return slot;
  });
  return wa;
}

function readCastCountFromUI(){
  const el = document.getElementById('castCountInput');
  if(el) state.castCount = Math.max(1, Math.min(5, Number(el.value) || 1));
  const propsEl = document.getElementById('genPropsWithCast');
  if(propsEl) state.genPropsWithCast = !!propsEl.checked;
  const genderEl = document.getElementById('charGender');
  if(genderEl) state.charGender = genderEl.value || state.charGender;
  return state.castCount;
}

  const raw = String(text||'').replace(fenceRe,'').trim();
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  const json = JSON.parse(raw.slice(start, end+1));

    ...p,

    source: 'ai',
    prepMode: 'key',
    heldBy: p.heldBy || 'none',

  props = linkPropHoldersAfterAnalyze(props, cast);
  const sceneHints = (Array.isArray(json.sceneProps) ? json.sceneProps : [])
    .map(s => [s.label, s.notes].filter(Boolean).join(' · ')).filter(Boolean);
  return { cast, props, sceneHints, crowdNote: String(json.crowdNote||'') };

async function analyzeFullCastFromStory(){

  const system = [

    '- TV, 모니터, 박스, SUV, 자동차, 경찰차, 제품, 빵, 커피, 가격표, 영수증, 로고, 글자는 소품 또는 장면 요소다. 인물 look/identityLock/wardrobe/signatureProp/prompt에 절대 넣지 않는다.',
    '- 인물 초상은 얼굴·헤어·나이·체형·착용 복장만. 직업이 경찰관이면 제복은 가능하지만 경찰차/박스/문구/로고 합성은 금지.',
    '- props의 heldBy로 누가 소품을 다루는지 연결한다. 소품을 든 장면은 나중에 씬 프롬프트에서 만든다.',
    '- 주목 인물은 보통 주인공+상대 2명. 정말 필요할 때만 3명 이상.'
  ].join('\n');
  const userText = '전체 줄거리와 씬 비트를 감독처럼 분석해서 주목 인물과 핵심 소품을 분리해줘. 동일 인물=1슬롯, identityLock/wardrobe/heldBy 필수.\n' + JSON.stringify(ctx, null, 0);
  const text = await callTextAi({ system, userText, maxTokens: 2800 });
  const fenceRe = new RegExp(String.fromCharCode(96,96,96) + 'json|' + String.fromCharCode(96,96,96), 'g');
  const raw = String(text||'').replace(fenceRe,'').trim();
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  if(start < 0 || end <= start) throw new Error('등장인물 분석 결과를 해석하지 못했어요.');
  const json = JSON.parse(raw.slice(start, end+1));
  const kindOk = new Set(['car','product','electronics','appliance']);
  const hero = json.hero || {};
  const heroSug = sanitizeCharacterSuggestion({
    id: 'hero',
    label: String(hero.label||'주인공'),
    gender: ['female','male','neutral'].includes(hero.gender) ? hero.gender : 'neutral',
    age: String(hero.age||''),
    roleInStory: String(hero.roleInStory||'주인공'),
    desire: String(hero.desire||''),
    conflict: String(hero.conflict||''),
    arc: String(hero.arc||''),
    look: String(hero.look||''),
    identityLock: String(hero.identityLock||hero.look||''),
    wardrobe: String(hero.wardrobe||''),
    signatureProp: String(hero.signatureProp||''),
    vibe: String(hero.vibe||''),
    prompt: String(hero.prompt||''),
  });
  let cast = (Array.isArray(json.cast) ? json.cast : [])
    .filter(c => c && c.role !== '엑스트라' && c.role !== '군중' && c.isMajor !== false)
    .slice(0, 3)
    .map(c=>sanitizeCastSlotForPortrait({
      ...c,
      source: 'ai',
      isMajor: true,
      draw: true,
      role: c.roleInStory || c.role || '조연',
      identityLock: c.identityLock || c.look || '',
      wardrobe: c.wardrobe || '',
      signatureProp: c.signatureProp || '',
    }));
  let props = (Array.isArray(json.props) ? json.props : []).slice(0, 2).map(p=>emptyPropSlot({
    ...p,
    kind: kindOk.has(p.kind) ? p.kind : 'product',
    source: 'ai',
    prepMode: 'key',
    heldBy: p.heldBy || 'none',
  }));
  const sceneHints = (Array.isArray(json.sceneProps) ? json.sceneProps : [])
    .map(s => [s.label, s.notes].filter(Boolean).join(' · ')).filter(Boolean);
  let recommendedCount = Math.max(1, Math.min(5, Number(json.recommendedCount) || 2));
  if(recommendedCount < 2 && cast.length >= 1) recommendedCount = 2;
  if(recommendedCount < 1 + cast.length) recommendedCount = Math.min(5, 1 + cast.length);
  while(cast.length < recommendedCount - 1) cast.push(sanitizeCastSlotForPortrait({ role:'상대', isMajor:true, draw:true, source:'ai' }));
  cast = cast.slice(0, recommendedCount - 1);
  props = linkPropHoldersAfterAnalyze(props, cast);
  props = props.map(p=>{
    if(p.heldBy && p.heldBy !== 'none') return p;
    const blob = String([p.label, p.model, p.kind, p.notes].filter(Boolean).join(' '));
    if(/TV|텔레비전|모니터|박스|상자|electronics|appliance/i.test(blob) && cast[0]){
      return { ...p, heldBy: 'cast:' + cast[0].id };
    }
    if(/SUV|자동차|차량|경찰차|순찰차|승용차|car/i.test(blob)){
      return { ...p, heldBy: 'none' };
    }
    return p;
  });
  return {
    recommendedCount,
    reason: String(json.reason||''),
    hero: heroSug,
    cast,
    props,
    sceneHints,
    crowdNote: String(json.crowdNote||'배경 행인·손님 등 얼굴 없는 군중'),
  };
}

async function runAutoAnalyzeAndDrawAllCast(opts={}){
  collectWorldAssetsFromUI();
  readCastCountFromUI();
  const skipAnalyze = !!opts.skipAnalyze;
  const forceRedraw = !!opts.forceRedraw;
  let analyzed = false;

  const needsAnalyze = ()=>{
    const plan = getCastDrawPlan();
    const hasHeroMeta = !!(state.selectedCharSuggestion?.label || state.selectedCharSuggestion?.look || state.selectedCharSuggestion?.prompt);
    const supportNamed = ensureWorldAssets().cast.some(c => String(c.name||c.look||'').trim());
    // 주목 2명 이상인데 메타가 거의 없으면 분석 필요
    return !hasHeroMeta || (state.castCount >= 2 && !supportNamed && plan.aiPending.length >= plan.drawCount);
  };

  if(!skipAnalyze && needsAnalyze()){
    setStatus('character','loading','① 대본에서 주목 인물·핵심 소품 분석 중...');
    const result = await analyzeFullCastFromStory();
    state.castCount = Math.max(2, result.recommendedCount || state.castCount || 2);
    state.charSuggestions = [result.hero];
    state.selectedCharSuggestion = result.hero;
    state.charGender = result.hero.gender === 'neutral' ? 'auto' : (result.hero.gender || state.charGender || 'auto');
    const wa = ensureWorldAssets();
    wa.cast = (result.cast||[]).map(c=>emptyCastSlot({ ...c, isMajor:true, draw:true, source:'ai' }));
    syncCastSlotsToCount(state.castCount);
    wa.props = linkPropHoldersAfterAnalyze(result.props||[], wa.cast);
    wa.sceneHints = uniqueStrings([...(result.sceneHints||[])]).slice(0, 12);
    wa.crowdNote = result.crowdNote || wa.crowdNote || '배경 행인·손님 등 얼굴 없는 군중';
    normalizePropFlags();
    analyzed = true;
    // 분석 결과를 화면에 잠깐 반영
    render();
    setStatus('character','loading','② 주목 인물 전체 캐릭터 생성 중...');
  }else{
    setStatus('character','loading', forceRedraw ? '주목 인물 다시 그리는 중...' : '주목 인물 전체 캐릭터 생성 중...');
  }

  // 주목 인물 전부 그리기 ON
  state.drawHero = true;
  if(state.heroSource !== 'upload') state.heroSource = 'ai';
  for(const c of ensureWorldAssets().cast){
    if(c.role === '엑스트라' || c.role === '군중'){ c.draw = false; c.isMajor = false; continue; }
    c.isMajor = true;
    c.draw = true;
    if(c.source !== 'upload') c.source = 'ai';
  }

  const summary = await generateAllCastAndOptionalProps({ forceRedraw });
  summary.analyzed = analyzed;
  return summary;
}

async function generateAllCastAndOptionalProps(opts={}){
  const forceRedraw = !!(opts.forceRedraw || state.castForceRedraw);
  state.castForceRedraw = false;
  readCastCountFromUI();
  collectWorldAssetsFromUI();
  syncCastSlotsToCount(state.castCount);
  const plan = getCastDrawPlan();
  const wa = ensureWorldAssets();
  const toDrawSupport = wa.cast.filter(c=>c.draw !== false);
  const drawTarget = (state.drawHero !== false ? 1 : 0) + toDrawSupport.length;
  if(drawTarget < 1){
    throw new Error('그릴 캐릭터가 없습니다. 주요 인물의 「캐릭터로 그리기」를 켜주세요.');
  }

  let char = state.character;
  if(state.drawHero !== false){
    const heroNeedsAi = state.heroSource !== 'upload' && (forceRedraw || !state.character?.imageUrl);
    if(heroNeedsAi){
      setStatus('character','loading',`주인공 AI 캐릭터 ${forceRedraw && state.character?.imageUrl?'다시 ':''}그리는 중 (1/${drawTarget})...`);
      const gender = state.charGender || 'auto';
      char = await callHiggsfieldCharacter(gender);
      char.fromSuggestion = state.selectedCharSuggestion?.label || '';
      state.character = char;
    }else if(state.heroSource === 'upload' && !state.character?.imageUrl){
      throw new Error('주인공이 수동(이미지) 모드입니다. 이미지를 첨부·확정하세요.');
    }else if(!state.character?.imageUrl){
      throw new Error('주인공 캐릭터 이미지가 없습니다.');
    }
    state.done.character = true;
    char = state.character;
  }else if(!state.character?.imageUrl){
    throw new Error('주인공 그리기가 꺼져 있습니다. 켜거나 이미지를 업로드하세요.');
  }else{
    state.done.character = true;
  }

  let done = state.drawHero !== false ? 1 : 0;
  for(let i=0;i<wa.cast.length;i++){
    const c = wa.cast[i];
    if(c.draw === false) continue;
    done++;
    if(c.source === 'upload'){
      if(!c.imageUrl) setStatus('world-assets','err', `«${c.name||c.role}» 수동 모드인데 이미지가 없어요.`);
      continue;
    }
    if(c.imageUrl && !forceRedraw) continue;
    setStatus('character','loading',`주요 캐릭터 ${forceRedraw && c.imageUrl?'다시 ':''}그리는 중 (${done}/${drawTarget}) «${c.name||c.role||'조연'}»...`);
    try{
      await generateWorldCastImage(c);
      c.source = 'ai';
    }catch(err){
      console.warn('조연 생성 실패', c.name, err);
      setStatus('world-assets','err', `조연 «${c.name||c.role}» 실패: ${err.message||err}`);
    }
  }

  if(state.genPropsWithCast){
    // 핵심 소품(차·구매제품)만 미리 그림 — 가격표·코믹소품은 씬 자동
    const aiProps = keyPropsList().filter(p=>p.source!=='upload' && !p.imageUrl && String(p.brand||p.model||p.label||'').trim());
    for(let i=0;i<aiProps.length;i++){
      const p = aiProps[i];
      setStatus('character','loading',`핵심 소품 (${i+1}/${aiProps.length}) «${propIdentity(p)}»...`);
      try{ await generateWorldPropImage(p); p.source = 'ai'; p.prepMode = 'key'; }
      catch(err){ console.warn('소품 생성 실패', p.label, err); }
    }
  }

  const castOk = wa.cast.filter(c=>c.draw !== false && c.imageUrl).length;
  const skipped = plan.skipList.length;
  const propOk = wa.props.filter(p=>p.imageUrl).length;
  const gNote = char?.resolvedGender && char.resolvedGender !== 'auto'
    ? ` · 주인공 ${char.resolvedGender==='female'?'여성':'남성'}` : '';
  return { totalPeople: plan.total, drawTarget, castOk, skipped, propOk, gNote };
}


async function generateWorldCastImage(cast){
  collectWorldAssetsFromUI();
  const artNote = ART_STYLES[state.artStyle]?.prompt || ART_STYLES.cinematic.prompt;
  const cleaned = sanitizeCastSlotForPortrait(cast || {});
  Object.assign(cast, cleaned);
  let gender = cast.gender || 'auto';
  if(gender === 'auto'){
    try{ gender = await resolveCharGenderForPrompt('auto'); }catch(_){ gender = 'auto'; }
  }
  cast.gender = gender;
  const heroHint = state.selectedCharSuggestion?.label || state.character?.fromSuggestion || '주인공';
  const prompt = buildCharacterPortraitPrompt(cast, {
    kind: 'support',
    artNote,
    storyBrief: buildDirectorCastingBrief(),
    relation: heroHint,
    resolvedGender: gender,
  });
  const label = ()=> (__statusBusy.character?.text || __statusBusy['world-assets']?.text || ('《' + (cast.name||cast.role||'조연') + '》 그리는 중...'))
    .replace(/\s*·\s*서버\s*\d+%/, '');
  const statusId = document.getElementById('status-character') ? 'character' : 'world-assets';
  const output = await hfSubmit(state.keys.hfCharacterModel, {
    prompt,
    aspect_ratio: state.aspectRatio || '9:16',
    resolution: '1080p',
    num_images: 1,
  }, {
    onProgress: (p)=> setStatusProgress(statusId, label(), p.frac),
  });
  cast.imageUrl = extractMediaUrl(output);
  cast.uploaded = false;
  if(!cast.imageUrl) throw new Error('조연 이미지 URL을 받지 못했어요.');
  return cast;
}


async function generateWorldPropImage(prop){
  collectWorldAssetsFromUI();
  const artNote = ART_STYLES[state.artStyle]?.prompt || ART_STYLES.cinematic.prompt;
  const kindLabel = WORLD_PROP_KINDS.find(k=>k.id===prop.kind)?.label || '소품';
  const identity = [prop.brand, prop.model, prop.label].filter(x=>String(x||'').trim()).join(' ');
  if(!identity) throw new Error('브랜드·모델·표시 이름 중 하나는 입력해주세요.');
  const holder = resolvePropHolder(prop);
  const prompt = [
    kindLabel + ' 실물 기준 레퍼런스 이미지.',
    '대상: ' + identity + '.',
    prop.notes ? '메모: ' + prop.notes + '.' : '',
    buildPropFidelityPrompt(prop, { holder }),
    holder ? '이 이미지는 소품 자체의 기준 이미지다. 사람을 함께 그리지 말고, 나중에 장면에서 ' + formatPersonIdentity(holder) + '가 이 물건을 실제 크기로 다루게 한다.' : '사람 없이 소품만 단독으로 보여준다.',
    '정확한 제품 사진처럼 전면/3/4 각도에서 형태, 실루엣, 크기감, 재질, 색상, 버튼, 베젤, 휠, 손잡이 등 구조를 명확히.',
    '제품 로고는 실제 브랜드 로고만 허용하고, 임의 글자·가짜 문구·워터마크·카드뉴스식 텍스트 금지.',
    '아트 스타일: ' + artNote + '.',
    '깨끗한 제품 구도, 배경 단순, 카툰화/과장/축소/인물 얼굴 합성 금지.'
  ].filter(Boolean).join(' ');
  const { model, args } = buildHfImageArgs(prompt, { refs: [] });
  args.aspect_ratio = prop.kind === 'car' ? '16:9' : '1:1';
  const output = await hfSubmit(model, args, { fallbackModels: HF_IMAGE_MODEL_FALLBACKS });
  prop.imageUrl = extractMediaUrl(output);
  prop.uploaded = false;
  if(!prop.imageUrl) throw new Error('소품 이미지 URL을 받지 못했어요.');
  return prop;
}

function inferSfxKindFromScene(row){
  const explicit = String(row?.sfxKind || row?.soundKind || '').trim().toLowerCase();
  const known = new Set(['tick','crunch','hit','whoosh','sparkle','knock','soft','boom','riser','comic','magic','suspense','chase']);
  if(known.has(explicit)) return { kind: explicit, label: row?.sfxLabel || explicit };
  const text = [row?.line, row?.caption, row?.visual, row?.beat, row?.emotion, row?.soundCue, row?.musicCue, row?.editRhythm, row?.spectacle].join(' ').toLowerCase();
  if(/시계|알람|틱|9:00|오전|벨|똑|카운트/.test(text)) return { kind:'tick', label:'시계·카운트' };
  if(/추격|질주|달리|스피드|속도|차량|suv|급정지|브레이크|액션/.test(text)) return { kind:'chase', label:'추격·스피드' };
  if(/서스펜스|긴장|심장|몰래|잠입|불안|저음|드론/.test(text)) return { kind:'suspense', label:'서스펜스 저음' };
  if(/폭발|쾅|충돌|강타|박살|급락|떨어|부딪|클라이맥스/.test(text)) return { kind:'boom', label:'폭발·강타' };
  if(/놀람|충격|반전|갑자기|헐|깜짝|임팩트|히트/.test(text)) return { kind:'hit', label:'임팩트 히트' };
  if(/상승|고조|긴장상승|다가오|열리기 직전|빌드업/.test(text)) return { kind:'riser', label:'긴장 고조' };
  if(/코믹|웃음|삑|빙글|실수|넘어|어이|황당/.test(text)) return { kind:'comic', label:'코믹 삑' };
  if(/판타지|마법|환상|빛|반짝|공개|등장|발견|글리터/.test(text)) return { kind:'magic', label:'판타지 반짝' };
  if(/도넛|먹|설탕|바삭|음식|한입|크런치/.test(text)) return { kind:'crunch', label:'바삭·한입' };
  if(/전환|이동|바람|휙|지나가|컷|점프컷/.test(text)) return { kind:'whoosh', label:'전환 휙' };
  if(/문|닫|열|똑똑/.test(text)) return { kind:'knock', label:'문·톡' };
  if(/조용|감성|여운|밤|잔잔|드라마/.test(text)) return { kind:'soft', label:'잔잔 패드' };
  return { kind:'whoosh', label:'전환 효과' };
}

function inferStoryMusicBed(rows){
  const text = (rows||[]).map(r => [r.musicCue, r.spectacle, r.beat, r.emotion, r.visual].join(' ')).join(' ').toLowerCase();
  if(/액션|추격|질주|스피드|140|빠른|브레이크/.test(text)) return { kind:'action', label:'빠른 액션 템포 베드', bpm:142 };
  if(/코믹|웃음|삑|황당|유머/.test(text)) return { kind:'comic', label:'코믹 리듬 베드', bpm:128 };
  if(/판타지|마법|환상|글리터|반짝/.test(text)) return { kind:'fantasy', label:'판타지 글리터 베드', bpm:118 };
  if(/서스펜스|긴장|불안|저음|드론|잠입/.test(text)) return { kind:'suspense', label:'서스펜스 저음 베드', bpm:104 };
  if(/드라마|감정|여운|눈물|잔잔/.test(text)) return { kind:'drama', label:'드라마틱 패드 베드', bpm:92 };
  return { kind:'hybrid', label:'하이브리드 쇼츠 템포 베드', bpm:124 };
}

function encodeWavMono(floatSamples, sampleRate=44100){
  const n = floatSamples.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sampleRate,true); v.setUint32(28,sampleRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  let o = 44;
  for(let i=0;i<n;i++){
    const x = Math.max(-1, Math.min(1, floatSamples[i]));
    v.setInt16(o, x < 0 ? x*0x8000 : x*0x7FFF, true);
    o += 2;
  }
  return new Blob([buf], { type:'audio/wav' });
}

function synthesizeSfxSamples(kind, durationSec=0.9, sampleRate=44100){
  const n = Math.max(1, Math.floor(sampleRate * durationSec));
  const out = new Float32Array(n);
  const env = (i, a=0.01, r=0.2)=>{
    const t = i/sampleRate;
    const attack = Math.min(1, t/a);
    const release = t > durationSec-r ? Math.max(0, (durationSec-t)/r) : 1;
    return attack * release;
  };
  if(kind === 'tick'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const pulse = (t % 0.22) < 0.03 ? 1 : 0;
      out[i] = pulse * Math.sin(2*Math.PI*1800*t) * 0.35 * env(i,0.002,0.05);
    }
  }else if(kind === 'crunch'){
    for(let i=0;i<n;i++){
      const noise = (Math.random()*2-1);
      const t = i/sampleRate;
      out[i] = noise * Math.exp(-t*14) * 0.45 * env(i,0.001,0.25);
    }
  }else if(kind === 'hit' || kind === 'boom'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const base = kind === 'boom' ? 85 : 140;
      out[i] = (Math.sin(2*Math.PI*(base+t*-60)*t) + (Math.random()*2-1)*0.35) * Math.exp(-t*(kind==='boom'?5.5:8)) * (kind==='boom'?0.72:0.55);
    }
  }else if(kind === 'riser'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const f = 220 + t * 1800;
      out[i] = (Math.sin(2*Math.PI*f*t) + (Math.random()*2-1)*0.18) * Math.min(1, t/durationSec) * 0.32;
    }
  }else if(kind === 'comic'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const f = t < durationSec*0.45 ? 740 : 520;
      out[i] = Math.sin(2*Math.PI*f*t) * Math.exp(-t*5) * 0.34 * env(i,0.002,0.15);
    }
  }else if(kind === 'magic'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      out[i] = (Math.sin(2*Math.PI*1320*t)+0.5*Math.sin(2*Math.PI*1980*t)+0.22*Math.sin(2*Math.PI*2640*t))
        * Math.exp(-t*2.8) * 0.32 * env(i,0.004,0.45);
    }
  }else if(kind === 'suspense'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      out[i] = (0.18*Math.sin(2*Math.PI*72*t) + 0.08*Math.sin(2*Math.PI*145*t)) * env(i,0.08,0.3);
    }
  }else if(kind === 'chase'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const pulse = (t % 0.18) < 0.045 ? 1 : 0.25;
      out[i] = ((Math.random()*2-1)*0.18 + Math.sin(2*Math.PI*(520+t*700)*t)*0.3) * pulse * env(i,0.004,0.18);
    }
  }else if(kind === 'sparkle'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      out[i] = (Math.sin(2*Math.PI*1200*t)+0.5*Math.sin(2*Math.PI*1800*t)+0.25*Math.sin(2*Math.PI*2400*t))
        * Math.exp(-t*3.5) * 0.28 * env(i,0.005,0.35);
    }
  }else if(kind === 'knock'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const tap = (t<0.05 || (t>0.12&&t<0.17)) ? 1 : 0;
      out[i] = tap * Math.sin(2*Math.PI*220*t) * Math.exp(-(t%0.12)*30) * 0.5;
    }
  }else if(kind === 'soft'){
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      out[i] = 0.12*Math.sin(2*Math.PI*220*t) * env(i,0.15,0.4);
    }
  }else{ // whoosh
    for(let i=0;i<n;i++){
      const t = i/sampleRate;
      const noise = (Math.random()*2-1);
      const bp = Math.sin(2*Math.PI*(400+t*1200)*t);
      out[i] = noise * bp * Math.exp(-Math.pow((t-durationSec*0.35)/(durationSec*0.25),2)) * 0.35;
    }
  }
  return out;
}

async function renderSfxClip(kind, durationSec=0.9){
  const samples = synthesizeSfxSamples(kind, durationSec);
  const blob = encodeWavMono(samples, 44100);
  const url = URL.createObjectURL(blob);
  return { url, blob, duration: durationSec };
}

async function mixSfxBed(clips, totalDur, opts={}){
  const sr = 44100;
  const n = Math.max(1, Math.floor(sr * Math.max(totalDur, 1)));
  const mix = new Float32Array(n);
  const bed = opts.musicBed || null;
  if(bed){
    const bpm = Math.max(70, Math.min(170, Number(bed.bpm) || 124));
    const beatDur = 60 / bpm;
    for(let i=0;i<n;i++){
      const t = i / sr;
      const beatPhase = (t % beatDur) / beatDur;
      const pulse = Math.exp(-beatPhase * 8);
      let base = 0;
      if(bed.kind === 'suspense'){
        base = 0.065*Math.sin(2*Math.PI*58*t) + 0.035*Math.sin(2*Math.PI*116*t);
      }else if(bed.kind === 'drama'){
        base = 0.055*Math.sin(2*Math.PI*196*t) + 0.035*Math.sin(2*Math.PI*294*t);
      }else if(bed.kind === 'fantasy'){
        base = 0.04*Math.sin(2*Math.PI*660*t) + 0.025*Math.sin(2*Math.PI*990*t) + pulse*0.035*Math.sin(2*Math.PI*1320*t);
      }else if(bed.kind === 'comic'){
        base = pulse*0.09*Math.sin(2*Math.PI*430*t) + 0.025*Math.sin(2*Math.PI*215*t);
      }else{
        base = pulse*0.11*Math.sin(2*Math.PI*92*t) + 0.045*Math.sin(2*Math.PI*184*t);
      }
      const fadeIn = Math.min(1, t / 0.4);
      const fadeOut = Math.min(1, Math.max(0, (totalDur - t) / 0.6));
      mix[i] += base * fadeIn * fadeOut;
    }
  }
  for(const c of clips){
    const samples = synthesizeSfxSamples(c.kind, c.dur || 0.9, sr);
    const start = Math.floor((c.at||0) * sr);
    for(let i=0;i<samples.length;i++){
      const idx = start + i;
      if(idx >= 0 && idx < n) mix[idx] += samples[i] * 0.85;
    }
  }
  let peak = 0.001;
  for(let i=0;i<n;i++) peak = Math.max(peak, Math.abs(mix[i]));
  const gain = Math.min(1, 0.9 / peak);
  for(let i=0;i<n;i++) mix[i] *= gain;
  const blob = encodeWavMono(mix, sr);
  return URL.createObjectURL(blob);
}

async function generateAutoSfxForScript(){
  ensureDirectionDefaultsOnScript();
  const rows = state.scriptTable || [];
  if(!rows.length) throw new Error('대본이 없어 효과음을 만들 수 없어요.');
  let tCursor = 0;
  const clips = [];
  for(let i=0;i<rows.length;i++){
    const row = rows[i];
    const dur = Math.max(0.8, Number(row.targetDur) || (row.audio==='vo' ? 2.2 : 1.8));
    const meta = inferSfxKindFromScene(row);
    row.sfxKind = meta.kind;
    row.sfxLabel = meta.label;
    // 씬 시작 + 짧은 악센트 (대사 씬도 약한 전환음)
    clips.push({ kind: meta.kind, label: meta.label, at: tCursor + 0.05, dur: Math.min(1.1, Math.max(0.45, dur*0.35)), scene: i });
    if(row.audio === 'sfx' || !String(row.line||'').trim()){
      // 효과음 전용 씬은 중간에 한 번 더
      clips.push({ kind: meta.kind, label: meta.label, at: tCursor + dur*0.45, dur: Math.min(0.9, dur*0.4), scene: i });
    }
    tCursor += dur;
  }
  const musicBed = inferStoryMusicBed(rows);
  const bedUrl = await mixSfxBed(clips, tCursor + 0.3, { musicBed });
  state.storySoundGuide = { musicBed, clips: clips.map(c=>({ kind:c.kind, label:c.label, at:c.at, dur:c.dur, scene:c.scene })) };
  // revoke old
  if(state.sfxBedUrl){ try{ URL.revokeObjectURL(state.sfxBedUrl); }catch(_){ } }
  state.sfxClips = clips;
  state.sfxBedUrl = bedUrl;
  return { clips, bedUrl, totalDur: tCursor };
}

function buildHfImageArgs(prompt, { refs = [] } = {}){
  const model = migrateHfModelSlug(state.keys.hfImageModel, DEFAULT_KEYS.hfImageModel);

  const args = {
    prompt: String(prompt||'').trim(),
    aspect_ratio: state.aspectRatio || '9:16',
  };
  if(/popcorn/i.test(model)){
    // Popcorn: resolution은 720p | 1600p
    args.resolution = '1600p';
    if(httpsRefs.length) args.input_images = httpsRefs.slice(0, 4);
  }else if(/soul/i.test(model)){
    args.resolution = '1080p';
    args.num_images = 1;
  }else if(/seedream/i.test(model)){
    args.resolution = '2K';
    args.camera_fixed = false;
    if(httpsRefs.length) args.image_urls = httpsRefs.slice(0, 4);
  }else{
    if(httpsRefs.length) args.reference_images = httpsRefs.slice(0, 4);
  }
  return { model, args };
}
