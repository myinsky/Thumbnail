// 미리보기 준비: 기본적으로 일시정지. 명시적으로 autoplay일 때만 재생
function applyPreviewPlaybackIntent(){
  if(state.current !== 'studio') return;
  const v = document.getElementById('nlePreviewVideo');
  if(!v) return;
  // 네이티브 컨트롤·자동재생 차단 (모니터 밖 브라우저 플레이어처럼 보이는 현상 방지)
  try{
    v.removeAttribute('controls');
    v.controls = false;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.setAttribute('controlslist','nodownload nofullscreen noremoteplayback');
    v.disablePictureInPicture = true;
  }catch(_){}
  applyPreviewVolume(v);
  const range = state.previewRange;
  const shouldPlay = !!state.autoplayPreview;
  state.autoplayPreview = false;
  const startAt = range ? Number(range.start) || 0 : 0;
  const endAt = range && range.end != null ? Number(range.end) : null;
  // 타임라인 클립 선택 시 data-clip-start로 첫 프레임 맞춤
  const clipStart = v.dataset.clipStart != null ? Number(v.dataset.clipStart) : null;
  const stillAt = range ? startAt : (clipStart != null && isFinite(clipStart) ? clipStart : 0);
  const seekStillAt = ()=>{
    try{ v.pause(); }catch(_){}
    try{ v.currentTime = stillAt; }catch(_){}
    const btn = document.getElementById('nlePlayPause');
    if(btn) btn.textContent = '▶';
  };
  if(!shouldPlay){
    if(v.readyState >= 1) seekStillAt();
    else v.addEventListener('loadedmetadata', seekStillAt, { once:true });
    return;
  }

  const kick = ()=>{
    try{ v.currentTime = startAt; }catch(_){}
    applyPreviewVolume(v);
    v.play().then(()=>{
      const btn = document.getElementById('nlePlayPause');
      if(btn) btn.textContent = '⏸';
    }).catch(()=>{
      v.muted = true;
      return v.play().then(()=>{
        const btn = document.getElementById('nlePlayPause');
        if(btn) btn.textContent = '⏸';
        if(!state.previewMuted && (state.previewVolume??1) > 0){
          try{ v.muted = false; applyPreviewVolume(v); }catch(_){}
        }
      }).catch(()=>{});
    });
  };
  if(v.readyState >= 1) kick();
  else v.addEventListener('loadedmetadata', kick, { once:true });

  if(endAt != null && isFinite(endAt)){
    const onTime = ()=>{
      if(v.currentTime >= endAt - 0.05){
        v.pause();
        try{ v.currentTime = endAt; }catch(_){}
        v.removeEventListener('timeupdate', onTime);
        const btn = document.getElementById('nlePlayPause');
        if(btn) btn.textContent = '▶';
      }
    };
    v.addEventListener('timeupdate', onTime);
  }
}

  state.activeSourceIndex = videoIndex;
  state.previewMode = 'source';
  state.sourceAssembledUrl = null;
  state.previewRange = (opts.start != null && opts.end != null)
    ? { start: opts.start, end: opts.end }
    : null;
  state.autoplayPreview = opts.autoplay === true;
  if(opts.suggestIndex != null) state.selectedSuggestIndex = opts.suggestIndex;
  render();
}

function fmtClock(sec){
  sec = Math.max(0, Number(sec) || 0);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if(h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

        ${skeletonBox('90%','12px')}<div style="height:8px;"></div>
        ${skeletonBox('80%','12px')}<div style="height:8px;"></div>
        ${skeletonBox('85%','12px')}
      </div>
    `;
  }
  return '';
}

function sectionSaveButtons(section){
  return `
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" data-save-section="${section}" type="button">💾 이 섹션 저장</button>
      <span style="align-self:center;font-size:11.5px;color:var(--text-lo);">입력하면 자동 저장 · 초기화 시 삭제</span>
      <button class="btn secondary" data-reset-section="${section}" type="button">↺ 초기화</button>
    </div>
    ${statusHtml(`save-${section}`)}
  `;
}

    <div class="card">

      <div style="background:#F0F7FF; border:1px solid #B7D3F5; border-radius:10px; padding:12px; margin-bottom:12px;">

    <div class="card">

      <div class="field">
        <label>API 키</label>
        <input type="password" id="in-openai-key" value="${state.keys.openaiApiKey}" placeholder="sk-...">
      </div>
      <div class="field">
        <label>모델</label>
        <select id="in-openai-model">
          ${OPENAI_MODELS.map(m=>`<option value="${m.id}" ${state.keys.openaiModel===m.id?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>API Base URL</label>
        <input type="text" id="in-openai-base" value="${state.keys.openaiBase}" placeholder="https://api.openai.com">
      </div>
      <button class="btn secondary" data-test="openai" type="button">연결 테스트</button>
      ${statusHtml('test-openai')}
      ${sectionSaveButtons('openai')}
    </div>

    <div class="card">
      <h3>Gemini API (Google)</h3>
      <div class="settings-note" style="margin-bottom:12px;">영상 구간 분석 + 텍스트 작업. <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--violet); font-weight:700;">Google AI Studio</a>에서 키 발급.</div>
      <div class="field">
        <label>API 키</label>
        <input type="password" id="in-gemini" value="${state.keys.gemini}" placeholder="AIza...">
      </div>
      <div class="field">
        <label>모델</label>
        <select id="in-gemini-model">
          ${GEMINI_MODELS.map(m=>`<option value="${m.id}" ${(state.keys.geminiModel||'gemini-3.5-flash')===m.id?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <button class="btn secondary" data-test="gemini" type="button">연결 테스트</button>
      ${statusHtml('test-gemini')}
      ${sectionSaveButtons('gemini')}
    </div>

    <div class="card">
      <h3>Higgsfield 인증</h3>
      <div class="field">
        <label>API Key ID</label>
        <input type="text" id="in-hf-id" value="${state.keys.higgsfieldKeyId}" placeholder="f6bba312-c907-...">
      </div>
      <div class="field">
        <label>API Key Secret</label>
        <input type="password" id="in-hf-secret" value="${state.keys.higgsfieldKeySecret}" placeholder="0a1825f6fc82...">

        <label>Base URL</label>
        <input type="text" id="in-hf-base" value="${state.keys.higgsfieldBase}">
      </div>
      <div class="settings-note">
        Base URL은 <code>https://platform.higgsfield.ai</code> 가 맞습니다. 인증은 <code>Authorization: Key {ID}:{Secret}</code>.
        <b>웹사이트 로그인은 필요 없습니다</b> — API 키만으로 동작합니다.
        <br><b>영상·이미지 생성은 로컬 프록시가 필요합니다.</b> Higgsfield 공식 SDK는 서버 전용이라
        브라우저에서 보낸 생성 요청은 <code>403</code>으로 거부됩니다. 터미널에서
        <code>node sss-local-proxy.mjs</code> 를 실행해 두면 이 앱이 자동으로 그 경로로 중계합니다.

    <div class="card">
      <h3>모델 슬러그</h3>
      <div class="settings-note" style="margin-bottom:12px;">이미지 모델은 이 계정에서 <code>higgsfield-ai/popcorn/auto</code> 가 동작합니다. <code>seedream</code> 은 <code>model_not_found</code> 로 거부될 수 있어요.</div>
      <div class="field">
        <label>캐릭터 생성 모델</label>
        <input type="text" id="in-model-char" value="${escHtml(state.keys.hfCharacterModel||'')}" placeholder="higgsfield-ai/soul/standard">
        <div class="settings-note" style="margin-top:6px;">권장: <code>higgsfield-ai/soul/standard</code> · <code>soul/v2/*</code> 는 웹앱 전용이라 API에서 403이 납니다.<br>
        <b>크레딧:</b> 웹 구독 잔액 ≠ API 잔액. <code>not_enough_credits</code> 나오면 <a href="https://cloud.higgsfield.ai" target="_blank" rel="noopener">cloud.higgsfield.ai</a>에서 API 크레딧을 충전하세요.</div>
      </div>
      <div class="field">
        <label>씬 이미지 생성 모델</label>
        <input type="text" id="in-model-image" value="${escHtml(state.keys.hfImageModel||'')}" placeholder="higgsfield-ai/popcorn/auto">
        <div class="settings-note" style="margin-top:6px;">권장: <code>higgsfield-ai/popcorn/auto</code> (장면·소품) · resolution 720p/1600p</div>
      </div>
      <div class="field">
        <label>이미지→영상 모델</label>
        <input type="text" id="in-model-video" value="${state.keys.hfVideoModel}" placeholder="예: .../image-to-video">
      </div>
      <div style="background:#F0F7FF; border:1px solid #B7D3F5; border-radius:10px; padding:12px; margin-bottom:12px;">
        <div style="font-weight:800; margin-bottom:6px;">힉스필드 음성 연결 순서</div>
        <ol style="margin:0 0 0 18px; padding:0; font-size:12.5px; line-height:1.6;">
          <li>위 <b>Higgsfield 인증</b>에서 Key ID·Secret 저장 후 연결 테스트 성공</li>
          <li>음성 모델: <code>higgsfield-ai/text2speech/v2</code></li>
          <li>엔진(variant): <b>ElevenLabs</b>는 elevenlabs.com 가입이 아니라, 힉스필드 안 TTS 엔진 이름입니다</li>
          <li>보이스 찾기: <a href="https://higgsfield.ai" target="_blank" rel="noopener" style="color:var(--violet); font-weight:700;">higgsfield.ai</a> 로그인 → 상단 <b>Audio</b> → <b>Voiceover</b>(또는 Cinema Studio의 음성) → Voice Preset에서 보이스 선택</li>
          <li>선택한 보이스의 <b>ID</b>를 아래에 붙여넣고 이 섹션 저장</li>
        </ol>
        <div class="settings-note" style="margin:8px 0 0;">
          힉스필드 Voice Preset은 이름·샘플이 영어인 경우가 많고, “한국어 전용” 목록이 따로 없을 수 있어요.
          한국어 쇼핑쇼츠는 <b>Typecast(한국어 보이스)</b> 또는 <b>Google Cloud TTS (ko-KR)</b>를 권장합니다 — 앱이 힉스필드 실패/미설정 시 자동으로 넘어갑니다.
          힉스필드로 한국어를 쓰려면 <b>Seed Speech</b>나 Eleven v3에 한국어 대본을 넣어 미리듣기로 확인하고, 쓸 만한 보이스 ID만 넣으세요.
        </div>
      </div>
      <div class="field">
        <label>음성 생성 모델</label>
        <input type="text" id="in-model-audio" value="${state.keys.hfAudioModel}" placeholder="higgsfield-ai/text2speech/v2">
      </div>
      <div class="field">
        <label>음성 엔진 (higgsfield.ai Audio 화면과 동일)</label>
        <select id="in-hf-audio-variant">
          <option value="elevenlabs" ${state.keys.hfAudioVariant==='elevenlabs'?'selected':''}>Eleven v3 (감정·전달 제어)</option>
          <option value="minimax" ${state.keys.hfAudioVariant==='minimax'?'selected':''}>MiniMax Speech 2.8 HD (고음질 나레이션)</option>

        <div class="settings-note" style="margin-top:6px;">지금 고른 <b>Eleven v3</b> → 설정에서는 <b>Eleven v3</b> 그대로 두면 됩니다. (API 값: <code>elevenlabs</code>) Seed Audio / Qwen은 다른 작업용이라 이 스튜디오 TTS에는 안 씁니다.</div>

        <input type="text" id="in-hf-audio-voice" value="${state.keys.hfAudioVoiceId}" placeholder="Voice Preset에서 고른 보이스 id">
        <div class="settings-note">Eleven v3를 고른 뒤 같은 화면에서 <b>Voice / Voice Preset</b>을 열어 보이스를 선택하고, 그 보이스의 ID를 여기 붙여넣으세요. elevenlabs.com 키는 필요 없습니다.</div>
      </div>
      ${sectionSaveButtons('models')}
    </div>

    <div class="card">
      <h3>Google Cloud TTS (무료 할당량 — 2순위)</h3>
      <div class="settings-note" style="margin-bottom:12px;">월 400만 자(Standard)/100만 자(WaveNet)까지 무료예요. Google Cloud 콘솔에서 Text-to-Speech API를 켜고 결제(청구) 등록한 뒤 키를 발급받으세요 (무료 한도 안에서는 청구 안 됨). Gemini 키와는 별개예요.</div>
      <div class="field">
        <label>API 키</label>
        <input type="password" id="in-google-tts-key" value="${state.keys.googleTtsApiKey}" placeholder="AIza... (Cloud TTS용)">
      </div>
      <div class="field">
        <label>보이스 (성별 클릭해서 펼치기 → "선택" → 미리듣기 → 마음에 들면 아래 저장)</label>
        <div style="max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:10px; padding:6px;">
          ${(()=>{
            const list = state.googleTtsVoiceList || DEFAULT_GOOGLE_VOICES;
            const voiceRow = (v, num)=>{
              const isSelected = state.keys.googleTtsVoice === v.name;
              return `
                <div style="display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:8px; ${isSelected?'background:#EAF0FE;':''}">
                  <div style="width:22px; flex-shrink:0; color:var(--text-faint); font-size:12px; text-align:right;">${num}</div>
                  <div style="flex:1; font-size:13px;">
                    <b>${v.name}</b>
                    <span style="color:var(--text-lo); margin-left:6px;">${v.tier||''}</span>
                  </div>
                  <button class="btn secondary" data-preview-google-voice="${v.name}" type="button" style="padding:6px 10px; font-size:12px;">🔊</button>
                  <button class="${isSelected?'btn':'btn secondary'}" data-select-google-voice="${v.name}" type="button" style="padding:6px 12px; font-size:12px;">${isSelected?'✓ 선택됨':'선택'}</button>
                </div>
                ${state.googleTtsPreviewVoice === v.name && state.googleTtsPreviewUrl ? `
                  <audio controls autoplay src="${state.googleTtsPreviewUrl}" style="width:100%; margin:4px 0 8px;"></audio>
                ` : ''}
              `;
            };
            const genderGroup = (label, voices, color)=>{
              const expanded = !!state.voiceGenderExpanded?.[label];
              return `
                <div data-toggle-voice-gender="${label}" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:8px 6px; border-radius:8px;" onmouseover="this.style.background='#F1F5FC'" onmouseout="this.style.background='transparent'">
                  <span style="font-weight:700; font-size:12.5px; color:${color};">${label} (${voices.length})</span>
                  <span style="color:var(--text-faint); font-size:11px;">${expanded?'▾ 접기':'▸ 펼치기'}</span>
                </div>
                ${expanded ? voices.map((v,i)=>voiceRow(v,i+1)).join('') : ''}
              `;
            };
            const females = list.filter(v=>v.gender==='여성');
            const males = list.filter(v=>v.gender==='남성');
            const rest = list.filter(v=>v.gender!=='여성' && v.gender!=='남성');
            return `
              ${genderGroup('여성', females, 'var(--violet)')}
              ${genderGroup('남성', males, 'var(--coral)')}
              ${rest.length ? genderGroup('기타', rest, 'var(--text-lo)') : ''}
            `;
          })()}
        </div>
      </div>
      <button class="btn secondary" id="fetchGoogleVoices" type="button">🔍 한국어 보이스 전체 불러오기 (Chirp3-HD·Neural2 포함)</button>
      ${statusHtml('google-voices')}
      <div class="settings-note" style="margin-top:6px;">Standard/WaveNet뿐 아니라 Chirp3-HD, Neural2, Studio도 월 100만 자까지 무료라, 우리 사용량(영상당 100자 안팎)이면 전부 무료 범위예요.</div>
      <div class="field">
        <label>말속도: <span id="rateLabel">${state.keys.googleTtsRate.toFixed(2)}x</span> (10~15초 규칙에 맞춰 기본 1.10x)</label>
        <input type="range" id="in-google-tts-rate" min="0.75" max="1.5" step="0.05" value="${state.keys.googleTtsRate}" style="width:100%;">
      </div>
      ${sectionSaveButtons('googleTts')}
    </div>

    <div class="card">
      <h3>Typecast (음성 폴백 — 3순위)</h3>
      <div class="settings-note" style="margin-bottom:12px;">한국어 나레이션 <b>1순위</b>입니다. 대본 단계·자동 생성에서 여기서 고른 보이스를 씁니다. Base URL은 <code>https://api.typecast.ai</code>.</div>
      <div class="field">
        <label>API 키</label>
        <input type="password" id="in-typecast-key" value="${state.keys.typecastApiKey}" placeholder="tc_...">
      </div>
      <div class="field">

function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function closeProductImageLightbox(){
  document.getElementById('productImgLightbox')?.remove();
  document.removeEventListener('keydown', productImgLightboxKeydown);
}
function productImgLightboxKeydown(ev){
  if(ev.key === 'Escape') closeProductImageLightbox();
}
function openProductImageLightbox(index){
  const img = state.productImages[index];
  if(!img) return;
  closeProductImageLightbox();
  const wrap = document.createElement('div');
  wrap.className = 'img-lightbox';
  wrap.id = 'productImgLightbox';
  wrap.innerHTML = `
    <button type="button" class="img-lightbox-close" aria-label="닫기">✕</button>
    <img src="data:${img.mime};base64,${img.b64}" alt="제품 이미지 크게 보기">
  `;
  wrap.addEventListener('click', (ev)=>{
    if(ev.target === wrap || ev.target.classList.contains('img-lightbox-close')){
      closeProductImageLightbox();
    }
  });
  document.body.appendChild(wrap);
  document.addEventListener('keydown', productImgLightboxKeydown);
}
function listOrDash(arr){
  const items = (arr || []).map(x => String(x||'').trim()).filter(Boolean);
  if(!items.length) return `<span style="color:var(--text-faint);">정보 없음</span>`;
  return `<ul class="ax-list">${items.map(x=>`<li>${escHtml(x)}</li>`).join('')}</ul>`;
}
function chipsHtml(arr, cls=''){
  const items = (arr || []).map(x => String(x||'').trim()).filter(Boolean);
  if(!items.length) return `<span class="ax-meta">정보 없음</span>`;
  return `<div class="ax-chips">${items.map(x=>`<span class="ax-chip ${cls}">${escHtml(x)}</span>`).join('')}</div>`;
}
function scoreBox(label, val){
  const n = Number(val);
  const show = Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : '—';
  return `<div class="ax-score"><b>${show}</b><span>${escHtml(label)}</span></div>`;
}

function ensureSourceHunt(){
  if(!state.sourceHunt || typeof state.sourceHunt !== 'object'){
    state.sourceHunt = {
      keyword:'', track:'product', period:'7d', limit:20,
      enabled:{ youtube:false, coupang:true, tiktok:true, douyin:false, xhs:false },
    };
  }
  if(!state.sourceHunt.enabled) state.sourceHunt.enabled = { youtube:false, coupang:true, tiktok:true, douyin:false, xhs:false };
  const isPet = state.sourceHunt.track === 'pet';
  if(isPet){
    // 반려동물 트랙: 유튜브가 가장 큰 실사 리액션 풀. 기본 ON.
    if(state.sourceHunt.enabled.youtube !== true && state.sourceHunt.enabled.youtube !== false){
      state.sourceHunt.enabled.youtube = true;
    }
    // 쿠팡은 반려동물 트랙에서는 의미 없음.
    state.sourceHunt.enabled.coupang = false;
  }else{
    // 쇼핑 트랙: 유튜브는 3단계 전용.
    state.sourceHunt.enabled.youtube = false;
  }
  const lim = Number(state.sourceHunt.limit);
  state.sourceHunt.limit = [10,20,30,50].includes(lim) ? lim : 20;
  if(!Array.isArray(state.selectedSourceVideos)) state.selectedSourceVideos = [];
  return state.sourceHunt;
}

/** 제목·설명에서 프로그램명 / 방영일 / 회차 추출 */
function extractBroadcastMeta(title='', description=''){
  const t = String(title||'');
  const d = String(description||'');
  const blob = `${t}\n${d}`;
  let programName = '';
  let episode = '';
  let airDate = '';

  const epRes = [
    /(?:EP|Ep|ep|Episode|episode)[\s.:]*(\d{1,4})/,
    /제\s*(\d{1,4})\s*화/,
    /(\d{1,4})\s*회(?:차)?(?!\s*차)/,
    /(\d{1,4})\s*화(?!\s*보)/,
    /#\s*(\d{1,4})\b/,
    /시즌\s*\d+[^\d\n]{0,8}(\d{1,4})\s*[화회]/,
    /(?:회차|에피소드)\s*[:：]?\s*(?:제)?\s*(\d{1,4})\s*[화회]?/,
  ];
  for(const re of epRes){
    const m = blob.match(re);
    if(m){
      const n = m[1];
      episode = /화/.test(m[0]) && !/회/.test(m[0]) ? `${n}화` : `${n}회`;
      break;
    }
  }

  const dateRes = [
    /(?:방송일|방영일|본방일|온에어|방송날짜)\s*[:：]?\s*(\d{2,4})[.\-/년]\s*(\d{1,2})[.\-/월]?\s*(\d{1,2})/,
    /(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\s*(?:방송|방영|본방)/,
    /(\d{2,4})년\s*(\d{1,2})월\s*(\d{1,2})일/,
    /(?:방송|방영)\s*[:：]\s*(\d{2,4})[.\-/](\d{1,2})[.\-/](\d{1,2})/,
  ];
  for(const re of dateRes){
    const m = blob.match(re);
    if(m){
      let y = m[1], mo = String(m[2]).padStart(2,'0'), day = String(m[3]).padStart(2,'0');
      if(y.length === 2) y = '20' + y;
      airDate = `${y}-${mo}-${day}`;
      break;
    }
  }

  const bracket = t.match(/^[\[【「『]([^\]】」』]{2,40})[\]】」』]/)
    || t.match(/[\[【]([^\]】]{2,40})[\]】]/);
  if(bracket) programName = bracket[1].replace(/\s+/g,' ').trim();

  if(!programName){
    const pm = d.match(/(?:프로그램(?:명)?|방송명|코너명?)\s*[:：]\s*([^\n|·]{2,40})/);
    if(pm) programName = pm[1].replace(/\s+/g,' ').trim();
  }
  if(!programName){
    const m = t.match(/^(.{2,28}?)\s+(?:EP[\s.:]*\d+|제?\s*\d+\s*[화회]|#\s*\d+)/i);
    if(m){
      const cand = m[1].replace(/[\[\]【】「」『』#|]/g,' ').replace(/\s+/g,' ').trim();
      if(cand && !/shorts|쇼츠|리뷰|추천|쿠팡|구매|언박싱|꿀템|가성비/i.test(cand)){
        programName = cand;
      }
    }
  }

  return { programName, airDate, episode };
}

/** 쇼핑쇼츠 적합성 점수 (조회수 + 제목 신호) */
/** ISO 8601(PT1M30S) → 초. 값이 없으면 null */
function ytDurationSec(iso){
  const m = String(iso||'').match(/^P(?:(\d+)D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i);
  if(!m) return null;
  const [, d, h, mi, s] = m;
  return (Number(d||0)*86400) + (Number(h||0)*3600) + (Number(mi||0)*60) + Number(s||0);
}

/** 쇼핑 쇼츠 「만드는 방법」류 영상인지 — 제목·설명·채널명을 함께 봅니다 */
function isHowToShoppingVideo(v){
  const head = `${v.title||''} ${v.channel||v.author||''}`;
  if(YT_HOWTO_EXCLUDE.test(head) || YT_HOWTO_MAKE.test(head)) return true;
  // 설명은 오탐이 늘어나므로 앞부분만, 그리고 제품 신호가 없을 때만 반영
  const desc = String(v.description||'').slice(0, 300);
  return YT_HOWTO_EXCLUDE.test(desc) && !YT_REAL_SHORTS_HINT.test(head);
}

function shortsSuitabilityScore(v){
  const t = `${v.title||''} ${v.channel||v.author||''}`;
  let s = 0;
  if(/shorts|#short|쇼츠|숏폼/i.test(t)) s += 45;
  if(/리뷰|언박싱|추천|사용법|후기|착용|협찬|뭐\s*쓰|정보|비교/i.test(t)) s += 28;
  if(/구매|할인|쿠팡|최저가|득템|꿀템/i.test(t)) s += 12;
  const views = Number(v.viewCount||0);
  s += Math.min(35, Math.log10(Math.max(1, views)) * 6);
  // 실제 완성된 쇼츠(짧은 길이·제품 노출)를 위로, 제작 노하우 영상을 아래로
  const sec = ytDurationSec(v.duration);
  if(sec != null){
    if(sec <= 60) s += 25;
    else if(sec <= 180) s += 8;
    else s -= 30;
  }
  if(YT_REAL_SHORTS_HINT.test(t)) s += 10;
  if(isHowToShoppingVideo(v)) s -= 70;
  return Math.max(0, Math.round(s));
}

function rankShortsCandidates(list, platform){
  return (list||[]).map(v=>({
    ...v,
    platform: platform || v.platform || 'youtube',
    shortsScore: shortsSuitabilityScore(v),
  })).sort((a,b)=>{
    if((b.shortsScore||0) !== (a.shortsScore||0)) return (b.shortsScore||0) - (a.shortsScore||0);
    return Number(b.viewCount||0) - Number(a.viewCount||0);
  });
}

function huntPeriodDef(id){
  return HUNT_PERIODS.find(p => p.id === (id || ensureSourceHunt().period)) || HUNT_PERIODS[1];
}

function huntPublishedBounds(periodId){
  const def = huntPeriodDef(periodId);
  const now = Date.now();
  if(def.olderThanDays){
    return {
      publishedBefore: new Date(now - def.olderThanDays * 86400000).toISOString(),
      publishedAfter: null,
      order: def.order || 'viewCount',
    };
  }
  if(def.days != null){
    return {
      publishedAfter: new Date(now - def.days * 86400000).toISOString(),
      publishedBefore: null,
      order: def.order || 'viewCount',
    };
  }
  return { publishedAfter:null, publishedBefore:null, order:'viewCount' };
}

function isChineseSitePlatform(platformId){

}
function looksChinese(s){ return /[\u4e00-\u9fff]/.test(String(s||'')); }
function looksHangul(s){ return /[가-힣]/.test(String(s||'')); }

/** 한→중 쇼핑/숏폼 용어 (긴 키부터 치환) */
const HUNT_ZH_LEXICON = [

  ['보조배터리','充电宝'],['블루투스 이어폰','蓝牙耳机'],['무선이어폰','无线耳机'],
  ['화장품','化妆品'],['스킨케어','护肤'],['마스크팩','面膜'],['샴푸','洗发水'],
  ['주방','厨房'],['수납','收纳'],['살림','居家'],['먹방','吃播'],['식품','食品'],
  ['연예인 착용','明星同款'],['방송 협찬','综艺种草'],['방송 착용','综艺同款'],
  ['연예인','明星'],['협찬','种草'],['착용','同款'],['언박싱','开箱'],
  ['꿀템','好物'],['가성비','性价比'],['추천템','推荐好物'],['추천','推荐'],
  ['리뷰','测评'],['쇼츠','短视频'],['쇼핑','购物'],['인기','热门'],['핫딜','特价'],
  ['뷰티','美妆'],['음식','美食'],['제품','产品'],['상품','商品'],
];

/** 한국어 키워드 → 중국어 검색어 (분석 chineseKeywords 우선) */
function translateHuntKwToZh(kw){
  let s = String(kw||'').trim();
  if(!s) return '';
  if(looksChinese(s) && !looksHangul(s)) return s;

  const analysisZh = (state.analysis?.chineseKeywords || []).map(x=>String(x||'').trim()).filter(looksChinese);
  const phZh = String(ensurePlatformHunt().kwZh||'').trim();

  // 어휘 치환
  const pairs = HUNT_ZH_LEXICON.slice().sort((a,b)=> b[0].length - a[0].length);
  for(const [ko, zh] of pairs){
    if(s.includes(ko)) s = s.split(ko).join(zh);
  }
  s = s.replace(/\s+/g,' ').trim();

  if(!looksHangul(s) && looksChinese(s)) return s;

  // 한글이 남으면: 분석/패널 중국어 + 남은 영숫자
  const latin = s.replace(/[가-힣]+/g,' ').replace(/\s+/g,' ').trim();
  if(phZh && looksChinese(phZh)) return `${phZh}${latin ? ' '+latin : ''}`.trim();
  if(analysisZh[0]) return `${analysisZh[0]}${latin ? ' '+latin : ''}`.trim();
  return (latin || '').trim();
}

function expandZhHuntQuery(zhBase, track, platformId){
  let zh = String(zhBase||'').trim();
  if(track === 'celeb'){
    if(!zh) zh = '明星同款 综艺种草';
    else if(!/同款|明星|综艺|种草|穿搭/.test(zh)) zh = `${zh} 同款`;
  } else {
    if(!zh) zh = categoryHuntSeedZh();
    else if(!/测评|推荐|种草|开箱|好物|吃播|美妆/.test(zh)) zh = `${zh} 测评`;
  }
  if(platformId === 'xhs' && !/种草|安利|测评/.test(zh)) zh = `${zh} 种草`;
  if(platformId === 'douyin' && !/推荐|测评|好物|同款/.test(zh)) zh = `${zh} 推荐`;
  return zh.replace(/\s+/g,' ').trim().slice(0, 80);
}

/**
 * A: 카테고리 기준 / B: 연예인·방송
 * 중국 사이트(도우인·샤오홍슈)는 중국어 쿼리로 변환
 * 주의: 이미 확장된 검색어를 다시 넣지 않음 (누적 방지)
 */
function buildHuntQuery(baseKw, platformId){
  const hunt = ensureSourceHunt();
  let kw = String(baseKw != null ? baseKw : resolveHuntKeywordBase()).trim();
  // 이전에 붙은 확장어 제거 (검색어 누적 버그 방지)
  kw = kw
    .replace(/\s*(연예인\s*착용\s*방송\s*협찬|쇼핑\s*추천\s*리뷰|shorts|쇼츠)\s*/gi, ' ')
    .replace(/\s*(明星同款|综艺种草|种草推荐|测评推荐)\s*/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // 중국 사이트 → 중국어 검색어
  if(isChineseSitePlatform(platformId)){
    const dedicated = platformId === 'douyin'
      ? (document.getElementById('douyinQueryInput')?.value.trim() || state.douyinQuery || '')
      : (document.getElementById('xhsQueryInput')?.value.trim() || state.xhsQuery || '');
    let zhBase = '';
    // 한글 베이스가 있으면 항상 중국어로 변환 (이전 중국어 입력보다 우선)
    if(kw && looksHangul(kw)){
      zhBase = translateHuntKwToZh(kw);
    } else if(dedicated && looksChinese(dedicated) && !looksHangul(dedicated)){
      zhBase = dedicated;
    } else if(dedicated){
      zhBase = translateHuntKwToZh(dedicated);
    } else {
      zhBase = translateHuntKwToZh(kw)
        || String(ensurePlatformHunt().kwZh||'').trim()
        || (state.analysis?.chineseKeywords||[]).find(looksChinese)
        || '';
    }
    return expandZhHuntQuery(zhBase, hunt.track, platformId);
  }

  if(hunt.track === 'celeb'){
    if(platformId === 'coupang') return (kw || '인기 상품').slice(0, 80);
    return (kw ? `${kw} 착용` : '연예인 착용 제품').slice(0, 80);
  }
  const cat = categoryHuntSeed();
  if(platformId === 'coupang') return (kw || cat.replace(/리뷰 추천/,'추천')).slice(0, 80);
  return (kw ? `${kw} 리뷰` : cat).slice(0, 80);
}

function syncHuntKeywordFromInputs(){
  const hunt = ensureSourceHunt();
  const el = document.getElementById('huntKeywordInput');
  if(el) hunt.keyword = el.value.trim();
  return hunt;
}

function selectedHuntPlatformIds(){
  const hunt = ensureSourceHunt();
  const en = hunt.enabled || {};
  if(hunt.track === 'pet'){
    return ['youtube','tiktok','douyin','xhs'].filter(id => en[id]);
  }
  // 쇼핑 트랙: 유튜브는 2단계에서 제외 (3단계 전용)
  const ids = ['coupang','tiktok','douyin','xhs'].filter(id => en[id]);
  if(hunt.track === 'celeb'){
    return ids.filter(id => id === 'tiktok' || id === 'coupang');
  }
  return ids;
}

async function runHuntSelectedPlatforms(){
  syncHuntKeywordFromInputs();
  const hunt = ensureSourceHunt();
  const ids = selectedHuntPlatformIds();
  if(!ids.length){
    setStatus('hunt-multi','err','플랫폼을 하나 이상 선택해주세요');
    return;
  }
  const base = resolveHuntKeywordBase();
  hunt.keyword = base;
  const limit = Math.min(50, Math.max(10, Number(hunt.limit) || 20));
  hunt.limit = [10,20,30,50].includes(limit) ? limit : 20;
  const trackLabel = hunt.track === 'celeb' ? 'B·연예인/방송' : `A·${categoryLabelKo()}`;
  setStatus('hunt-multi','loading', `${trackLabel} · 조회수 상위 ${hunt.limit}개 검색 중...`);

  let opened = 0;
  const notes = [];
  const shortsPool = [];

  for(const id of ids){
    const kw = buildHuntQuery(base, id);
    if(id === 'youtube'){
      if(!state.keys.youtubeApiKey){
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(kw || 'pet shorts')}`, '_blank');
        opened++;
        notes.push('유튜브 탭');
      } else {
        try{
          const items = await youtubeShoppingShortsSearch({
            keyword: kw,
            mode: hunt.track === 'pet' ? 'mixed' : 'shopping',
            track: hunt.track,
            period: hunt.period,
            limit: hunt.limit,
            duration: 'short',
            minViews: 0,
          });
          const ranked = rankShortsCandidates(items.map(v => ({ ...v, platform:'youtube' }))).slice(0, hunt.limit);
          shortsPool.push(...ranked);
          notes.push(`유튜브 ${ranked.length}개`);
        }catch(err){
          console.warn('유튜브 검색 실패:', err?.message || err);
          window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(kw || 'pet shorts')}`, '_blank');
          opened++;
          notes.push('유튜브 탭');
        }
      }
      continue;
    }
    if(id === 'coupang'){
      state.coupangQuery = kw || state.coupangQuery || '';
      if(kw && state.keys.coupangAccessKey && state.keys.coupangSecretKey){
        try{
          const result = await coupangSearch(kw, Math.min(10, hunt.limit));
          const list = result.data?.productData || (Array.isArray(result.data) ? result.data : []);
          state.coupangResults = list.map(p => {
            const name = p.productName || p.name || '';
            return {
              name, price: p.productPrice ?? p.price ?? null,
              image: p.productImage || p.imageUrl || '',
              url: p.productUrl || p.landingUrl || '',
              productId: p.productId || null,
              isRocket: !!p.isRocket, isFreeShipping: !!p.isFreeShipping,
              categoryName: p.categoryName || '',
              matchScore: titleMatchScore(kw, name),
            };
          }).sort((a,b)=> (b.matchScore||0) - (a.matchScore||0));
          notes.push(`쿠팡 ${state.coupangResults.length}개`);
        }catch(_){
          window.open(platformHuntSearchUrl('coupang', kw || '인기'), '_blank');
          opened++;
          notes.push('쿠팡 탭');
        }
      } else {
        window.open(platformHuntSearchUrl('coupang', kw || '인기'), '_blank');
        opened++;
        notes.push('쿠팡 탭');
      }
    } else if(id === 'tiktok'){
      state.tiktokQuery = kw;
      if(state.keys.apifyToken && kw){
        try{
          const items = await apifyTiktokSearch(kw, hunt.limit);
          const ranked = rankShortsCandidates(items, 'tiktok').slice(0, hunt.limit);
          state.apifyResults = ranked;
          shortsPool.push(...ranked);
          notes.push(`틱톡 ${ranked.length}개`);
        }catch(_){
          window.open(platformHuntSearchUrl('tiktok', kw || 'fyp'), '_blank');
          opened++;
          notes.push('틱톡 탭');
        }
      } else {
        window.open(platformHuntSearchUrl('tiktok', kw || 'fyp'), '_blank');
        opened++;
        notes.push('틱톡 탭');
      }
      ensurePlatformHunt().lastOpened.tiktok = true;
    } else if(id === 'douyin'){
      state.douyinQuery = kw;
      ensurePlatformHunt().kwZh = kw;
      window.open(platformHuntSearchUrl('douyin', kw || '热门'), '_blank');
      opened++;
      notes.push(`도우인 「${kw}」`);
      ensurePlatformHunt().lastOpened.douyin = true;
    } else if(id === 'xhs'){
      state.xhsQuery = kw;
      ensurePlatformHunt().kwZh = kw;
      window.open(platformHuntSearchUrl('xhs', kw || '种草'), '_blank');
      opened++;
      notes.push(`샤오홍슈 「${kw}」`);
      ensurePlatformHunt().lastOpened.xhs = true;
    }
  }

  // 쇼핑쇼츠 활용 후보 — 조회수·적합성 순으로 제시 (유튜브 제외)
  // 「쇼핑쇼츠 만드는 법」류 제작 노하우 영상은 완성 소재가 아니므로 제외
  state.huntShortsResults = rankShortsCandidates(shortsPool.filter(v => !isHowToShoppingVideo(v)))
    .slice(0, hunt.limit);
  state.sourceTab = ids.includes('coupang') ? 'coupang' : (ids[0] || 'coupang');
  const msg = `${trackLabel} · 상위 ${hunt.limit} · ` + (notes.join(' · ') || '완료');
  setStatus('hunt-multi','ok', msg + (base ? '' : ' · 키워드 없이 실행'));
  render();
  setStatus('hunt-multi','ok', msg + (opened ? ' · 팝업 허용 필요할 수 있어요' : ''));
}

function cleanProductTitle(name){
  return String(name || '')
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/자급제|공식판매점|쿠팡|로켓배송|사전구매|한정\s*할인|무료배송/g, ' ')
    .replace(/[,，]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function uniqueStrings(arr){
  const seen = new Set();
  const out = [];
  for(const raw of arr || []){
    const s = String(raw || '').trim();
    if(!s) continue;
    const key = s.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    out.push(s);
  }
  return out;
}

/** 쿠팡 상품/분석 결과 → 플랫폼별 검색 키워드 계획 */
function buildPlatformHuntPlan(){
  const fullName = state.selectedCoupang?.name || state.analysis?.productName || '';
  const name = cleanProductTitle(fullName);
  const brand = String(state.analysis?.brand || '').trim();
  const category = String(state.analysis?.category || state.selectedCoupang?.categoryName || '').trim();
  const shortName = name.split(/\s+/).slice(0, 6).join(' ');
  const ko = uniqueStrings([
    ...(state.analysis?.searchKeywords || []),
    shortName,
    name,
    [brand, shortName].filter(Boolean).join(' '),
    [shortName, '리뷰'].filter(Boolean).join(' '),
    [shortName, '쇼츠'].filter(Boolean).join(' '),
    category && shortName ? `${category} ${shortName.split(/\s+/)[0]||''}` : '',
  ]).slice(0, 6);
  const zhFromKo = translateHuntKwToZh(shortName || name || '');
  const zh = uniqueStrings([
    ...(state.analysis?.chineseKeywords || []),
    zhFromKo,
    categoryHuntSeedZh(),
    zhFromKo ? `${zhFromKo} 测评` : '',
    zhFromKo ? `${zhFromKo} 种草` : '',
  ]).slice(0, 6);
  return {
    productLabel: name || fullName || '불러온 상품',
    ko, zh,
    primaryKo: ko[0] || name || '제품',
    primaryZh: zh[0] || categoryHuntSeedZh(),
  };
}

function ensurePlatformHunt(){
  if(!state.platformHunt || typeof state.platformHunt !== 'object'){
    state.platformHunt = { panel:'tiktok', kwKo:'', kwZh:'', lastOpened:{} };
  }
  if(state.platformHunt.panel === 'youtube' || state.platformHunt.panel === 'coupang'){
    state.platformHunt.panel = 'tiktok';
  }
  if(!state.platformHunt.lastOpened) state.platformHunt.lastOpened = {};
  return state.platformHunt;
}

function syncPlatformHuntKeywords(force=false){
  const ph = ensurePlatformHunt();
  const plan = buildPlatformHuntPlan();
  if(force || !ph.kwKo) ph.kwKo = plan.primaryKo;
  if(force || !ph.kwZh){
    ph.kwZh = plan.primaryZh
      || translateHuntKwToZh(plan.primaryKo || '')
      || categoryHuntSeedZh();
  }
  return plan;
}

function platformHuntKeyword(platformId){
  const ph = ensurePlatformHunt();
  const def = PLATFORM_HUNT_DEFS.find(p => p.id === platformId);
  const ko = (ph.kwKo || '').trim();
  const zh = (ph.kwZh || '').trim();
  // 도우인·샤오홍슈는 중국어만 사용
  if(isChineseSitePlatform(platformId)){
    if(zh && looksChinese(zh)) return expandZhHuntQuery(zh, ensureSourceHunt().track, platformId);
    return buildHuntQuery(ko || resolveHuntKeywordBase(), platformId);
  }
  if(def?.preferZh) return zh || ko;
  return ko || zh;
}

function platformHuntSearchUrl(platformId, keyword){
  const kw = encodeURIComponent(keyword || '');
  const period = ensureSourceHunt().period || '7d';
  switch(platformId){
    case 'youtube': {
      // sp 필터는 UI 보조 — API 검색이 주경로
      const spMap = { '24h':'EgIIAQ%253D%253D', '7d':'EgIIAw%253D%253D', '30d':'EgIIBA%253D%253D', '365d':'EgIIBQ%253D%253D' };
      const sp = spMap[period] || '';
      return `https://www.youtube.com/results?search_query=${kw}${sp ? '&sp='+sp : ''}`;
    }
    case 'tiktok':  return `https://www.tiktok.com/search?q=${kw}`;
    case 'douyin':  return `https://www.douyin.com/search/${kw}`;
    case 'coupang': return `https://www.coupang.com/np/search?q=${kw}`;
    case 'xhs':     return `https://www.xiaohongshu.com/search_result?keyword=${kw}`;
    default: return '';
  }
}

/* ============================================================

        쇼핑 쇼츠·아이디어 꿀템은 다중 키워드로 검색한 뒤 <b>쇼츠</b>/<b>롱폼</b> + <b>조회수 상위(선택 개수)</b>로 정리합니다. 키워드는 선택사항입니다.<br>

      </div>
    </div>

function scriptTableHtml(rows){
  return `<table>
    <tr><th>씬</th><th>오디오</th><th>대사</th><th>화면</th><th>자막</th></tr>
    ${(rows||[]).map(r=>{
      const hasVo = String(r.line||'').trim() && r.audio !== 'sfx';
      return `<tr>
        <td>${r.scene ?? ''}</td>
        <td style="white-space:nowrap; font-size:11px; color:${hasVo?'var(--violet)':'var(--text-faint)'};">${hasVo?'🎙 대사':'🔊 효과음'}</td>
        <td>${r.line || '<span style="color:var(--text-faint);">—</span>'}</td>
        <td>${r.visual||''}</td>
        <td>${r.caption||''}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

/** 나레이션할 대사 줄만 추출 (빈 줄·audio:sfx 제외) */
function getDialogueRows(scriptTable){
  return (scriptTable || []).map((r, i)=>({ ...r, _i:i })).filter(r=>{
    if(r.audio === 'sfx') return false;
    return !!String(r.line || '').trim();
  });
}

function resolveNarrationEmotion(index, total){
  const mode = state.keys.narrationEmotion || 'smart';
  if(mode === 'auto-scene'){
    if(total <= 1) return 'toneup';
    if(index === 0) return 'toneup';
    if(index === total - 1) return 'happy';
    return 'normal';
  }
  return mode;
}

/** 미리 이미지로 준비할 핵심 소품(차·구매제품) vs 씬에서 자동 반영 */
function inferPropPrepMode(partial={}){
  if(partial.prepMode === 'key' || partial.prepMode === 'auto') return partial.prepMode;
  const kind = String(partial.kind||'');
  const blob = `${partial.label||''} ${partial.brand||''} ${partial.model||''} ${partial.notes||''}`;
  // 가격표·코믹소품·부스러기·배경 소품 → 미리 설정 불필요
  if(/가격표|태그|부스러기|콧수염|코믹|소품|군중|배경|간판|영수증|할인/i.test(blob)) return 'auto';
  if(kind === 'car') return 'key';
  if(kind === 'product' || kind === 'electronics' || kind === 'appliance') return 'key';
  if(kind === 'other' || kind === 'furniture') return 'auto';
  return 'auto';
}

function emptyPropSlot(partial={}){
  const kindOk = new Set(WORLD_PROP_KINDS.map(k=>k.id));
  const prepMode = inferPropPrepMode(partial);
  let heldBy = String(partial.heldBy||'none');
  if(heldBy !== 'hero' && heldBy !== 'none' && !heldBy.startsWith('cast:')){
    // 분석 단계에서 이름만 온 경우 나중에 linkPropHoldersAfterAnalyze 로 id 연결
    if(heldBy && heldBy !== 'none') heldBy = `name:${heldBy}`;
    else heldBy = 'none';
  }
  return {
    id: partial.id || newWorldAssetId('prop'),
    kind: kindOk.has(partial.kind) ? partial.kind : (partial.kind || 'product'),
    label: String(partial.label||''),
    brand: String(partial.brand||''),
    model: String(partial.model||''),
    notes: String(partial.notes||''),
    heldBy, // none | hero | cast:<id> | name:<표시이름>
    source: partial.source === 'upload' ? 'upload' : 'ai', // ai | upload
    prepMode, // key=미리 그리기 · auto=씬 자동
    useInScene: partial.useInScene !== false,
    imageUrl: partial.imageUrl || null,
    uploaded: !!partial.uploaded,
  };
}

function normalizePropFlags(){
  const wa = ensureWorldAssets();
  if(!Array.isArray(wa.sceneHints)) wa.sceneHints = wa.sceneHints ? [].concat(wa.sceneHints) : [];
  if(typeof wa.crowdNote !== 'string') wa.crowdNote = wa.crowdNote ? String(wa.crowdNote) : '';
  // auto 소품은 슬롯에서 빼고 sceneHints로 흡수 (설정 UI 단순화)
  const kept = [];
  for(const raw of (wa.props||[])){
    const p = emptyPropSlot(raw);
    if(p.prepMode === 'auto' && !p.imageUrl){
      const hint = [p.label, p.brand, p.model, p.notes].filter(Boolean).join(' · ');
      if(hint && !wa.sceneHints.some(h => String(h).includes(p.label||hint))){
        wa.sceneHints.push(hint);
      }
      continue;
    }
    kept.push(p);
  }
  wa.props = kept;
  wa.sceneHints = uniqueStrings(wa.sceneHints.map(s=>String(s||'').trim()).filter(Boolean)).slice(0, 12);
  return wa;
}

function keyPropsList(){
  return normalizePropFlags().props.filter(p => p.prepMode === 'key' || p.imageUrl);
}


function propIdentity(p){
  return [p.brand, p.model, p.label].filter(x=>String(x||'').trim()).join(' ') || '이름 미정';

function buildScenePropFidelityPrompt(group){

    if((p.kind === 'car' || /suv|자동차|차량|car/i.test(blob)) && /suv|자동차|차량|차|car|추격|도로/.test(visual)) return true;
    if((p.kind === 'electronics' || p.kind === 'appliance' || /tv|텔레비전|모니터|스크린/.test(blob)) && /tv|텔레비전|모니터|스크린|화면|박스/.test(visual)) return true;

  }).slice(0, 3);

function formatPersonIdentity(person){
  if(!person) return '';
  const name = cleanCastText(person.name || person.label || person.role || '인물', 60);
  const lock = stripStoryPropsFromPersonText(person.identityLock || person.look || '', 160);
  const wardrobe = stripStoryPropsFromPersonText(person.wardrobe || '', 120);
  const sig = safePersonalSignatureProp(person.signatureProp || '');
  const bits = ['《' + name + '》'];
  if(lock) bits.push('얼굴고정:' + lock);
  if(wardrobe) bits.push('복장고정:' + wardrobe);
  if(sig) bits.push('작은개인소품:' + sig);
  return bits.join(' · ');
}

function resolvePropHolder(prop){
  if(!prop) return null;
  const held = String(prop.heldBy||'none');
  const bible = buildCharacterBible();
  if(held === 'hero') return bible.hero;
  if(held.startsWith('cast:')){
    const id = held.slice(5);
    return bible.support.find(c=>c.id===id) || null;
  }
  if(held.startsWith('name:')){
    const name = held.slice(5).trim().toLowerCase();
    if(!name || name === 'hero' || name === '주인공') return bible.hero;
    return bible.support.find(c => String(c.name||'').toLowerCase()===name
      || String(c.role||'').toLowerCase()===name) || null;
  }
  // 메모/라벨에 인물 힌트가 있으면 추정
  const blob = `${prop.label||''} ${prop.notes||''}`.toLowerCase();
  if(/주인공|경찰|베이글/.test(blob) && /들|들고|운반|훔|질주|남자|인물/.test(blob)){
    // 상대가 TV를 드는 스토리가 흔함 → 첫 조연 우선, 없으면 주인공
    return bible.support[0] || bible.hero;
  }
  return null;
}

/** 분석 결과 heldBy(이름) → cast id 로 연결 */
function linkPropHoldersAfterAnalyze(props, castList){
  const cast = castList || ensureWorldAssets().cast;
  return (props||[]).map(p=>{
    const slot = emptyPropSlot(p);
    let held = String(slot.heldBy||'none');
    if(held.startsWith('name:')){
      const name = held.slice(5).trim();
      if(!name || /none|없음|무|no/i.test(name)) held = 'none';
      else if(/hero|주인공/i.test(name)) held = 'hero';
      else {
        const hit = cast.find(c => c.name === name || c.role === name
          || String(c.name||'').includes(name) || String(name).includes(c.name||''));
        held = hit ? `cast:${hit.id}` : 'none';
      }
    }else if(held !== 'hero' && held !== 'none' && !held.startsWith('cast:')){
      if(/hero|주인공/i.test(held)) held = 'hero';
      else if(/none|없음/i.test(held)) held = 'none';
      else {
        const hit = cast.find(c => c.name === held || c.role === held);
        held = hit ? `cast:${hit.id}` : (cast[0] ? `cast:${cast[0].id}` : 'none');
      }
    }
    slot.heldBy = held;
    return slot;
  });
}

function getConsistencyRefUrls(opts={}){
  const bible = buildCharacterBible();
  const wa = normalizePropFlags();
  const personRefs = [];
  const propRefs = [];
  for(const p of bible.all){
    if(p.imageUrl && /^https?:\/\//i.test(p.imageUrl)) personRefs.push(p.imageUrl);
  }
  for(const prop of wa.props){
    if(prop.useInScene === false || !prop.imageUrl) continue;
    if(!/^https?:\/\//i.test(prop.imageUrl)) continue;
    if(String(prop.heldBy||'none') !== 'none' && opts.includeHeldProps !== true) continue;
    propRefs.push(prop.imageUrl);
  }
  const extra = (opts.extra||[]).filter(u=>u && /^https?:\/\//i.test(u));
  const max = Math.max(1, Math.min(8, Number(opts.max) || 4));
  const ordered = opts.propFirst
    ? [...personRefs.slice(0,2), ...propRefs.slice(0,2), ...extra]
    : [...personRefs.slice(0,2), ...extra, ...propRefs.slice(0,2)];
  return uniqueStrings(ordered).filter(Boolean).slice(0, max);
}

function renderCastResultGallery(){
  const wa = ensureWorldAssets();
  const hasHero = !!state.character?.imageUrl;
  const castWithImg = wa.cast.filter(c=>c.imageUrl);
  const propsWithImg = wa.props.filter(p=>p.imageUrl);
  if(!hasHero && !castWithImg.length && !propsWithImg.length) return '';
  const holderLabel = (p)=>{
    const h = resolvePropHolder(p);

    return `동일인물: ${h.name}`;
  };
  return `
    <div class="card" style="margin-top:16px;">

      <div class="settings-note" style="margin-bottom:10px; font-size:12.5px; line-height:1.5;">

      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;">

          <div>
            <div class="thumb"><img src="${state.character.imageUrl}" alt=""></div>
            <div style="font-size:12.5px; font-weight:700; margin-top:6px;">주인공</div>
            ${state.character.fromSuggestion ? `<div class="settings-note" style="margin-top:2px;">«${escHtml(state.character.fromSuggestion)}»</div>` : ''}
            ${state.selectedCharSuggestion?.wardrobe ? `<div class="settings-note" style="margin-top:2px;">${escHtml(state.selectedCharSuggestion.wardrobe)}</div>` : ''}

  `;
}

function petDownloaderUrl(url){

function petSourceRefsBanner(){

  `;
