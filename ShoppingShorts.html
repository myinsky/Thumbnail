/** 타임라인 시간축: base 20px/s. 긴 영상도 한 화면에 들어가도록 최소 줌을 아주 작게 허용 */
const TL_PPS_BASE = 20;
const TL_ZOOM_MIN = 0.005;  // ≈ 0.1px/s → 수시간 분량도 맞춤 가능
const TL_ZOOM_MAX = 12;

function timelinePPS(zoom = state.tlZoom){
  return Math.max(0.04, TL_PPS_BASE * (Number(zoom) || 1));
}

function clipOutDur(e){
  return Math.max(0.5, (e.end - e.start) / (e.speed ?? 1));
}

function isTlManual(){
  return (state.tlEditMode || 'manual') === 'manual';
}

/** 표시용 클립 시작 시각 — state를 절대 수정하지 않음 (편집 독립성) */
function buildClipStartMap(edl){
  const map = {};
  const manual = isTlManual();
  let acc = 0;
  (edl || []).forEach((e, i)=>{
    const dur = clipOutDur(e);
    if((e.track || 1) === 1){
      if(manual && e.at != null && e.at !== ''){
        map[i] = Number(e.at);
        acc = Math.max(acc, map[i] + dur);
      }else{
        // 자동 모드이거나 at 없음: 순차 표시만 (저장값 변경 없음)
        map[i] = acc;
        acc += dur;
      }
    }else{
      map[i] = Number(e.at) || 0;
    }
  });
  return map;
}

/** V1 클립들을 시간순으로 빈칸 없이 이어 붙임 — 영상만, 자막 무관 */
function snapMainClipsTogether(){
  const edl = state.sourceEDL || [];
  const mains = edl
    .map((e, i) => ({ e, i }))
    .filter(x => (x.e.track || 1) === 1)
    .sort((a, b) => (Number(a.e.at) || 0) - (Number(b.e.at) || 0) || a.i - b.i);
  let acc = 0;
  mains.forEach(({ e }) => {
    e.at = Number(acc.toFixed(2));
    acc += clipOutDur(e);
  });
  return mains.length;
}

function nextV1AppendAt(){
  const edl = state.sourceEDL || [];
  let end = 0;
  let packed = 0;
  let anyAt = false;
  edl.forEach(e => {
    if((e.track || 1) !== 1) return;
    const dur = clipOutDur(e);
    if(e.at != null && e.at !== ''){
      anyAt = true;
      end = Math.max(end, Number(e.at) + dur);
    }
    packed += dur;
  });
  return anyAt ? end : packed;
}

/** @deprecated 사이드이펙트 동기화 금지 — 자막·영상은 항상 독립 */
function syncSubtitlesFromEDLIfAuto(_keepText = true){
  // no-op: 클립 편집이 자막을, 자막 편집이 클립을 바꾸지 않음
}

/** 타임라인에 표시해야 할 전체 길이(초) — V1 + 오버레이 + 자막, 비어 있으면 소스 길이 */
function getTimelineContentDuration(){
  const edl = state.sourceEDL || [];
  const starts = buildClipStartMap(edl);
  let total = 0;
  edl.forEach((e, i)=>{
    total = Math.max(total, (starts[i] || 0) + clipOutDur(e));
  });
  (state.subtitles || []).forEach(s=>{
    if((s.end || 0) > total) total = s.end;
  });
  if(total < 1){
    const durs = Object.values(state.sourceDurations || {}).map(Number).filter(n=>n > 0);
    if(durs.length) total = Math.max(total, ...durs);
  }
  return Math.max(1, total);
}

/* ============================================================
   재생 진행 시각화 — 타임라인 클립에 현재 재생 지점을 표시
============================================================ */

/**
 * 미리보기 영상의 현재 시각을 타임라인 좌표로 변환합니다.
 * @returns {{tl:number|null, clips:Object<number,number>}|null}
 *   clips[i] = 클립 i의 진행 비율 (0 이전 · 1 초과는 아직/이미 지난 클립)
 */
function buildPlaybackProgress(){
  const v = document.getElementById('nlePreviewVideo');
  if(!v || !Number.isFinite(v.currentTime)) return null;
  const edl = state.sourceEDL || [];
  if(!edl.length) return null;
  const starts = buildClipStartMap(edl);
  const t = v.currentTime;
  const out = { tl:null, clips:{} };

  // 완성본(합본)은 타임라인 전체를 그대로 재생
  if(state.sourceAssembledUrl){
    out.tl = t;
    edl.forEach((e, i)=>{
      out.clips[i] = (t - (starts[i] || 0)) / clipOutDur(e);
    });
    return out;
  }

  // 소스 모니터: 같은 원본을 쓰는 클립의 구간 안에 있을 때만 표시
  if(state.previewMode === 'source' && state.activeSourceIndex != null){
    edl.forEach((e, i)=>{
      if(e.videoIndex !== state.activeSourceIndex) return;
      const span = Math.max(0.001, e.end - e.start);
      const f = (t - e.start) / span;
      out.clips[i] = f;
      if(f >= 0 && f <= 1) out.tl = (starts[i] || 0) + (t - e.start) / (e.speed ?? 1);
    });
    return out;
  }

  // 프로그램 모니터: 선택한 클립 하나를 재생
  const i = Math.min(state.selectedEdlIndex ?? 0, edl.length - 1);
  const clip = edl[i];
  if(!clip) return null;
  const span = Math.max(0.001, clip.end - clip.start);
  const dur = clipOutDur(clip);
  out.clips[i] = (t - clip.start) / span;
  // 클립 밖으로 재생이 흘러도 재생헤드는 클립 안에 머무름
  const off = Math.min(dur, Math.max(0, (t - clip.start) / (clip.speed ?? 1)));
  out.tl = (starts[i] || 0) + off;
  return out;
}

/** 재생 중에만 재생헤드를 화면 안으로 따라가게 스크롤 */
function followPlayheadScroll(px){
  const sc = document.getElementById('vpTimelineScroll');
  if(!sc) return;
  const w = sc.clientWidth;
  if(!(w > 0)) return;
  const margin = Math.min(180, w * 0.25);
  if(px < sc.scrollLeft + margin) sc.scrollLeft = Math.max(0, px - margin);
  else if(px > sc.scrollLeft + w - margin) sc.scrollLeft = px - w + margin;
}

/** 클립 진행 막대 · 재생헤드 위치를 DOM에 직접 반영 (재렌더 없이) */
function paintTimelineProgress(){
  const inner = document.querySelector('.vp-tl-inner');
  if(!inner) return;
  const v = document.getElementById('nlePreviewVideo');
  const playing = !!(v && !v.paused && !v.ended);
  const prog = buildPlaybackProgress();

  inner.querySelectorAll('.vp-clip').forEach(el=>{
    const i = Number(el.dataset.selectEdl);
    const f = prog?.clips?.[i];
    const bar = el.querySelector('.vp-clip-progress');
    const at = f != null && f >= -0.0005 && f <= 1.0005;
    const done = f != null && f > 1.0005;
    el.classList.toggle('at-play', at);
    el.classList.toggle('played', done);
    el.classList.toggle('playing', at && playing);
    if(bar) bar.style.width = at ? `${(Math.max(0, f) * 100).toFixed(2)}%` : (done ? '100%' : '0');
    const now = el.querySelector('.vp-clip-now');
    if(now && at){
      const clip = (state.sourceEDL || [])[i];
      now.textContent = clip ? `${(Math.max(0, f) * clipOutDur(clip)).toFixed(1)}s` : '';
    }
  });

  const head = inner.querySelector('.vp-playhead');
  if(head){
    head.classList.toggle('live', playing);
    if(prog?.tl != null){
      const px = 132 + prog.tl * timelinePPS();
      head.style.left = `${px}px`;
      if(playing){
        // 정지 후에도 멈춘 자리에서 자르기·자막 추가가 이어지도록 state에 반영
        state.playhead = Number(prog.tl.toFixed(3));
        followPlayheadScroll(px);
      }
    }
  }
}

let tlProgressRaf = 0;
function stopTimelineProgressLoop(){
  if(tlProgressRaf) cancelAnimationFrame(tlProgressRaf);
  tlProgressRaf = 0;
}
function startTimelineProgressLoop(){
  stopTimelineProgressLoop();
  const step = ()=>{
    const v = document.getElementById('nlePreviewVideo');
    paintTimelineProgress();
    if(v && !v.paused && !v.ended){
      tlProgressRaf = requestAnimationFrame(step);
    }else{
      tlProgressRaf = 0;
    }
  };
  tlProgressRaf = requestAnimationFrame(step);
}

['play','playing'].forEach(ev=>{
  document.addEventListener(ev, (e)=>{
    if(e.target?.id === 'nlePreviewVideo') startTimelineProgressLoop();
  }, true);
});
['pause','ended','seeked','loadedmetadata','ratechange'].forEach(ev=>{
  document.addEventListener(ev, (e)=>{
    if(e.target?.id !== 'nlePreviewVideo') return;
    if(ev === 'pause' || ev === 'ended'){
      stopTimelineProgressLoop();
      const btn = document.getElementById('nlePlayPause');
      if(btn) btn.textContent = '▶';
    }
    paintTimelineProgress();
  }, true);
});

/** 타임라인 시간축 줌 (줄이기/넓히기/맞춤/슬라이더) */
function applyTimelineZoom(mode, opts={}){
  const totalDur = getTimelineContentDuration();
  const scrollEl = document.getElementById('vpTimelineScroll');
  const prevPPS = timelinePPS();
  const centerTime = scrollEl
    ? (scrollEl.scrollLeft + scrollEl.clientWidth * 0.5 - 132) / prevPPS
    : (state.playhead || 0);

  let z = Number(state.tlZoom) || 1;
  if(mode === 'in') z = Math.min(TL_ZOOM_MAX, z * 1.35);
  else if(mode === 'out') z = Math.max(TL_ZOOM_MIN, z / 1.35);
  else if(mode === 'reset') z = 1;
  else if(mode === 'fit'){
    const viewport = scrollEl?.clientWidth || Math.max(640, window.innerWidth - 80);
    const usable = Math.max(200, viewport - 150);
    const need = Math.max(4, totalDur);
    // 전체 길이가 뷰포트에 들어오도록 PPS → zoom 환산 (여유 4%)
    z = Math.max(TL_ZOOM_MIN, Math.min(TL_ZOOM_MAX, (usable * 0.96) / (need * TL_PPS_BASE)));
  }else if(mode === 'set' && opts.value != null){
    z = Math.max(TL_ZOOM_MIN, Math.min(TL_ZOOM_MAX, Number(opts.value) || 1));
  }
  state.tlZoom = Number(z.toFixed(4));
  render();
  requestAnimationFrame(()=>{
    const el = document.getElementById('vpTimelineScroll');
    if(!el) return;
    const pps = timelinePPS();
    if(mode === 'fit'){
      el.scrollLeft = 0;
    }else{
      el.scrollLeft = Math.max(0, centerTime * pps + 132 - el.clientWidth * 0.5);
    }
  });
}

/** 클립이 뷰포트보다 훨씬 길면 자동으로 전체 맞춤 */
function maybeAutoFitTimeline(){
  requestAnimationFrame(()=>{
    const el = document.getElementById('vpTimelineScroll');
    if(!el || state.current !== 'studio') return;
    const needW = getTimelineContentDuration() * timelinePPS() + 160;
    if(needW > el.clientWidth * 1.08) applyTimelineZoom('fit');
  });
}

function resolveProgramPreview(edl, selected){
  if(state.sourceAssembledUrl){
    return { kind:'assembled', url: state.sourceAssembledUrl };
  }
  if(state.previewMode === 'source' && state.activeSourceIndex != null){
    const src = state.sourceVideos[state.activeSourceIndex];
    if(src) return { kind:'source', src, index: state.activeSourceIndex };
  }
  const clip = selected || (edl.length ? edl[Math.min(state.selectedEdlIndex||0, edl.length-1)] : null);
  if(clip){
    const src = state.sourceVideos[clip.videoIndex];
    if(src) return { kind:'clip', src, clip, index: clip.videoIndex };
  }
  return { kind:'empty' };
}

async function resolveClipRangeForSource(videoIndex){
  const src = state.sourceVideos[videoIndex];
  if(!src) return null;
  if(src.isImage) return { start:0, end:3 };
  const mark = state.sourceMarks?.[videoIndex];
  if(mark && mark.in != null && mark.out != null && mark.out > mark.in){
    return { start: Number(Number(mark.in).toFixed(1)), end: Number(Number(mark.out).toFixed(1)) };
  }
  let dur = state.sourceDurations?.[videoIndex];
  if(!(dur > 0)) dur = await ensureVideoDuration(videoIndex);
  const end = Math.max(0.5, Number(dur) || 3);
  return { start:0, end: Number(end.toFixed(1)) };
}

function getActiveXform(){
  const edl = state.sourceEDL || [];
  const clip = edl[state.selectedEdlIndex];
  if(state.previewMode !== 'source' && clip) return clip;
  if(!state.previewXform){
    state.previewXform = { tx:0, ty:0, scaleX:100, scaleY:100, lockAspect:false };
  }
  return state.previewXform;
}

function applyXformToPreviewEl(el, xform){
  if(!el || !xform) return;
  const tx = xform.tx ?? 0, ty = xform.ty ?? 0;
  const sx = (xform.scaleX ?? 100) / 100, sy = (xform.scaleY ?? 100) / 100;
  const rot = xform.rotation ?? 0, op = xform.opacity ?? 1;
  el.style.transformOrigin = 'center';
  el.style.transform = `translate(${tx}%,${ty}%) scale(${sx},${sy}) rotate(${rot}deg)`;
  el.style.opacity = String(op);
}

function clipXformStyleAttr(c){
  if(!c) return 'transform-origin:center;';
  const tx=c.tx??0, ty=c.ty??0, sx=(c.scaleX??100)/100, sy=(c.scaleY??100)/100, rot=c.rotation??0, op=c.opacity??1;
  return `transform-origin:center; transform:translate(${tx}%,${ty}%) scale(${sx},${sy}) rotate(${rot}deg); opacity:${op};`;
}

function pushClipToTimeline(videoIndex, range, extra={}){
  if(!range) return;
  if(!state.sourceEDL) state.sourceEDL = [];
  const xf = state.previewXform || {};
  const track = Math.max(1, Math.min(MAX_VIDEO_TRACKS, Number(extra.track) || 1));
  const clip = {
    line: '',
    videoIndex,
    start: range.start,
    end: range.end,
    track: 1,
    tx: xf.tx ?? 0,
    ty: xf.ty ?? 0,
    scaleX: xf.scaleX ?? 100,
    scaleY: xf.scaleY ?? 100,
    lockAspect: xf.lockAspect === true,
    ...extra,
    track,
  };
  if(track > 1 && (clip.at == null || clip.at === '')){
    clip.at = Number(state.playhead) || 0;
  }
  if(track === 1 && (clip.at == null || clip.at === '')){
    clip.at = Number(nextV1AppendAt().toFixed(2));
  }
  state.sourceEDL.push(clip);
  state.selectedEdlIndex = state.sourceEDL.length - 1;
  state.tlFocus = 'clip';
  state.previewMode = 'timeline';
  state.activeSourceIndex = null;
  state.previewRange = null;
  // 영상 추가가 자막을 생성·덮어쓰지 않음 (완전 독립)
  if(!Array.isArray(state.subtitles)) state.subtitles = [];
  // 긴 클립이 들어오면 다음 프레임에 전체맞춤
  maybeAutoFitTimeline();
}

function addSubtitleAt(opts={}){
  if(!state.subtitles) state.subtitles = [];
  const last = state.subtitles[state.subtitles.length-1];
  const start = Number(Number(opts.start != null ? opts.start : (state.playhead || (last ? last.end : 0))).toFixed(2));
  const end = Number(Number(opts.end != null ? opts.end : (start + DEFAULT_SUB_DURATION)).toFixed(2));
  const safeEnd = Math.max(start + 0.5, end);
  const lane = opts.lane != null
    ? Math.max(1, Math.min(MAX_SUB_LANES, Number(opts.lane)))
    : findFreeSubLane(start, safeEnd);
  const row = {
    start,
    end: safeEnd,
    text: opts.text || '',
    kind: opts.kind || 'caption',
    lane,
  };
  state.subtitles.push(row);
  state.selectedSubIndex = state.subtitles.length - 1;
  state.tlFocus = 'sub';
  state.subStyleTarget = row.kind === 'title' ? 'title' : 'sub';
  return row;
}

async function addSourcesToTimelineSequential(indices){
  const list = (indices || []).filter(i => state.sourceVideos[i]);
  if(!list.length) throw new Error('추가할 미디어가 없어요.');
  for(const i of list){
    const range = await resolveClipRangeForSource(i);
    pushClipToTimeline(i, range);
  }
}

function fmtDur(sec){
  if(!sec || !isFinite(sec)) return '—';
  return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
}

function applyPreviewVolume(v){
  if(!v) return;
  const vol = Math.max(0, Math.min(1, Number(state.previewVolume ?? 1)));
  state.previewVolume = vol;
  try{
    v.volume = vol;
    v.muted = !!state.previewMuted || vol <= 0.001;
  }catch(_){}
}

function addSuggestSegmentToTimeline(si){
  const seg = (state.suggestedSegments || [])[si];
  if(!seg) throw new Error('선택한 추천 구간이 없어요.');
  const range = {
    start: Number(Number(seg.start).toFixed(1)),
    end: Number(Number(seg.end).toFixed(1)),
  };
  if(!(range.end > range.start)) throw new Error('유효하지 않은 구간이에요.');
  state.sourceMarks[seg.videoIndex] = { in: range.start, out: range.end };
  pushClipToTimeline(seg.videoIndex, range);
  // 클립에 추천 메타·대본 힌트 보관
  const clip = state.sourceEDL[state.selectedEdlIndex];
  if(clip){
    clip.line = seg.desc || '';
    clip.suggestMeta = {
      reason: seg.reason, value: seg.value, scriptTip: seg.scriptTip, nextSteps: seg.nextSteps,
    };
  }
  return clip;
}

async function generateScriptFromSuggest(si){
  const seg = (state.suggestedSegments || [])[si];
  if(!seg) throw new Error('선택한 추천 구간이 없어요.');
  const productBits = [];
  if(state.selectedCoupang?.productName) productBits.push(`상품명: ${state.selectedCoupang.productName}`);
  if(state.analysis?.summary) productBits.push(`분석요약: ${String(state.analysis.summary).slice(0,240)}`);
  const dur = Math.max(3, (seg.end - seg.start) || 15);
  const text = await callTextAi({
    system: '당신은 한국어 쇼핑 쇼츠(숏폼) 나레이션 작가입니다. 과장·허위 없이 짧고 리듬감 있게 씁니다. 대본만 출력합니다.',
    userText: `아래 영상 구간만 쓰는 ${Math.round(dur)}초 쇼핑 쇼츠 나레이션 대본을 만들어주세요.
구간: ${fmtClock(seg.start)} ~ ${fmtClock(seg.end)} (${dur.toFixed(0)}초)
장면: ${seg.desc || ''}
분리 이유: ${seg.reason || ''}
쇼츠 가치: ${seg.value || ''}
대본 가이드: ${seg.scriptTip || ''}
${productBits.length ? productBits.join('\n') : '상품 정보가 없으면 화면에서 보이는 제품/장면 기준으로 작성.'}

규칙:
- 줄바꿈으로 3~6줄 (한 줄 = 한 호흡). 구간이 짧으면 3줄, 길면 5~6줄
- 1줄: 훅 (결과·혜택·호기심)
- 중간: 사용/디테일/근거 (길이에 맞게 호흡 조절)
- 마지막 줄: CTA (장바구니·링크·구매 유도)
- 번호·따옴표·마크다운·설명 문구 없이 대사만
- 이후 수동 트리밍 또는 자동 길이 맞춤 편집을 전제로 작성`,
    maxTokens: 900,
  });
  const script = String(text || '').replace(/```[\s\S]*?```/g, m => m.replace(/```\w*/g,'').replace(/```/g,''))
    .split('\n').map(l => l.replace(/^\s*[-*\d.)]+\s*/, '').trim()).filter(Boolean).join('\n');
  if(!script) throw new Error('대본을 만들지 못했어요.');
  state.sourceScript = script;
  return script;
}

function applyScriptAsSubtitlesOnTimeline(){
  const lines = (state.sourceScript || '').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) throw new Error('대본이 없어요. 먼저 대본을 생성하세요.');
  const edl = (state.sourceEDL || []).filter(e => (e.track||1) === 1);
  if(!edl.length) throw new Error('타임라인에 클립이 없어요. 추천 구간을 먼저 넣어주세요.');
  let t = Number(state.playhead) || 0;
  state.subtitles = lines.map((text)=>{
    const start = Number(t.toFixed(2));
    const end = Number((t + DEFAULT_SUB_DURATION).toFixed(2));
    t = end;
    return { start, end, text, kind:'caption', lane:1 };
  });
  return state.subtitles;
}

/** 분석 오류 vs 소재 없음 구분용 메시지 */
function classifySuggestFailure(err){
  const raw = (err && err.message) ? String(err.message) : String(err || '');
  const s = raw.trim();
  // 이미 사용자용으로 변환된 문구는 중복 포장하지 않음
  if(/쇼츠 소재가 없는 것이 아니라|분석 요청 자체가 실패|소재 유무는 아직 확인되지|소재 유무와는 별개/.test(s)){
    return { kind: 'error', short: '분석 실패', message: s };
  }
  if(/failed to fetch|networkerror|load failed|net::|cors|econnreset|enotfound|timed?\s*out|network|gemini에 연결하지/i.test(s)){
    return {
      kind: 'error',
      short: '분석 실패 · Gemini 연결 오류',
      message: /Gemini에 연결|로컬 프록시|file:\/\//i.test(s)
        ? s
        : '영상 분석 요청 자체가 실패했어요. (쇼츠 소재가 없는 상태가 아닙니다.) Gemini 연결·API 키를 확인하고, file:// 로 연 경우 node sss-local-proxy.mjs 실행 또는 http로 다시 열어 주세요.',
    };
  }
  if(/api.?key|키가 필요|설정에서.*gemini|gemini api/i.test(s)){
    return {
      kind: 'error',
      short: '분석 실패 · API 키 필요',
      message: s.includes('키') ? s : 'Gemini API 키가 없거나 잘못되었어요. 설정에서 키를 입력한 뒤 다시 분석해 주세요. (소재 유무와는 별개입니다.)',
    };
  }
  if(/http\s*[45]\d\d|분석 실패|키프레임 분석 실패/i.test(s)){
    return {
      kind: 'error',
      short: '분석 실패 · 서버 응답 오류',
      message: `영상 분석에 실패했어요. (${s}) 잠시 후 다시 시도하거나 API 사용량을 확인해 주세요. 쇼츠 소재가 없는 것인지 아직 확인되지 않았습니다.`,
    };
  }
  if(/키프레임을 충분히|프레임 캡처/i.test(s)){
    return {
      kind: 'error',
      short: '분석 실패 · 영상 샘플 추출 오류',
      message: `${s} 다른 형식/코덱으로 다시 가져오거나, 짧은 클립으로 나눠 분석해 주세요. (소재 유무와는 별개입니다.)`,
    };
  }
  if(/해석하지|형식이 올바르지/i.test(s)){
    return {
      kind: 'error',
      short: '분석 실패 · AI 응답 해석 오류',
      message: `${s} 다시 분석을 시도해 주세요. 쇼츠 소재가 없는 것인지 아직 확인되지 않았습니다.`,
    };
  }
  return {
    kind: 'error',
    short: '분석 실패',
    message: `영상 분석에 실패했어요. ${s || '알 수 없는 오류'} — 쇼츠 소재가 없는 것이 아니라 분석이 중단된 상태입니다.`,
  };
}

function renderSuggestedSegmentsPanel(){
  const segs = state.suggestedSegments || [];
  const sum = state.suggestVideoSummary || null;
  const levelBadge = (kind, level)=>{
    const lv = level || 'mid';
    const label = kind === 'shop'
      ? ({high:'쇼핑 연결 높음', mid:'쇼핑 연결 보통', low:'쇼핑 연결 낮음'})[lv]
      : ({high:'쇼츠 컷 좋음', mid:'쇼츠 컷 보통', low:'쇼츠 컷 낮음'})[lv];
    const cls = kind === 'shop' ? `link-${lv}` : `cut-${lv}`;
    return `<span class="vp-suggest-badge ${cls}">${label || kind}</span>`;
  };
  const summaryHtml = (s, extra='')=>{
    if(!s && !extra) return '';
    return `<div class="vp-suggest-summary">
      <div class="sum-head">
        ${s?.overallStyle ? `<span class="vp-suggest-badge style">스타일 · ${escHtml(s.overallStyle)}</span>` : ''}
        ${s ? levelBadge('shop', s.shoppingLink) : ''}
        ${s ? levelBadge('cut', s.shortsCutPotential) : ''}
      </div>
      ${s?.shoppingLinkReason ? `<div class="sum-row"><b>쇼핑 연결</b> ${escHtml(s.shoppingLinkReason)}</div>` : ''}
      ${s?.shortsCutReason ? `<div class="sum-row"><b>컷 활용</b> ${escHtml(s.shortsCutReason)}</div>` : ''}
      ${s?.dialogueNote ? `<div class="sum-row"><b>대사</b> ${escHtml(s.dialogueNote)}</div>` : ''}
      ${s?.voiceNote ? `<div class="sum-row"><b>음성</b> ${escHtml(s.voiceNote)}</div>` : ''}
      ${s?.sceneNote ? `<div class="sum-row"><b>장면</b> ${escHtml(s.sceneNote)}</div>` : ''}
      ${extra || ''}
    </div>`;
  };

  if(!segs.length){
    const kind = state.suggestResultKind || (state.suggestEmptyNote ? 'empty' : '');
    if(!state.suggestEmptyNote && !kind && !sum) return '';
    const isErr = kind === 'error';
    const title = isErr ? '영상 분석 실패' : '쇼핑쇼츠 장면';
    const badge = isErr
      ? '<span class="vp-suggest-badge err">분석 실패</span>'
      : '<span class="vp-suggest-badge empty">분석 완료 · 소재 없음</span>';
    const headLine = isErr
      ? '분석이 실패했습니다'
      : '분석 완료 · 쇼츠로 쓸 장면을 추리지 못함';
    const tip = isErr
      ? '네트워크·Gemini API 키를 확인한 뒤 다시 「🔍 분석」을 눌러 주세요.'
      : '쇼핑 연결성·쇼츠 컷 매력 기준으로 쓸 만한 구간이 거의 없다고 판단됐어요. 다른 영상을 고르거나 수동으로 [ ] 구간을 지정해 보세요.';
    return `<div class="vp-suggest-wrap">
      <div class="vp-suggest-head">
        <div class="vp-panel-title">${title}</div>
        ${badge}
      </div>
      ${summaryHtml(sum)}
      <div class="vp-suggest-result ${isErr ? 'err' : 'empty'}">
        <div class="vp-suggest-result-title">${headLine}</div>
        <div>${escHtml(state.suggestEmptyNote || (isErr ? '분석 요청이 실패했습니다.' : '쇼핑 쇼츠로 연결하거나 잘라 쓸 장면을 찾지 못했어요.'))}</div>
        <div class="vp-suggest-result-tip">${tip}</div>
      </div>
    </div>`;
  }
  const vi = segs[0]?.videoIndex ?? state.activeSourceIndex ?? 0;
  const dur = state.sourceDurations?.[vi] || Math.max(...segs.map(s=>s.end||0), 1);
  const sel = state.selectedSuggestIndex;
  const cur = (sel != null && segs[sel]) ? segs[sel] : null;
  const rail = segs.map((s,i)=>{
    const left = Math.max(0, Math.min(100, (s.start / dur) * 100));
    const width = Math.max(1.2, Math.min(100 - left, ((s.end - s.start) / dur) * 100));
    return `<button type="button" class="vp-suggest-seg ${sel===i?'active':''}"
      data-play-suggest="${i}" style="left:${left}%;width:${width}%;" title="${fmtClock(s.start)}~${fmtClock(s.end)} ${escHtml(s.style||'')} ${escHtml(s.desc||'')}">${i+1}</button>`;
  }).join('');
  const list = segs.map((s,i)=>`
    <div class="vp-suggest-item ${sel===i?'active':''}" draggable="true" data-drag-suggest="${i}" data-play-suggest="${i}" title="드래그해서 타임라인에 넣기">
      <span class="idx">${i+1}</span>
      <span class="meta">
        <div class="time">${fmtClock(s.start)} ~ ${fmtClock(s.end)} · ${(s.end-s.start).toFixed(0)}초</div>
        <div class="desc" title="${escHtml(s.desc||'')}">${escHtml(s.desc || '추천 장면')}${s.itemType||s.itemName ? ' · '+escHtml([s.itemType,s.itemName].filter(Boolean).join(' ')) : ''}</div>
        <div>
          ${s.style ? `<span class="style-tag">${escHtml(s.style)}</span>` : ''}
          <span class="score-tag">쇼핑 ${Number(s.shoppingScore||0)}</span>
          <span class="score-tag cut">컷 ${Number(s.cutScore||0)}</span>
        </div>
      </span>
      <button class="vp-suggest-add" data-add-suggest="${i}" type="button" draggable="false" title="타임라인에 추가">＋</button>
      <button class="vp-suggest-playbtn" data-play-suggest="${i}" type="button" draggable="false" title="미리보기">▶</button>
    </div>`).join('');
  const detail = cur ? `
    <div class="vp-suggest-detail">
      ${cur.style ? `<div class="row"><b>스타일</b> <span class="style-tag">${escHtml(cur.style)}</span></div>` : ''}
      ${(cur.itemType||cur.itemName) ? `<div class="row"><b>상품</b> ${escHtml([cur.itemType, cur.itemName].filter(Boolean).join(' · '))}</div>` : ''}
      <div class="row"><b>점수</b> 쇼핑연결 ${Number(cur.shoppingScore||0)} · 쇼츠컷 ${Number(cur.cutScore||0)}</div>
      ${cur.dialogue ? `<div class="row"><b>대사</b> ${escHtml(cur.dialogue)}</div>` : ''}
      ${cur.voice ? `<div class="row"><b>음성</b> ${escHtml(cur.voice)}</div>` : ''}
      ${cur.hook ? `<div class="row"><b>왜 재미있나</b> ${escHtml(cur.hook)}</div>` : ''}
      <div class="row"><b>분리 이유</b> ${escHtml(cur.reason || '쇼핑 연결 또는 쇼츠로 자를 매력이 있는 구간입니다.')}</div>
      <div class="row"><b>쇼츠 가치</b> ${escHtml(cur.value || '짧은 쇼츠 소스로 활용할 수 있어요.')}</div>
      <div class="row"><b>대본 방향</b> ${escHtml(cur.scriptTip || '훅 → 디테일/감정 → CTA 순으로 구성하세요.')}</div>
      <div class="row"><b>다음 단계</b> ${escHtml(cur.nextSteps || '타임라인에 넣고 대본·자막 후 재편집하세요.')}</div>
      <div class="vp-suggest-actions">
        <button class="vp-btn primary" id="addSuggestToTimelineBtn" type="button">✂ 선택 구간만 타임라인에</button>
        <button class="vp-btn" id="genScriptForSuggestBtn" type="button">📝 이 구간 대본 생성</button>
        <button class="vp-btn" id="suggestToSubsBtn" type="button">T 대본→자막</button>
        <button class="vp-btn" id="suggestOpenTextPanelBtn" type="button">Aa 자막·폰트</button>
      </div>
      ${statusHtml('suggest-edit')}
    </div>
    <div class="vp-suggest-flow">
      <b style="color:var(--txt);">분석 목표</b> —
      <b>쇼핑 연결</b>(상품·코디로 이어지는가) +
      <b>쇼츠 컷</b>(재미있어 잘라 쓸 수 있는가). 스타일 태그를 보고 골라 편집하세요.
    </div>` : '';
  return `<div class="vp-suggest-wrap">
    <div class="vp-suggest-head">
      <div class="vp-panel-title">쇼츠 소스 장면 <span>${segs.length}개</span></div>
      <span class="vp-suggest-badge ok">세밀 분석</span>
    </div>
    ${summaryHtml(sum, '<div class="sum-row" style="margin-top:6px;">＋로 타임라인에 넣거나 카드를 끌어다 놓으세요. <b>스타일</b>·점수를 보고 고르면 됩니다.</div>')}
    <div class="vp-suggest-rail">${rail}</div>
    <div class="vp-suggest-list">${list}</div>
    ${detail}
  </div>`;
}


function renderManualAssembly(){
  const edl = state.sourceEDL || [];
  const selIdx = state.selectedEdlIndex ?? 0;
  const selected = edl[selIdx] || null;
  const totalDur = getTimelineContentDuration();
  const contentDur = totalDur;
  const v1Count = edl.filter(e=>(e.track||1)===1).length;
  const tlMode = state.tlEditMode || 'manual';
  const PPS = timelinePPS();
  const playhead = state.playhead || 0;
  const tlSize = ['sm','md','lg'].includes(state.tlSize) ? state.tlSize : 'md';
  const panel = state.nlePanel || 'media';
  const ws = state.workspace || 'edit';
  // 워크스페이스를 바꾸면 그에 맞는 인스펙터 탭이 기본으로 열립니다
  const wsDefaultTab = { edit:'clip', color:'color', audio:'audio', graphic:'sub' };
  const insp = (ws==='edit') ? (state.inspTab || 'clip') : wsDefaultTab[ws];
  const [monW, monH] = ASPECT_RATIOS[state.aspectRatio] || ASPECT_RATIOS['9:16'];
  // 실제 크기는 syncPreviewMonitorSize()가 랩 크기에 맞춰 화면비 유지로 계산
  const panelW = Math.min(680, Math.max(280, Number(state.panelW) || 400));
  const inspW = Math.min(600, Math.max(260, Number(state.inspW) || 380));

  const rulerMax = Math.max(20, Math.ceil(contentDur || 10) + (PPS < 1 ? 120 : PPS < 8 ? 30 : 15));
  const tickStep = PPS < 0.12 ? 600 : PPS < 0.35 ? 300 : PPS < 0.8 ? 120 : PPS < 1.5 ? 60
    : PPS < 3 ? 30 : PPS < 6 ? 15 : PPS < 12 ? 10 : PPS < 25 ? 5 : PPS < 50 ? 2 : 1;
  const fmtRuler = (s)=>{
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    if(h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  };
  let ruler = '';
  for(let s=0; s<=rulerMax; s+=tickStep){
    ruler += `<div class="tl-tick" style="left:${s*PPS}px;"><span>${fmtRuler(s)}</span></div>`;
  }

  // 표시 위치만 계산 — render가 EDL/자막 state를 수정하지 않음
  const clipDur = clipOutDur;
  const clipStartMap = buildClipStartMap(edl);

  const renderClipBlock = (e,i)=>{
    const dur = clipDur(e);
    const left = clipStartMap[i]*PPS, width = dur*PPS;
    const src = state.sourceVideos[e.videoIndex];
    return `<div class="vp-clip ${i===selIdx?'active':''} ${(e.track||1)>1?'overlay':''}" data-select-edl="${i}" draggable="true" data-drag-edl="${i}" style="left:${left}px; width:${width}px;" title="드래그해서 다른 영상 줄로 옮기기">
      ${src ? (src.isImage
          ? `<img class="vp-clip-thumb" src="${src.url}" alt="">`
          : `<video class="vp-clip-thumb" src="${src.url}" muted playsinline preload="metadata"></video>`) : ''}
      <div class="vp-clip-progress"></div>
      <div class="vp-clip-top"><span class="vp-clip-name">${src?src.name:'클립'}</span></div>
      ${e.waveform ? `<div class="vp-clip-wave"></div>` : ''}
      <span class="vp-clip-now"></span>
      <div class="vp-clip-bot">${dur.toFixed(1)}s${(e.speed && e.speed!==1)?` · ${(e.speed*100).toFixed(0)}%`:''}</div>
    </div>`;
  };

  const trackBlocks = t => edl.map((e,i)=> (e.track||1)===t ? renderClipBlock(e,i) : '').join('');
  const vTrackCount = visibleVideoTrackCount();
  const usedV = maxUsedVideoTrack();
  const tLaneCount = visibleSubLaneCount();
  const usedT = (state.subtitles||[]).length ? maxUsedSubLane() : 0;

  const subBlocksForLane = (lane)=>(state.subtitles||[]).map((s,i)=>{
    if((Number(s.lane)||1) !== lane) return '';
    const left=s.start*PPS, width=Math.max(28,(s.end-s.start)*PPS);
    return `<div class="vp-sub ${state.selectedSubIndex===i?'active':''}" data-select-sub="${i}" draggable="true" data-drag-sub="${i}" style="left:${left}px; width:${width}px;" title="${escHtml(s.text||'자막')} · 양끝 드래그로 길이 조절">
      <span class="vp-sub-edge left" data-sub-trim="start" data-sub-trim-i="${i}" title="시작 조절"></span>
      T${lane} ${escHtml(s.text||'자막')}
      <span class="vp-sub-edge right" data-sub-trim="end" data-sub-trim-i="${i}" title="끝 조절"></span>
    </div>`;
  }).join('');

  const videoTracksHtml = Array.from({length: vTrackCount}, (_, idx)=>{
    const n = vTrackCount - idx; // 위쪽부터 Vn … V1
    const blocks = trackBlocks(n);
    const spare = n > usedV;
    const hidden = isVideoTrackHidden(n);
    const color = VIDEO_TRACK_COLORS[(n-1) % VIDEO_TRACK_COLORS.length];
    const emptyHint = n === 1
      ? '＋ 미디어를 여기로 드래그하거나 왼쪽 ＋로 추가하세요'
      : (spare ? `＋ 여기에 드롭하면 V${n} 줄이 열립니다` : '겹쳐 넣을 클립을 드롭하세요');
    return `<div class="vp-track ${n===1?'main':''} ${spare?'spare':''}">
      <div class="vp-track-head">
        <span class="vp-track-tag" style="background:${color}">V${n}</span> ${videoTrackLabel(n)}
        ${n===1
          ? `<span class="vp-track-icons" title="메인 트랙은 항상 표시됩니다">👁</span>`
          : `<button class="vp-track-btn ${hidden?'off':''}" data-track-toggle="v${n}" type="button" title="표시/숨김">${hidden?'🚫':'👁'}</button>`}
      </div>
      <div class="vp-track-body" data-tl-drop="v:${n}" style="${hidden?'opacity:0.35;':''}">${hidden ? '' : (blocks || `<span class="vp-track-empty">${emptyHint}</span>`)}</div>
    </div>`;
  }).join('');

  const subTracksHtml = Array.from({length: tLaneCount}, (_, idx)=>{
    const lane = idx + 1;
    const blocks = subBlocksForLane(lane);
    const spare = lane > usedT;
    const hidden = isSubLaneHidden(lane);
    const color = SUB_LANE_COLORS[(lane-1) % SUB_LANE_COLORS.length];
    const emptyHint = spare
      ? `＋ 여기에 드롭·추가하면 자막 ${lane}줄이 생깁니다`
      : '자막 블록';
    return `<div class="vp-track ${spare?'spare':''}" ${lane===1?'id="vpTrackSub"':''}>
      <div class="vp-track-head">
        <span class="vp-track-tag t" style="background:${color}">T${lane}</span> 자막${lane>1?lane:''}
        <button class="vp-track-btn ${hidden?'off':''}" data-track-toggle="t${lane}" type="button" title="자막 줄 표시/숨김">${hidden?'🚫':'👁'}</button>
        <button class="vp-track-btn" data-add-sub-lane="${lane}" type="button" title="이 줄에 자막 추가">＋</button>
      </div>
      <div class="vp-track-body" data-tl-drop="t:${lane}" style="${hidden?'opacity:0.35;':''}">${hidden ? '' : (blocks || `<span class="vp-track-empty">${emptyHint}</span>`)}</div>
    </div>`;
  }).join('');

  const fmtTC = sec => `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec/60)%60).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}:${String(Math.floor((sec%1)*24)).padStart(2,'0')}`;

  const navBtn = (id,icon,label)=>`<button class="vp-nav-btn ${panel===id?'active':''}" data-nle-panel="${id}" type="button"><span>${icon}</span>${label}</button>`;
  const tabBtn = (id,label)=>`<button class="vp-tab ${insp===id?'active':''}" data-insp-tab="${id}" type="button">${label}</button>`;
  // 슬라이더 + 숫자 입력창(스피너) 콤보 — 전문가용 편집 툴처럼 값을 직접 타이핑할 수 있게
  const sn = (id, value, min, max, step, opts={})=>{
    const dec = opts.decimals ?? (step < 1 ? 2 : 0);
    const shown = opts.display ? opts.display(Number(value)) : Number(value).toFixed(dec);
    const dis = opts.disabled ? 'disabled' : '';
    return `<div class="vp-sn">
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" ${dis}>
      <input type="number" id="${id}Num" data-pair="${id}" data-decimals="${dec}" min="${min}" max="${max}" step="${step}" value="${shown}" ${dis}>
      ${opts.suffix ? `<span class="vp-sn-suffix">${opts.suffix}</span>` : ''}
    </div>`;
  };
  // 접기/펼치기 가능한 속성 섹션 헤더
  const collapsed = (key)=> !!(state.inspCollapse && state.inspCollapse[key]);
  const grp = (key,label,extraHtml='')=>`<div class="vp-insp-group vp-insp-group-toggle" data-insp-toggle="${key}">
      <span class="vp-grp-chev">${collapsed(key)?'▶':'▼'}</span>${label}${extraHtml}
    </div>`;
  const bodyOpen = (key)=> `<div class="vp-insp-body-collapsible"${collapsed(key)?' style="display:none;"':''}>`;
  const bodyClose = `</div>`;
  // 자막/타이틀 스타일 편집 UI — target: 'sub'(본문 자막) | 'title'(타이틀)
  const styleEditorHtml = (target)=>{
    const st = target==='sub' ? state.subStyle : state.titleStyle;
    const ff = st.fontFamily || 'Noto Sans KR';
    const activeKey = matchStylePresetKey(st);
    return `
      <div class="vp-insp-section">쇼츠 스타일 선택</div>
      <div class="vp-style-grid">
        ${Object.entries(TEXT_STYLE_PRESETS).map(([key,p])=>{
          const swBg = p.bg ? p.bgColor : '#1B2436';
          const shadow = p.glow
            ? `0 0 8px ${p.outline}, 0 0 2px ${p.outline}`
            : (p.outlineWidth ? `0 0 ${Math.max(1,p.outlineWidth)}px ${p.outline}` : 'none');
          return `<button class="vp-style-card ${activeKey===key?'active':''}" data-style-preset="${key}" data-style-target="${target}" type="button" title="${p.label}">
            <span class="swatch" style="background:${swBg}; color:${p.color}; font-family:${fontCss(p.fontFamily)}; font-weight:${p.bold?800:500}; text-shadow:${shadow};">가나다</span>
            <span class="lbl">${p.label}${p.bg?' · 배경':''}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="vp-insp-section">직접 조정</div>
      <div class="vp-row"><label>폰트</label>
        <select data-style-target="${target}" data-style-prop="fontFamily">
          ${SUB_FONTS.map(f=>`<option value="${f.id}" ${ff===f.id?'selected':''} style="font-family:${f.css}">${f.id}</option>`).join('')}
        </select>
      </div>
      <div class="vp-row"><label id="styleFontSizeLabel">크기 ${st.fontSize}px</label>
        <input type="range" data-style-target="${target}" data-style-prop="fontSize" min="10" max="72" value="${st.fontSize}"></div>
      <div class="vp-row2">
        <div><label>글자색</label><input type="color" data-style-target="${target}" data-style-prop="color" value="${st.color}"></div>
        <div><label>외곽선색</label><input type="color" data-style-target="${target}" data-style-prop="outline" value="${st.outline}"></div>
      </div>
      <div class="vp-row"><label id="styleOutlineLabel">외곽선 두께 ${st.outlineWidth}px</label>
        <input type="range" data-style-target="${target}" data-style-prop="outlineWidth" min="0" max="8" value="${st.outlineWidth}"></div>
      <div class="vp-row2">
        <div><label>굵기</label><select data-style-target="${target}" data-style-prop="bold">
          <option value="1" ${st.bold?'selected':''}>굵게</option>
          <option value="0" ${!st.bold?'selected':''}>보통</option></select></div>
        <div><label>기본 위치</label><select data-style-target="${target}" data-style-prop="position">
          <option value="bottom" ${st.position==='bottom'?'selected':''}>하단</option>
          <option value="middle" ${st.position==='middle'?'selected':''}>중앙</option>
          <option value="top" ${st.position==='top'?'selected':''}>상단</option></select></div>
      </div>
      <label class="vp-check"><input type="checkbox" data-style-target="${target}" data-style-prop="bg" ${st.bg?'checked':''}> 배경색 넣기</label>
      ${st.bg ? `<div class="vp-row" style="margin-top:8px;"><label>배경색</label><input type="color" data-style-target="${target}" data-style-prop="bgColor" value="${st.bgColor}"></div>` : ''}
      <label class="vp-check"><input type="checkbox" data-style-target="${target}" data-style-prop="glow" ${st.glow?'checked':''}> 네온 글로우</label>
      <div class="vp-insp-note" style="margin-top:8px;">프리셋을 고르거나, 위 텍스트칸·미리보기 더블클릭으로 직접 수정하세요. 테두리는 글자에 맞춰집니다.</div>`;
  };
  const clipXformCss = (c)=>{
    // 레거시 호환 — 변환은 vp-media-layer에 적용

    return '';
  };

  const tlHCustom = Number.isFinite(Number(state.tlPanelH)) && Number(state.tlPanelH) > 0;

  return `

      <button class="vp-back" data-nav="home" type="button" title="다른 단계로 이동">☰</button>
      <div class="vp-brand"><span class="vp-logo">V</span> Shorts Studio</div>
      <div class="vp-proj">
        <input type="text" id="projectName" value="${state.projectName}" title="프로젝트 이름">

        <span class="vp-next">${studioNextHint()}</span>
      </div>
      <div class="vp-header-right">
        <div class="vp-steps-mini">
          ${STEPS.filter(s=>s.id!=='studio').map(s=>`

        </div>
        <span class="vp-toolrow-sep"></span>
        <button class="vp-btn ghost" id="nleAddFileBtn" type="button">⬇ 가져오기</button>
        <button class="vp-btn primary" id="assembleSourceVideosBtn" type="button" ${!edl.length?'disabled':''}>⬆ 내보내기</button>
        ${state.sourceAssembledUrl ? `<a class="vp-btn primary" style="background:#0F9D58;" href="${state.sourceAssembledUrl}" download="${(state.projectName||'shorts').replace(/[^\w가-힣-]/g,'_')}.mp4">💾 MP4 다운로드</a>` : ''}
      </div>
    </div>

    <!-- ===== 본문: 레일 | 패널 | 리사이저 | 미리보기 | 리사이저 | 속성 ===== -->
    <div class="vp-body" style="--vp-panel-w:${panelW}px; --vp-insp-w:${inspW}px;">
      <!-- 좌측 아이콘 레일 -->
      <div class="vp-rail">
        ${navBtn('media','🎞','미디어')}
        ${navBtn('ai','✨','AI생성')}
        ${navBtn('text','T','자막')}
        ${navBtn('audio','♪','오디오')}
        ${navBtn('script','📝','대본')}
      </div>

      <!-- 좌측 패널 -->
      <div class="vp-panel">
        ${panel==='media' ? `
          <div class="vp-drop" id="vpDropZone">
            <button class="vp-btn primary block" id="nleAddFileBtn2" type="button" style="margin:0;">⬇ 영상·이미지 불러오기</button>
          </div>
          <input type="file" id="sourceVideoInput" accept="video/*,image/*" multiple style="display:none;">

          <div class="vp-panel-title" style="margin-top:10px;"><div>클립 <span>${state.sourceVideos.length}/${MAX_SOURCE_VIDEOS}</span></div>
            <div style="display:flex;gap:4px;align-items:center;">
              ${state.sourceVideos.length ? `<button class="vp-mini go" id="addAllToTimelineBtn" type="button" title="전체 순서대로 타임라인에 추가">전체＋</button>` : ''}
              ${(state.selectedSourceIndices||[]).length ? `<button class="vp-mini" id="addSelectedToTimelineBtn" type="button" title="선택 항목 추가">선택＋</button>` : ''}
              ${state.sourceVideos.length ? `<button class="vp-mini" id="selectAllSourceBtn" type="button">${(state.selectedSourceIndices||[]).length===state.sourceVideos.length?'해제':'전체'}</button>` : ''}
            </div>
          </div>
          ${(state.selectedSourceIndices||[]).length ? `
            <button class="vp-btn primary block" id="selectedAutoEditBtn" type="button" style="margin-bottom:8px;">🤖 선택 ${state.selectedSourceIndices.length}개 자동 편집</button>
            ${statusHtml('selected-auto')}
          ` : ''}
          <div class="vp-media-grid">
            ${state.sourceVideos.length ? state.sourceVideos.map((v,i)=>{
              const m=state.sourceMarks?.[i]||{};
              const ready=m.in!=null&&m.out!=null&&m.out>m.in;
              const dur=state.sourceDurations?.[i];
              const picked = (state.selectedSourceIndices||[]).includes(i);
              return `<div class="vp-media ${state.activeSourceIndex===i?'active':''} ${i<MAX_AI_ANALYZE?'ai-ok':''}" data-activate-source="${i}" draggable="true" data-drag-source="${i}" title="드래그해서 타임라인에 넣기">
                ${i<MAX_AI_ANALYZE?`<span class="vp-ai-tag" title="AI 자동 분석 대상">AI</span>`:''}
                <label class="vp-media-check" title="여러 개 선택">
                  <input type="checkbox" data-select-source="${i}" ${picked?'checked':''}>
                </label>
                <div class="vp-media-thumb">${v.isImage
                    ? `<img src="${v.url}" alt="${v.name}">`
                    : `<video src="${v.url}" muted playsinline preload="metadata" data-source-video="${i}" data-dur-index="${i}"></video>`}
                  <span class="vp-media-badge">${v.isImage ? 'IMG' : (dur?fmtDur(dur):'…')}</span>
                  ${ready?`<span class="vp-media-badge sel">✂ ${(m.out-m.in).toFixed(1)}s</span>`:''}
                  <button class="vp-media-add" data-add-to-timeline="${i}" type="button" draggable="false" title="타임라인에 추가">＋</button>
                </div>
                <div class="vp-media-name" title="${v.name}">${i+1}. ${v.name}</div>
                <div class="vp-media-tools">
                  ${v.isImage ? '' : `
                    <button class="vp-mini" data-mark-in="${i}" type="button" title="시작점">[</button>
                    <button class="vp-mini" data-mark-out="${i}" type="button" title="끝점">]</button>
                  `}
                  <button class="vp-mini" data-remove-source-video="${i}" type="button" title="제거">✕</button>
                </div>
              </div>`;
            }).join('') : `<div class="vp-empty">아직 영상이 없어요<br><small>최대 ${MAX_SOURCE_VIDEOS}개</small></div>`}
          </div>
          ${state.sourceVideos.length ? `
            <div class="vp-sep"></div>
            <div class="vp-grid2">
              <button class="vp-btn tool block" id="previewSourceBtn" type="button" style="margin:0;" title="소스 모니터에서 미리보기"><span class="vp-btn-ic">▶</span>소스</button>
              <button class="vp-btn tool accent block" id="analyzeSuggestBtn" type="button" style="margin:0;" title="쇼핑쇼츠 구간 분석"><span class="vp-btn-ic">🔍</span>분석</button>
            </div>
            ${statusHtml('suggest-analyze')}
            ${statusHtml('timeline-add')}
            ${renderSuggestedSegmentsPanel()}
          ` : ''}
        ` : ''}

        ${panel==='ai' ? `
          <div class="vp-panel-title">AI 자동 편집</div>
          <button class="vp-btn primary block" id="nleAutoEditBtn" type="button" ${!state.sourceVideos.length?'disabled':''}>🤖 대본 맞춰 자동 편집</button>

          ${statusHtml('source-analyze')}
          <div class="vp-sep"></div>
          <div class="vp-panel-title">영상화 (씬 이미지 → 영상 클립)</div>
          ${!state.sceneImages.length ? `
            <div class="vp-hint">6단계에서 씬 이미지를 먼저 만들어주세요.</div>
            <button class="vp-btn block" data-nav="images" type="button">← 씬 이미지로</button>
          ` : `
            <button class="vp-btn block" id="videoBtn" type="button">씬 이미지 → 영상 클립</button>
            ${statusHtml('video')}
            ${state.clips.length?`
              <button class="vp-btn primary block" id="pushClipsAuto" type="button" style="margin-top:6px;">🤖 자동 배치</button>
              <button class="vp-btn block" id="pushClipsManual" type="button" style="margin-top:6px;">✍️ 수동 배치(소재함에만 추가)</button>
            `:''}
          `}
          <div class="vp-sep"></div>
          <div class="vp-panel-title">AI 나레이션</div>
          ${state.keys.googleTtsApiKey?`<select id="googleVoiceSelectVoiceStep">${(state.googleTtsVoiceList||DEFAULT_GOOGLE_VOICES).map(v=>`<option value="${v.name}" ${state.keys.googleTtsVoice===v.name?'selected':''}>${v.name} (${v.gender})</option>`).join('')}</select>`:''}
          ${state.keys.typecastVoices.length?`<select id="typecastVoiceSelect">${state.keys.typecastVoices.map(v=>`<option value="${v.id}" ${resolveTypecastVoiceId()===v.id?'selected':''}>${v.label||v.id}</option>`).join('')}</select>`:''}
          <button class="vp-btn block" id="voiceBtn" type="button">🎙 음성 생성</button>
          ${statusHtml('voice')}
        ` : ''}

        ${panel==='text' ? `
          <div class="vp-panel-title">자막 <span>${state.subtitles?.length||0}개</span></div>
          <div class="vp-grid2">
            <button class="vp-btn primary" id="addSubtitleRowBtn" type="button">＋ 자막 추가</button>
            <button class="vp-btn" id="addTitleRowBtn" type="button" style="background:#FFF6D8; color:#7A5B00; border-color:#F3D98B;">🔥 ＋ 타이틀 추가</button>
            <button class="vp-btn" id="autoSubtitleBtn" type="button" ${!state.voiceUrl?'disabled':''}>🎤 음성 분석</button>
            <button class="vp-btn" id="subFromScriptBtn" type="button" ${!state.sourceScript?'disabled':''}>📝 대본에서</button>
            <button class="vp-btn" id="importSrtBtnTrigger" type="button">📂 불러오기</button>
          </div>
          <input type="file" id="importSrtFile" accept=".srt,text/plain" style="display:none;">
          ${statusHtml('subtitle-io')}
          <div class="vp-hint">텍스트를 입력·붙여넣기하세요. 색·폰트·크기는 우측 <b>그래픽</b> 탭에서, 미리보기에서 드래그로 위치를 옮길 수 있어요.</div>
          <div class="vp-sub-list">
            ${state.subtitles?.length ? state.subtitles.map((s,i)=>`
              <div class="vp-sub-item ${state.selectedSubIndex===i?'active':''} ${s.kind==='title'?'is-title':''}" data-select-sub="${i}">
                <div class="vp-sub-head">
                  <span class="vp-sub-no">${i+1}</span>
                  <button class="vp-sub-kind" data-toggle-sub-kind="${i}" type="button" title="자막↔타이틀 전환">${s.kind==='title'?'🔥 타이틀':'💬 자막'}</button>
                  <span class="vp-sub-no" title="타임라인 자막 줄">T${s.lane||1}</span>
                  <input type="text" data-sub-start="${i}" value="${s.start.toFixed(1)}">
                  <span>~</span>
                  <input type="text" data-sub-end="${i}" value="${s.end.toFixed(1)}">
                  <button class="vp-mini" data-remove-subtitle="${i}" type="button">✕</button>
                </div>
                <textarea data-sub-text="${i}" rows="2" placeholder="자막 입력">${s.text}</textarea>
              </div>`).join('') : `<div class="vp-empty">자막이 없어요</div>`}
          </div>
          <button class="vp-btn block" id="downloadSrtBtn" type="button" ${!state.subtitles?.length?'disabled':''}>💾 .srt 저장</button>
        ` : ''}

        ${panel==='audio' ? `
          <div class="vp-panel-title">배경음악</div>
          <input type="file" id="sourceBgmInput" accept="audio/*">
          ${state.sourceBgm?`<div class="vp-ok">✓ ${state.sourceBgm.name}</div>`:''}
          ${state.sfxBedUrl?`<div class="vp-ok" style="margin-top:8px;">✓ 자동 효과음 ${(state.sfxClips||[]).length}개
            <audio controls src="${state.sfxBedUrl}" style="width:100%; margin-top:6px;"></audio>
            <label class="vp-check" style="margin-top:6px;"><input type="checkbox" id="toggleAutoSfx" ${state.autoSfx!==false?'checked':''}> 내보내기에 효과음 포함</label>
          </div>`:''}
          <div class="vp-sep"></div>
          <div class="vp-panel-title">나레이션 (직접 녹음)</div>
          <input type="file" id="voiceFileInput" accept="audio/*">
          ${state.voiceUrl?`<audio controls src="${state.voiceUrl}" style="width:100%; margin-top:10px;"></audio>`:''}
          <div class="vp-hint">AI 음성은 ✨AI생성 탭에서 만들 수 있어요.</div>
        ` : ''}

        ${panel==='script' ? `
          <div class="vp-panel-title">대본</div>
          <textarea id="sourceScriptInput" rows="12" placeholder="줄바꿈으로 장면을 구분하세요">${state.sourceScript}</textarea>
          <div class="vp-panel-title" style="margin-top:14px;">목표 길이</div>
          <input type="text" id="sourceTargetDuration" value="${state.sourceTargetDuration}" style="max-width:110px;"> <span class="vp-hint" style="display:inline;">초</span>
        ` : ''}
      </div>

      <div class="vp-resizer" data-vp-resize="panel" title="미디어 칸 폭 조절"></div>

      <!-- 중앙 프리뷰 (편집바는 본문 아래 풀폭) -->
      <div class="vp-stage">
        ${(()=>{
          const prev = resolveProgramPreview(edl, selected);
          const head = state.sourceAssembledUrl
            ? `<span class="vp-chip done">✓ 완성본</span>
               <a class="vp-mini primary-dl" href="${state.sourceAssembledUrl}" download="${(state.projectName||'shorts').replace(/[^\\w가-힣-]/g,'_')}.mp4">💾 MP4 다운로드</a>
               <button class="vp-mini" id="backToEditPreview" type="button">편집으로</button>`
            : prev.kind==='source'
              ? `<span class="vp-chip">소스 모니터 · ${prev.index+1}번</span>
                 <button class="vp-mini" id="backToTimelinePreview" type="button">타임라인 보기로</button>`
              : prev.kind==='clip'
                ? `<span class="vp-chip">프로그램 · 클립 ${(state.selectedEdlIndex??0)+1} · ${prev.clip.start}s~${prev.clip.end}s</span>`
                : `<span class="vp-chip dim">타임라인 비어 있음</span>`;
          const xfLive = (prev.kind==='source' || prev.kind==='clip') ? getActiveXform() : null;
          const canMouseXform = !!(xfLive && state.workspace !== 'graphic' && state.nlePanel !== 'text' && insp !== 'sub');
          let mediaInner = '';
          if(prev.kind==='assembled'){
            mediaInner = `<video id="nlePreviewVideo" src="${prev.url}" playsinline webkit-playsinline preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture></video>`;
          }else if(prev.kind==='source'){
            mediaInner = prev.src.isImage
              ? `<img src="${prev.src.url}" alt="소스 미리보기">`
              : `<video id="nlePreviewVideo" playsinline webkit-playsinline preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture src="${prev.src.url}" data-source-video="${prev.index}"></video>`;
          }else if(prev.kind==='clip'){
            mediaInner = prev.src.isImage
              ? `<img src="${prev.src.url}" alt="클립 미리보기">`
              : `<video id="nlePreviewVideo" playsinline webkit-playsinline preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture src="${prev.src.url}" data-clip-start="${prev.clip.start}" data-clip-end="${prev.clip.end}"></video>`;
          }else{
            mediaInner = `<div class="vp-empty">타임라인에 클립을 추가하세요</div>`;
          }
          const handles = canMouseXform ? `
            <span class="vp-media-handle nw" data-vxf="nw" title="크기"></span>
            <span class="vp-media-handle ne" data-vxf="ne" title="크기"></span>
            <span class="vp-media-handle sw" data-vxf="sw" title="크기"></span>
            <span class="vp-media-handle se" data-vxf="se" title="크기"></span>
            <span class="vp-media-handle n" data-vxf="n" title="세로"></span>
            <span class="vp-media-handle s" data-vxf="s" title="세로"></span>
            <span class="vp-media-handle e" data-vxf="e" title="가로"></span>
            <span class="vp-media-handle w" data-vxf="w" title="가로"></span>` : '';
          const media = (prev.kind==='source' || prev.kind==='clip')
            ? `<div class="vp-media-layer ${canMouseXform?'editable':''}" id="vpMediaLayer" data-video-xform="1" style="${clipXformStyleAttr(xfLive)}" title="${canMouseXform?'드래그: 이동 · 모서리/변: 비율·크기':''}">${mediaInner}${handles}</div>`
            : mediaInner;
          return `
        <div class="vp-stage-head">${head}</div>
        <div class="vp-monitor-wrap" style="--vp-ar-w:${monW};--vp-ar-h:${monH};" title="화면비 ${state.aspectRatio||'9:16'}">
          <div class="vp-monitor" style="--vp-ar-w:${monW};--vp-ar-h:${monH};aspect-ratio:${monW}/${monH};">
            ${media}
            ${buildCaptionOverlayHtml()}
          </div>
        </div>
        <div class="vp-stage-status">${statusHtml('source-assemble')}</div>`;
        })()}
      </div>

      <div class="vp-resizer" data-vp-resize="insp" title="속성 칸 폭 조절"></div>

      <!-- 우측 속성 -->
      <div class="vp-inspector">
        <div class="vp-ws vp-ws-insp">
          ${[['edit','편집'],['color','색보정'],['audio','오디오'],['graphic','그래픽']].map(([id,label])=>
            `<button class="vp-ws-tab ${(state.workspace||'edit')===id?'active':''}" data-workspace="${id}" type="button">${label}</button>`
          ).join('')}
        </div>
        <div class="vp-insp-tabs">${
          ws==='color' ? tabBtn('color','색보정')
          : ws==='audio' ? tabBtn('audio','오디오')
          : ws==='graphic' ? tabBtn('sub','자막 스타일')
          : `${tabBtn('clip','클립')}${tabBtn('sub','자막')}${tabBtn('audio','오디오')}`
        }</div>
        <div class="vp-insp-body">
          ${insp==='clip' ? (selected ? `
            <div class="vp-insp-file">${state.sourceVideos[selected.videoIndex]?.isImage?'🖼':'🎬'} ${state.sourceVideos[selected.videoIndex]?.name||'클립'}</div>

            <div class="vp-insp-group">기본</div>
            <div class="vp-row"><label>클립 메모</label><input type="text" id="inspLine" value="${selected.line}" title="클립 메모만 저장합니다. 자막 트랙과는 별개입니다."></div>
            <div class="vp-row"><label>소스</label>
              <select id="inspVideo">${state.sourceVideos.map((v,vi)=>`<option value="${vi}" ${selected.videoIndex===vi?'selected':''}>${vi+1}. ${v.name}</option>`).join('')}</select></div>
            <div class="vp-row2">
              <div><label>시작(초)</label><input type="text" id="inspStart" value="${selected.start}"></div>
              <div><label>끝(초)</label><input type="text" id="inspEnd" value="${selected.end}"></div>
            </div>
            <div class="vp-insp-note">길이 ${(Math.max(0.5,selected.end-selected.start)).toFixed(1)}초 · 출력 ${((selected.end-selected.start)/(selected.speed||1)).toFixed(1)}초</div>

            <div class="vp-insp-group">트랙 · 위치</div>
            <div class="vp-row2">
              <div><label>트랙</label>
                <select id="inspTrack">
                  ${Array.from({length: Math.min(MAX_VIDEO_TRACKS, Math.max(visibleVideoTrackCount(), selected.track||1))}, (_,i)=>{
                    const n = i+1;
                    return `<option value="${n}" ${(selected.track||1)===n?'selected':''}>V${n} ${videoTrackLabel(n)}</option>`;
                  }).join('')}
                </select></div>
              <div><label>시작 위치(초)</label>
                <input type="text" id="inspAt" value="${selected.at ?? (clipStartMap[selIdx] ?? 0)}" ${(selected.track||1)===1 && !isTlManual()?'disabled title="자동 모드에서는 영상만 순차 표시(저장 위치는 수동·붙이기로 설정)"':''}></div>
            </div>
            ${(selected.track||1)>1 ? `
              <div class="vp-row2">
                <div><label>크기 <b>${Math.round((selected.ovScale??0.4)*100)}%</b></label>
                  <input type="range" id="inspOvScale" min="0.15" max="1" step="0.05" value="${selected.ovScale??0.4}"></div>
                <div><label>위치</label>
                  <select id="inspOvPos">
                    <option value="tr" ${(selected.ovPos??'tr')==='tr'?'selected':''}>우측 상단</option>
                    <option value="tl" ${selected.ovPos==='tl'?'selected':''}>좌측 상단</option>
                    <option value="br" ${selected.ovPos==='br'?'selected':''}>우측 하단</option>
                    <option value="bl" ${selected.ovPos==='bl'?'selected':''}>좌측 하단</option>
                    <option value="c" ${selected.ovPos==='c'?'selected':''}>가운데</option>
                    <option value="full" ${selected.ovPos==='full'?'selected':''}>전체 덮기</option>
                  </select></div>
              </div>` : ''}

            ${grp('xform','변환')}
            ${bodyOpen('xform')}
            <div class="vp-insp-note" style="margin-top:0;margin-bottom:8px;">미리보기에서 영상을 드래그해 옮기고, 모서리·변 핸들로 크기를 조절하세요.</div>

              <div><label>위치 X</label>${sn('inspTx', selected.tx??0, -50, 50, 1, {suffix:'%'})}</div>

            </div>
            <div class="vp-row2">
              <div><label>W</label>${sn('inspScaleX', selected.scaleX??100, 10, 300, 1, {suffix:'%'})}</div>

            <div class="vp-row"><label>불투명도</label>${sn('inspOpacity', Math.round((selected.opacity??1)*100), 0, 100, 1, {suffix:'%'})}</div>
            ${(selected.tx||selected.ty||(selected.scaleX&&selected.scaleX!==100)||(selected.scaleY&&selected.scaleY!==100)||selected.rotation||(selected.opacity!=null&&selected.opacity!==1)) ? `<button class="vp-btn block" id="inspResetXform" type="button">↺ 변환 초기화</button>` : ''}
            ${bodyClose}

            ${grp('color','색상', `<button class="vp-mini" id="inspAutoColor" type="button" style="margin-left:auto;">자동 보정</button>`)}
            ${bodyOpen('color')}
            <div class="vp-row"><label>노출</label>${sn('inspBrightness', selected.brightness??0, -0.3, 0.3, 0.01)}</div>
            <div class="vp-row"><label>대비</label>${sn('inspContrast', selected.contrast??1, 0.5, 1.8, 0.05)}</div>
            <div class="vp-row"><label>채도</label>${sn('inspSaturation', selected.saturation??1, 0, 2.5, 0.05)}</div>
            <div class="vp-row"><label>온도</label>${sn('inspTemp', selected.temp??0, -0.3, 0.3, 0.01)}</div>
            <div class="vp-row"><label>틴트</label>${sn('inspTint', selected.tint??0, -0.3, 0.3, 0.01)}</div>
            <button class="vp-btn block" id="inspResetColor" type="button">초기화</button>
            ${bodyClose}

            ${grp('speed','속도')}
            ${bodyOpen('speed')}
            <div class="vp-row"><label>재생 속도</label>${sn('inspSpeed', Math.round((selected.speed||1)*100), 50, 200, 5, {suffix:'%'})}</div>
            ${bodyClose}

            ${grp('audio','오디오')}
            ${bodyOpen('audio')}
            <div class="vp-row"><label>볼륨(원본 소리)</label>${sn('inspClipVol', ratioToDb(selected.volume??0), -40, 12, 0.5, {suffix:'dB', display:v=> v<=-39.5 ? '-∞' : v.toFixed(1)})}</div>
            <label class="vp-check"><input type="checkbox" id="inspWaveform" ${selected.waveform?'checked':''}> 오디오 웨이브 표시</label>
            <div class="vp-insp-note">-∞dB면 원본 소리는 빠지고 나레이션·배경음악만 재생돼요.</div>
            ${bodyClose}

            ${grp('transition','전환')}
            ${bodyOpen('transition')}
            <label class="vp-check"><input type="checkbox" id="inspFadeIn" ${selected.fadeIn?'checked':''}> 시작할 때 서서히 나타나기</label>
            <label class="vp-check"><input type="checkbox" id="inspFadeOut" ${selected.fadeOut?'checked':''}> 끝날 때 서서히 사라지기</label>
            ${bodyClose}

            <button class="vp-btn block" id="inspResetClip" type="button" style="margin-top:14px;">↺ 이 클립 효과 전체 초기화</button>
          ` : `<div class="vp-empty">타임라인에서 클립을 선택하세요</div>`) : ''}

          ${insp==='color' ? (selected ? `
            <div class="vp-insp-file">🎨 ${state.sourceVideos[selected.videoIndex]?.name||'클립'}</div>
            <div class="vp-insp-group" style="display:flex; align-items:center;">기본 보정<button class="vp-mini" id="inspAutoColor" type="button" style="margin-left:auto;">자동 보정</button></div>
            <div class="vp-row"><label>노출(밝기)</label>${sn('inspBrightness', selected.brightness??0, -0.3, 0.3, 0.01)}</div>
            <div class="vp-row"><label>대비</label>${sn('inspContrast', selected.contrast??1, 0.5, 1.8, 0.05)}</div>
            <div class="vp-row"><label>채도</label>${sn('inspSaturation', selected.saturation??1, 0, 2.5, 0.05)}</div>
            <div class="vp-row"><label>감마</label>${sn('inspGamma', selected.gamma??1, 0.5, 1.8, 0.05)}</div>

            <div class="vp-insp-group">색온도 / 틴트</div>
            <div class="vp-row"><label>따뜻하게 / 차갑게</label>${sn('inspTemp', selected.temp??0, -0.3, 0.3, 0.01)}</div>
            <div class="vp-row"><label>틴트(녹색/보라)</label>${sn('inspTint', selected.tint??0, -0.3, 0.3, 0.01)}</div>
            <button class="vp-btn block" id="inspResetColor" type="button" style="margin-top:4px;">초기화</button>

            <div class="vp-insp-group">프리셋</div>
            <div class="vp-grid2">
              <button class="vp-btn" data-color-preset="none" type="button">원본</button>
              <button class="vp-btn" data-color-preset="vivid" type="button">선명하게</button>
              <button class="vp-btn" data-color-preset="warm" type="button">따뜻하게</button>
              <button class="vp-btn" data-color-preset="cool" type="button">차갑게</button>
              <button class="vp-btn" data-color-preset="bright" type="button">밝게</button>
              <button class="vp-btn" data-color-preset="film" type="button">필름톤</button>
            </div>
            <button class="vp-btn block" id="applyColorAll" type="button" style="margin-top:12px;">전체 클립에 이 보정 적용</button>
          ` : `<div class="vp-empty">타임라인에서 클립을 선택하세요</div>`) : ''}

          ${insp==='sub' ? (()=>{
            if(!state.subtitles) state.subtitles = [];
            const subs = state.subtitles;
            if(state.selectedSubIndex == null && subs.length) state.selectedSubIndex = 0;
            const si = state.selectedSubIndex;
            const cur = (si != null) ? subs[si] : null;
            if(cur) state.subStyleTarget = cur.kind === 'title' ? 'title' : 'sub';
            const target = state.subStyleTarget || 'sub';
            const stCur = target === 'title' ? state.titleStyle : state.subStyle;
            const posCur = cur ? resolveCaptionPos(cur, stCur) : defaultCaptionPos(stCur.position || 'bottom');
            const chips = subs.length ? `<div class="vp-sub-chip-row">${subs.map((s,i)=>`
              <button type="button" class="vp-sub-chip ${si===i?'active':''}" data-select-sub="${i}" title="${escHtml(s.text||'빈 자막')}">${i+1}. ${escHtml((s.text||'(빈 자막)').slice(0,18))}</button>
            `).join('')}</div>` : '';
            return `
            <div class="vp-insp-section">자막 내용</div>
            <div class="vp-grid2" style="margin-bottom:8px;">
              <button class="vp-btn primary" id="inspAddSubBtn" type="button">＋ 자막</button>
              <button class="vp-btn" id="inspAddTitleBtn" type="button" style="background:#FFF6D8; color:#7A5B00; border-color:#F3D98B;">＋ 타이틀</button>
            </div>
            ${chips}
            ${cur ? `
              <div class="vp-row2">
                <div><label>시작(초)</label><input type="number" id="inspSubStart" step="0.1" min="0" value="${Number(cur.start).toFixed(1)}"></div>
                <div><label>끝(초)</label><input type="number" id="inspSubEnd" step="0.1" min="0" value="${Number(cur.end).toFixed(1)}"></div>
              </div>
              <div class="vp-row"><label>자막 줄 (T)</label>
                <select id="inspSubLane">
                  ${Array.from({length: Math.min(MAX_SUB_LANES, Math.max(visibleSubLaneCount(), cur.lane||1))}, (_,i)=>{
                    const n = i+1;
                    return `<option value="${n}" ${(Number(cur.lane)||1)===n?'selected':''}>T${n}${n>maxUsedSubLane()?' (새 줄)':''}</option>`;
                  }).join('')}
                </select>
              </div>
              <div class="vp-row" style="margin-bottom:6px;">
                <label>텍스트 (직접 입력 · 붙여넣기)</label>
                <textarea id="inspSubText" rows="4" placeholder="여기에 자막을 입력하거나 붙여넣으세요">${escHtml(cur.text||'')}</textarea>
              </div>
              <div class="vp-insp-section">화면 위치</div>
              <div class="vp-row"><label id="inspSubXLabel">좌우 ${Math.round(posCur.x)}%</label>
                <input type="range" id="inspSubX" min="4" max="96" step="1" value="${Math.round(posCur.x)}"></div>
              <div class="vp-row"><label id="inspSubYLabel">상하 ${Math.round(posCur.y)}%</label>
                <input type="range" id="inspSubY" min="4" max="96" step="1" value="${Math.round(posCur.y)}"></div>
              <button class="vp-btn block" id="inspSubPosReset" type="button" style="margin-bottom:8px;">↺ 위치 초기화</button>
              <div class="vp-insp-note" style="margin-top:0;margin-bottom:10px;">미리보기에서 자막을 드래그해도 위치가 바뀝니다.</div>
              <div class="vp-grid2" style="margin-bottom:8px;">
                <button class="vp-mini" id="inspSubKindToggle" type="button">${cur.kind==='title'?'🔥 타이틀 → 자막':'💬 자막 → 타이틀'}</button>
                <button class="vp-mini" id="inspSubDelete" type="button">✕ 삭제</button>
              </div>
            ` : `<div class="vp-empty" style="margin-bottom:10px;">자막이 없어요. 위에서 추가하거나 왼쪽 T 자막 패널에서 불러오세요.</div>`}
            <div class="vp-tabs-mini" style="display:flex; gap:4px; background:#EDF2FB; border-radius:9px; padding:3px; margin-bottom:8px;">
              <button class="vp-mini ${target==='sub'?'active':''}" data-sub-style-target="sub" type="button" style="flex:1;">💬 본문 스타일</button>
              <button class="vp-mini ${target==='title'?'active':''}" data-sub-style-target="title" type="button" style="flex:1;">🔥 타이틀 스타일</button>
            </div>
            ${styleEditorHtml(target)}
            <label class="vp-check" style="margin-top:14px;"><input type="checkbox" id="burnSubtitles" ${state.burnSubtitles?'checked':''}> 내보내기 때 영상에 자막 굽기</label>
            <div class="vp-insp-note">글자 크기·색·폰트는 아래 스타일에서, 위치는 위 좌우/상하에서 조절하세요.</div>`;
          })() : ''}

          ${insp==='audio' ? `
            <div class="vp-insp-group">나레이션</div>
            ${state.voiceUrl ? `
              <div class="vp-row">
                <label>볼륨 <b>${Math.round((state.voiceVolume??1)*100)}%</b></label>
                <input type="range" id="inspVoiceVol" min="0" max="2" step="0.05" value="${state.voiceVolume??1}">
              </div>
              <audio controls src="${state.voiceUrl}" style="width:100%;"></audio>
            ` : `<div class="vp-insp-note">나레이션 없음</div>`}

            <div class="vp-insp-group" style="margin-top:16px;">배경음악</div>
            ${state.sourceBgm ? `
              <div class="vp-insp-note" style="margin-bottom:8px;">♪ ${state.sourceBgm.name}</div>
              <div class="vp-row">
                <label>볼륨 <b>${Math.round((state.bgmVolume??0.25)*100)}%</b></label>
                <input type="range" id="inspBgmVol" min="0" max="1" step="0.05" value="${state.bgmVolume??0.25}">
              </div>
              <label class="vp-check"><input type="checkbox" id="inspBgmFade" ${state.bgmFade?'checked':''}> 끝에서 서서히 줄이기</label>
            ` : `<div class="vp-insp-note">배경음악 없음</div>`}

            <div class="vp-hint">파일 추가는 좌측 <b>♪오디오</b> 탭에서 하세요.</div>
          ` : ''}
        </div>
      </div>
    </div>

    <!-- ===== 편집바 (타임라인과 동일한 전체 폭) ===== -->
    <div class="vp-edit-bar">
      <div class="vp-edit-bar-left">
        <div class="vp-tl-modes">
          <button class="vp-tl-mode ${tlMode==='manual'?'active':''}" data-tl-edit-mode="manual" type="button" title="영상 절대 위치 · 자막과 완전 독립">수동</button>
          <button class="vp-tl-mode ${tlMode==='auto'?'active':''}" data-tl-edit-mode="auto" type="button" title="영상만 순차 표시(자막은 건드리지 않음)">자동</button>
        </div>
        <span class="vp-toolrow-sep"></span>
        <button class="vp-action" data-nle-panel="text" type="button" title="자막 (T)">T 자막</button>
        <button class="vp-action" id="nleTrimBtn" type="button" ${!edl.length||!selected?'disabled':''} title="자르기 (X)">✂ 자르기</button>
        <button class="vp-action" id="nleSnapClipsBtn" type="button" ${v1Count<2?'disabled':''} title="영상 사이 빈칸을 없애고 이어 붙이기">⛓ 붙이기</button>
        <button class="vp-action" data-remove-edl="${selIdx}" type="button" ${!edl.length?'disabled':''} title="삭제 (Del)">🗑 삭제</button>
        <button class="vp-action" id="nleSplitBtn" type="button" ${!edl.length?'disabled':''} title="분할 (S)">⑂ 분할</button>
        <button class="vp-action" id="nleSpeedBtn" type="button" ${!selected?'disabled':''} title="속도">⏱ 속도</button>
      </div>
      <div class="vp-edit-bar-center">
        <div class="vp-play-group">
          <button class="vp-play" id="nleSkipStart" type="button" title="처음 (Home)">⏮</button>
          <button class="vp-play" id="nleStepBack" type="button" title="-1초 (←)">⏪</button>
          <button class="vp-play main" id="nlePlayPause" type="button" title="재생/일시정지 (Space)">▶</button>
          <button class="vp-play" id="nleStepFwd" type="button" title="+1초 (→)">⏩</button>
          <button class="vp-play" id="nleSkipEnd" type="button" title="끝 (End)">⏭</button>
        </div>
        <div class="vp-vol" title="미리보기 볼륨">
          <button class="vp-play" id="nleMuteBtn" type="button" title="음소거 토글">${(state.previewMuted || (state.previewVolume??1)<=0)?'🔇':'🔊'}</button>
          <input type="range" id="nlePreviewVol" min="0" max="1" step="0.05" value="${state.previewVolume??1}">
          <span class="vp-vol-label">${Math.round((state.previewVolume??1)*100)}%</span>
        </div>
        <div class="vp-tc-row">
          <span class="vp-tc accent" id="nlePreviewTC">00:00:00:00</span>
          <span class="vp-tc dim">/ ${fmtTC(totalDur)}</span>
        </div>
        <span class="vp-toolrow-sep"></span>
        <select id="aspectRatio" class="vp-aspect" title="화면 비율">
          <option value="9:16" ${state.aspectRatio==='9:16'?'selected':''}>9:16</option>
          <option value="16:9" ${state.aspectRatio==='16:9'?'selected':''}>16:9</option>
          <option value="1:1" ${state.aspectRatio==='1:1'?'selected':''}>1:1</option>
          <option value="4:5" ${state.aspectRatio==='4:5'?'selected':''}>4:5</option>
        </select>
      </div>
      <div class="vp-edit-bar-right">
        <button class="vp-action" id="nleAudioBtn" type="button" title="오디오">♪ 오디오</button>
        <button class="vp-action" id="nleTransitionBtn" type="button" ${!selected?'disabled':''} title="전환">⤢ 전환</button>
        <button class="vp-action" id="nleColorBtn" type="button" title="색보정">🎨 보정</button>
        <button class="vp-action" id="nleDuplicateBtn" type="button" ${!edl.length?'disabled':''} title="복제 (Ctrl+D)">⧉ 복제</button>
        <button class="vp-action" data-move-edl="-1" type="button" ${selIdx===0||!edl.length?'disabled':''} title="앞으로 ([)">◀</button>
        <button class="vp-action" data-move-edl="1" type="button" ${selIdx>=edl.length-1||!edl.length?'disabled':''} title="뒤로 (])">▶</button>
        <span class="vp-toolrow-sep"></span>
        <button class="vp-action" id="nleShortcutHelpBtn" type="button" title="단축키">⌨</button>
      </div>
    </div>

    <!-- 미리보기·편집바 ↔ 타임라인 세로 경계 (드래그로 높이 조절, 더블클릭 초기화) -->
    <div class="vp-resizer vp-resizer-v" data-vp-resize="timeline" title="미리보기 / 타임라인 높이 조절 · 더블클릭: 기본값"></div>

    <!-- ===== 타임라인 ===== -->
    <div class="vp-timeline-wrap tl-${tlSize}">
      <div class="vp-tl-toolbar">
        <span class="vp-tl-toolbar-title">타임라인</span>
        <div class="vp-tl-toolbar-group" title="시간축을 압축하거나 늘려서 봅니다">
          <label>배율</label>
          <button class="vp-mini" data-tl-zoom="out" type="button" title="줄여서 보기 (긴 영상을 한눈에)">➖ 줄이기</button>
          <input type="range" id="tlZoomSlider" min="${TL_ZOOM_MIN}" max="4" step="0.001"
            value="${Math.min(4, Math.max(TL_ZOOM_MIN, state.tlZoom||1))}"
            title="타임라인 축소/확대" style="width:110px; padding:0; accent-color:var(--accent);">
          <span class="vp-tl-zoom-label">${(state.tlZoom||1) < 0.1 ? (state.tlZoom||1).toFixed(3) : (state.tlZoom||1).toFixed(2)}x</span>
          <button class="vp-mini" data-tl-zoom="in" type="button" title="넓혀서 보기 (세밀하게)">➕ 넓히기</button>
          <button class="vp-mini go" data-tl-zoom="fit" type="button" title="전체 길이가 한 화면에 보이게">⊡ 전체맞춤</button>
          <button class="vp-mini" data-tl-zoom="reset" type="button" title="기본 배율">1x</button>
        </div>
        <div class="vp-tl-toolbar-group" title="타임라인 패널 높이">
          <label>높이</label>
          <button class="vp-mini ${tlSize==='sm'?'active':''}" data-tl-size="sm" type="button">작게</button>
          <button class="vp-mini ${tlSize==='md'?'active':''}" data-tl-size="md" type="button">보통</button>
          <button class="vp-mini ${tlSize==='lg'?'active':''}" data-tl-size="lg" type="button">크게</button>
        </div>
        <span class="vp-hint" style="margin:0; font-size:11px;">빈 줄에 드롭하면 V/T 트랙이 자동 추가 · Ctrl+휠 배율</span>
      </div>
      <div class="vp-timeline" id="vpTimelineScroll">
        <div class="vp-tl-inner" style="width:${Math.max(rulerMax*PPS+140, 400)}px; min-width:100%;">
          <div class="vp-playhead" style="left:${132+playhead*PPS}px;"></div>
          <div class="vp-ruler" data-seek-ruler>${ruler}</div>
          ${videoTracksHtml}
          ${subTracksHtml}
          <div class="vp-track">
            <div class="vp-track-head"><span class="vp-track-tag a">A1</span> 음성
              <button class="vp-track-btn ${state.trackHidden.voice?'off':''}" data-track-toggle="voice" type="button" title="나레이션 켜기/끄기">${state.trackHidden.voice?'🔇':'🔊'}</button></div>
            <div class="vp-track-body" data-tl-drop="a:1">${state.voiceUrl?`<div class="vp-audio voice" style="left:0; width:${Math.max(80,totalDur*PPS)}px;">🎙 나레이션</div>`:'<span class="vp-track-empty">나레이션은 AI생성·오디오 탭에서 추가</span>'}</div>
          </div>
          <div class="vp-track">
            <div class="vp-track-head"><span class="vp-track-tag a">A2</span> 음악
              <button class="vp-track-btn ${state.trackHidden.bgm?'off':''}" data-track-toggle="bgm" type="button" title="배경음악 켜기/끄기">${state.trackHidden.bgm?'🔇':'🔊'}</button></div>
            <div class="vp-track-body" data-tl-drop="a:2">${state.sourceBgm?`<div class="vp-audio" style="left:0; width:${Math.max(80,totalDur*PPS)}px;">♪ ${state.sourceBgm.name}</div>`:(state.sfxBedUrl?`<div class="vp-audio" style="left:0; width:${Math.max(80,totalDur*PPS)}px; opacity:0.85;">🔊 자동 효과음 ${(state.sfxClips||[]).length}</div>`:'<span class="vp-track-empty">배경음악은 오디오 탭에서 추가</span>')}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  `;
}
