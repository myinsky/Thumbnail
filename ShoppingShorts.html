    p.categoryName ? `카테고리: ${p.categoryName}` : '',
    p.isRocket ? '배송: 로켓배송' : '',
    p.isFreeShipping ? '배송: 무료배송' : '',
    p.productId ? `상품ID: ${p.productId}` : '',
    p.url ? `파트너스 링크: ${p.url}` : '',
  ].filter(Boolean).join('\n');
}

async function applyCoupangProduct(p){
  state.selectedCoupang = { ...p };
  state.productDescription = buildCoupangProductDescription(p);
  // 리뷰란이 비어 있으면 상품 메타를 참고 정보로 채워 둠 (대본 신뢰도용)
  if(!(state.reviewText||'').trim()){
    state.reviewText = [
      `쿠팡 상품명: ${p.name}`,
      p.price != null ? `판매가 ${Number(p.price).toLocaleString()}원` : '',
      p.isRocket ? '로켓배송 상품' : '',
      p.categoryName ? `카테고리 ${p.categoryName}` : '',
    ].filter(Boolean).join('. ') + '.';
  }
  if(p.image){
    const img = await fetchImageAsBase64(p.image);
    state.productImages = img ? [img] : [];
    state.productImageUrls = [];
  }else{
    state.productImages = [];
    state.productImageUrls = [];
  }
  // 타 플랫폼 탐색 키워드를 상품명 기준으로 갱신
  ensurePlatformHunt().panel = ensurePlatformHunt().panel || 'youtube';
  syncPlatformHuntKeywords(true);
  state.youtubeResults = null;
  state.apifyResults = null;
  ensurePlatformHunt().lastOpened = {};
}


const __SSS_PRODUCT_AUTO_FETCH_DIAGNOSTICS_V1__ = true;

function isFetchTransportError(err){
  const raw = String(err?.message || err || '');
  return /Failed to fetch|NetworkError|Load failed|CORS|ERR_FAILED|TypeError/i.test(raw);
}

function formatCoupangFetchError(err, endpoint=''){
  const raw = String(err?.message || err || 'Failed to fetch');
  if(!isFetchTransportError(raw)) return raw;
  const proxyOn = !!(state.keys.useWorkerProxy && String(state.keys.workerProxyUrl||'').trim());
  const local = proxyOn && /^(https?:\/\/)?(127\.0\.0\.1|localhost)(:\d+)?/i.test(String(state.keys.workerProxyUrl||'').trim());
  return [
    '쿠팡 제품 이미지 검색 연결 실패입니다.',
    proxyOn
      ? (local
        ? '로컬 프록시가 꺼져 있거나 쿠팡 중계 라우트가 응답하지 않습니다.'
        : 'Worker 프록시 URL이 응답하지 않습니다. 주소/배포/라우팅을 확인하세요.')
      : '브라우저에서 쿠팡 API를 직접 호출하면 CORS로 차단될 수 있습니다.',
    '해결: 제품 이미지를 직접 등록하거나, node sss-local-proxy.mjs 를 실행한 뒤 설정에서 로컬 프록시 사용을 켜고 다시 시도하세요.',
    '이 단계는 유튜브 소재 문제가 아니라 실제 제품 이미지 확보 단계입니다.',
    endpoint ? '요청 경로: ' + endpoint.replace(/access-key=[^,&\s]+/i, 'access-key=***').slice(0,180) : ''
  ].filter(Boolean).join(' ');
}


function formatProductAutoError(err){
  const raw = String(err?.message || err || '알 수 없는 오류');
  if(isFetchTransportError(raw)){
    return [
      '외부 연결이 실패했습니다.',
      '제품 이미지를 등록하지 않은 경우에는 입력한 스토리를 우선으로 자동 영상을 구성합니다.',
      '이 오류가 보이면 등록/검색된 제품 이미지, 쿠팡 검색, AI/영상 생성 API, 프록시 같은 외부 연결 단계에서 막힌 것입니다.',
      '제품 이미지 기준으로 진행하려면 로컬 프록시/Worker/API 키를 확인하고, 이미지가 없다면 스토리만 남긴 상태로 다시 실행하세요.'
    ].join(' ');
  }
  return raw;
}

async function coupangSearch(keyword, limit=10){
  const access = String(state.keys.coupangAccessKey||'').trim();
  const secret = String(state.keys.coupangSecretKey||'').trim();
  if(!access || !secret){
    throw new Error('쿠팡파트너스 Access Key / Secret Key가 비어 있어요. API 설정에서 입력·저장해주세요.');
  }
  state.keys.coupangAccessKey = access;
  state.keys.coupangSecretKey = secret;
  const method = 'GET';
  const path = '/v2/providers/affiliate_open_api/apis/openapi/products/search';
  const query = `keyword=${encodeURIComponent(keyword)}&limit=${Math.min(10, Math.max(1, limit))}&imageSize=512x512`;
  const datetime = coupangDatetime();
  const message = datetime + method + path + query;
  const signature = await hmacSha256Hex(state.keys.coupangSecretKey, message);
  const authorization = `CEA algorithm=HmacSHA256, access-key=${state.keys.coupangAccessKey}, signed-date=${datetime}, signature=${signature}`;

  const endpoint = (state.keys.useWorkerProxy && state.keys.workerProxyUrl)
    ? `${state.keys.workerProxyUrl.replace(/\/$/,'')}/coupang${path}?${query}`
    : `https://api-gateway.coupang.com${path}?${query}`;

  let res;
  try{
    res = await fetch(endpoint, {
      method,
      headers:{ 'Authorization': authorization, 'Content-Type':'application/json' }
    });
  }catch(fetchErr){
    throw new Error(formatCoupangFetchError(fetchErr, endpoint));
  }
  if(!res.ok){
    const body = await res.text().catch(()=>'');
    throw new Error(`쿠팡 검색 실패 HTTP ${res.status}: ${body.slice(0,150) || 'CORS면 Worker 프록시를 켜세요'}`);
  }
  return res.json();
}

/* ============================================================
   YouTube Data API v3
   주의: order=viewCount + publishedAfter 조합은 빈 결과가 자주 남
   → BlueThumb과 같이 relevance/date로 검색 후 조회수는 클라이언트 정렬
============================================================ */
async function youtubeSearch(query, maxResults=5, opts={}){
  const key = String(state.keys.youtubeApiKey||'').trim();
  if(!key) throw new Error('YouTube API 키가 없어요. API 설정에서 넣어주세요.');

  const periodId = opts.period || ensureSourceHunt().period || '7d';
  const bounds = huntPublishedBounds(periodId);
  // viewCount+기간 필터는 API가 빈 배열을 자주 반환 → relevance 기본
  let order = opts.order || 'relevance';
  if(order === 'viewCount' && (bounds.publishedAfter || bounds.publishedBefore)){
    order = 'relevance';
  }
  const capped = Math.min(50, Math.max(1, Number(maxResults) || 5));
  const params = new URLSearchParams({
    part: 'snippet',
    q: String(query||'').trim() || '쇼핑 쇼츠',
    type: 'video',
    order,
    maxResults: String(capped),
    key,
    regionCode: opts.regionCode || 'KR',
    relevanceLanguage: opts.relevanceLanguage || 'ko',
  });
  if(bounds.publishedAfter) params.set('publishedAfter', bounds.publishedAfter);
  if(bounds.publishedBefore) params.set('publishedBefore', bounds.publishedBefore);
  // short | medium | long | any
  if(opts.duration && opts.duration !== 'any'){
    params.set('videoDuration', opts.duration);
  }

  const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
  const searchData = await searchRes.json().catch(()=>({}));
  if(!searchRes.ok){
    const apiMsg = searchData?.error?.message || JSON.stringify(searchData).slice(0,160);
    throw new Error(`YouTube 검색 실패 (${searchRes.status}): ${apiMsg}`);
  }
  const ids = (searchData.items||[]).map(i=>i.id?.videoId).filter(Boolean);
  if(!ids.length) return [];

  const statsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet,contentDetails&id=${ids.join(',')}&key=${key}`);
  const statsData = await statsRes.json().catch(()=>({}));
  if(!statsRes.ok){
    const apiMsg = statsData?.error?.message || String(statsRes.status);
    throw new Error('YouTube 통계 조회 실패: '+apiMsg);
  }

  return (statsData.items||[]).map(v=>{
    const title = v.snippet?.title || '';
    const description = v.snippet?.description || '';
    const meta = extractBroadcastMeta(title, description);
    return {
      id: v.id,
      title,
      description,
      channel: v.snippet?.channelTitle || '',
      thumbnail: v.snippet?.thumbnails?.medium?.url || v.snippet?.thumbnails?.default?.url,
      viewCount: Number(v.statistics?.viewCount||0),
      likeCount: Number(v.statistics?.likeCount||0),
      commentCount: Number(v.statistics?.commentCount||0),
      publishedAt: v.snippet?.publishedAt || '',
      duration: v.contentDetails?.duration || '',
      url: `https://www.youtube.com/watch?v=${v.id}`,
      platform: 'youtube',
      programName: meta.programName,
      airDate: meta.airDate,
      episode: meta.episode,
    };
  }).sort((a,b)=> Number(b.viewCount||0) - Number(a.viewCount||0));
}

function ensureYtMaterial(){
  if(!state.ytMaterial || typeof state.ytMaterial !== 'object'){
    state.ytMaterial = { keyword:'', mode:'shopping', track:'product', period:'365d', limit:20, minViews:10000, duration:'short' };
  }
  if(!state.ytMaterial.track) state.ytMaterial.track = 'product';
  const lim = Number(state.ytMaterial.limit);
  state.ytMaterial.limit = [10,20,30,50].includes(lim) ? lim : 20;
  // 과거 'any'(전체 길이) → 롱폼
  if(state.ytMaterial.duration === 'any') state.ytMaterial.duration = 'long';
  state.ytMaterial.duration = state.ytMaterial.duration === 'long' ? 'long' : 'short';
  return state.ytMaterial;
}

/** BlueThumb식 다중 쿼리 → 쇼츠 필터 → 조회수 상위 */
function buildYtMaterialQueries(yt){
  const kw = String(yt.keyword||'').trim();
  const track = yt.track || 'product';
  let bank = [];
  if(track === 'pet'){
    // mode 는 pet 세부 카테고리로 재사용 (dog/cat/mixed). 그 외 값이면 mixed.
    const sub = yt.mode === 'dog' ? 'dog' : yt.mode === 'cat' ? 'cat' : 'mixed';
    bank = huntTrackQueryBank('pet', sub);
    if(kw) bank = [kw, ...bank.map(q => `${kw} ${q}`)].slice(0, 12);
    return uniqueStrings(bank).slice(0, 12);
  }
  if(yt.mode === 'shopping') bank = YT_SHOPPING_QUERY_BANK.shopping.slice();
  else if(yt.mode === 'idea') bank = YT_SHOPPING_QUERY_BANK.idea.slice();
  else if(yt.mode === 'celeb'){
    bank = kw
      ? [`${kw} 연예인 착용`, `${kw} 방송 협찬`, `${kw} 착용 쇼츠`, '연예인 착용 제품']
      : ['연예인 착용 제품','방송 협찬 제품','셀럽 착용 쇼츠','연예인 뭐 쓰는지'];
  } else {
    // category — Step2 카테고리 연동
    const seed = categoryHuntSeed();
    bank = kw
      ? [`${kw} 쇼츠`, `${kw} 리뷰`, `${kw} 추천템`, seed]
      : [`${seed} 쇼츠`, `${seed}`, '쿠팡 추천템', '쇼츠 꿀템'];
  }
  if(kw && (yt.mode === 'shopping' || yt.mode === 'idea')){
    bank = [kw, ...bank.map(q => `${kw} ${q}`)].slice(0, 12);
  }
  // 선택 개수를 채우기 위해 기본 쿼리 풀을 넓힘
  return uniqueStrings(bank).slice(0, 12);
}

async function youtubeShoppingShortsSearch(ytOpts={}){
  const yt = { ...ensureYtMaterial(), ...ytOpts };
  const key = String(state.keys.youtubeApiKey||'').trim();
  if(!key) throw new Error('YouTube API 키가 없어요. API 설정에서 넣어주세요.');

  const queries = buildYtMaterialQueries(yt);
  const limit = [10,20,30,50].includes(Number(yt.limit)) ? Number(yt.limit) : 20;
  // 선택 개수를 채우도록 쿼리당 더 많이 수집
  const perQuery = Math.min(50, Math.max(15, limit));
  const wantShort = yt.duration !== 'long';
  // YouTube videoDuration=short는 4분 미만. 쇼츠 모드에서는 초 단위로 한 번 더 자름.
  const apiDuration = wantShort ? 'short' : 'any';
  const durationCap = wantShort ? 180 : null;
  const minViews = Math.max(0, Number(yt.minViews)||0);
  const seen = new Set();
  const pooled = [];
  const dropped = { howto:0, tooLong:0, tooShort:0 };

  const track = yt.track || 'product';
  const includeRe = huntTrackIncludeRe(track);
  const excludeRe = huntTrackExcludeRe(track);
  const isPet = track === 'pet';
  const strictMode = isPet ? true : (yt.mode === 'shopping' || yt.mode === 'idea');

  const absorb = (batch, q, relaxInclude=false)=>{
    for(const v of batch){
      const id = v.id || v.url;
      if(!id || seen.has(id)) continue;
      const title = String(v.title||'');
      if(!isPet && isHowToShoppingVideo(v)){ dropped.howto++; continue; }
      const sec = ytDurationSec(v.duration);
      if(durationCap != null && sec != null && sec > durationCap){ dropped.tooLong++; continue; }
      // 롱폼 모드: 실제 쇼츠(≤60초)는 제외
      if(!wantShort && sec != null && sec <= 60){ dropped.tooShort++; continue; }
      if(!relaxInclude){
        if(excludeRe.test(title) && !includeRe.test(title)) continue;
        if(strictMode){
          if(!includeRe.test(title) && !kwLooseMatch(q, title) && !kwLooseMatch(yt.keyword, title)) continue;
        }
      }else if(excludeRe.test(title) && !includeRe.test(title) && !kwLooseMatch(yt.keyword, title)){
        continue;
      }
      seen.add(id);
      pooled.push(v);
    }
  };

  const searchOne = async (q, order, relaxInclude=false)=>{
    const batch = await youtubeSearch(q, perQuery, {
      period: yt.period || '365d',
      order,
      duration: apiDuration,
      regionCode: 'KR',
      relevanceLanguage: 'ko',
    });
    absorb(batch, q, relaxInclude);
  };

  for(let i=0; i<queries.length; i++){
    const q = queries[i];
    const order = (i % 2 === 0) ? 'relevance' : 'date';
    try{
      await searchOne(q, order, false);
    }catch(err){
      if(i === 0) throw err;
    }
    // 아직 부족하면 같은 쿼리를 다른 정렬로 한 번 더
    if(pooled.length < limit){
      try{ await searchOne(q, order === 'relevance' ? 'date' : 'relevance', false); }catch(_){}
    }
    if(pooled.length >= limit * 3) break;
  }

  // 선택 개수보다 적으면 추가 쿼리 + 완화 필터로 채움
  if(pooled.length < limit){
    const kw = String(yt.keyword||'').trim();
    const fillQs = uniqueStrings([
      ...queries,
      kw || '쇼핑 쇼츠',
      kw ? `${kw} 추천템` : '쿠팡 추천템',
      kw ? `${kw} 꿀템` : '쇼츠 꿀템',
      '내돈내산 추천',
      '가성비템',
      '살림템 추천',
      '핫딜 추천',
      wantShort ? '쇼츠 리뷰' : (kw ? `${kw} 리뷰` : '제품 리뷰'),
      wantShort ? '추천템 쇼츠' : (kw ? `${kw} 언박싱` : '언박싱 리뷰'),
    ]);
    for(let i=0; i<fillQs.length && pooled.length < limit; i++){
      const q = fillQs[i];
      try{ await searchOne(q, i % 2 ? 'date' : 'relevance', true); }catch(_){}
    }
  }

  const isTrueShort = v => {
    const sec = ytDurationSec(v.duration);
    return sec == null || sec <= 60;
  };
  const isLongForm = v => {
    const sec = ytDurationSec(v.duration);
    return sec == null || sec > 60;
  };
  const byViews = (a,b)=> Number(b.viewCount||0) - Number(a.viewCount||0);
  const lengthPool = wantShort
    ? (()=>{
        const shortsOnly = pooled.filter(isTrueShort);
        return shortsOnly.length >= Math.min(limit, 5) ? shortsOnly : pooled;
      })()
    : (pooled.filter(isLongForm).length ? pooled.filter(isLongForm) : pooled);

  const pick = (list, viewsFloor)=> rankShortsCandidates(list, 'youtube')
    .filter(v => Number(v.viewCount||0) >= viewsFloor)
    .sort(byViews);

  let ranked = pick(lengthPool, minViews).slice(0, limit);

  // 최소 조회수 때문에 부족하면 임계를 낮춰 선택 개수까지 채움
  if(ranked.length < limit){
    const have = new Set(ranked.map(v => v.id || v.url));
    for(const v of pick(lengthPool, 0)){
      const id = v.id || v.url;
      if(have.has(id)) continue;
      ranked.push(v); have.add(id);
      if(ranked.length >= limit) break;
    }
  }
  if(ranked.length < limit && lengthPool !== pooled){
    const have = new Set(ranked.map(v => v.id || v.url));
    for(const v of pick(pooled, 0)){
      const id = v.id || v.url;
      if(have.has(id)) continue;
      ranked.push(v); have.add(id);
      if(ranked.length >= limit) break;
    }
  }

  return { videos: ranked, queries, minViews, dropped, requested: limit };
}

/* __SSS_SOURCE_FIND_V2__ — 쇼츠의 방송·롱폼 원본 찾기 (유사 쇼핑쇼츠 검색 금지) */
const SOURCE_FIND_SHOPPING_NOISE = /꿀템|쿠팡|추천템|가성비|언박싱|핫딜|특가|구매링크|쇼핑하울|득템|리뷰템|광고|협찬링크|링크는\s*고정|shorts?\b|쇼츠\b/i;
const SOURCE_FIND_BROADCAST_HINT = /다시보기|풀영상|풀버전|본편|원본|방송|예능|토크|인터뷰|직캠|풀캠|무대|본방|클립|하이라이트|다시\s*보기/i;

function cleanTitleForSourceSearch(title){
  return String(title||'')
    .replace(/#[^\s#]+/g, ' ')
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/【[^】]*】/g, ' ')
    .replace(/[🔥✨❤💕👉✅⭐️★☆♪🎵🎬📌💡]+/g, ' ')
    .replace(/\b(shorts?|쇼츠|short)\b/gi, ' ')
    .replace(SOURCE_FIND_SHOPPING_NOISE, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function extractHashtags(text){
  return uniqueStrings((String(text||'').match(/#[^\s#]+/g) || []).map(h => h.replace(/^#/, '').trim()).filter(h => h.length >= 2));
}

function ytVideoIdFromSeed(seed){
  return String(seed?.id || '').trim()
    || (String(seed?.url||'').match(/[?&]v=([\w-]{6,})/)||[])[1]
    || (String(seed?.url||'').match(/youtu\.be\/([\w-]{6,})/)||[])[1]
    || '';
}

function parseAiJsonObject(text){
  const raw = String(text||'').replace(/```json|```/g, '').trim();
  try{ return JSON.parse(raw); }catch(_){}
  const m = raw.match(/\{[\s\S]*\}/);
  if(m){
    try{ return JSON.parse(m[0]); }catch(_){}
  }
  return null;
}

async function enrichSeedFromYoutube(seed){
  const key = String(state.keys.youtubeApiKey||'').trim();
  const id = ytVideoIdFromSeed(seed);
  if(!key || !id) return seed;
  try{
    const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${encodeURIComponent(id)}&key=${key}`);
    const data = await res.json().catch(()=>({}));
    if(!res.ok) return seed;
    const v = data.items?.[0];
    if(!v) return seed;
    const title = v.snippet?.title || seed.title || '';
    const description = v.snippet?.description || seed.description || '';
    const meta = extractBroadcastMeta(title, description);
    return {
      ...seed,
      id,
      title,
      description,
      channel: v.snippet?.channelTitle || seed.channel || '',
      thumbnail: v.snippet?.thumbnails?.medium?.url || seed.thumbnail || '',
      publishedAt: v.snippet?.publishedAt || seed.publishedAt || '',
      duration: v.contentDetails?.duration || seed.duration || '',
      viewCount: Number(v.statistics?.viewCount || seed.viewCount || 0),
      url: seed.url || `https://www.youtube.com/watch?v=${id}`,
      programName: seed.programName || meta.programName || '',
      airDate: seed.airDate || meta.airDate || '',
      episode: seed.episode || meta.episode || '',
    };
  }catch(_){
    return seed;
  }
}

/** Gemini가 YouTube URL을 직접 보면 화면 문자·대사·출연자를 추정 */
async function identifyBroadcastViaGeminiVideo(seed){
  const url = String(seed.url||'').trim();
  if(!url || !/youtube\.com|youtu\.be/i.test(url)) return null;
  if(!String(state.keys.gemini||'').trim()) return null;
  const body = {
    contents: [{
      parts: [
        { file_data: { file_uri: url } },
        { text: `이 유튜브 쇼츠/클립이 "어떤 방송·프로그램의 어떤 장면"인지 식별해.
유튜버가 덧붙인 상품 나레이션·쿠팡 홍보가 아니라, 화면 속 원본 방송/무대/예능 장면을 찾아라.
화면 자막(OCR), 로고, 출연자 얼굴·이름, 대사, 세트장, 하단 방송 자막을 근거로 추정해.
JSON만 출력:
{"programName":"","episode":"","airDate":"","celebrities":[],"sceneHints":[],"onScreenText":[],"dialogueHints":[],"searchQueries":[],"confidence":0,"notes":""}
- programName: 예능/음악방송/드라마 등 원본 프로그램명 (모르면 "")
- searchQueries: 유튜브에서 편집 안 된 롱폼·다시보기·풀영상을 찾기 위한 한국어 검색어 4~8개 (상품명·꿀템·쿠팡 금지)
- confidence: 0~1` }
      ]
    }],
    generationConfig: { maxOutputTokens: 2048 },
  };
  try{
    const { data } = await fetchGeminiGenerateContent(body, {
      model: resolveGeminiModel(),
      persistProxyFallback: false,
    });
    const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n') || '';
    const obj = parseAiJsonObject(text);
    if(!obj || typeof obj !== 'object') return null;
    return { ...obj, via: 'gemini-youtube' };
  }catch(err){
    console.warn('[source-find] Gemini YouTube 분석 실패 → 텍스트 추정', err);
    return null;
  }
}

async function identifyBroadcastViaTextAi(seed){
  const hashtags = extractHashtags(`${seed.title||''}\n${seed.description||''}`);

  const userText = `아래 쇼핑/셀럽 쇼츠의 "잘라 쓴 원본 방송"을 추정해 주세요.
상품 홍보 문구·해시태그 광고는 무시하고, 출연자·방송 장면·프로그램 단서를 우선하세요.

제목: ${seed.title||''}
채널: ${seed.channel||''}
설명:
${String(seed.description||'').slice(0, 1800)}
해시태그: ${hashtags.map(h=>'#'+h).join(' ') || '(없음)'}
이미 추출된 메타: 프로그램=${meta.programName||seed.programName||''} / 회차=${meta.episode||seed.episode||''} / 방영=${meta.airDate||seed.airDate||''}

JSON만:
{"programName":"","episode":"","airDate":"","celebrities":[],"sceneHints":[],"onScreenText":[],"dialogueHints":[],"searchQueries":[],"confidence":0,"notes":""}
규칙:
- searchQueries는 편집 안 된 롱폼·다시보기·풀영상·본편 검색용 (예: "프로그램명 다시보기", "출연자 프로그램명 풀영상")
- 꿀템/쿠팡/추천템/상품명 검색어 금지
- 확신이 낮아도 출연자·장면 단서로 검색어를 만들어라`;
  const text = await callTextAi({
    system,
    userText,
    maxTokens: 1600,
    geminiFallback: true,
  });
  const obj = parseAiJsonObject(text);
  if(!obj || typeof obj !== 'object'){
    return {
      programName: meta.programName || seed.programName || '',
      episode: meta.episode || seed.episode || '',
      airDate: meta.airDate || seed.airDate || '',
      celebrities: hashtags.filter(h => !/뷰티|쿠팡|추천|연예인|쇼츠|shorts/i.test(h)).slice(0, 6),
      sceneHints: [],
      searchQueries: [],
      confidence: meta.programName ? 0.35 : 0.15,
      notes: 'AI JSON 파싱 실패 — 메타·해시태그 폴백',
      via: 'fallback-meta',
    };
  }
  return { ...obj, via: 'text-ai' };
}

async function identifyBroadcastSource(seed, onStatus){
  onStatus?.('유튜브 설명·메타 보강 중…');
  const enriched = await enrichSeedFromYoutube(seed);
  const meta = extractBroadcastMeta(enriched.title||'', enriched.description||'');
  let guess = null;

  onStatus?.('영상 화면·대사로 프로그램 추정 중… (Gemini)');
  guess = await identifyBroadcastViaGeminiVideo(enriched);

  const guessThin = !guess
    || (!guess.programName && !(guess.celebrities||[]).length && !(guess.searchQueries||[]).length);
  if(guessThin){
    onStatus?.('제목·설명·해시태그로 원본 프로그램 추정 중…');
    try{
      guess = await identifyBroadcastViaTextAi(enriched);
    }catch(err){
      console.warn('[source-find] text AI 실패', err);
      guess = {
        programName: meta.programName || enriched.programName || '',
        episode: meta.episode || enriched.episode || '',
        airDate: meta.airDate || enriched.airDate || '',
        celebrities: extractHashtags(`${enriched.title||''}\n${enriched.description||''}`)
          .filter(h => !/뷰티|쿠팡|추천|연예인|쇼츠|shorts|먹방|생활/i.test(h)).slice(0, 6),
        sceneHints: [],
        searchQueries: [],
        confidence: meta.programName ? 0.3 : 0.1,
        notes: err.message || 'AI 추정 실패',
        via: 'meta-only',
      };
    }
  }

  const programName = String(guess.programName || meta.programName || enriched.programName || '').trim();
  const episode = String(guess.episode || meta.episode || enriched.episode || '').trim();
  const airDate = String(guess.airDate || meta.airDate || enriched.airDate || '').trim();
  const celebrities = uniqueStrings([...(guess.celebrities||[]), ...extractHashtags(`${enriched.title}\n${enriched.description}`)]
    .map(s => String(s||'').replace(/^#/, '').trim())
    .filter(s => s.length >= 2 && !SOURCE_FIND_SHOPPING_NOISE.test(s) && !/뷰티|연예인|추천|쿠팡|쇼츠|shorts/i.test(s))
  ).slice(0, 8);

  return {
    seed: enriched,
    programName,
    episode,
    airDate,
    celebrities,
    sceneHints: uniqueStrings(guess.sceneHints || []).slice(0, 8),
    onScreenText: uniqueStrings(guess.onScreenText || []).slice(0, 8),
    dialogueHints: uniqueStrings(guess.dialogueHints || []).slice(0, 8),
    searchQueries: uniqueStrings(guess.searchQueries || []).slice(0, 10),
    confidence: Math.max(0, Math.min(1, Number(guess.confidence) || 0)),
    notes: String(guess.notes || ''),
    via: guess.via || 'unknown',
  };
}

function buildOriginalSourceQueries(ident){
  const qs = [];
  const program = ident.programName || '';
  const episode = ident.episode || '';
  const airDate = ident.airDate || '';
  const celebs = ident.celebrities || [];
  const hints = [...(ident.sceneHints||[]), ...(ident.onScreenText||[]), ...(ident.dialogueHints||[])]
    .map(s => String(s||'').trim())
    .filter(s => s.length >= 2 && s.length <= 40 && !SOURCE_FIND_SHOPPING_NOISE.test(s));

  for(const q of (ident.searchQueries || [])){
    const s = String(q||'').trim();
    if(s && !SOURCE_FIND_SHOPPING_NOISE.test(s)) qs.push(s);
  }
  if(program){
    qs.push(program);
    qs.push(`${program} 다시보기`);
    qs.push(`${program} 풀영상`);
    qs.push(`${program} 본편`);
    if(episode) qs.push(`${program} ${episode}`);
    if(airDate) qs.push(`${program} ${airDate}`);
    if(celebs[0]) qs.push(`${program} ${celebs[0]}`);
  }
  if(celebs.length >= 2) qs.push(`${celebs[0]} ${celebs[1]} 방송`);
  if(celebs[0] && !program){
    qs.push(`${celebs[0]} 예능 풀영상`);
    qs.push(`${celebs[0]} 다시보기`);
  }
  for(const h of hints.slice(0, 3)){
    if(program) qs.push(`${program} ${h}`);
    else if(celebs[0]) qs.push(`${celebs[0]} ${h}`);
  }
  // 최후: 쇼핑 문구를 걷어낸 제목 + 원본 키워드 (상품 검색 방지)
  const cleaned = cleanTitleForSourceSearch(ident.seed?.title || '');
  const core = cleaned.split(/\s+/).filter(t => t.length >= 2 && !/추천|제품|템|쿨링|붓기|실온/i.test(t)).slice(0, 5).join(' ');
  if(core && (program || celebs.length)) qs.push(`${core} 원본`);

  return uniqueStrings(qs.filter(Boolean)).slice(0, 10);
}

function isShoppingRemixCandidate(v){
  const head = `${v.title||''} ${v.channel||''} ${String(v.description||'').slice(0, 180)}`;
  if(SOURCE_FIND_SHOPPING_NOISE.test(head)) return true;
  if(isHowToShoppingVideo(v)) return true;
  const sec = ytDurationSec(v.duration);
  // 60초 이하 + 쇼핑성 제목은 원본이 아님
  if(sec != null && sec <= 60 && /추천|리뷰|템|하울|득템/i.test(v.title||'')) return true;
  return false;
}

function scoreOriginalSourceCandidate(v, ident){
  const title = String(v.title||'');
  const channel = String(v.channel||'');
  const blob = `${title} ${channel} ${String(v.description||'').slice(0, 300)}`;
  let hit = 0;
  if(ident.programName && blob.includes(ident.programName)) hit += 5;
  for(const c of (ident.celebrities||[]).slice(0, 4)){
    if(c && blob.includes(c)) hit += 2;
  }
  for(const h of (ident.sceneHints||[]).slice(0, 4)){
    if(h && title.includes(h)) hit += 1;
  }
  if(SOURCE_FIND_BROADCAST_HINT.test(blob)) hit += 2;
  if(SOURCE_FIND_SHOPPING_NOISE.test(blob)) hit -= 6;
  const sec = ytDurationSec(v.duration);
  if(sec != null && sec <= 60) hit -= 4;
  if(sec != null && sec > 180) hit += 3;
  if(sec != null && sec > 600) hit += 2;
  if(sec != null && sec > 1800) hit += 1;
  // 공식/방송사 채널 가산
  if(/(SBS|KBS|MBC|tvN|JTBC|ENA|Mnet|공식|ARCHIVE|다시보기)/i.test(channel)) hit += 3;
  return hit * 10000 + Math.min(Number(v.viewCount||0), 5_000_000);
}

async function findOriginalVideoSources(seed, wantCount=10, onStatus){
  const key = String(state.keys.youtubeApiKey||'').trim();
  if(!key) throw new Error('YouTube API 키가 없어요. API 설정에서 넣어주세요.');

  const ident = await identifyBroadcastSource(seed, onStatus);
  const queries = buildOriginalSourceQueries(ident);
  if(!queries.length){
    return { materials: [], ident, queries };
  }

  const seedId = ytVideoIdFromSeed(ident.seed);
  const seen = new Set([seedId, ident.seed.url].filter(Boolean));
  const pooled = [];

  onStatus?.(`원본·롱폼 검색 중… (추정: ${ident.programName || ident.celebrities[0] || '장면 단서'})`);

  for(let i=0; i<queries.length && pooled.length < wantCount * 3; i++){
    const q = queries[i];
    const durationPref = i < 4 ? 'long' : (i < 7 ? 'medium' : 'any');
    const order = i % 3 === 2 ? 'viewCount' : 'relevance';
    try{
      const batch = await youtubeSearch(q, Math.min(25, Math.max(12, wantCount)), {
        period: '365d',
        order,
        duration: durationPref,
        regionCode: 'KR',
        relevanceLanguage: 'ko',
      });
      for(const v of batch){
        const id = v.id || v.url;
        if(!id || seen.has(id) || seen.has(v.url)) continue;
        if(isShoppingRemixCandidate(v)) continue;
        seen.add(id);
        if(v.url) seen.add(v.url);
        const sec = ytDurationSec(v.duration);
        const kind = (sec != null && sec <= 60)
          ? '짧은 클립(참고)'
          : (SOURCE_FIND_BROADCAST_HINT.test(`${v.title} ${v.channel}`) ? '롱폼·원본 유력' : '롱폼 후보');
        pooled.push({ ...v, sourceKind: kind, sourceQuery: q });
      }
    }catch(err){
      if(i === 0 && !pooled.length) throw err;
    }
  }

  const scored = pooled
    .map(v => ({ ...v, remixScore: scoreOriginalSourceCandidate(v, ident) }))
    .filter(v => v.remixScore > -20000)
    .sort((a,b)=> b.remixScore - a.remixScore);

  return { materials: scored.slice(0, wantCount), ident, queries };
}

/* ============================================================
   직접 소스 영상 조립 — Gemini 영상 분석 + EDL 생성 + FFmpeg.wasm 조립
============================================================ */

// Blob(영상 파일)을 Gemini에 보내서 장면 단위로 분석
// 편집안(EDL) 입력값을 화면에서 읽어서 state에 반영 (인덱스 기반, 안전하게)
function collectEdlFromInputs(){

// EDL을 .srt 자막 파일 내용으로 변환 (조립본의 타임라인 기준, 순차 누적)
function srtTimeFmt(sec){
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(Math.floor(sec%60)).padStart(2,'0');
  const ms = String(Math.round((sec%1)*1000)).padStart(3,'0');
  return `${h}:${m}:${s},${ms}`;
}
function srtTimeParse(str){
  const m = str.match(/(\d+):(\d+):(\d+)[,.](\d+)/);
  if(!m) return 0;
  return Number(m[1])*3600 + Number(m[2])*60 + Number(m[3]) + Number(m[4])/1000;
}

// EDL 구간 길이를 그대로 이어붙였을 때의 누적 타임라인(초) 계산 — 자막 기본값 생성에 사용
// EDL 구간 길이를 이어붙였을 때의 누적 타임라인 계산
// keepText=true면 기존 자막 텍스트를 유지하고 타이밍만 다시 맞춥니다
// (클립을 지우거나 순서를 바꿔도 직접 쓴 자막이 날아가지 않게)
// 클립 원본 오디오 볼륨: 내부적으로는 배수(ratio, 0=무음)로 저장하고 UI에는 dB로 보여줌
function ratioToDb(ratio){
  if(!ratio || ratio <= 0.0001) return -40;
  const db = 20 * Math.log10(ratio);
  return Math.max(-40, Math.min(12, db));
}
function dbToRatio(db){
  if(db <= -39.5) return 0;
  return Math.round(Math.pow(10, db/20) * 1000) / 1000;
}

// 자막이 새로 생기면 하단 타임라인의 T1(자막) 트랙이 저절로 눈에 보이도록 스크롤
function scrollSubTrackIntoView(){
  requestAnimationFrame(()=>{
    document.getElementById('vpTrackSub')?.scrollIntoView({block:'nearest', behavior:'smooth'});
  });
}

function computeTimelineFromEDL(edl, keepText = true){
  const prev = keepText ? (state.subtitles || []) : [];
  // 자동 모드용: V1 흐름에 자막을 맞춤. 수동 모드에서는 호출하지 않음(자막·영상 독립).
  let t = 0;
  const rows = [];
  edl.forEach((e)=>{
    if((e.track||1) !== 1) return;
    const clipDur = Math.max(0.5, e.end - e.start) / (e.speed ?? 1);
    const clipAt = (e.at != null) ? Number(e.at) : t;
    const prevRow = prev[rows.length];
    const text = (prevRow && prevRow.text) ? prevRow.text : e.line;
    const prevDur = prevRow ? (Number(prevRow.end) - Number(prevRow.start)) : null;
    // 예전에 클립 전체 길이로 잡혀 있던 자막은 8초로 줄이고, 사용자가 손본 길이는 유지
    const lookedLikeFullClip = prevDur != null && Math.abs(prevDur - clipDur) < 0.2;
    let dur = DEFAULT_SUB_DURATION;
    if(prevDur != null && prevDur > 0 && !lookedLikeFullClip){
      dur = Math.max(0.5, prevDur);
    }
    // 클립보다 긴 자막도 허용(수동 편집 잔여). 자동 배치 시작점만 클립에 맞춤.
    rows.push({
      start: Number(clipAt.toFixed(2)),
      end: Number((clipAt + dur).toFixed(2)),
      text,
      kind: prevRow?.kind || 'caption',
      lane: prevRow?.lane || 1,
      x: prevRow?.x,
      y: prevRow?.y,
    });
    t = Math.max(t + clipDur, clipAt + clipDur);
  });
  return rows;
}

function buildSrtContent(subs){
  return subs.map((s,i)=> `${i+1}\n${srtTimeFmt(s.start)} --> ${srtTimeFmt(s.end)}\n${s.text}\n`).join('\n');
}

// .srt 파일 내용을 파싱해서 [{start,end,text}] 배열로 변환
function parseSrtContent(text){
  const blocks = text.replace(/\r/g,'').trim().split(/\n\n+/);
  return blocks.map(block=>{
    const lines = block.split('\n').filter(Boolean);
    const timeLine = lines.find(l=>l.includes('-->'));
    if(!timeLine) return null;
    const [fromStr, toStr] = timeLine.split('-->').map(s=>s.trim());
    const textLines = lines.slice(lines.indexOf(timeLine)+1);
    return { start: srtTimeParse(fromStr), end: srtTimeParse(toStr), text: textLines.join(' ') };
  }).filter(Boolean);
}

async function analyzeVideoWithGemini(source, label='영상'){
  // source가 File이면 그대로, URL(AI 생성 클립)이면 먼저 Blob으로 가져옴
  const blob = (typeof source === 'string') ? await fetch(source).then(r=>r.blob()) : source;
  if(blob.size > 20 * 1024 * 1024){
    throw new Error(`${label}: 20MB 초과 영상은 지원 안 돼요. 압축해서 다시 올려주세요.`);
  }
  const b64 = await blobToBase64(blob);
  const url = geminiUrl('gemini-3.5-flash');
  const body = {
    contents: [{
      parts: [
        { text: `이 영상을 장면 단위로 분석해줘. 각 장면의 시작-끝 시간(초, 정수)과 내용을 아래
        JSON 배열 형식으로만 답해줘 (다른 텍스트 없이): [{"start":0,"end":3,"desc":"제품을 정면에서 보여줌"}]` },
        { inline_data: { mime_type: blob.type || 'video/mp4', data: b64 } }
      ]
    }]
  };
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!res.ok) throw new Error(`${label} 분석 실패: HTTP ${res.status}`);
  const data = await res.json();
  const text = data.candidates[0].content.parts[0].text;
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

function ensureVideoDuration(videoIndex){
  return new Promise((resolve)=>{
    const known = state.sourceDurations?.[videoIndex];
    if(known && isFinite(known) && known > 0){ resolve(known); return; }
    const src = state.sourceVideos[videoIndex];
    if(!src?.url){ resolve(0); return; }
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = ()=>{
      const d = v.duration || 0;
      if(d > 0) state.sourceDurations[videoIndex] = d;
      resolve(d);
    };
    v.onerror = ()=> resolve(0);
    v.src = src.url;
  });
}

/** 비디오 URL에서 특정 시각 JPEG 프레임 캡처 (대용량 영상용) */
function captureFrameAt(url, timeSec){
  return new Promise((resolve, reject)=>{
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    let done = false;
    const finish = (fn, arg)=>{
      if(done) return;
      done = true;
      try{ v.removeAttribute('src'); v.load(); }catch(_){}
      fn(arg);
    };
    v.onloadedmetadata = ()=>{
      const dur = v.duration || 0;
      const t = Math.min(Math.max(0.05, timeSec), Math.max(0.05, dur > 0 ? dur - 0.08 : timeSec));
      try{ v.currentTime = t; }catch(e){ finish(reject, e); }
    };
    v.onseeked = ()=>{
      try{
        const vw = v.videoWidth || 640, vh = v.videoHeight || 360;
        const w = 480, h = Math.max(1, Math.round(w * vh / vw));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(v, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.7);
        finish(resolve, { b64: dataUrl.split(',')[1], time: Number(v.currentTime.toFixed(1)), mime:'image/jpeg' });
      }catch(e){ finish(reject, e); }
    };
    v.onerror = ()=> finish(reject, new Error('프레임 캡처 실패'));
    v.src = url;
  });
}

/** 대용량 영상: 키프레임을 뽑아 장면(가변 길이) 쇼핑쇼츠 후보 추천 */
async function suggestShoppingShortsFromKeyframes(videoIndex, duration){
  if(!state.keys.gemini) throw new Error('설정에서 Gemini API 키를 입력해주세요.');
  const src = state.sourceVideos[videoIndex];
  if(!src?.url) throw new Error('영상 URL이 없어요.');
  const dur = Math.max(8, duration || 0);
  // 세밀 분석: 샘플을 더 촘촘히 (대사·장면 전환 놓치지 않도록)
  const count = dur > 3600 ? 20 : dur > 1200 ? 16 : dur > 300 ? 14 : dur > 120 ? 12 : 10;
  const times = [];
  for(let i=0;i<count;i++){
    // 초반·중반·후반을 고르게 + 오프닝/엔딩 가중
    const u = (i + 0.5) / count;
    const bias = u < 0.2 ? u * 0.7 : u > 0.85 ? 0.75 + (u-0.85)*1.6 : u;
    times.push(Number((Math.min(0.97, Math.max(0.02, bias)) * dur).toFixed(1)));
  }
  const frames = [];
  for(let i=0;i<times.length;i++){
    setStatus('suggest-analyze','loading', `장면 샘플 ${i+1}/${times.length} 캡처 중...`);
    try{
      frames.push(await captureFrameAt(src.url, times[i]));
    }catch(_){ /* 일부 실패 무시 */ }
  }
  if(frames.length < 3) throw new Error('키프레임을 충분히 뽑지 못했어요.');

  const parts = [
    { text: `영상 총 길이 약 ${Math.round(dur)}초. 아래는 시간 순 스틸컷이야(각 이미지 앞에 시각 초가 있음).
오디오 트랙은 이 모드에서 직접 들리지 않으니, 화면 자막·입모양·장면 문맥으로 대사·음성을 추정하고 dialogue/voice에 반영해(추정은 "추정:" 접두).
장면이 갑자기 바뀌는 지점·제품이 크게 보이는 지점·표정이 강한 지점을 쇼츠 컷 후보로 우선해.
${SUGGEST_SHOPPING_PROMPT}
- start/end는 초(소수 1자리), 반드시 0~${Math.round(dur)} 범위
- 인접 스틸 사이를 하나의 구간으로 묶을 때, 제품/훅이 유지되는 구간만 잡아` }
  ];
  frames.forEach(f=>{
    parts.push({ text: `시각 ${f.time}초` });
    parts.push({ inline_data: { mime_type: f.mime, data: f.b64 } });
  });

  setStatus('suggest-analyze','loading','샘플 장면으로 쇼핑 연결성·쇼츠 컷 매력을 평가하는 중...');
  const { data, via } = await fetchGeminiGenerateContent(
    { contents:[{ parts }] },
    { model: resolveGeminiModel(), persistProxyFallback: true }
  );
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  if(!text) throw new Error(`키프레임 분석 응답이 비어 있어요 (${via}). 모델/키를 확인하거나 다시 시도해 주세요.`);
  return parseSuggestAiResponse(text, 'keyframe');
}

function normalizeSuggestSegments(raw, videoIndex, duration){
  if(!Array.isArray(raw)) return [];
  const dur = duration || 0;
  const MIN_SEG = 4;
  const MAX_SEG = 90;
  return raw.map((s,i)=>{
    let start = Math.max(0, Number(s.start) || 0);
    let end = Math.max(start + 1, Number(s.end) || (start + 12));
    if(dur > 0){
      start = Math.min(start, Math.max(0, dur - 2));
      end = Math.min(end, dur);
    }
    if(end - start < MIN_SEG) end = Math.min(dur || (start + MIN_SEG), start + MIN_SEG);
    if(end - start > MAX_SEG) end = start + MAX_SEG;
    const itemType = (s.itemType || s.category || '').toString().slice(0, 30);
    const itemName = (s.itemName || s.product || '').toString().slice(0, 60);
    const desc = (s.desc || [itemType, itemName].filter(Boolean).join(' · ') || `쇼츠 후보 장면 ${i+1}`).toString().slice(0, 160);
    const source = s.source || 'ai';
    const fallback = defaultSuggestMeta(i, desc, source, itemType || s.role || '');
    const shoppingScore = Math.max(0, Math.min(100, Number(s.shoppingScore ?? s.shopScore ?? 0) || 0));
    const cutScore = Math.max(0, Math.min(100, Number(s.cutScore ?? s.shortsScore ?? 0) || 0));
    return {
      videoIndex,
      start: Number(start.toFixed(1)),
      end: Number(end.toFixed(1)),
      desc,
      itemType,
      itemName,
      style: (s.style || s.sceneStyle || s.visualStyle || '').toString().slice(0, 40),
      shoppingScore,
      cutScore,
      dialogue: (s.dialogue || s.speech || s.caption || '').toString().slice(0, 220),
      voice: (s.voice || s.audio || s.voiceNote || '').toString().slice(0, 120),
      hook: (s.hook || s.interest || '').toString().slice(0, 180),
      role: (s.role || itemType || '').toString().slice(0, 20),
      reason: (s.reason || fallback.reason).toString().slice(0, 260),
      value: (s.value || s.worth || fallback.value).toString().slice(0, 260),
      scriptTip: (s.scriptTip || s.script || fallback.scriptTip).toString().slice(0, 260),
      nextSteps: (s.nextSteps || s.direction || fallback.nextSteps).toString().slice(0, 260),
      source,
    };
  }).filter(s=>s.end > s.start)
    // 쇼핑 연결·컷 매력 둘 다 낮은 구간은 뒤로, 높은 것 우선
    .sort((a,b)=>{
      const sa = (a.shoppingScore||0) + (a.cutScore||0);
      const sb = (b.shoppingScore||0) + (b.cutScore||0);
      if(sb !== sa) return sb - sa;
      return a.start - b.start;
    })
    .slice(0, 12);
}

/** AI 응답: {found,videoSummary,segments} 또는 배열(하위호환) */
function normalizeVideoSummary(raw){
  const s = (raw && typeof raw === 'object') ? raw : {};
  const lvl = (v)=>{
    const t = String(v||'').toLowerCase();
    if(t === 'high' || t === '높음' || t === '상') return 'high';
    if(t === 'low' || t === '낮음' || t === '하') return 'low';
    if(t === 'mid' || t === 'medium' || t === '중간' || t === '중') return 'mid';
    return t || 'mid';
  };
  return {
    shoppingLink: lvl(s.shoppingLink || s.shopping),
    shoppingLinkReason: String(s.shoppingLinkReason || s.shopReason || '').slice(0, 220),
    shortsCutPotential: lvl(s.shortsCutPotential || s.cutPotential || s.shortsCut),
    shortsCutReason: String(s.shortsCutReason || s.cutReason || '').slice(0, 220),
    overallStyle: String(s.overallStyle || s.style || '').slice(0, 40),
    dialogueNote: String(s.dialogueNote || s.dialogue || '').slice(0, 260),
    voiceNote: String(s.voiceNote || s.voice || '').slice(0, 200),
    sceneNote: String(s.sceneNote || s.scene || '').slice(0, 220),
  };
}

function parseSuggestAiResponse(text, source='ai'){
  const cleaned = String(text||'').replace(/```json|```/g,'').trim();
  let parsed;
  try{ parsed = JSON.parse(cleaned); }
  catch(_){
    const m = cleaned.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
    if(!m) throw new Error('AI 응답을 해석하지 못했어요.');
    parsed = JSON.parse(m[0]);
  }
  const pack = (found, segments, message, summary)=>({
    found: !!found,
    segments: (segments||[]).map(s=>({ ...s, source })),
    message: String(message||''),
    videoSummary: normalizeVideoSummary(summary),
  });

  if(Array.isArray(parsed)){
    if(!parsed.length){
      return pack(false, [], '분석은 완료됐어요. 쇼핑 연결·쇼츠 컷으로 쓸 장면을 찾지 못했어요.', null);
    }
    return pack(true, parsed, '', null);
  }
  if(parsed && typeof parsed === 'object'){
    const summary = parsed.videoSummary || parsed.summary || null;
    if(parsed.found === false || parsed.none === true || parsed.empty === true){
      return pack(false, [], parsed.message || parsed.reason || '분석은 완료됐어요. 쇼핑 쇼츠로 쓸 장면을 찾지 못했어요.', summary);
    }
    const segs = Array.isArray(parsed.segments) ? parsed.segments
      : (Array.isArray(parsed.scenes) ? parsed.scenes : null);
    if(segs){
      if(!segs.length){
        return pack(false, [], parsed.message || '분석은 완료됐어요. 쓸 만한 장면을 찾지 못했어요.', summary);
      }
      return pack(true, segs, parsed.message || '', summary);
    }
  }
  throw new Error('AI 응답 형식이 올바르지 않아요.');
}


async function suggestShoppingShortsWithGemini(source, label='영상', duration=0){
  let blob;
  try{
    blob = (typeof source === 'string') ? await fetch(source).then(r=>{
      if(!r.ok) throw new Error(`영상 파일을 읽지 못했어요 (HTTP ${r.status})`);
      return r.blob();
    }) : source;
  }catch(e){
    throw new Error(e?.message || '영상 파일을 읽지 못했어요.');
  }
  if(blob.size > 12 * 1024 * 1024){
    throw new Error('LARGE_FILE');
  }
  if(!state.keys.gemini) throw new Error('설정에서 Gemini API 키를 입력해주세요.');
  const b64 = await blobToBase64(blob);
  const durHint = duration > 0 ? `영상 길이는 약 ${Math.round(duration)}초야. ` : '';
  const prompt = `${durHint}이 영상에는 화면과 오디오가 함께 있어. 대사·나레이션·BGM·장면 전환을 모두 듣고 보면서 분석해.
${SUGGEST_SHOPPING_PROMPT}`;
  const { data, via } = await fetchGeminiGenerateContent(
    { contents:[{ parts:[
      { text: prompt },
      { inline_data: { mime_type: blob.type || 'video/mp4', data: b64 } }
    ]}] },
    { model: resolveGeminiModel(), persistProxyFallback: true }
  );
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  if(!text) throw new Error(`${label} 분석 응답이 비어 있어요 (${via}).`);
  return parseSuggestAiResponse(text, 'ai');
}

/**
 * @returns {{segments:Array, emptyMessage:string, kind?:'ok'|'empty'|'error'}}
 */
async function runShoppingShortsAnalysis(videoIndex){
  const src = state.sourceVideos[videoIndex];
  if(!src) throw new Error('분석할 영상이 없어요.');
  if(src.isImage) throw new Error('이미지는 구간 분석 대상이 아니에요. 영상을 불러와주세요.');
  setStatus('suggest-analyze','loading','영상 길이 확인 중...');
  const duration = await ensureVideoDuration(videoIndex);
  const source = src.file || src.url;
  let blobSize = 0;
  try{
    if(src.file?.size) blobSize = src.file.size;
    else if(typeof source === 'string'){
      const head = await fetch(source, { method:'HEAD' }).catch(()=>null);
      blobSize = Number(head?.headers?.get('content-length') || 0);
    }
  }catch(_){}

  const NONE = '분석은 완료됐어요. 이 영상에서는 옷·귀걸이·신발·악세서리 등 쇼핑 쇼츠로 연결할 상품 장면을 찾지 못했어요.';

  if(!String(state.keys.gemini||'').trim()){
    return {
      segments: [],
      kind: 'error',
      emptyMessage: '영상 구간 분석은 Gemini 고정입니다. Claude로는 영상 파일을 분석할 수 없어요. 설정에서 Gemini API 키를 입력한 뒤 다시 분석해 주세요.',
    };
  }

  let lastErr = null;
  // 긴 영상(2분↑)·12MB↑·크기 불명 → 전체 업로드 생략 (Failed to fetch/타임아웃 주원인)
  const preferKeyframes = !(blobSize > 0 && blobSize <= 12*1024*1024 && duration > 0 && duration <= 120);

  // 1) 짧은·작은 파일만 전체 영상 AI (Gemini 고정 — Claude 미사용)
  if(!preferKeyframes){
    try{
      setStatus('suggest-analyze','loading','Gemini로 대사·음성·장면을 분석해 쇼핑 연결·쇼츠 컷 후보를 찾는 중...');
      const result = await suggestShoppingShortsWithGemini(source, src.name, duration);
      if(!result.found) return { segments: [], kind: 'empty', emptyMessage: result.message || NONE, videoSummary: result.videoSummary || null };
      return { segments: normalizeSuggestSegments(result.segments, videoIndex, duration), kind: 'ok', emptyMessage: '', videoSummary: result.videoSummary || null };
    }catch(err){
      lastErr = err;
      if(err.message !== 'LARGE_FILE') console.warn(err);
    }
  }

  // 2) 긴 영상·대용량·1차 실패 → 키프레임 (Gemini 고정, 가짜 구간 생성 안 함)
  try{
    setStatus('suggest-analyze','loading',
      preferKeyframes
        ? `Gemini · 긴 영상(${fmtClock(duration)})이라 샘플 장면으로 상품을 찾는 중...`
        : 'Gemini · 샘플 장면으로 다시 분석 중...');
    const result = await suggestShoppingShortsFromKeyframes(videoIndex, duration);
    if(!result.found) return { segments: [], kind: 'empty', emptyMessage: result.message || NONE, videoSummary: result.videoSummary || null };
    return { segments: normalizeSuggestSegments(result.segments, videoIndex, duration), kind: 'ok', emptyMessage: '', videoSummary: result.videoSummary || null };
  }catch(err){
    console.warn(err);
    const merged = err?.message || lastErr?.message || String(err || lastErr || '');
    const info = classifySuggestFailure(new Error(merged));
    throw new Error(info.message);
  }
}

// 나레이션 음성을 제미나이로 분석해서, 주어진 대본 줄 순서 그대로 각 줄의 실제 시작/끝 시간(초)을 찾아줌
async function loadDirectionVoiceFiles(fileList){
  const files = Array.from(fileList || []).filter(f => f && ((f.type||'').startsWith('audio') || /\.(mp3|wav|m4a|aac|ogg)$/i.test(f.name||'')));
  if(!files.length) throw new Error('오디오 파일을 선택해 주세요.');
  const items = [];
  for(const f of files){
    const url = URL.createObjectURL(f);
    const duration = await getAudioDuration(url).catch(()=>0);
    items.push({ name: f.name, url, duration, file: f });
  }
  state.externalVoices = items;
  state.externalVoiceUrl = items.length === 1 ? items[0].url : null;
  state.externalVoiceMatched = false;
  return items;
}

async function matchExternalVoiceToScript(){
  ensureDirectionDefaultsOnScript();
  const dialogue = getDialogueRows(state.scriptTable);
  if(!dialogue.length) throw new Error('대사(vo) 씬이 없어요. 먼저 대사 씬을 지정하세요.');
  const voices = state.externalVoices || [];
  if(!voices.length && !state.externalVoiceUrl) throw new Error('먼저 음성 파일을 올려 주세요.');

  setStatus('voice-match','loading','대본과 음성 타이밍 맞추는 중...');

  if(voices.length >= dialogue.length){
    // 파일 개수 ≥ 대사 줄 → 순서대로 길이 1:1 (전체 트랙 대체는 단일 파일만 지원)
    for(let i=0;i<dialogue.length;i++){
      const dur = Math.max(0.8, Number(voices[i].duration) || 2);
      const row = state.scriptTable[dialogue[i]._i];
      row.targetDur = dur;
      row.externalVoiceUrl = voices[i].url;
    }
    state.externalVoiceUrl = null; // 다중 파일은 길이만 반영, TTS/단일 나레이션은 별도
    state.externalVoiceMatched = true;
    setStatus('voice-match','ok', `파일 ${dialogue.length}개 → 씬 길이 1:1 반영. (전체 나레이션 대체는 음성 1개 업로드 시)`);
    return;
  }

  // 단일(또는 적은) 파일 → 전체 나레이션으로 보고 줄별 분할
  const main = voices[0] || { url: state.externalVoiceUrl };
  state.externalVoiceUrl = main.url;
  const lines = dialogue.map(r => String(r.line||'').trim());
  try{
    const timings = await analyzeVoiceTimingForLines(main.url, lines);
    timings.forEach((tm, i)=>{
      const row = state.scriptTable[dialogue[i]._i];
      row.targetDur = Math.max(0.8, tm.end - tm.start);
    });
    state.externalVoiceMatched = true;
    setStatus('voice-match','ok', `음성 1개 → 대사 ${lines.length}줄 타이밍 매칭 완료`);
  }catch(err){
    const total = await getAudioDuration(main.url).catch(()=> lines.length * 2.2);
    const charCounts = lines.map(l => Math.max(6, l.replace(/\s/g,'').length));
    const totalChars = charCounts.reduce((a,b)=>a+b, 0) || 1;
    charCounts.forEach((c, i)=>{
      const row = state.scriptTable[dialogue[i]._i];
      row.targetDur = Math.max(1, (c / totalChars) * (total || lines.length * 2.2));
    });
    state.externalVoiceMatched = true;
    setStatus('voice-match','ok', `AI 타이밍 실패 → 글자 수 비율로 길이를 나눴어요. (${err.message||err})`);
  }
}

async function analyzeVoiceTimingForLines(voiceUrl, lines){
  const blob = await fetch(voiceUrl).then(r=>r.blob());
  if(blob.size > 20*1024*1024) throw new Error('20MB 넘는 오디오는 지원 안 돼요');
  const b64 = await blobToBase64(blob);
  const res = await fetch(geminiUrl('gemini-3.5-flash'), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{ parts:[
      { text:`이 오디오는 아래 대본 줄들을 순서대로 읽은 나레이션이야. 각 줄이 실제로 시작되고
      끝나는 시간(초, 소수 1자리)을 정확히 찾아줘. 대본:
      ${JSON.stringify(lines)}
      결과는 대본과 같은 개수, 같은 순서의 JSON 배열로만 답해줘 (다른 텍스트 없이):
      [{"start":0.0,"end":2.5}]` },
      { inline_data:{ mime_type: blob.type||'audio/mp3', data: b64 } }
    ]}] })
  });
  if(!res.ok) throw new Error('음성 타이밍 분석 실패: HTTP '+res.status);
  const data = await res.json();
  const txt = data.candidates[0].content.parts[0].text;
  const timings = JSON.parse(txt.replace(/```json|```/g,'').trim());
  if(!Array.isArray(timings) || timings.length !== lines.length){
    throw new Error('분석 결과 개수가 대본 줄 수와 달라요');
  }
  return timings;
}

// 오디오 파일(URL)의 실제 재생 길이(초)를 읽어옴
function getAudioDuration(url){
  return new Promise((resolve)=>{
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = ()=> resolve(a.duration || 0);
    a.onerror = ()=> resolve(0);
    a.src = url;
  });
}

// 장면 목록 + 대본 + (미리 TTS로 확정한) 줄별 목표 길이를 넣어서, 내용이 맞는 장면을 골라 편집안(EDL) 생성
async function buildEDLWithDurations(lines, lineDurations, allScenes){
  const url = geminiUrl('gemini-3.5-flash');
  const items = lines.map((line,i)=>({ line, targetSeconds: Number((lineDurations[i]||3).toFixed(1)) }));
  const prompt = `다음은 여러 소스 영상에서 추출한 장면 목록이야 (videoIndex는 몇 번째 영상인지, start/end는 그 영상 안에서의 초 단위 시간, desc는 장면 내용):
${JSON.stringify(allScenes)}

아래는 나레이션 대사 줄이고, targetSeconds는 이미 음성(TTS)으로 변환했을 때 그 줄이 실제로 차지하는 길이(초)야:
${JSON.stringify(items)}

각 대사 줄마다, 줄에 등장하는 행동·동작·사물·상황과 내용이 가장 잘 어울리는 장면을 위 장면 목록에서
하나씩 골라줘. 그 장면의 start를 시작점으로 잡아줘 (영상과 음성이 같이 재생됐을 때 자연스럽게
어울리도록, 내용이 일치하는 순간부터 시작하는 게 중요해). 아래 JSON 배열 형식으로만 답해줘
(다른 텍스트 없이, targetSeconds는 그대로 돌려줘도 됨):
[{"line":"","videoIndex":0,"start":0,"targetSeconds":3}]`;

  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:prompt}]}] }) });
  if(!res.ok) throw new Error('편집안 생성 실패: HTTP '+res.status);
  const data = await res.json();
  const text = data.candidates[0].content.parts[0].text;
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

// 장면 목록 + 대본을 넣어서 편집안(EDL) 생성
async function buildEDL(lines, allScenes, targetDuration){
  const url = geminiUrl('gemini-3.5-flash');
  const prompt = `다음은 여러 소스 영상에서 추출한 장면 목록이야 (videoIndex는 몇 번째 업로드 영상인지, start/end는 그 영상 안에서의 초 단위 시간):
${JSON.stringify(allScenes)}

아래 대본 줄들을 순서대로 표현하는 영상 편집안을 만들어줘. 전체 길이 합이 ${targetDuration}초 안팎이
되도록, 대사 줄 개수에 맞춰 구간 길이를 적절히 배분해줘 (한 줄당 보통 2~4초):
${JSON.stringify(lines)}

각 대사 줄마다 위 장면 목록 중 내용이 가장 잘 어울리는 것을 하나씩 골라서, 아래 JSON 배열
형식으로만 답해줘 (다른 텍스트 없이):
[{"line":"","videoIndex":0,"start":0,"end":3}]`;

  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:prompt}]}] }) });
  if(!res.ok) throw new Error('편집안 생성 실패: HTTP '+res.status);
  const data = await res.json();
  const text = data.candidates[0].content.parts[0].text;
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

// FFmpeg.wasm 인스턴스 (한 번만 로드해서 재사용)
let ffmpegInstance = null;
async function getFFmpeg(onProgress){
  if(ffmpegInstance) return ffmpegInstance;
  const { FFmpeg } = FFmpegWASM;
  const ffmpeg = new FFmpeg();
  const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  if(onProgress) ffmpeg.on('log', ({message}) => onProgress('FFmpeg: '+message.slice(0,60)));
  await ffmpeg.load({
    coreURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpegInstance = ffmpeg;
  return ffmpeg;
}

// EDL대로 실제 트리밍+합치기+오디오(나레이션/BGM) 믹싱
async function assembleFromSources(onProgress){
  const ffmpeg = await getFFmpeg(onProgress);
  // 사용자가 고른 출력 비율 (wasm 속도 고려해 720p 기준)
  const [W,H] = ASPECT_RATIOS[state.aspectRatio] || ASPECT_RATIOS['9:16'];

  onProgress('소스 파일 로딩 중...');
  for(let i=0;i<state.sourceVideos.length;i++){
    const sv = state.sourceVideos[i];
    const src = sv.file || sv.url; // 업로드 파일 또는 AI 생성 클립 URL
    // 이미지는 확장자를 유지해야 FFmpeg가 제대로 읽어요
    const ext = sv.isImage ? (sv.file?.type.includes('png') ? 'png' : 'jpg') : 'mp4';
    await ffmpeg.writeFile(`src${i}.${ext}`, await FFmpegUtil.fetchFile(src));
    sv._ffName = `src${i}.${ext}`;
  }

  // 각 구간을 잘라내면서 동시에 9:16 규격으로 통일 (해상도가 달라도 이어붙일 수 있게)
  onProgress('구간별로 자르고 규격 맞추는 중...');
  const segFiles = [];      // V1 메인 트랙 조각들
  const overlaySegs = [];   // V2·V3 오버레이 조각들
  const segAudioFiles = []; // V1 클립의 원본 오디오(볼륨 0이면 무음) 조각들
  let anyOrigAudio = false; // 볼륨을 준 클립이 하나라도 있는지
  for(let j=0;j<state.sourceEDL.length;j++){
    const seg = state.sourceEDL[j];
    const isOverlay = (seg.track||1) > 1;
    const dur = Math.max(0.5, seg.end - seg.start);
    const outName = `seg${j}.mp4`;
    const sv = state.sourceVideos[seg.videoIndex];
    const inName = sv._ffName || `src${seg.videoIndex}.mp4`;
    // 클립별 효과를 필터 체인으로 조립
    const chain = isOverlay
      ? [`scale=${Math.round(W*(seg.ovScale ?? 0.4))}:-2`, 'setsar=1']   // 오버레이는 축소만
      : [`scale=${W}:${H}:force_original_aspect_ratio=decrease`,
         `pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2:black`, 'setsar=1'];

    // 색보정 (밝기·대비·채도·감마)
    const br = seg.brightness ?? 0, ct = seg.contrast ?? 1;
    const sa = seg.saturation ?? 1, gm = seg.gamma ?? 1;
    if(br !== 0 || ct !== 1 || sa !== 1 || gm !== 1){
      chain.push(`eq=brightness=${br}:contrast=${ct}:saturation=${sa}:gamma=${gm}`);
    }
    // 색온도(따뜻하게/차갑게)·틴트(녹색/보라) — 하나의 colorbalance 필터로 처리
    const tp = seg.temp ?? 0, tn = seg.tint ?? 0;
    if(tp !== 0 || tn !== 0){
      chain.push(`colorbalance=rs=${tp.toFixed(2)}:bs=${(-tp).toFixed(2)}:gm=${tn.toFixed(2)}`);
    }

    // 속도 (setpts는 값이 반대 — 2배속이면 0.5)
    const spd = seg.speed ?? 1;
    if(spd !== 1) chain.push(`setpts=${(1/spd).toFixed(4)}*PTS`);

    const outDur = dur / spd; // 속도 적용 후 실제 길이
    // 페이드 인/아웃 (0.4초)
    const fd = 0.4;
    if(seg.fadeIn) chain.push(`fade=t=in:st=0:d=${fd}`);
    if(seg.fadeOut) chain.push(`fade=t=out:st=${Math.max(0,outDur-fd).toFixed(2)}:d=${fd}`);

    chain.push('fps=30');
    const vf = chain.join(',');

    let curOutName = outName;
    const args = sv.isImage
      ? ['-loop','1','-i', inName, '-t', String(outDur), '-an', '-vf', vf, '-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p', curOutName]
      : ['-ss', String(seg.start), '-i', inName, '-t', String(dur), '-an', '-vf', vf, '-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p', curOutName];
    await ffmpeg.exec(args);

    // 변환(위치·크기·회전·불투명도) — 값이 기본값이 아니면 검정 캔버스 위에 합성
    if(!isOverlay){
      const sx = (seg.scaleX ?? 100)/100, sy = (seg.scaleY ?? 100)/100;
      const rot = seg.rotation ?? 0, op = seg.opacity ?? 1;
      const txPct = seg.tx ?? 0, tyPct = seg.ty ?? 0;
      if(sx !== 1 || sy !== 1 || rot !== 0 || op !== 1 || txPct !== 0 || tyPct !== 0){
        const txPx = Math.round(W * txPct/100), tyPx = Math.round(H * tyPct/100);
        const rad = (rot * Math.PI/180).toFixed(4);
        const fgChain = [`scale=iw*${sx}:ih*${sy}`];
        if(rot !== 0) fgChain.push(`rotate=${rad}:fillcolor=black@0`);
        fgChain.push('format=rgba');
        if(op !== 1) fgChain.push(`colorchannelmixer=aa=${op.toFixed(2)}`);
        const xformOut = `xf${j}.mp4`;
        await ffmpeg.exec(['-f','lavfi','-i',`color=black:s=${W}x${H}:d=${outDur.toFixed(2)}:r=30`,
          '-i', curOutName,
          '-filter_complex', `[1:v]${fgChain.join(',')}[fg];[0:v][fg]overlay=(W-w)/2+${txPx}:(H-h)/2+${tyPx}:format=auto[out]`,
          '-map','[out]','-t', outDur.toFixed(2), '-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p', xformOut]);
        curOutName = xformOut;
      }
    }

    // 클립 오디오(원본 소리) — 볼륨을 0보다 크게 설정한 경우에만 추출, 그 외엔 무음으로 채워 동기화 유지
    if(!isOverlay){
      const vol = seg.volume ?? 0;
      const audioOut = `sega${j}.aac`;
      let extracted = false;
      if(vol > 0 && !sv.isImage){
        try{
          await ffmpeg.exec(['-ss', String(seg.start), '-i', inName, '-t', String(dur),
            '-vn', '-filter:a', `atempo=${spd.toFixed(2)},volume=${vol.toFixed(2)}`,
            '-ac','2','-ar','44100','-c:a','aac', audioOut]);
          // ffmpeg.exec()은 명령이 실패해도(예: 오디오 트랙 없음) 예외를 안 던지고 그냥 넘어갈 수 있어서,
          // 실제로 파일이 만들어졌는지 직접 확인해야 안전함
          const check = await ffmpeg.readFile(audioOut);
          extracted = check && check.length > 0;
        }catch(err){
          extracted = false; // 이 클립에 오디오 트랙이 없는 경우 등 — 아래에서 무음으로 대체
        }
      }
      if(extracted){
        anyOrigAudio = true;
      } else {
        await ffmpeg.exec(['-f','lavfi','-i','anullsrc=r=44100:cl=stereo','-t', outDur.toFixed(2), '-c:a','aac', audioOut]);
      }
      segAudioFiles.push(audioOut);
    }

    if(isOverlay){
      // 해당 오버레이 트랙이 숨김이면 건너뜀
      if(state.trackHidden[`v${seg.track}`]){ onProgress(`구간 처리 중 (${j+1}/${state.sourceEDL.length})...`); continue; }
      overlaySegs.push({ file: curOutName, at: seg.at ?? 0, dur: outDur,
                         scale: seg.ovScale ?? 0.4, pos: seg.ovPos ?? 'tr' });
    } else {
      segFiles.push(curOutName);
    }
    onProgress(`구간 처리 중 (${j+1}/${state.sourceEDL.length})...`);
  }
  if(!segFiles.length) throw new Error('메인 트랙(V1)에 클립이 없어요. 최소 1개는 V1에 넣어주세요.');

  // V1 클립들의 원본 오디오를 순서대로 이어붙임 (볼륨을 준 클립이 하나라도 있을 때만)
  let origAudioReady = false;
  if(anyOrigAudio && segAudioFiles.length){
    onProgress('원본 오디오 합치는 중...');
    const listA = segAudioFiles.map(f=>`file '${f}'`).join('\n');
    await ffmpeg.writeFile('listA.txt', new TextEncoder().encode(listA));
    await ffmpeg.exec(['-f','concat','-safe','0','-i','listA.txt','-c','copy','origaudio.aac']);
    origAudioReady = true;
  }

  onProgress('구간 이어붙이는 중...');
  const listContent = segFiles.map(f=>`file '${f}'`).join('\n');
  await ffmpeg.writeFile('list.txt', new TextEncoder().encode(listContent));
  await ffmpeg.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','concat.mp4']);

  // V2·V3 오버레이를 메인 영상 위에 겹치기
  let baseVideo = 'concat.mp4';
  if(overlaySegs.length){
    onProgress('오버레이 합성 중...');
    const posMap = {
      tl:'20:20', tr:'W-w-20:20', bl:'20:H-h-20', br:'W-w-20:H-h-20',
      c:'(W-w)/2:(H-h)/2', full:'0:0'
    };
    const inputs = ['-i', baseVideo];
    overlaySegs.forEach(o => inputs.push('-i', o.file));
    const chains = [];
    let prev = '0:v';
    overlaySegs.forEach((o,k)=>{
      const out = (k === overlaySegs.length-1) ? 'vov' : `ov${k}`;
      const xy = posMap[o.pos] || posMap.tr;
      chains.push(`[${prev}][${k+1}:v]overlay=${xy}:enable='between(t,${o.at},${(o.at+o.dur).toFixed(2)})'[${out}]`);
      prev = out;
    });
    await ffmpeg.exec([...inputs, '-filter_complex', chains.join(';'),
                       '-map','[vov]','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','overlaid.mp4']);
    baseVideo = 'overlaid.mp4';
  }

  // ---- 오디오/자막 합성 ----
  // 속도 효과를 반영한 최종 길이 (페이드아웃 타이밍 계산용)
  const totalOutDur = state.sourceEDL.filter(e=>(e.track||1)===1).reduce((s,e)=>
    s + Math.max(0.5, e.end - e.start) / (e.speed ?? 1), 0);
  const inputArgs = ['-i', baseVideo];
  const hasVoice = !!state.voiceUrl && !state.trackHidden.voice;
  const hasBgm = !!state.sourceBgm && !state.trackHidden.bgm;
  const hasSfx = !!state.sfxBedUrl && state.autoSfx !== false;

  // 오디오 소스를 최대 3개(원본 클립 소리·나레이션·배경음악)까지 동적으로 구성
  let nextInputIdx = 1; // 0번은 baseVideo
  const audioSources = [];
  if(origAudioReady){
    inputArgs.push('-i','origaudio.aac');
    audioSources.push({ inIdx: nextInputIdx++, volume: 1, fade:false });
  }
  if(hasVoice){
    onProgress('나레이션 준비 중...');
    const voiceBlob = await fetch(state.voiceUrl).then(r=>r.blob());
    await ffmpeg.writeFile('voice.mp3', await FFmpegUtil.fetchFile(voiceBlob));
    inputArgs.push('-i','voice.mp3');
    audioSources.push({ inIdx: nextInputIdx++, volume: state.voiceVolume ?? 1, fade:false });
  }
  if(hasBgm){
    onProgress('배경음악 준비 중...');
    await ffmpeg.writeFile('bgm.mp3', await FFmpegUtil.fetchFile(state.sourceBgm.file));
    inputArgs.push('-i','bgm.mp3');
    audioSources.push({ inIdx: nextInputIdx++, volume: state.bgmVolume ?? 0.25, fade: !!state.bgmFade });
  }
  if(hasSfx){
    onProgress('자동 효과음 준비 중...');
    const sfxBlob = await fetch(state.sfxBedUrl).then(r=>r.blob());
    await ffmpeg.writeFile('sfxbed.wav', await FFmpegUtil.fetchFile(sfxBlob));
    inputArgs.push('-i','sfxbed.wav');
    audioSources.push({ inIdx: nextInputIdx++, volume: 0.75, fade:false });
  }

  // 자막 필터 문자열 준비 — 본문 자막과 타이틀을 각자 스타일로 따로 구움
  let subFilter = '';
  if(state.burnSubtitles && !state.trackHidden.sub){
    onProgress('자막 파일 준비 중...');
    const allSubs = state.subtitles || computeTimelineFromEDL(state.sourceEDL);
    const toAss = (hex)=> '&H' + hex.replace('#','').match(/../g).reverse().join('').toUpperCase();
    const buildStyle = (st)=>{
      const align = st.position==='top' ? 8 : st.position==='middle' ? 5 : 2;
      const fontName = fontAssName(st.fontFamily).replace(/'/g, '');
      let s = `FontName=${fontName},FontSize=${st.fontSize},PrimaryColour=${toAss(st.color)},OutlineColour=${toAss(st.outline)},Bold=${st.bold?1:0},Alignment=${align},Outline=${st.outlineWidth ?? 2},Shadow=${st.glow ? Math.max(3, st.shadow||0) : (st.shadow||0)},MarginV=40`;
      if(st.bg) s += `,BorderStyle=3,BackColour=${toAss(st.bgColor)}`;
      return s;
    };
    const filters = [];
    const captionRows = allSubs.filter(s => s.kind !== 'title');
    const titleRows = allSubs.filter(s => s.kind === 'title');
    if(captionRows.length){
      await ffmpeg.writeFile('subs.srt', new TextEncoder().encode(buildSrtContent(captionRows)));
      filters.push(`subtitles=subs.srt:force_style='${buildStyle(state.subStyle)}'`);
    }
    if(titleRows.length){
      await ffmpeg.writeFile('titles.srt', new TextEncoder().encode(buildSrtContent(titleRows)));
      filters.push(`subtitles=titles.srt:force_style='${buildStyle(state.titleStyle)}'`);
    }
    subFilter = filters.join(',');
  }

  // ⚠ FFmpeg는 -vf 와 -filter_complex 를 동시에 못 씁니다.
  //   오디오 믹싱(filter_complex)이 필요하면 자막도 filter_complex 안에 넣어야 해요.
  const audioFilterFor = (s)=> s.fade
    ? `volume=${s.volume},afade=t=out:st=${Math.max(0,totalOutDur-2).toFixed(1)}:d=2`
    : `volume=${s.volume}`;

  const buildArgs = (withSubs)=>{
    const args = [...inputArgs];

    if(audioSources.length >= 2){
      const chains = [];
      if(withSubs) chains.push(`[0:v]${subFilter}[vout]`);
      const labels = [];
      audioSources.forEach((s,k)=>{
        chains.push(`[${s.inIdx}:a]${audioFilterFor(s)}[a${k}]`);
        labels.push(`[a${k}]`);
      });
      chains.push(`${labels.join('')}amix=inputs=${labels.length}:duration=first[aout]`);
      args.push('-filter_complex', chains.join(';'));
      args.push('-map', withSubs ? '[vout]' : '0:v', '-map', '[aout]');
    } else {
      if(withSubs) args.push('-vf', subFilter);
      args.push('-map','0:v');
      if(audioSources.length === 1){
        const s = audioSources[0];
        args.push('-map', `${s.inIdx}:a`, '-filter:a', audioFilterFor(s));
      }
    }
    args.push('-shortest','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','output.mp4');
    return args;
  };

  onProgress('오디오/자막 합성 중...');
  try{
    await ffmpeg.exec(buildArgs(!!subFilter));
  }catch(err){
    if(subFilter){
      onProgress('자막 굽기 실패 — 자막 없이 다시 시도합니다 (.srt는 따로 받아서 쓰세요)');
      await ffmpeg.exec(buildArgs(false));
    } else {
      throw err;
    }
  }

  const data = await ffmpeg.readFile('output.mp4');
  if(!data || data.length < 10000){
    throw new Error(`내보내기 결과가 비정상적으로 작아요 (${data?.length||0} bytes) — ffmpeg 처리 중 조용히 실패했을 수 있어요. 클립 개수를 줄이거나 다시 시도해주세요.`);
  }
  return URL.createObjectURL(new Blob([data.buffer], { type:'video/mp4' }));
}

function normalizeAnalysisResult(raw){
  const a = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  const arr = (v)=> Array.isArray(v) ? v.map(x => typeof x === 'string' ? x : (x?.label ? `${x.label}: ${x.value||''}` : String(x??''))).filter(Boolean) : [];
  const scores = a.scores && typeof a.scores === 'object' ? a.scores : {};
  const clamp = (n)=>{
    const x = Number(n);
    return Number.isFinite(x) ? Math.max(0, Math.min(100, Math.round(x))) : null;
  };
  const specs = Array.isArray(a.specs) ? a.specs.map(s=>({
    label: String(s?.label || s?.name || '').trim(),
    value: String(s?.value || s?.val || '').trim(),
    source: String(s?.source || '').trim(),
  })).filter(s=>s.label || s.value) : [];
  return {
    productName: String(a.productName || state.selectedCoupang?.name || '').trim(),
    brand: String(a.brand || '').trim(),
    category: String(a.category || '').trim(),
    subcategory: String(a.subcategory || '').trim(),
    target: String(a.target || '').trim(),
    priceNote: String(a.priceNote || '').trim(),
    summary: String(a.summary || '').trim(),
    specs,
    imageAnalysis: {
      summary: String(a.imageAnalysis?.summary || '').trim(),
      packaging: String(a.imageAnalysis?.packaging || '').trim(),
      visualHooks: arr(a.imageAnalysis?.visualHooks),
      qualitySignals: arr(a.imageAnalysis?.qualitySignals),
      shortsShotIdeas: arr(a.imageAnalysis?.shortsShotIdeas),
    },
    reviewAnalysis: {
      summary: String(a.reviewAnalysis?.summary || '').trim(),
      pros: arr(a.reviewAnalysis?.pros),
      cons: arr(a.reviewAnalysis?.cons),
      frequentPhrases: arr(a.reviewAnalysis?.frequentPhrases),
      trustNotes: String(a.reviewAnalysis?.trustNotes || '').trim(),
    },
    differentiators: arr(a.differentiators),
    buyTriggers: arr(a.buyTriggers),
    objections: arr(a.objections),
    shortsAngles: arr(a.shortsAngles),
    openingHooks: arr(a.openingHooks),
    scores: {
      visualAppeal: clamp(scores.visualAppeal),
      purchaseIntent: clamp(scores.purchaseIntent),
      contentPotential: clamp(scores.contentPotential),
      uploadScore: clamp(scores.uploadScore),
      rationale: String(scores.rationale || '').trim(),
    },
    searchKeywords: arr(a.searchKeywords),
    chineseKeywords: arr(a.chineseKeywords),
    unknowns: arr(a.unknowns),
    marketSignals: a.marketSignals && typeof a.marketSignals === 'object' ? a.marketSignals : null,
  };
}

function enrichAnalysisWithYoutube(videos, query){
  if(!state.analysis || !videos?.length) return;
  const views = videos.map(v => Number(v.viewCount||0));
  const comments = videos.map(v => Number(v.commentCount||0));
  const avg = (xs)=> xs.reduce((s,n)=>s+n,0) / (xs.length || 1);
  const top = Math.max(...views);
  const avgV = Math.round(avg(views));
  const avgC = Math.round(avg(comments));
  state.analysis.marketSignals = {
    youtubeTopViews: top,
    youtubeAvgViews: avgV,
    youtubeCommentAvg: avgC,
    query,
    note: top >= 100000
      ? '이 카테고리는 이미 조회수가 큰 영상이 있어요. 차별화된 훅·실사용 장면이 중요합니다.'
      : top >= 10000
        ? '중간 규모 조회수 콘텐츠가 있는 카테고리예요. 후기·비교 앵글이 잘 먹힐 수 있어요.'
        : '상위권 조회수가 낮은 편이에요. 니치이거나 아직 콘텐츠가 적은 주제일 수 있어요.',
  };
  // 시장 시그널로 업로드 점수 보정 (기존 AI 점수 유지)
  const base = Number(state.analysis.scores?.uploadScore);
  if(Number.isFinite(base)){
    let bonus = 0;
    if(top >= 100000) bonus = 8;
    else if(top >= 10000) bonus = 4;
    else if(top < 1000) bonus = -4;
    state.analysis.scores.uploadScore = Math.max(0, Math.min(100, base + bonus));
    if(!state.analysis.scores.rationale){
      state.analysis.scores.rationale = 'AI 점수 + 유튜브 상위 조회수 시그널을 반영했어요.';
    }
  }
}

async function fetchYoutubeBenchForAnalysis(){
  if(!String(state.keys.youtubeApiKey||'').trim()) return null;
  const query = buildHuntQuery(analysisSearchQuery(), 'youtube');
  const period = ensureSourceHunt().period || '7d';
  const videos = await youtubeSearch(query, 8, {
    period,
    order: 'relevance',
    duration: 'short',
    regionCode: 'KR',
    relevanceLanguage: 'ko',
  });
  state.youtubeResults = videos;
  state.youtubeSourceResults = videos;
  enrichAnalysisWithYoutube(videos, query);
  return videos;
}

규칙:

- searchKeywords는 유튜브 쇼츠 검색용 한국어 2~3개 (짧고 검색되게).

  },
  "reviewAnalysis":{

    "cons":["",""],
    "frequentPhrases":["",""],
    "trustNotes":""
  },
  "differentiators":["",""],
  "buyTriggers":["",""],
  "objections":["",""],
  "shortsAngles":["",""],

  "scores":{
    "visualAppeal":0,
    "purchaseIntent":0,
    "contentPotential":0,
    "uploadScore":0,
    "rationale":""
  },

}`
    + descText + reviewText + coupangNote;

/** 제품 분석 실행 (+ 선택 시 유튜브 조회수) */
async function runFullProductAnalysis({ withYoutube=false, statusIds=['analysis'] } = {}){
  state.productDescription = document.getElementById('productDesc')?.value || state.productDescription;
  state.categoryType = document.getElementById('categoryType')?.value || state.categoryType;
  state.reviewText = document.getElementById('reviewText')?.value || state.reviewText;
  if(!state.productImages.length && !(state.productDescription||'').trim() && !state.selectedCoupang){
    throw new Error('쿠팡 상품을 불러오거나, 제품 이미지/설명을 넣어주세요.');
  }
  // 쿠팡만 불러온 뒤 textarea가 비어 보이는 경우 대비
  if(!(state.productDescription||'').trim() && state.selectedCoupang){
    state.productDescription = buildCoupangProductDescription(state.selectedCoupang);
  }
  const engine = textAiProviderLabel(getTextAiProvider());
  const setAll = (mode, msg)=> statusIds.forEach(id => setStatus(id, mode, msg));
  const geminiNote = (state.productImages?.length || (state.selectedSourceVideos||[]).length)
    ? ` (${engine} · 실패 시 Gemini)`
    : ` (${engine})`;
  setAll('loading', `상품 정보 분석 중...${geminiNote}`);
  const result = await callGeminiAnalysis();
  state.analysis = result;
  state.done.analysis = true;
  if(state.categoryType === 'auto' && result.category){
    const c = result.category;
    if(/식품|음식|먹|간식|음료/.test(c)) state.categoryType = 'food';
    else if(/뷰티|화장품|이미용|헤어|피부/.test(c)) state.categoryType = 'beauty';
    else if(/생활|주방|청소|수납|가전/.test(c)) state.categoryType = 'household';
  }
  // 분석에서 나온 한/중 검색 키워드로 플랫폼 탐색칸 갱신
  syncPlatformHuntKeywords(true);
  let doneMsg = '분석 완료 · 아래에서 리포트를 확인하세요';
  if(withYoutube){
    if(!String(state.keys.youtubeApiKey||'').trim()){
      doneMsg = '분석 완료 (YouTube API 키 없음 → 조회수 생략). 설정에서 키를 넣으면 조회수도 붙어요.';
    }else{
      setAll('loading', '분석 완료 · 유튜브 조회수 수집 중...');
      try{
        await fetchYoutubeBenchForAnalysis();
        doneMsg = `분석 완료 · 유튜브 ${(state.youtubeResults||[]).length}개 반영`;
      }catch(ytErr){
        doneMsg = `분석 완료 (유튜브: ${ytErr.message||'실패'})`;
      }
    }
  }
  render();
  setAll('ok', doneMsg);
  document.getElementById('analysisResultCard')?.scrollIntoView({ behavior:'smooth', block:'start' });
  return state.analysis;
}

function productAutoSearchQuery(value){
  const text = String(value || state.productDescription || state.selectedCoupang?.name || state.analysis?.productName || '').trim();
  if(state.selectedCoupang?.name) return cleanProductTitle(state.selectedCoupang.name).slice(0, 120);
  const line = text.split(/\n+/)
    .map(s => s.trim())
    .find(s => s && !/줄거리|스토리|장면|연출|광고|홍보|보여준다|등장|사용컷/i.test(s)) || text.split(/\n+/)[0] || text;
  return cleanProductTitle(line.replace(/^(제품명|상품명)\s*[:：]\s*/i, '')).slice(0, 120);
}

function normalizeCoupangProductList(result, query){
  const list = result?.data?.productData || (Array.isArray(result?.data) ? result.data : []);
  return list.map(p => {
    const name = p.productName || p.name || '';
    return {
      name,
      price: p.productPrice ?? p.price ?? null,
      image: p.productImage || p.imageUrl || '',
      url: p.productUrl || p.landingUrl || '',
      productId: p.productId || null,
      isRocket: !!p.isRocket,
      isFreeShipping: !!p.isFreeShipping,
      categoryName: p.categoryName || '',
      matchScore: titleMatchScore(query, name),
    };
  }).sort((a,b)=> (b.matchScore||0) - (a.matchScore||0));
}

function inferPrimaryProductKind(text=''){
  const s = String(text).toLowerCase();
  if(/suv|자동차|차량|승용차|트럭|전기차|car|vehicle/.test(s)) return 'car';
  if(/tv|텔레비전|모니터|스크린|노트북|태블릿|스피커|이어폰|헤드셋|전자/.test(s)) return 'electronics';
  if(/냉장고|세탁기|청소기|가습기|공기청정기|에어프라이어|전자레인지|가전/.test(s)) return 'appliance';
  return 'product';
}

function buildPrimaryProductNotes(){
  const a = state.analysis || {};
  const bits = [];
  if(a.summary) bits.push(a.summary);
  if(a.imageAnalysis?.summary) bits.push(a.imageAnalysis.summary);
  if(a.imageAnalysis?.packaging) bits.push('패키지/외형: ' + a.imageAnalysis.packaging);
  if(Array.isArray(a.specs) && a.specs.length){
    bits.push('스펙: ' + a.specs.slice(0,5).map(s=>[s.label,s.value].filter(Boolean).join(' ')).filter(Boolean).join(', '));
  }
  bits.push('제품 홍보 영상의 핵심 실물. 장면마다 실제 형태·크기·색상·비율을 유지.');
  return bits.join(' ');
}

async function ensurePrimaryProductPropForScene({ statusId='product-auto' } = {}){

      console.warn('product image upload failed', err);
    }
  }
  const wa = ensureWorldAssets();
  const slot = emptyPropSlot({
    id: 'primary-product',

    label: productName,
    brand: a.brand || '',

async function ensureProductSeedForAuto({ statusId='product-auto', allowStoryOnly=false, searchIfMissing=false } = {}){
  const brief = readProductBriefFromUi();
  if(!brief && !state.selectedCoupang && !state.productImages?.length){
    throw new Error('제품명과 홍보 줄거리, 또는 제품 이미지를 먼저 입력해주세요.');
  }

  if(state.productImages?.length){
    state.productAutoReferenceMode = 'product-image';
    return { source:'upload', hasProductImage:true, storyFirst:false };
  }

  if(state.selectedCoupang?.image){
    state.productAutoReferenceMode = 'product-image';
    setStatus(statusId, 'loading', '선택된 상품 이미지를 기준으로 준비 중...');
    const img = await fetchImageAsBase64(state.selectedCoupang.image);
    if(img){
      state.productImages = [img];
      state.productImageUrls = [];
      return { source:'selected-coupang', hasProductImage:true, storyFirst:false };
    }
    return { source:'selected-coupang-url', hasProductImage:true, storyFirst:false };
  }

  if(allowStoryOnly || !searchIfMissing){
    state.productAutoReferenceMode = 'story-first';
    setStatus(statusId, 'loading', '제품 이미지 없음: 입력한 스토리를 우선으로 구성합니다.');
    return { source:'story-first', hasProductImage:false, storyFirst:true };
  }

  const hasCoupangKeys = String(state.keys.coupangAccessKey||'').trim() && String(state.keys.coupangSecretKey||'').trim();
  if(!hasCoupangKeys){
    throw new Error('자동 제품 이미지 검색을 사용하려면 쿠팡 파트너스 API 키를 설정하거나, 제품 이미지를 직접 등록해주세요.');
  }

  const query = productAutoSearchQuery(brief);
  if(!query) throw new Error('제품명을 찾지 못했어요. 첫 줄에 정확한 상품명을 적어주세요.');
  state.coupangQuery = query;
  setStatus(statusId, 'loading', '쿠팡에서 실제 제품 이미지 검색 중...');
  const result = await coupangSearch(query, 5);
  if(result.rCode && result.rCode !== '0') throw new Error(String(result.rCode) + ': ' + (result.rMessage || '쿠팡 검색 실패'));
  const products = normalizeCoupangProductList(result, query);
  state.coupangResults = products;
  const picked = products.find(p => p.image) || products[0];
  if(!picked) throw new Error('제품 이미지를 찾지 못했습니다. 제품 이미지를 직접 등록한 뒤 다시 진행해주세요.');
  const userBrief = brief;
  await applyCoupangProduct(picked);
  state.productDescription = [userBrief, '', '[자동 매칭 상품]', buildCoupangProductDescription(picked)].filter(Boolean).join('\n');
  if(!state.productImages?.length && !picked.image){
    throw new Error('상품은 찾았지만 이미지가 없습니다. 제품 이미지를 직접 등록해주세요.');
  }
  state.productAutoReferenceMode = 'product-image';
  return { source:'coupang', product:picked, hasProductImage:true, storyFirst:false };
}

function preferredProductVariantFromBrief(brief=''){
  const s = String(brief).toLowerCase();
  if(/스토리|줄거리|이야기|반전|드라마|코믹|서스펜스|액션/.test(s)) return 'story';
  if(/정보|기능|스펙|비교|사용법|장점/.test(s)) return 'info';
  return 'purchase';
}

function compactStoryText(value, fallback=''){
  return String(value ?? fallback ?? '').replace(/\s+/g, ' ').trim();
}

function joinStoryParts(parts, sep=' · '){
  return (parts || []).map(v => compactStoryText(v)).filter(Boolean).join(sep);
}

function storyArrayText(value){
  if(Array.isArray(value)) return value.map(v => compactStoryText(v)).filter(Boolean).join(', ');
  return compactStoryText(value);
}
