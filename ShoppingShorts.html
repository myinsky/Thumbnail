/** 나레이션 음성: Typecast(한국어) → Google TTS → Higgsfield */
async function callNarrationVoice(scriptTable){
  const rows = Array.isArray(scriptTable) ? scriptTable : [{ line: String(scriptTable||'') }];
  const dialogue = rows
    .map(r => (typeof r === 'string' ? { line:r } : r))
    .filter(r => String(r.line||'').trim() && r.audio !== 'sfx');
  if(!dialogue.length) return { url:null, skipped:true, provider:'none' };

  // 1순위: 타입캐스트 — 줄별 톤/속도 적용 후 이어붙이기
  if(state.keys.typecastApiKey && resolveTypecastVoiceId()){
    try{
      return await callTypecastDialogueRows(dialogue);
    }catch(err){
      console.warn('타입캐스트 음성 실패, 다음 엔진으로:', err.message);
    }
  }

  const fullText = dialogue.map(r => r.line).join(' ');

  // 2순위: 구글 Cloud TTS (ko-KR)
  if(state.keys.googleTtsApiKey){
    try{
      return await callGoogleTtsVoice(fullText);
    }catch(err){
      console.warn('구글 TTS 실패, 힉스필드로 폴백:', err.message);
    }
  }

  // 3순위: 힉스필드 (보이스 ID가 있을 때만)
  if(state.keys.hfAudioModel && state.keys.hfAudioVoiceId){
    try{
      const output = await hfSubmit(state.keys.hfAudioModel, {
        prompt: fullText,
        text: fullText,
        variant: state.keys.hfAudioVariant || 'elevenlabs',
        voice_type: 'preset',
        voice_id: state.keys.hfAudioVoiceId,
      });
      const url = extractMediaUrl(output);
      if(url) return { url, provider:'higgsfield' };
    }catch(err){
      console.warn('힉스필드 음성 실패:', err.message);
    }
  }

  throw new Error('나레이션을 만들지 못했어요. Typecast API 키·보이스를 대본 설정에서 확인하거나 구글TTS를 연결해주세요.');
}
// 이전 이름 호환
async function callHiggsfieldVoice(scriptTable){
  return callNarrationVoice(scriptTable);
}

async function callGoogleTtsVoice(text){
  const res = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${state.keys.googleTtsApiKey}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      input:{ text },
      voice:{ languageCode:'ko-KR', name: state.keys.googleTtsVoice },
      audioConfig:{ audioEncoding:'MP3', speakingRate: state.keys.googleTtsRate } // 저장된 속도값 사용
    })
  });
  if(!res.ok){
    const body = await res.text().catch(()=>'');
    throw new Error(`구글 TTS 실패: ${res.status} ${body.slice(0,120)}`);
  }
  const data = await res.json();
  const byteChars = atob(data.audioContent);
  const bytes = new Uint8Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
  const blob = new Blob([bytes], { type:'audio/mp3' });
  return { url: URL.createObjectURL(blob), provider:'google-tts' };
}

async function callTypecastVoiceBlob(text, { emotion='smart', tempo, previousText='', nextText='' } = {}){
  if(!state.keys.typecastApiKey) throw new Error('설정에서 Typecast API 키를 입력해주세요.');
  if(!state.keys.typecastVoices.length) throw new Error('등록된 타입캐스트 보이스가 없어요.');
  const vid = resolveTypecastVoiceId();
  const chosen = state.keys.typecastVoices.find(v => v.id === vid) || state.keys.typecastVoices[0];
  if(!chosen?.id) throw new Error('보이스 ID가 비어있어요. 대본 설정에서 목소리를 고르세요.');
  state.keys.selectedTypecastVoice = chosen.id;

  const audioTempo = Math.min(2, Math.max(0.5, Number(tempo ?? state.keys.narrationTempo) || 1.15));
  const body = {
    voice_id: chosen.id,
    text: String(text||'').trim(),
    model: 'ssfm-v30',
    language: 'kor',
    output: { audio_format: 'mp3', audio_tempo: audioTempo },
  };
  if(emotion === 'smart'){
    body.prompt = {
      emotion_type: 'smart',
      previous_text: previousText || undefined,
      next_text: nextText || undefined,
    };
  }else if(emotion && emotion !== 'auto-scene'){
    body.prompt = {
      emotion_type: 'preset',
      emotion_preset: emotion,
      emotion_intensity: 1.2,
    };
  }

  const res = await fetch(typecastUrl('/v1/text-to-speech'), {
    method:'POST',
    headers: typecastHeaders(),
    body: JSON.stringify(body),
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`타입캐스트 호출 실패: ${res.status} ${errText.slice(0,120)}`);
  }
  return { blob: await res.blob(), voice: chosen.label, id: chosen.id };
}

/** 대사 줄마다 톤을 바꿔 생성한 뒤 mp3를 이어붙임 */
async function callTypecastDialogueRows(rows){
  const lines = rows.map(r => String(r.line||'').trim()).filter(Boolean);
  if(!lines.length) return { url:null, skipped:true, provider:'typecast' };
  const blobs = [];
  let voiceLabel = '';
  for(let i=0;i<lines.length;i++){
    const emotion = resolveNarrationEmotion(i, lines.length);
    const { blob, voice } = await callTypecastVoiceBlob(lines[i], {
      emotion,
      previousText: lines[i-1] || '',
      nextText: lines[i+1] || '',
    });
    voiceLabel = voice;
    blobs.push(blob);
  }
  const merged = new Blob(blobs, { type: 'audio/mpeg' });
  return { url: URL.createObjectURL(merged), provider:'typecast', voice: voiceLabel, lines: lines.length };
}

async function callTypecastVoice(text){
  const { blob, voice } = await callTypecastVoiceBlob(text, {
    emotion: state.keys.narrationEmotion === 'auto-scene' ? 'smart' : (state.keys.narrationEmotion || 'smart'),
  });
  return { url: URL.createObjectURL(blob), provider:'typecast', voice };
}

let vpResizeDrag = null;
let vpVResizeDrag = null;

function clampTimelinePanelH(h){
  const vp = document.querySelector('.vp');
  const header = document.querySelector('.vp-header');
  const editBar = document.querySelector('.vp-edit-bar');
  const minTl = 140;
  const minBody = 180;
  const resizerH = 5;
  if(!vp) return Math.max(minTl, Math.round(Number(h) || minTl));
  const fixed = (header?.offsetHeight || 44) + (editBar?.offsetHeight || 56) + resizerH;
  const avail = Math.max(minTl + minBody, vp.clientHeight - fixed);
  return Math.max(minTl, Math.min(avail - minBody, Math.round(Number(h) || minTl)));
}

function applyTimelinePanelHeight(h, { persist = true } = {}){
  const vp = document.querySelector('.vp');
  if(!vp) return;
  if(h == null || h === '' || !Number.isFinite(Number(h))){
    if(persist) state.tlPanelH = null;
    vp.style.removeProperty('--vp-tl-h');
    vp.classList.remove('tl-h-custom');
    return;
  }
  const clamped = clampTimelinePanelH(h);
  if(persist) state.tlPanelH = clamped;
  vp.style.setProperty('--vp-tl-h', clamped + 'px');
  vp.classList.add('tl-h-custom');
}

document.addEventListener('mousedown', (e)=>{
  const handle = e.target.closest?.('[data-vp-resize]');
  if(!handle || state.current !== 'studio') return;
  const kind = handle.dataset.vpResize;
  e.preventDefault();

  if(kind === 'timeline'){
    const vp = document.querySelector('.vp');
    const tl = document.querySelector('.vp-timeline-wrap');
    if(!vp || !tl) return;
    vpVResizeDrag = {
      startY: e.clientY,
      startH: tl.offsetHeight,
      el: handle,
      vp,
    };
    handle.classList.add('active');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    return;
  }

  vpResizeDrag = {
    kind,
    startX: e.clientX,
    startW: kind === 'panel'
      ? Math.min(680, Math.max(280, Number(state.panelW) || 400))
      : Math.min(600, Math.max(260, Number(state.inspW) || 380)),
    el: handle,
  };
  handle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e)=>{
  if(vpVResizeDrag){
    const dy = e.clientY - vpVResizeDrag.startY;
    // 경계선을 위로 → 타임라인 확대, 아래로 → 축소
    applyTimelinePanelHeight(vpVResizeDrag.startH - dy);
    syncPreviewMonitorSize();
    return;
  }
  if(!vpResizeDrag) return;
  const dx = e.clientX - vpResizeDrag.startX;
  if(vpResizeDrag.kind === 'panel'){
    state.panelW = Math.min(680, Math.max(280, vpResizeDrag.startW + dx));
  }else{
    state.inspW = Math.min(600, Math.max(260, vpResizeDrag.startW - dx));

  const body = document.querySelector('.vp-body');

    body.style.setProperty('--vp-insp-w', (state.inspW || 380) + 'px');

});
document.addEventListener('mouseup', ()=>{

function parseTlDrop(spec){
  // "v:2" | "t:1" | "a:1" | legacy "1"
  if(spec == null || spec === '') return null;
  if(/^\d+$/.test(spec)) return { kind:'v', n: Number(spec) };
  const m = String(spec).match(/^(v|t|a):(\d+)$/i);
  if(!m) return null;
  return { kind: m[1].toLowerCase(), n: Number(m[2]) };
}

/** 트랙 바디 위 드롭 X → 타임라인 초 */
function tlTimeFromClientX(bodyEl, clientX){
  if(!bodyEl) return Number(state.playhead) || 0;
  const rect = bodyEl.getBoundingClientRect();
  return Math.max(0, Number(((clientX - rect.left) / timelinePPS()).toFixed(2)));
}

// 미디어·추천 장면·클립·자막 → 타임라인 드래그
document.addEventListener('dragstart', (e)=>{
  if(e.target.closest?.('button, input, label, a, .vp-sub-edge')){
    e.preventDefault();
    return;
  }
  const sug = e.target.closest?.('[data-drag-suggest]');
  if(sug){
    e.dataTransfer.setData('text/sss-suggest', sug.dataset.dragSuggest);
    e.dataTransfer.effectAllowed = 'copy';
    return;
  }
  const edlDrag = e.target.closest?.('[data-drag-edl]');
  if(edlDrag){
    e.dataTransfer.setData('text/sss-edl', edlDrag.dataset.dragEdl);
    e.dataTransfer.effectAllowed = 'move';
    return;
  }
  const subDrag = e.target.closest?.('[data-drag-sub]');
  if(subDrag){
    e.dataTransfer.setData('text/sss-sub', subDrag.dataset.dragSub);
    e.dataTransfer.effectAllowed = 'move';
    return;
  }
  const card = e.target.closest?.('[data-drag-source]');
  if(!card) return;
  e.dataTransfer.setData('text/sss-source', card.dataset.dragSource);
  e.dataTransfer.effectAllowed = 'copy';
});
document.addEventListener('dragover', (e)=>{
  const zone = e.target.closest?.('#vpDropZone');
  if(zone){
    e.preventDefault();
    zone.classList.add('over');
    return;
  }
  const tl = e.target.closest?.('[data-tl-drop]');
  if(tl){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';

  }
});
document.addEventListener('dragleave', (e)=>{
  const zone = e.target.closest?.('#vpDropZone');
  if(zone) zone.classList.remove('over');
  const tl = e.target.closest?.('[data-tl-drop]');
  if(tl && !tl.contains(e.relatedTarget)) tl.classList.remove('tl-drop-over');
});
document.addEventListener('drop', async (e)=>{
  const tl = e.target.closest?.('[data-tl-drop]');
  if(tl){
    e.preventDefault();
    tl.classList.remove('tl-drop-over');
    const drop = parseTlDrop(tl.dataset.tlDrop);
    if(!drop) return;

    // 기존 클립을 다른 영상 줄로 이동(수동이면 드롭 위치로 at 갱신)
    const edlRaw = e.dataTransfer.getData('text/sss-edl');
    if(edlRaw !== '' && edlRaw != null && drop.kind === 'v'){
      const idx = Number(edlRaw);
      const clip = state.sourceEDL?.[idx];
      if(clip){
        clip.track = Math.max(1, Math.min(MAX_VIDEO_TRACKS, drop.n));
        if(isTlManual() || clip.track > 1){
          clip.at = tlTimeFromClientX(tl, e.clientX);
        }
        state.selectedEdlIndex = idx;
        if(!isTlManual() && clip.track === 1) snapMainClipsTogether();
        render();
      }
      return;
    }

    // 자막 블록을 다른 자막 줄로 이동 — 영상과 무관하게 위치만 조정
    const subMoveRaw = e.dataTransfer.getData('text/sss-sub');
    if(subMoveRaw !== '' && subMoveRaw != null && drop.kind === 't'){
      const idx = Number(subMoveRaw);
      const sub = state.subtitles?.[idx];
      if(sub){
        const dur = Math.max(0.5, (Number(sub.end) || 0) - (Number(sub.start) || 0));
        const start = tlTimeFromClientX(tl, e.clientX);
        sub.lane = Math.max(1, Math.min(MAX_SUB_LANES, drop.n));
        sub.start = start;
        sub.end = Number((start + dur).toFixed(2));
        state.selectedSubIndex = idx;
        render();
      }
      return;
    }

    // 자막 줄에 미디어/추천을 드롭하면 그 줄에 새 자막 생성
    if(drop.kind === 't'){
      const sugRaw = e.dataTransfer.getData('text/sss-suggest');
      if(sugRaw !== '' && sugRaw != null){
        const seg = (state.suggestedSegments || [])[Number(sugRaw)];
        if(seg){
          addSubtitleAt({
            start: seg.start, end: seg.end,
            text: seg.desc || '', kind: 'caption', lane: drop.n,
          });
          render();
        }
        return;
      }
      addSubtitleAt({ kind:'caption', lane: drop.n, start: state.playhead || 0 });
      state.workspace = 'graphic';
      state.inspTab = 'sub';
      render();
      return;
    }

    if(drop.kind === 'a'){
      // 오디오 줄은 파일 드롭만 허용
      return;
    }

    // 영상 줄: 추천 구간 / 소스 미디어
    const dropAt = tlTimeFromClientX(tl, e.clientX);
    const sugRaw = e.dataTransfer.getData('text/sss-suggest');
    if(sugRaw !== '' && sugRaw != null){
      try{
        const si = Number(sugRaw);
        addSuggestSegmentToTimeline(si);
        const clip = state.sourceEDL?.[state.selectedEdlIndex];
        if(clip){
          clip.track = drop.n;
          if(isTlManual() || drop.n > 1) clip.at = dropAt;
        }
        state.selectedSuggestIndex = si;
        if(!isTlManual() && drop.n === 1) snapMainClipsTogether();
        render();
      }catch(err){
        alert(err.message || String(err));
      }
      return;
    }
    const raw = e.dataTransfer.getData('text/sss-source');
    if(raw === '' || raw == null) return;
    const i = Number(raw);
    if(!state.sourceVideos[i]) return;
    try{
      const range = await resolveClipRangeForSource(i);
      const extra = { track: drop.n };
      if(isTlManual() || drop.n > 1) extra.at = dropAt;
      pushClipToTimeline(i, range, extra);
      if(!isTlManual() && drop.n === 1) snapMainClipsTogether();
      render();
    }catch(err){
      alert(err.message || String(err));
    }
    return;
  }
  const zone = e.target.closest?.('#vpDropZone');
  if(!zone) return;
  e.preventDefault();
  zone.classList.remove('over');
  const files = Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('video/')||f.type.startsWith('image/'));
  const remaining = MAX_SOURCE_VIDEOS - state.sourceVideos.length;
  if(remaining <= 0){ alert(`최대 ${MAX_SOURCE_VIDEOS}개까지만 업로드할 수 있어요.`); return; }
  const before = state.sourceVideos.length;
  files.slice(0, remaining).forEach(file=>{
    const isImage = file.type.startsWith('image/');
    state.sourceVideos.push({ file, name: file.name, url: URL.createObjectURL(file), isImage });
  });
  if(state.activeSourceIndex == null && state.sourceVideos.length > before){
    state.activeSourceIndex = before;
  }
  state.previewMode = 'timeline';
  render();
});

document.addEventListener('timeupdate', (e)=>{
  if(e.target.id !== 'nlePreviewVideo') return;
  const tc = document.getElementById('nlePreviewTC');
  if(tc) tc.textContent = fmtClock(e.target.currentTime);
  // 추천 구간 재생 시 끝에서 자동 정지
  const range = state.previewRange;
  if(range && range.end != null && e.target.currentTime >= Number(range.end) - 0.05){
    e.target.pause();
    try{ e.target.currentTime = Number(range.end); }catch(_){}
  }else if(!range && e.target.dataset.clipEnd != null){
    // 프로그램 모니터는 타임라인 클립 = 재생 구간. 아웃점에서 멈춰 진행 표시와 맞춤
    const outAt = Number(e.target.dataset.clipEnd);
    if(Number.isFinite(outAt) && e.target.currentTime >= outAt - 0.05){
      e.target.pause();
      try{ e.target.currentTime = outAt; }catch(_){}
      const btn = document.getElementById('nlePlayPause');
      if(btn) btn.textContent = '▶';
    }
  }
  refreshCaptionOverlay();
  // rAF 루프가 없을 때(일시정지 중 탐색 등)도 진행 막대를 맞춰줌
  if(!tlProgressRaf) paintTimelineProgress();
}, true);

// 미리보기 영상 — 드래그 이동 · 핸들로 가로/세로 자유 조절
let videoXformDrag = null;
document.addEventListener('mousedown', (e)=>{
  if(e.target.closest?.('.vp-caption-box, [data-sub-trim], .vp-xform-bar')) return;
  const handle = e.target.closest?.('[data-vxf]');
  const layer = e.target.closest?.('#vpMediaLayer[data-video-xform]');
  if(!layer || !layer.classList.contains('editable')) return;
  if(e.target.closest?.('.vp-caption-layer') && !handle) return;
  const xf = getActiveXform();
  const mon = layer.closest('.vp-monitor');
  if(!mon || !xf) return;
  const rect = mon.getBoundingClientRect();
  videoXformDrag = {
    mode: handle ? handle.dataset.vxf : 'move',
    xf,
    startX: e.clientX,
    startY: e.clientY,
    startTx: xf.tx ?? 0,
    startTy: xf.ty ?? 0,
    startSx: xf.scaleX ?? 100,
    startSy: xf.scaleY ?? 100,
    w: rect.width || 1,
    h: rect.height || 1,
    layer,
  };
  e.preventDefault();
});
document.addEventListener('mousemove', (e)=>{
  if(!videoXformDrag) return;
  const d = videoXformDrag;
  const dx = e.clientX - d.startX;
  const dy = e.clientY - d.startY;
  const xf = d.xf;
  if(d.mode === 'move'){
    xf.tx = Number((d.startTx + (dx / d.w) * 100).toFixed(1));
    xf.ty = Number((d.startTy + (dy / d.h) * 100).toFixed(1));
  }else{
    const sxDelta = (dx / d.w) * 120;
    const syDelta = (dy / d.h) * 120;
    let sx = d.startSx, sy = d.startSy;
    const m = d.mode;
    if(m === 'e' || m === 'ne' || m === 'se') sx = d.startSx + sxDelta;
    if(m === 'w' || m === 'nw' || m === 'sw') sx = d.startSx - sxDelta;
    if(m === 's' || m === 'se' || m === 'sw') sy = d.startSy + syDelta;
    if(m === 'n' || m === 'ne' || m === 'nw') sy = d.startSy - syDelta;
    if(xf.lockAspect){
      const uniform = (m === 'e' || m === 'w') ? sx : (m === 'n' || m === 's') ? sy : (sx + sy) / 2;
      sx = uniform; sy = uniform;
    }
    xf.scaleX = Math.max(10, Math.min(300, Math.round(sx)));
    xf.scaleY = Math.max(10, Math.min(300, Math.round(sy)));
  }
  applyXformToPreviewEl(d.layer, xf);
  // 인스펙터 숫자 동기화
  const map = { tx:'inspTx', ty:'inspTy', scaleX:'inspScaleX', scaleY:'inspScaleY' };
  Object.entries(map).forEach(([key, id])=>{
    const r = document.getElementById(id), n = document.getElementById(id+'Num');
    if(r) r.value = xf[key];
    if(n) n.value = Number(xf[key]).toFixed(0);
  });
});
document.addEventListener('mouseup', ()=>{
  videoXformDrag = null;
});

// 타임라인 자막 양끝 길이 조절
let subTrimDrag = null;
document.addEventListener('mousedown', (e)=>{
  if(videoXformDrag) return;
  const edge = e.target.closest?.('[data-sub-trim]');
  if(edge){
    const i = Number(edge.dataset.subTrimI);
    const sub = state.subtitles?.[i];
    if(!sub) return;
    const body = edge.closest('.vp-track-body');
    if(!body) return;
    state.selectedSubIndex = i;
    state.tlFocus = 'sub';
    subTrimDrag = {
      index: i,
      edge: edge.dataset.subTrim, // start | end
      body,
      pps: timelinePPS(),
    };
    e.preventDefault();
    e.stopPropagation();
    return;
  }
});
document.addEventListener('mousemove', (e)=>{
  if(!subTrimDrag) return;
  const sub = state.subtitles?.[subTrimDrag.index];
  if(!sub) return;
  const rect = subTrimDrag.body.getBoundingClientRect();
  const t = Math.max(0, (e.clientX - rect.left) / subTrimDrag.pps);
  const minDur = 0.5;
  if(subTrimDrag.edge === 'start'){
    sub.start = Number(Math.min(sub.end - minDur, t).toFixed(2));
  }else{
    sub.end = Number(Math.max(sub.start + minDur, t).toFixed(2));
  }
  const el = document.querySelector(`.vp-sub[data-select-sub="${subTrimDrag.index}"]`);
  if(el){
    el.style.left = `${sub.start * subTrimDrag.pps}px`;
    el.style.width = `${Math.max(28, (sub.end - sub.start) * subTrimDrag.pps)}px`;
  }
  const sIn = document.getElementById('inspSubStart');
  const sOut = document.getElementById('inspSubEnd');
  if(sIn && state.selectedSubIndex === subTrimDrag.index) sIn.value = sub.start.toFixed(1);
  if(sOut && state.selectedSubIndex === subTrimDrag.index) sOut.value = sub.end.toFixed(1);
  // 좌측 목록 시간 입력도 동기화
  const listStart = document.querySelector(`[data-sub-start="${subTrimDrag.index}"]`);
  const listEnd = document.querySelector(`[data-sub-end="${subTrimDrag.index}"]`);
  if(listStart) listStart.value = sub.start.toFixed(1);
  if(listEnd) listEnd.value = sub.end.toFixed(1);
  refreshCaptionOverlay();
});
document.addEventListener('mouseup', ()=>{
  if(!subTrimDrag) return;
  subTrimDrag = null;
  // 자막만 갱신 — 영상 클립 길이는 건드리지 않음
  render();
});

// 미리보기 자막 직접 수정 · 드래그 이동 · 크기 조절
let captionDrag = null;
document.addEventListener('dblclick', (e)=>{
  const textEl = e.target.closest?.('.vp-caption-text');
  const box = e.target.closest?.('.vp-caption-box');
  if(!box || !document.querySelector('.vp-monitor')?.contains(box)) return;
  const idx = Number(box.dataset.captionIndex);
  if(Number.isFinite(idx)) state.selectedSubIndex = idx;
  const el = textEl || box.querySelector('.vp-caption-text');
  if(!el) return;
  el.setAttribute('contenteditable', 'true');
  el.focus();
  try{
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(_){}
  e.preventDefault();
});
document.addEventListener('focusout', (e)=>{
  const el = e.target.closest?.('.vp-caption-text');
  if(!el || !document.querySelector('.vp-monitor')?.contains(el)) return;
  const box = el.closest('.vp-caption-box');
  const idx = Number(box?.dataset.captionIndex);
  const sub = state.subtitles?.[idx];
  if(!sub) return;
  const next = (el.innerText || '').replace(/\u00a0/g, ' ').replace(/\n$/,'').trimEnd();
  const placeholder = '자막을 입력하세요';
  sub.text = next === placeholder ? '' : next;
  const panel = document.getElementById('inspSubText');
  if(panel && state.selectedSubIndex === idx) panel.value = sub.text;
});
document.addEventListener('keydown', (e)=>{
  const el = e.target.closest?.('.vp-caption-text[contenteditable="true"]');
  if(!el || !document.querySelector('.vp-monitor')?.contains(el)) return;
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    el.blur();
  }
  e.stopPropagation();
}, true);
document.addEventListener('mousedown', (e)=>{
  if(subTrimDrag) return;
  if(e.target.closest?.('.vp-caption-text[contenteditable="true"]')) return;
  const resize = e.target.closest?.('[data-caption-resize]');
  const box = e.target.closest?.('.vp-caption-box');
  if(!box || !document.querySelector('.vp-monitor')?.contains(box)) return;
  const mon = document.querySelector('.vp-monitor');
  const rect = mon.getBoundingClientRect();
  const idx = Number(box.dataset.captionIndex);
  if(Number.isFinite(idx)) state.selectedSubIndex = idx;
  if(resize){
    const st = styleForSubtitle(state.subtitles?.[idx]);
    captionDrag = {
      mode: 'resize',
      startX: e.clientX,
      startSize: Number(st.fontSize) || 20,
      style: st,
    };
  }else{
    captionDrag = {
      mode: 'move',
      rect,
      index: idx,
    };
  }
  e.preventDefault();
});
document.addEventListener('mousemove', (e)=>{
  if(!captionDrag) return;
  if(captionDrag.mode === 'resize'){
    const delta = (e.clientX - captionDrag.startX) / 3;
    const next = Math.max(10, Math.min(72, Math.round(captionDrag.startSize + delta)));
    captionDrag.style.fontSize = next;
    const lb = document.getElementById('styleFontSizeLabel');
    if(lb) lb.textContent = `크기 ${next}px`;
    const range = document.querySelector('[data-style-prop="fontSize"]');
    if(range) range.value = next;
    refreshCaptionOverlay();
    return;
  }
  const rect = captionDrag.rect;
  const x = Math.max(4, Math.min(96, ((e.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(4, Math.min(96, ((e.clientY - rect.top) / rect.height) * 100));
  const sub = state.subtitles?.[captionDrag.index];
  if(sub){
    sub.x = Number(x.toFixed(1));
    sub.y = Number(y.toFixed(1));
  }else{
    const st = state.subStyleTarget === 'title' ? state.titleStyle : state.subStyle;
    st.x = Number(x.toFixed(1));
    st.y = Number(y.toFixed(1));
  }
  const box = document.querySelector(`.vp-caption-box[data-caption-index="${captionDrag.index}"]`) || document.getElementById('vpCaptionBox');
  if(box){
    box.style.left = `${x}%`;
    box.style.top = `${y}%`;
  }
  // 우측 자막 위치 슬라이더 동기화
  const sx = document.getElementById('inspSubX');
  const sy = document.getElementById('inspSubY');
  const sxL = document.getElementById('inspSubXLabel');
  const syL = document.getElementById('inspSubYLabel');
  if(sx) sx.value = Math.round(x);
  if(sy) sy.value = Math.round(y);
  if(sxL) sxL.textContent = `좌우 ${Math.round(x)}%`;
  if(syL) syL.textContent = `상하 ${Math.round(y)}%`;
});
document.addEventListener('mouseup', ()=>{
  if(!captionDrag) return;
  captionDrag = null;
});

// ===== 편집기 단축키 =====
// (편집 화면 - 6단계 영상 편집 스튜디오 - 에서만 동작하고, 입력창에 타이핑 중일 땐 무시함)
const NLE_SHORTCUTS = [
  { keys:'Space',        desc:'재생 / 일시정지' },
  { keys:'← / →',        desc:'1초 뒤로 / 앞으로 이동' },
  { keys:'Home / End',   desc:'맨 처음 / 맨 끝으로 이동' },
  { keys:'S',            desc:'재생헤드에서 분할' },
  { keys:'X',            desc:'영상 자르기(뒷부분 삭제)' },
  { keys:'Delete',       desc:'선택한 클립 삭제' },
  { keys:'T',            desc:'자막 넣기 패널 열기' },
  { keys:'[ / ]',        desc:'선택한 클립 순서 앞으로 / 뒤로' },
  { keys:'Ctrl/Cmd + D', desc:'선택한 클립 복제' },
];

function clickIfPresent(id){ document.getElementById(id)?.click(); }

document.addEventListener('keydown', (e)=>{
  if(state.current !== 'studio') return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable) return;

  if(e.code === 'Space'){ e.preventDefault(); clickIfPresent('nlePlayPause'); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); clickIfPresent('nleStepBack'); return; }
  if(e.key === 'ArrowRight'){ e.preventDefault(); clickIfPresent('nleStepFwd'); return; }
  if(e.key === 'Home'){ e.preventDefault(); clickIfPresent('nleSkipStart'); return; }
  if(e.key === 'End'){ e.preventDefault(); clickIfPresent('nleSkipEnd'); return; }
  if((e.key==='s'||e.key==='S') && !e.ctrlKey && !e.metaKey){ e.preventDefault(); clickIfPresent('nleSplitBtn'); return; }
  if((e.key==='x'||e.key==='X') && !e.ctrlKey && !e.metaKey){ e.preventDefault(); clickIfPresent('nleTrimBtn'); return; }
  if((e.key==='t'||e.key==='T') && !e.ctrlKey && !e.metaKey){ e.preventDefault(); document.querySelector('[data-nle-panel="text"]')?.click(); return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    // 포커스된 트랙만 삭제 — 자막 선택 중 영상이 지워지지 않음
    if(state.tlFocus === 'sub' && state.selectedSubIndex != null && state.subtitles?.length){
      state.subtitles.splice(state.selectedSubIndex, 1);
      state.selectedSubIndex = state.subtitles.length
        ? Math.min(state.selectedSubIndex, state.subtitles.length - 1) : null;
      render();
    }else{
      document.querySelector('[data-remove-edl]')?.click();
    }
    return;
  }
  if(e.key === '['){
    e.preventDefault();
    if(state.tlFocus !== 'sub') document.querySelector('[data-move-edl="-1"]')?.click();
    return;
  }
  if(e.key === ']'){
    e.preventDefault();
    if(state.tlFocus !== 'sub') document.querySelector('[data-move-edl="1"]')?.click();
    return;
  }
  if((e.key==='d'||e.key==='D') && (e.ctrlKey||e.metaKey)){
    e.preventDefault();
    if(state.tlFocus !== 'sub') clickIfPresent('nleDuplicateBtn');
    return;
  }
});


async function bootstrapClaudeTransportOnLoad(){
  try{
    // 로컬 프록시에 저장된 키 동기화 (file:// ↔ http://127.0.0.1:878x 공유)
    await pullKeysFromLocalProxy();
    const localUp = await pingLocalProxy();
    // 8787이 adobe-pdf-proxy 등 다른 앱이면 프록시 설정을 끄고 직접 호출로 복구
    if(isProxyEnabled() && isLocalProxy() && !localUp){
      state.keys.useWorkerProxy = false;
      try{
        localStorage.setItem('sss_worker', JSON.stringify({
          useWorkerProxy: false,
          workerProxyUrl: state.keys.workerProxyUrl || '',
        }));
      }catch(_){}
    }
    if(location.protocol === 'file:'){
      if(localUp){
        enableLocalProxySetting(true, localUp);
        // 리다이렉트 전에 현재 키를 프록시 파일로 넘겨 http origin에서도 복원
        await pushKeysToLocalProxy();
        const go = `${localUp}/`;
        if(!sessionStorage.getItem('sss_redirected_local')){
          sessionStorage.setItem('sss_redirected_local', '1');
          location.replace(go);
          return true;
        }
      }else{
        showFileProtocolClaudeBanner();
      }
    }else if(localUp && /127\.0\.0\.1|localhost/i.test(location.host || '')){
      enableLocalProxySetting(true, localUp);
      await pullKeysFromLocalProxy();
    }
  }catch(_){}
  return false;
}

function showFileProtocolClaudeBanner(){
  if(document.getElementById('sssFileClaudeBanner')) return;
  const el = document.createElement('div');
  el.id = 'sssFileClaudeBanner';
  el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#1E3A8A;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;';
  el.innerHTML = `
    <div style="flex:1;min-width:220px;">
      <b style="display:block;margin-bottom:4px;">Claude는 file:// 에서 차단됩니다</b>
      같은 폴더의 <b>로컬서버_실행.bat</b>을 실행한 뒤
      <b>http://127.0.0.1:8791</b> 로 열어주세요. (8787은 PDF Studio일 수 있습니다.)
    </div>
    <button type="button" id="sssOpenLocalProxyHint" style="background:#fff;color:#1E3A8A;border:none;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;">해결 방법</button>
    <button type="button" id="sssDismissFileBanner" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;">닫기</button>
  `;
  document.body.appendChild(el);
  el.querySelector('#sssDismissFileBanner')?.addEventListener('click', ()=> el.remove());
  el.querySelector('#sssOpenLocalProxyHint')?.addEventListener('click', ()=>{
    alert('1) 탐색기에서 이 HTML이 있는 폴더를 연다\n2) 로컬서버_실행.bat 더블클릭\n3) 브라우저가 http://127.0.0.1:8791 로 열리면 그 화면(Shopping Shorts)에서 다시 시도\n\n※ 8787이 열리면 PDF Studio입니다. 닫고 8791을 사용하세요.');
  });
}


document.addEventListener('input', (e)=>{
  if(state.current !== 'settings') return;
  const el = e.target;
  if(!el || !el.matches?.('input,textarea,select')) return;
  if(!(el.id?.startsWith('in-') || el.id?.startsWith('prod') || el.dataset?.voiceLabel != null || el.dataset?.voiceId != null)) return;
  collectSettingsFromInputs();
  scheduleSaveAllKeys();
}, true);
/* sss_keys_input_autosave */
bootstrapClaudeTransportOnLoad().then(async (redirected)=>{
  if(redirected) return;
  try{ await pullKeysFromLocalProxy(); }catch(_){}
  render();
}).catch(()=>render());
