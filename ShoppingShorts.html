   이벤트 바인딩 (단계별 액션)
============================================================ */
/** 숏폼 빠른 전개: 대본 길이에 맞춰 충분한 비주얼 그룹 수 (기본 씬당 1장, 최대 10) */
function targetVisualGroupCount(scriptLen){
  const n = Math.max(1, Number(scriptLen) || 1);
  if(n <= 8) return n;                 // 짧은 대본: 거의 씬마다 컷
  if(n <= 12) return Math.min(10, n);  // 중편: 최대 10컷
  return 10;                            // 긴 대본: 10컷으로 압축
}

function buildVisualGroups(scriptTable){
  const rows = Array.isArray(scriptTable) ? scriptTable : [];
  if(!rows.length) return [];
  const buckets = {};
  const want = targetVisualGroupCount(rows.length);
  const isStory = state.scriptMode === 'story' && state.selectedStoryPlan != null;
  const existingGroups = new Set(rows.map(s => s.group).filter(g => g != null));
  const keepExisting = !isStory && existingGroups.size >= Math.min(want, rows.length) && existingGroups.size > 3;
  if(isStory){
    rows.forEach((s, i)=>{
      const g = Number(s.group) || (i + 1);
      (buckets[g] ||= []).push(s);
    });
  }else if(keepExisting){
    rows.forEach(s=>{ (buckets[s.group] ||= []).push(s); });
  } else {
    const chunkSize = Math.max(1, Math.ceil(rows.length / want));
    rows.forEach((s,i)=>{
      const g = Math.floor(i / chunkSize) + 1;
      (buckets[g] ||= []).push(s);
    });
  }
  return Object.keys(buckets).sort((a,b)=>Number(a)-Number(b)).map(g=>{
    const scenes = buckets[g];
    const sceneLines = scenes.map(s=>{
      const vp = sceneVisualParts(s);
      return joinStoryParts([
        '씬 ' + (s.scene ?? ''),
        s.imagePrompt || vp.desc || s.visual || s.line,
        s.dramaticFunction ? '역할:' + s.dramaticFunction : '',
        s.emotion ? '감정:' + s.emotion : '',
        s.cameraMotion ? '움직임:' + s.cameraMotion : '',
        s.soundCue ? '효과음:' + s.soundCue : '',
        s.musicCue ? 'BGM:' + s.musicCue : '',
        s.editRhythm ? '편집리듬:' + s.editRhythm : '',
        s.spectacle ? '장르융합:' + s.spectacle : ''
      ]);
    }).filter(Boolean);
    return {
      group: Number(g),
      scenes: scenes.map(s=>s.scene),
      visual: sceneLines.join(' / '),
      lines: scenes.map(s=>s.line).filter(Boolean).join(' '),
      captions: scenes.map(s=>s.caption),
      shots: scenes.map(s=>s.shot).filter(Boolean),
      angles: scenes.map(s=>s.angle).filter(Boolean),
      beat: scenes.map(s=>s.beat || s.dramaticFunction).filter(Boolean).join(' → '),
      emotion: scenes.map(s=>s.emotion).filter(Boolean).join(' → '),
      continuity: scenes.map(s=>s.continuityNote).filter(Boolean).join(' / '),
      imagePrompt: scenes.map(s=>s.imagePrompt).filter(Boolean).join(' / '),
      negativePrompt: scenes.map(s=>s.negativePrompt).filter(Boolean).join(' / '),
      soundCue: scenes.map(s=>s.soundCue || s.sfxLabel).filter(Boolean).join(' / '),
      musicCue: scenes.map(s=>s.musicCue).filter(Boolean).join(' / '),
      editRhythm: scenes.map(s=>s.editRhythm).filter(Boolean).join(' / '),
      spectacle: scenes.map(s=>s.spectacle).filter(Boolean).join(' / '),
      paceDur: Math.max(1.0, Math.min(2.4, 1.15 + (scenes.length-1)*0.35)),
    };
  });
}

// 대본 내용에 맞춰 샷 사이즈·앵글·구도를 자동으로 붙임
function composeShotsFromScript(scriptTable){
  if(!Array.isArray(scriptTable) || !scriptTable.length) return [];
  const isStory = state.scriptMode === 'story' && state.selectedStoryPlan != null;
  return scriptTable.map((row, i)=>{
    const beat = SHOT_BEATS[Math.min(i, SHOT_BEATS.length-1)];
    const text = (row.line||'') + ' ' + (row.visual||'') + ' ' + (row.caption||'');
    const hasExplicitCamera = !!(row.shot || row.angle || row.composition);
    let shot = row.shot || beat.shot;
    let angle = row.angle || beat.angle;
    let composition = row.composition || beat.composition;

    if(!hasExplicitCamera){
      if(/클로즈|확대|디테일|손|얼굴|눈|표정|입|눈물/.test(text)){
        shot = '클로즈업'; angle = '아이레벨'; composition = '감정·디테일 중심, 얕은 심도, 세로 프레임 중앙';
      }else if(/전체|거리|방|풍경|밖|공간|풍경|군중|도시/.test(text)){
        shot = '와이드'; angle = '아이레벨 또는 하이앵글'; composition = '환경 맥락 제시, 삼분할';
      }else if(/사용|들|열|마시|바르|착용|누르|조작/.test(text)){
        shot = '미디엄~인서트'; angle = '오버숄더 또는 탑다운'; composition = '손·제품 인터랙션 강조';
      }else if(/놀람|반전|충격|갑자기|근데/.test(text)){
        shot = '미디엄 푸시인'; angle = '살짝 로우앵글'; composition = '긴장감, 피사체를 프레임 중앙으로';
      }else if(i === 0){
        shot = '와이드→미디엄'; angle = '아이레벨'; composition = '오프닝 훅, 상황 진입';
      }else if(i === scriptTable.length - 1){
        shot = '미디엄 또는 클로즈업'; angle = '아이레벨'; composition = '마무리·CTA, 여운 있는 구도';
      }
    }

    const baseVisual = compactStoryText(row.visual || row.imagePrompt || row.line || '장면');
    const visual = [
      baseVisual,
      row.beat ? '비트:' + row.beat : '',
      row.dramaticFunction ? '서사역할:' + row.dramaticFunction : '',
      row.emotion ? '감정:' + row.emotion : '',
      row.cameraMotion ? '카메라움직임:' + row.cameraMotion : '',
      row.continuityNote ? '연속성:' + row.continuityNote : '',
      '샷:' + shot,
      '앵글:' + angle,
      '구도:' + composition,
      '화면비:' + (state.aspectRatio||'9:16') + ' 세로 숏폼',
      '아트스타일:' + (ART_STYLES[state.artStyle]?.label || state.artStyle),
    ].filter(Boolean).join(' · ');

    const want = targetVisualGroupCount(scriptTable.length);
    const chunkSize = Math.max(1, Math.ceil(scriptTable.length / want));
    const group = isStory ? (Number(row.group) || i + 1) : (Math.floor(i / chunkSize) + 1);
    let targetDur = row.targetDur;
    if(targetDur == null || !Number.isFinite(Number(targetDur))){
      const lineLen = String(row.line||'').trim().length;
      if(row.audio === 'sfx') targetDur = lineLen > 12 ? 1.3 : 0.95;
      else targetDur = Math.max(1.15, Math.min(2.1, 1.05 + lineLen * 0.035));
    }
    return {
      ...row,
      shot, angle, composition,
      visual,
      group,
      targetDur: Number(Number(targetDur).toFixed(2)),
    };
  });
}

function applyShotPlanToScript(){
  if(!state.scriptTable?.length) return;
  state.scriptTable = composeShotsFromScript(state.scriptTable);
  state.visualGroups = buildVisualGroups(state.scriptTable);
  state.shotPlanReady = true;
}

function resolveTypecastVoiceId(){
  const list = state.keys.typecastVoices || [];
  const id = String(state.keys.selectedTypecastVoice || '').trim();
  if(id && list.some(v => v.id === id)) return id;
  return list[0]?.id || '';
}

function typecastVoiceSelectHtml(selectId){
  const list = state.keys.typecastVoices || [];
  const cur = resolveTypecastVoiceId();
  if(!list.length){
    return `<div class="settings-note">설정 → Typecast에 보이스를 등록해주세요. (기본 한국어 보이스가 있으면 여기에 표시됩니다)</div>`;
  }
  const female = list.filter(v => /\(여\)|여성|여\b/i.test(v.label||''));
  const male = list.filter(v => /\(남\)|남성|남\b/i.test(v.label||''));
  const other = list.filter(v => !female.includes(v) && !male.includes(v));
  const opt = (v)=>`<option value="${v.id}" ${cur===v.id?'selected':''}>${v.label||v.id}</option>`;
  return `
    <select id="${selectId}">
      ${female.length ? `<optgroup label="여성">${female.map(opt).join('')}</optgroup>` : ''}
      ${male.length ? `<optgroup label="남성">${male.map(opt).join('')}</optgroup>` : ''}
      ${other.length ? `<optgroup label="기타">${other.map(opt).join('')}</optgroup>` : ''}
      ${!female.length && !male.length ? list.map(opt).join('') : ''}
    </select>`;
}

function collectProductionOptionsFromUI(){
  const styleEl = document.getElementById('prodArtStyle');
  const genderEl = document.getElementById('prodCharGender');
  const visualEl = document.getElementById('prodVisualStyle');
  const aspectEl = document.getElementById('prodAspectRatio');
  const voiceEl = document.getElementById('prodTypecastVoice');
  const modeEl = document.getElementById('prodNarrationMode');
  const emotionEl = document.getElementById('prodNarrationEmotion');
  const tempoEl = document.getElementById('prodNarrationTempo');
  if(styleEl) state.artStyle = styleEl.value || state.artStyle;
  if(genderEl) state.charGender = genderEl.value || state.charGender;
  if(visualEl) state.visualStyle = visualEl.value || state.visualStyle;
  if(aspectEl) state.aspectRatio = aspectEl.value || state.aspectRatio;
  if(voiceEl) state.keys.selectedTypecastVoice = voiceEl.value;
  if(modeEl) state.keys.narrationMode = modeEl.value;
  if(emotionEl) state.keys.narrationEmotion = emotionEl.value;
  if(tempoEl) state.keys.narrationTempo = parseFloat(tempoEl.value) || 1.15;
  const narrEl = document.getElementById('prodIncludeNarration');
  if(narrEl){
    state.includeNarration = narrEl.value === 'on';
    if(!state.includeNarration) state.keys.narrationMode = 'off';
    else if(state.keys.narrationMode === 'off') state.keys.narrationMode = 'auto';
  }
  // 씬별 대사/효과음 토글
  document.querySelectorAll('[data-audio-mode]').forEach(el=>{
    const i = Number(el.dataset.audioMode);
    if(!state.scriptTable?.[i]) return;
    state.scriptTable[i].audio = el.value === 'sfx' ? 'sfx' : 'vo';
    if(el.value === 'sfx'){
      // 효과음 씬은 나레이션 대상에서 제외 (대사는 자막용으로 남겨둘 수 있음)
    }
  });
  document.querySelectorAll('[data-line-edit]').forEach(el=>{
    const i = Number(el.dataset.lineEdit);
    if(state.scriptTable?.[i]) state.scriptTable[i].line = el.value;
  });
  document.querySelectorAll('[data-caption-edit]').forEach(el=>{
    const i = Number(el.dataset.captionEdit);
    if(state.scriptTable?.[i]) state.scriptTable[i].caption = el.value;
  });
  document.querySelectorAll('[data-caption-style]').forEach(el=>{
    const i = Number(el.dataset.captionStyle);
    if(!state.scriptTable?.[i]) return;
    let v = el.value;
    if(state.scriptTable[i].audio === 'vo' && v === 'none') v = 'bottom';
    state.scriptTable[i].captionStyle = v;
  });
  document.querySelectorAll('[data-target-dur]').forEach(el=>{
    const i = Number(el.dataset.targetDur);
    if(!state.scriptTable?.[i]) return;
    const n = parseFloat(el.value);
    state.scriptTable[i].targetDur = Number.isFinite(n) && n > 0 ? n : null;
  });
  // vo → caption 강제 동기화
  (state.scriptTable||[]).forEach(r=>{
    if(r.audio === 'vo'){
      const line = String(r.line||'').trim();
      if(!String(r.caption||'').trim()) r.caption = line;
      if(!r.captionStyle || r.captionStyle === 'none') r.captionStyle = 'bottom';
    }
  });
  if(voiceEl || modeEl || emotionEl || tempoEl) persistNarrationSettings();
}

function sceneVisualParts(s){
  const raw = String(s?.visual || '').trim();
  let desc = raw;
  const cut = raw.search(/\s·\s샷:/);
  if(cut >= 0) desc = raw.slice(0, cut).trim();
  else {
    const cut2 = raw.search(/\s·\s앵글:/);
    if(cut2 >= 0) desc = raw.slice(0, cut2).trim();
  }
  const pick = (key)=>{
    const m = raw.match(new RegExp(key + ':([^·]+)'));
    return (m ? m[1] : '').trim();
  };
  return {
    desc: desc || '(화면 설명 없음)',
    shot: s?.shot || pick('샷') || '',
    angle: s?.angle || pick('앵글') || '',
    composition: s?.composition || pick('구도') || '',
    aspect: pick('화면비') || `${state.aspectRatio||'9:16'} 세로 숏폼`,
    art: pick('아트스타일') || (ART_STYLES[state.artStyle]?.label || state.artStyle || ''),
  };
}

}

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">

        ${state.externalVoiceUrl || (state.externalVoices||[]).length ? `
          <div class="settings-note" style="margin-top:8px; color:#166534;">
            ✓ 외부 음성 ${(state.externalVoices||[]).length || 1}개
            ${state.externalVoiceMatched ? '· 대본 매칭 완료' : '· 아직 매칭 전'}
            ${state.externalVoiceUrl ? `· <a href="${state.externalVoiceUrl}" target="_blank" rel="noopener">미리듣기</a>` : ''}
            <button type="button" class="btn secondary" id="clearExternalVoiceBtn" style="margin-left:8px; padding:4px 8px; font-size:11px;">지우기</button>

      <div class="settings-note" style="margin-top:-4px; margin-bottom:8px;">기본은 <b>원클릭 자동</b>입니다. 단계별은 캐릭터→씬 이미지→스튜디오를 하나씩 확인합니다.</div>
      ${statusHtml('auto-gen')}

      ${state.shotPlanReady || shots.length ? `
        <div style="margin-top:10px;">
          <div style="font-size:14px; font-weight:800; margin-bottom:8px;">씬별 연출 검수 (대사·효과음·자막)</div>
          <div class="settings-note" style="margin-bottom:10px; font-size:13px; line-height:1.55;">
            <b>대사</b> 씬은 자막/말풍선이 반드시 나갑니다.
            <b>효과음</b> 모드는 「이 씬은 나레이션 없음」이라는 뜻입니다. 자동 생성 시 씬 분위기에 맞는 효과음과 짧은 템포 베드가 붙고, 정식 BGM은 스튜디오/게시 단계에서 교체할 수 있습니다.
          </div>
          <div style="display:flex; flex-direction:column; gap:12px;">
            ${shots.map((s,i)=>{
              const isSfx = s.audio === 'sfx' || (!String(s.line||'').trim() && s.audio !== 'vo');
              const capStyle = s.captionStyle || (isSfx ? 'none' : 'bottom');
              const capText = String(s.caption || (!isSfx ? s.line : '') || '').replace(/"/g,'&quot;');
              const dur = s.targetDur != null ? s.targetDur : '';
              const vp = sceneVisualParts(s);
              return `
              <div style="padding:14px 14px 12px; border:1px solid var(--border); border-radius:12px; background:#fff;">
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
                  <div style="font-size:14px; font-weight:800; color:var(--violet);">씬 ${s.scene ?? i+1}${s.shot?` · ${s.shot}`:''}</div>
                  <select data-audio-mode="${i}" style="width:auto; font-size:13px; padding:6px 10px;">
                    <option value="vo" ${!isSfx?'selected':''}>🎙 대사 (자막 필수)</option>
                    <option value="sfx" ${isSfx?'selected':''}>🔊 나레이션 없음</option>
                  </select>
                  <select data-caption-style="${i}" style="width:auto; font-size:13px; padding:6px 10px;" title="자막 스타일">
                    <option value="bottom" ${capStyle==='bottom'?'selected':''}>하단 자막</option>
                    <option value="bubble" ${capStyle==='bubble'?'selected':''}>말풍선</option>
                    <option value="none" ${capStyle==='none'?'selected':''} ${!isSfx?'disabled':''}>자막 없음</option>
                  </select>
                  <label style="font-size:13px; color:var(--text-lo); display:flex; align-items:center; gap:6px; font-weight:600;">길이(초)
                    <input type="number" min="0.5" step="0.1" data-target-dur="${i}" value="${dur}" placeholder="자동" style="width:72px; font-size:13px; padding:6px 8px;">
                  </label>
                </div>
                <label style="display:block; font-size:12px; font-weight:700; color:#64748B; margin:0 0 4px;">대사 / 나레이션</label>
                <input type="text" data-line-edit="${i}" value="${String(s.line||'').replace(/"/g,'&quot;')}" placeholder="${isSfx?'(나레이션 없음 — 비워두기)':'대사 / 나레이션 문장'}" style="font-size:14px; padding:10px 12px; margin-bottom:8px;">
                <label style="display:block; font-size:12px; font-weight:700; color:#64748B; margin:0 0 4px;">화면 자막 / 말풍선</label>
                <input type="text" data-caption-edit="${i}" value="${capText}" placeholder="${isSfx?'선택 자막(재미 문구)':'화면에 보일 자막/말풍선 — 대사 씬 필수'}" style="font-size:14px; padding:10px 12px; margin-bottom:10px; ${!isSfx?'border-color:#93C5FD;':''}">
                <div style="padding:12px 14px; border-radius:10px; background:#F5F8FF; border:1px solid #D7E3F8;">
                  <div style="font-size:12px; font-weight:800; color:#3B82F6; letter-spacing:0.02em; margin-bottom:6px;">화면 연출</div>
                  <div style="font-size:15px; font-weight:700; color:#0F172A; line-height:1.55; margin-bottom:10px;">${escHtml(vp.desc)}</div>
                  <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${sceneMetaChip('샷', vp.shot)}
                    ${sceneMetaChip('앵글', vp.angle)}
                    ${sceneMetaChip('구도', vp.composition)}
                    ${sceneMetaChip('비율', vp.aspect)}
                    ${sceneMetaChip('스타일', vp.art)}
                  </div>
                </div>
                ${isSfx ? `<div style="margin-top:8px; font-size:12.5px; color:#92400E; background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:8px 10px; line-height:1.45;">이 씬은 나레이션 없이 효과음·BGM 리듬으로 전달합니다. 자동 생성 시 효과음 타점이 붙고, 정식 BGM은 스튜디오/게시 단계에서 교체할 수 있어요.</div>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>
      ` : `<div class="settings-note">아직 구도를 안 짰다면 "화면·구도 자동 구성"을 먼저 눌러주세요. 자동 생성 시에도 같이 적용됩니다.</div>`}
    </div>
  `;
}

async function runAutoVideoPipeline(){
  collectProductionOptionsFromUI();
  migrateAllHfModelSlugs();
  if(!state.scriptTable?.length) throw new Error('대본이 없어요. 먼저 기획안/대본 버전을 선택하세요.');
  if(!state.keys.hfCharacterModel || !state.keys.hfImageModel || !state.keys.hfVideoModel){
    throw new Error('Higgsfield 모델 슬러그가 비어 있어요. API 설정에서 확인해 주세요.');
  }
  if(!String(state.keys.higgsfieldKeyId||'').trim() || !String(state.keys.higgsfieldKeySecret||'').trim()){
    throw new Error('Higgsfield Key ID·Secret이 비어 있어요. API 설정에서 입력해주세요.');
  }
  setStatus('auto-gen','loading','로컬 프록시 확인 중...');
  await ensureHfProxyReady();

  // 나레이션은 사용자가 켠 경우만. 효과음은 기본 자동.
  if(!state.includeNarration) state.keys.narrationMode = 'off';
  let narrationMode = state.includeNarration ? (state.keys.narrationMode || 'auto') : 'off';
  let dialogueRows = narrationMode === 'always'
    ? (state.scriptTable||[]).map((r,i)=>({...r,_i:i})).filter(r=>String(r.line||'').trim())
    : getDialogueRows(state.scriptTable);
  let needVoice = narrationMode !== 'off' && dialogueRows.length > 0;
  const hasAnyVoiceSource = !!state.externalVoiceUrl || !!resolveTypecastVoiceId() || !!state.keys.googleTtsApiKey || !!(state.keys.hfAudioModel && state.keys.hfAudioVoiceId);
  if(needVoice && !hasAnyVoiceSource){
    const isStoryAutoRun = state.scriptMode === 'story' && state.selectedStoryPlan != null;
    if(isStoryAutoRun){
      // 스토리 자동 흐름은 보이스 세팅 기회 없이 진입하므로 대사 씬을 sfx로 강등해 파이프라인을 살린다.
      (state.scriptTable||[]).forEach(r=>{
        if(String(r.line||'').trim() && r.audio !== 'sfx'){
          r.audio = 'sfx';
          if(!r.caption || !String(r.caption).trim()) r.caption = String(r.line||'').trim();
          if(!r.captionStyle || r.captionStyle === 'none') r.captionStyle = 'bottom';
        }
      });
      state.keys.narrationMode = 'off';
      state.includeNarration = false;
      narrationMode = 'off';
      dialogueRows = [];
      needVoice = false;
      setStatus('auto-gen','loading','보이스 소스가 없어 대사 씬을 효과음+자막으로 자동 전환했어요.');
    }else{
      throw new Error('대사 씬이 있는데 보이스가 없어요. 외부 음성을 올리거나 Typecast 목소리를 고르거나 나레이션을 「끔」으로 두세요.');
    }
  }

  setStatus('auto-gen','loading','① 대본 맞춰 화면·구도 구성 중...');
  applyShotPlanToScript();

  const isStoryAuto = state.scriptMode === 'story' && state.selectedStoryPlan != null;
  if(isStoryAuto){
    setStatus('auto-gen','loading','② 이야기에서 주인공·조연·소품 분석 후 캐릭터 생성 중...');
    await runAutoAnalyzeAndDrawAllCast();
  }else{
    setStatus('auto-gen','loading','② 등장인물 생성 중...');
    await generateAllCastAndOptionalProps();
  }
  state.done.character = true;

  setStatus('auto-gen','loading',`③ 씬 이미지 생성 중 (0/${state.visualGroups.length})...`);
  if(!Array.isArray(state.sceneImages)) state.sceneImages = [];
  if(state.sceneImages.length !== state.visualGroups.length){
    state.sceneImages = new Array(state.visualGroups.length).fill(null).map((_, i)=> state.sceneImages[i] || null);
  }
  const sceneFailures = [];
  for(let i=0;i<state.visualGroups.length;i++){
    if(state.sceneImages[i]?.url){
      setStatus('auto-gen','loading',`③ 씬 이미지 재사용 (${i+1}/${state.visualGroups.length})...`);
      continue;
    }
    try{
      const img = await callHiggsfieldSceneImage(state.visualGroups[i], state.character);
      state.sceneImages[i] = img;
    }catch(err){
      console.warn('씬 이미지 실패 (scene ' + (i+1) + '):', err?.message || err);
      state.sceneImages[i] = null;
      sceneFailures.push({ index:i, kind:'image', message:String(err?.message||err) });
    }
    setStatus('auto-gen','loading',`③ 씬 이미지 생성 중 (${i+1}/${state.visualGroups.length})...`);
  }
  const okImageCount = state.sceneImages.filter(s=>s?.url).length;
  if(!okImageCount) throw new Error('모든 씬 이미지 생성이 실패했어요. Higgsfield 응답을 확인하세요.');
  state.done.images = okImageCount === state.visualGroups.length;

  setStatus('auto-gen','loading',`④ 영상 클립 생성 중 (0/${state.sceneImages.length})...`);
  if(!Array.isArray(state.clips)) state.clips = [];
  if(state.clips.length !== state.sceneImages.length){
    state.clips = new Array(state.sceneImages.length).fill(null).map((_, i)=> state.clips[i] || null);
  }
  for(let i=0;i<state.sceneImages.length;i++){
    if(!state.sceneImages[i]?.url){
      state.clips[i] = null;
      continue;
    }
    if(state.clips[i]?.url){
      setStatus('auto-gen','loading',`④ 클립 재사용 (${i+1}/${state.sceneImages.length})...`);
      continue;
    }
    try{
      const clip = await callHiggsfieldMotion(state.sceneImages[i], state.visualGroups[i]);
      state.clips[i] = clip;
    }catch(err){
      console.warn('클립 실패 (scene ' + (i+1) + '):', err?.message || err);
      state.clips[i] = null;
      sceneFailures.push({ index:i, kind:'clip', message:String(err?.message||err) });
    }
    setStatus('auto-gen','loading',`④ 영상 클립 생성 중 (${i+1}/${state.sceneImages.length})...`);
  }
  const okClipCount = state.clips.filter(c=>c?.url).length;
  if(!okClipCount) throw new Error('모든 클립 생성이 실패했어요. 씬 이미지는 있지만 모션 API에서 실패했습니다.');
  state.done.video = okClipCount === state.sceneImages.length;

  state.sceneFailures = sceneFailures;

  const usableClips = state.clips.filter(c=>c?.url);
  state.sourceVideos = usableClips.slice(0, MAX_SOURCE_VIDEOS).map((c,i)=>({
    file: null, name: `AI클립_${i+1}.mp4`, url: c.url, isRemote: true, isImage: false,
  }));

  // ⑤ 대사 있는 씬만 나레이션 (효과음 씬 스킵)
  const voiceName = (state.keys.typecastVoices||[]).find(v => v.id === resolveTypecastVoiceId())?.label || '나레이션';
  const dialogueLines = dialogueRows.map(r => String(r.line||'').trim());
  let dialogueDurations = dialogueLines.map(()=> 2.2);

  ensureDirectionDefaultsOnScript();
  // 연출안에서 지정한 목표 길이 우선
  const presetDurs = dialogueRows.map(r => Number(r.targetDur));
  if(presetDurs.every(n => Number.isFinite(n) && n > 0)){
    dialogueDurations = presetDurs.map(n => Math.max(0.8, n));
  }

  if(needVoice){
    if(state.externalVoiceUrl){
      setStatus('auto-gen','loading',`⑤ 외부 음성으로 대사 ${dialogueLines.length}줄 타이밍 반영 중...`);
      state.voiceUrl = state.externalVoiceUrl;
      state.done.voice = true;
      state.sourceScript = dialogueLines.join('\n');
      try{
        const timings = await analyzeVoiceTimingForLines(state.externalVoiceUrl, dialogueLines);
        dialogueDurations = timings.map(t => Math.max(0.8, t.end - t.start));
        // scriptTable targetDur 동기화
        timings.forEach((tm, di)=>{
          const row = state.scriptTable?.[dialogueRows[di]._i];
          if(row) row.targetDur = Math.max(0.8, tm.end - tm.start);
        });
      }catch(_){
        const totalVoiceDur = await getAudioDuration(state.externalVoiceUrl).catch(()=> dialogueLines.length * 2.2);
        const charCounts = dialogueLines.map(l => Math.max(6, l.replace(/\s/g,'').length));
        const totalChars = charCounts.reduce((a,b)=>a+b, 0) || 1;
        dialogueDurations = charCounts.map(c => Math.max(1, (c / totalChars) * (totalVoiceDur || dialogueLines.length * 2.2)));
      }
    }else{
      setStatus('auto-gen','loading',`⑤ ${voiceName} · 대사 ${dialogueLines.length}줄 나레이션 중...`);
      const voice = await callNarrationVoice(dialogueRows);
      if(voice?.url){
        state.voiceUrl = voice.url;
        state.done.voice = true;
        state.sourceScript = dialogueLines.join('\n');
        try{
          setStatus('auto-gen','loading','⑥ 대사 타이밍에 영상 길이 맞추는 중...');
          const timings = await analyzeVoiceTimingForLines(voice.url, dialogueLines);
          dialogueDurations = timings.map(t => Math.max(0.8, t.end - t.start));
        }catch(_){
          const totalVoiceDur = await getAudioDuration(voice.url).catch(()=> dialogueLines.length * 2.2);
          const charCounts = dialogueLines.map(l => Math.max(6, l.replace(/\s/g,'').length));
          const totalChars = charCounts.reduce((a,b)=>a+b, 0) || 1;
          dialogueDurations = charCounts.map(c => Math.max(1, (c / totalChars) * (totalVoiceDur || dialogueLines.length * 2.2)));
        }
      }
    }
  }else{
    state.voiceUrl = null;
    state.done.voice = narrationMode === 'off' || dialogueLines.length === 0;
    state.sourceScript = (state.scriptTable||[]).map(r=>r.line||'').filter(Boolean).join('\n');
  }

  // 전체 씬 EDL: 대사 씬=음성 길이, 효과음 씬=짧은 비트
  let dlgCursor = 0;
  state.sourceEDL = (state.scriptTable||[]).map((row, i)=>{
    const isDlg = (row.audio !== 'sfx') && !!String(row.line||'').trim();
    let end = Number(row.targetDur);
    if(!(end > 0)){
      if(isDlg && needVoice){
        end = Math.max(1.2, dialogueDurations[dlgCursor] ?? 2.2);
        dlgCursor++;
      }else if(isDlg){
        end = Math.max(1.5, dialogueDurations[dlgCursor] ?? 2.0);
        dlgCursor++;
      }else{
        end = 2.0;
      }
    }else if(isDlg && needVoice){
      dlgCursor++;
    }
    return {
      line: row.caption || row.line || '',
      videoIndex: Math.min(i, Math.max(0, state.sourceVideos.length - 1)),
      start: 0,
      end,
      audio: isDlg ? 'vo' : 'sfx',
      captionStyle: row.captionStyle || (isDlg ? 'bottom' : 'none'),
    };
  });
  state.subtitles = buildSubtitlesFromDirectionPlan(state.sourceEDL);
  if(state.autoSfx !== false){
    setStatus('auto-gen','loading','⑦ 씬 맞춤 효과음 자동 생성 중...');
    try{
      // EDL 길이로 targetDur 동기화 후 SFX 배치
      (state.sourceEDL||[]).forEach((e,i)=>{
        if(state.scriptTable?.[i]) state.scriptTable[i].targetDur = Math.max(0.8, e.end - e.start);
      });
      await generateAutoSfxForScript();
    }catch(sfxErr){
      console.warn('SFX auto failed', sfxErr);
    }
  }
  state.done.direction = true;
  state.directionReady = true;
  state.studioMode = 'ai';
  state.aiPanelOpen = true;
  state.current = 'studio';
  const bubbleN = (state.subtitles||[]).filter(s=>s.captionStyle==='bubble').length;
  const sfxN = (state.sfxClips||[]).length;
  const failN = (state.sceneFailures||[]).length;
  const failNote = failN ? ` · 실패 ${failN}개 (다시 실행하면 성공한 씬은 재사용)` : '';
  const msg = needVoice
    ? `완료! ${state.externalVoiceUrl?'외부 음성':voiceName} · 대사 ${dialogueLines.length}줄 · 자막 ${(state.subtitles||[]).length}개 · 효과음 ${sfxN}${failNote}`
    : `완료! 나레이션 없음 · 자동 효과음 ${sfxN}개 · 자막 ${(state.subtitles||[]).length}개${failNote}`;
  setStatus('auto-gen', 'ok', msg);
}

function collectSettingsFromInputs(){
  const g = (id)=> document.getElementById(id);
  if(g('in-claude-key')) state.keys.claudeApiKey = g('in-claude-key').value.trim();
  if(g('in-claude-model')) state.keys.claudeModel = migrateClaudeModelId(g('in-claude-model').value);
  if(g('in-claude-base')) state.keys.claudeBase = g('in-claude-base').value.trim() || 'https://api.anthropic.com';
  if(g('in-text-ai-provider')){
    const v = g('in-text-ai-provider').value;
    state.keys.textAiProvider = v === 'openai' ? 'chatgpt' : v;
  }
  if(g('in-openai-key')) state.keys.openaiApiKey = g('in-openai-key').value.trim();
  if(g('in-openai-model')) state.keys.openaiModel = g('in-openai-model').value.trim() || 'gpt-5.6-terra';
  if(g('in-openai-base')) state.keys.openaiBase = g('in-openai-base').value.trim() || 'https://api.openai.com';
  if(g('in-gemini')) state.keys.gemini = g('in-gemini').value.trim();
  if(g('in-gemini-model')) state.keys.geminiModel = g('in-gemini-model').value.trim() || 'gemini-3.5-flash';
  if(g('prodNarrationMode')) state.keys.narrationMode = g('prodNarrationMode').value;

  if(g('prodNarrationTempo')) state.keys.narrationTempo = parseFloat(g('prodNarrationTempo').value) || 1.15;

  state.keys.hfImageModel = migrateHfModelSlug(document.getElementById('in-model-image')?.value, DEFAULT_KEYS.hfImageModel);
  state.keys.hfVideoModel = migrateHfModelSlug(document.getElementById('in-model-video')?.value, DEFAULT_KEYS.hfVideoModel);
  state.keys.hfAudioModel = migrateHfModelSlug(document.getElementById('in-model-audio')?.value, DEFAULT_KEYS.hfAudioModel);
  state.keys.hfAudioVariant = document.getElementById('in-hf-audio-variant')?.value ?? state.keys.hfAudioVariant;
  state.keys.hfAudioVoiceId = document.getElementById('in-hf-audio-voice')?.value ?? state.keys.hfAudioVoiceId;
  state.keys.typecastApiKey = document.getElementById('in-typecast-key').value;
  state.keys.typecastBase = document.getElementById('in-typecast-base').value;
  state.keys.googleTtsApiKey = document.getElementById('in-google-tts-key')?.value ?? state.keys.googleTtsApiKey;
  state.keys.googleTtsVoice = document.getElementById('in-google-tts-voice')?.value ?? state.keys.googleTtsVoice;
  state.keys.googleTtsRate = parseFloat(document.getElementById('in-google-tts-rate')?.value) || state.keys.googleTtsRate;
  document.querySelectorAll('[data-voice-label]').forEach(el=>{
    const idx = Number(el.dataset.voiceLabel);
    if(state.keys.typecastVoices[idx]) state.keys.typecastVoices[idx].label = el.value;
  });
  document.querySelectorAll('[data-voice-id]').forEach(el=>{
    const idx = Number(el.dataset.voiceId);
    if(state.keys.typecastVoices[idx]) state.keys.typecastVoices[idx].id = el.value;
  });
  state.keys.coupangAccessKey = document.getElementById('in-coupang-access')?.value ?? state.keys.coupangAccessKey;
  state.keys.coupangSecretKey = document.getElementById('in-coupang-secret')?.value ?? state.keys.coupangSecretKey;
  state.keys.youtubeApiKey = document.getElementById('in-youtube-key')?.value ?? state.keys.youtubeApiKey;
  state.keys.apifyToken = document.getElementById('in-apify-token')?.value ?? state.keys.apifyToken;
  state.keys.apifyTiktokActor = document.getElementById('in-apify-actor')?.value ?? state.keys.apifyTiktokActor;
  state.keys.useWorkerProxy = document.getElementById('in-use-worker').value === 'true';
  state.keys.workerProxyUrl = document.getElementById('in-worker-url').value;
}

document.addEventListener('click', async (e)=>{

  if(e.target.dataset.studioMode){
    state.studioMode = e.target.dataset.studioMode;
    if(state.studioMode === 'manual' && !state.sourceScript && state.scriptTable){
      state.sourceScript = state.scriptTable.map(r=>r.line).join('\n');
    }
    render();
  }

  if(e.target.dataset.finalTab){
    state.finalTab = e.target.dataset.finalTab;
    if(state.finalTab === 'manual' && !state.sourceScript && state.scriptTable){
      state.sourceScript = state.scriptTable.map(r=>r.line).join('\n');
    }
    render();
  }

  if(e.target.dataset.videoTab){
    state.videoTab = e.target.dataset.videoTab;
    if(state.videoTab === 'manual' && !state.sourceScript && state.scriptTable){
      state.sourceScript = state.scriptTable.map(r=>r.line).join('\n');
    }
    render();
  }

  if(e.target.dataset.removeSourceVideo !== undefined){
    const removed = Number(e.target.dataset.removeSourceVideo);
    state.sourceVideos.splice(removed, 1);
    // 해당 소스만 EDL에서 제거·인덱스 재매핑 — 자막·다른 클립은 유지
    if(Array.isArray(state.sourceEDL)){
      state.sourceEDL = state.sourceEDL
        .filter(c => c.videoIndex !== removed)
        .map(c => ({ ...c, videoIndex: c.videoIndex > removed ? c.videoIndex - 1 : c.videoIndex }));
      state.selectedEdlIndex = Math.max(0, Math.min(state.selectedEdlIndex ?? 0, state.sourceEDL.length - 1));
    }
    const remapMarks = {};
    Object.keys(state.sourceMarks || {}).forEach(k=>{
      const ki = Number(k);
      if(ki === removed) return;
      remapMarks[ki > removed ? ki - 1 : ki] = state.sourceMarks[k];
    });
    state.sourceMarks = remapMarks;
    const remapDur = {};
    Object.keys(state.sourceDurations || {}).forEach(k=>{
      const ki = Number(k);
      if(ki === removed) return;
      remapDur[ki > removed ? ki - 1 : ki] = state.sourceDurations[k];
    });
    state.sourceDurations = remapDur;
    state.activeSourceIndex = null;
    state.selectedSourceIndices = [];
    state.suggestedSegments = null;
    state.selectedSuggestIndex = null;
    state.previewRange = null;
    render();
  }

  if(e.target.closest('[data-toggle-typecast-gender]')){
    const label = e.target.closest('[data-toggle-typecast-gender]').dataset.toggleTypecastGender;
    state.typecastGenderExpanded[label] = !state.typecastGenderExpanded[label];
    render();
  }

  if(e.target.closest('[data-toggle-voice-gender]')){
    const label = e.target.closest('[data-toggle-voice-gender]').dataset.toggleVoiceGender;
    state.voiceGenderExpanded[label] = !state.voiceGenderExpanded[label];
    render();
  }

  if(e.target.dataset.selectGoogleVoice){
    collectSettingsFromInputs();
    state.keys.googleTtsVoice = e.target.dataset.selectGoogleVoice;
    render();
  }

  if(e.target.dataset.previewGoogleVoice){
    collectSettingsFromInputs();
    const voiceName = e.target.dataset.previewGoogleVoice;
    setStatus('google-voices','loading', `${voiceName} 미리듣기 생성 중...`);
    try{
      const res = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${state.keys.googleTtsApiKey}`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          input:{ text:'안녕하세요, 이 목소리로 나레이션이 만들어질 예정이에요.' },
          voice:{ languageCode:'ko-KR', name: voiceName },
          audioConfig:{ audioEncoding:'MP3', speakingRate: state.keys.googleTtsRate }
        })
      });
      if(!res.ok){
        const body = await res.text().catch(()=>'');
        throw new Error(`HTTP ${res.status}: ${body.slice(0,150)}`);
      }
      const data = await res.json();
      const byteChars = atob(data.audioContent);
      const bytes = new Uint8Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
      const blob = new Blob([bytes], { type:'audio/mp3' });
      state.googleTtsPreviewUrl = URL.createObjectURL(blob);
      state.googleTtsPreviewVoice = voiceName;
      setStatus('google-voices','ok', '재생 중');
      render();
    }catch(err){
      setStatus('google-voices','err', err.message);
    }
  }

  if(e.target.id === 'fetchGoogleVoices'){
    collectSettingsFromInputs();
    setStatus('google-voices','loading','한국어 보이스 목록 불러오는 중...');
    try{
      const res = await fetch(`https://texttospeech.googleapis.com/v1/voices?languageCode=ko-KR&key=${state.keys.googleTtsApiKey}`);
      if(!res.ok){
        const body = await res.text().catch(()=>'');
        throw new Error(`HTTP ${res.status}: ${body.slice(0,150)}`);
      }
      const data = await res.json();
      const tierOf = (name)=>{
        if(name.includes('Chirp3-HD')) return 'Chirp3-HD (최신·감정표현)';
        if(name.includes('Neural2')) return 'Neural2';
        if(name.includes('Studio')) return 'Studio';
        if(name.includes('Wavenet')) return 'WaveNet';
        if(name.includes('Standard')) return 'Standard';
        return '';
      };
      state.googleTtsVoiceList = data.voices.map(v=>({
        name: v.name,
        gender: v.ssmlGender === 'MALE' ? '남성' : v.ssmlGender === 'FEMALE' ? '여성' : '중립',
        tier: tierOf(v.name),
      })).sort((a,b)=> a.tier.localeCompare(b.tier));
      setStatus('google-voices','ok', `${state.googleTtsVoiceList.length}개 보이스 불러옴`);
      render();
    }catch(err){
      setStatus('google-voices','err', err.message);
    }
  }

  if(e.target.id === 'addVoiceRow'){
    collectSettingsFromInputs();
    state.keys.typecastVoices.push({ label:'', id:'' });
    state.typecastGenderExpanded['기타'] = true;
    render();
  }

  if(e.target.dataset.removeVoice !== undefined){
    collectSettingsFromInputs();
    state.keys.typecastVoices.splice(Number(e.target.dataset.removeVoice), 1);
    render();
  }

  if(e.target.id === 'fetchTypecastVoices'){
    collectSettingsFromInputs();
    setStatus('typecast-voices','loading','보이스 목록 불러오는 중...');
    try{
      const res = await fetch(typecastUrl('/v1/voices'), {
        headers: typecastHeaders()
      });
      if(!res.ok){
        const body = await res.text().catch(()=>'');
        throw new Error(`HTTP ${res.status}: ${body.slice(0,150) || '(응답 없음)'}`);
      }
      const voices = await res.json();
      state.keys.typecastVoices = voices.slice(0, 15).map(v=>({ label: v.voice_name, id: v.voice_id }));
      setStatus('typecast-voices','ok', `${voices.length}개 중 ${state.keys.typecastVoices.length}개 불러옴`);
      render();
    }catch(err){
      setStatus('typecast-voices','err', err.message);
    }
  }

  if(e.target.id === 'useDirectClaudeBtn'){
    collectSettingsFromInputs();
    state.keys.useWorkerProxy = false;
    try{ localStorage.setItem('sss_worker', JSON.stringify({ useWorkerProxy:false, workerProxyUrl:state.keys.workerProxyUrl || '' })); }catch(_){}
    setStatus('test-claude','ok','직접 호출로 설정됨. 연결 테스트를 눌러 확인하세요.');
    render();
    setTimeout(()=> setStatus('test-claude','ok','직접 호출로 설정됨. 연결 테스트를 눌러 확인하세요.'), 0);
  }

  if(e.target.id === 'useLocalProxyBtn'){
    collectSettingsFromInputs();
    const root = (await pingLocalProxy()) || 'http://127.0.0.1:8791';
    state.keys.useWorkerProxy = true;
    state.keys.workerProxyUrl = root;
    try{ localStorage.setItem('sss_worker', JSON.stringify({ useWorkerProxy:true, workerProxyUrl:state.keys.workerProxyUrl })); }catch(_){}
    setStatus('test-claude','ok',`로컬 프록시 폴백 설정됨 (${root}). 로컬서버_실행.bat 실행 후 연결 테스트하세요.`);
    render();
    setTimeout(()=> setStatus('test-claude','ok',`로컬 프록시 폴백 설정됨 (${root}). 로컬서버_실행.bat 실행 후 연결 테스트하세요.`), 0);
  }

  if(e.target.id === 'saveKeys'){
    collectSettingsFromInputs();
    saveAllKeySections({ quiet:true });
    state.done.settings = true;
    state.current = 'analysis';
    render();
  }

  if(e.target.dataset.saveSection){
    saveSection(e.target.dataset.saveSection);
  }

  // 설정 화면에서 키/모델 입력 시 자동 저장 (새로고침 유지, 초기화 시에만 삭제)
  if(state.current === 'settings'){
    const el = e.target;
    if(el && (el.matches?.('input,select,textarea') || el.closest?.('.card input, .card select, .card textarea'))){
      if(el.id?.startsWith('in-') || el.id?.startsWith('prod') || el.dataset?.voiceLabel != null || el.dataset?.voiceId != null){
        collectSettingsFromInputs();
        scheduleSaveAllKeys();
      }
    }
  }

  if(e.target.dataset.resetSection){
    if(confirm('이 섹션의 입력값을 초기화할까요?')) resetSection(e.target.dataset.resetSection);
  }

  if(e.target.dataset.test){
    collectSettingsFromInputs();
    const service = e.target.dataset.test;
    setStatus(`test-${service}`, 'loading', '연결 확인 중...');
    try{
      if(service === 'claude'){
        if(!String(state.keys.claudeApiKey||'').trim()){
          throw new Error('Claude API 키를 입력해주세요.');
        }
        state.keys.claudeModel = migrateClaudeModelId(state.keys.claudeModel);
        const pingBody = {
          model: state.keys.claudeModel || 'claude-sonnet-5',
          max_tokens: 32,
          messages: [{ role:'user', content:'ping' }],
        };
        const { res, via } = await fetchClaudeMessages(pingBody, { persistProxyFallback:false });
        if(!res.ok){
          const body = await res.text().catch(()=> '');
          throw new Error(formatClaudeHttpError(res.status, body, state.keys.claudeModel));
        }
        const data = await res.json();
        const model = data.model || state.keys.claudeModel;
        setStatus('test-claude','ok',`연결 성공 · ${model} (${via})`);
      }
      if(service === 'gemini'){
        if(!String(state.keys.gemini||'').trim()) throw new Error('Gemini API 키를 입력해주세요.');
        const model = resolveGeminiModel();
        const { via } = await fetchGeminiGenerateContent(
          { contents:[{ parts:[{ text:'ping' }] }] },
          { model, persistProxyFallback:false }
        );
        setStatus('test-gemini','ok',`연결 성공 · ${model} (${via})`);
      }
      if(service === 'openai'){
        if(!String(state.keys.openaiApiKey||'').trim()){
          throw new Error('ChatGPT(OpenAI) API 키를 입력해주세요.');
        }
        const { res, via } = await fetchOpenAIChat({
          model: state.keys.openaiModel || 'gpt-5.6-terra',
          max_completion_tokens: 16,
          messages: [{ role:'user', content:'ping' }],
        });
        if(!res.ok){
          const body = await res.text().catch(()=> '');
          throw new Error(formatOpenAIHttpError(res.status, body));
        }
        const data = await res.json().catch(()=>({}));
        const model = data.model || state.keys.openaiModel;
        setStatus('test-openai','ok',`연결 성공 · ${model} (${via})`);
      }
      if(service === 'higgsfield'){
        const id = String(state.keys.higgsfieldKeyId||'').trim();
        const secret = String(state.keys.higgsfieldKeySecret||'').trim();
        if(!id || !secret) throw new Error('API Key ID와 Secret을 모두 입력해주세요. (웹 로그인과는 별개입니다)');
        // 실제 생성과 같은 경로로 확인해야 403을 미리 잡을 수 있습니다
        hfProxyState = null;
        migrateAllHfModelSlugs();
        let res, via;
        try{
          ({ res, via } = await hfFetch('files/generate-upload-url', {
            method:'POST',
            headers: hfHeaders(),
            body: JSON.stringify({ content_type:'image/png' })
          }, { allowDirect:true }));
        }catch(netErr){
          throw new Error(`네트워크 오류: ${netErr.message||netErr}. node sss-local-proxy.mjs 실행 후 다시 시도해 보세요.`);
        }
        if(!res.ok){
          const body = await res.text().catch(()=> '');
          throw new Error(hfErrorMessage(res.status, via, body, '연결 테스트'));
        }
        const charModel = state.keys.hfCharacterModel || DEFAULT_KEYS.hfCharacterModel;
        const proxyNote = via === '로컬 프록시'
          ? `로컬 프록시 경유 · 캐릭터 모델 ${charModel}`
          : '직접 호출은 연결만 확인됨. 영상·이미지 생성은 node sss-local-proxy.mjs 가 필요합니다.';
        setStatus('test-higgsfield','ok',`연결 성공 (${via}) · ${proxyNote}`);
      }
      if(service === 'coupang'){
        const result = await coupangSearch('테스트', 1);
        if(result.rCode && result.rCode !== '0') throw new Error(`${result.rCode}: ${result.rMessage || ''}`);
        setStatus('test-coupang','ok','연결 성공');
      }
      if(service === 'youtube'){
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=test&type=video&maxResults=1&key=${state.keys.youtubeApiKey}`);
        if(!res.ok){
          const body = await res.text().catch(()=>'');
          throw new Error(`HTTP ${res.status}: ${body.slice(0,150)}`);
        }
        setStatus('test-youtube','ok','연결 성공');
      }
      if(service === 'apify'){
        const res = await fetch(`https://api.apify.com/v2/acts/${state.keys.apifyTiktokActor}?token=${state.keys.apifyToken}`);
        if(!res.ok){
          const body = await res.text().catch(()=>'');
          throw new Error(`HTTP ${res.status}: ${body.slice(0,150)}`);
        }
        setStatus('test-apify','ok','연결 성공');
      }
      if(service === 'typecast'){
        const res = await fetch(typecastUrl('/v1/voices'), {
          headers: typecastHeaders()
        });
        if(!res.ok){
          const body = await res.text().catch(()=>'');
          throw new Error(`HTTP ${res.status}: ${body.slice(0,150) || '(API 키가 유효하지 않거나 유료 플랜이 필요할 수 있어요)'}`);
        }
        setStatus('test-typecast','ok',`연결 성공 (${state.keys.useWorkerProxy?'Worker 경유':'직접 호출'})`);
      }
    }catch(err){
      setStatus(`test-${service}`,'err', err.message);
    }
  }

  if(e.target.id === 'exportKeysBtn'){
    collectSettingsFromInputs();
    const blob = new Blob([JSON.stringify(state.keys, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'shopping-shorts-settings.json';
    a.click();
    setStatus('import-export','ok','설정 파일로 저장됨');
  }

  if(e.target.id === 'importKeysBtnTrigger'){
    document.getElementById('importKeysFile').click();
  }

  if(e.target.id === 'uploadZone' || e.target.closest('#uploadZone')){
    document.getElementById('fileInput').click();
    return;
  }

  // 제품 썸네일: ✕ 삭제 / 클릭 시 크게 보기
  const removeImgEl = e.target.closest?.('[data-remove-img]');
  if(removeImgEl){
    e.preventDefault();
    e.stopPropagation();
    const idx = Number(removeImgEl.dataset.removeImg);
    if(Number.isFinite(idx)){
      state.productImages.splice(idx, 1);
      render();
    }
    return;
  }
  const previewImgEl = e.target.closest?.('[data-preview-img]');
  if(previewImgEl){
    e.preventDefault();
    openProductImageLightbox(Number(previewImgEl.dataset.previewImg));
    return;
  }
  if(e.target.id === 'productImgLightbox' || e.target.classList?.contains('img-lightbox-close')){
    closeProductImageLightbox();
    return;
  }

  if(e.target.dataset.tiktokSearch){
    window.open(`https://www.tiktok.com/search?q=${encodeURIComponent(e.target.dataset.tiktokSearch)}`, '_blank');
  }

  const sourceTabEl = e.target.closest?.('[data-source-tab]');
  if(sourceTabEl?.dataset.sourceTab){
    state.sourceTab = sourceTabEl.dataset.sourceTab;
    render();
    return;
  }

  // 영상 소재 찾기 — 트랙 (자식 클릭에도 즉시 반영)
  const trackEl = e.target.closest?.('[data-hunt-track]');
  if(trackEl?.dataset.huntTrack){
    const hunt = syncHuntKeywordFromInputs();
    hunt.track = trackEl.dataset.huntTrack;
    if(hunt.track === 'celeb'){
      hunt.enabled = { youtube:false, tiktok:true, coupang:!!hunt.enabled?.coupang, douyin:false, xhs:false };
    }else if(hunt.track === 'pet'){
      hunt.enabled = { youtube:true, tiktok:true, coupang:false, douyin:false, xhs:false };
    }else{
      hunt.enabled = { youtube:false, tiktok:true, coupang:true, douyin:false, xhs:false };
    }
    render();
    return;
  }

  // 기간 칩
  const periodEl = e.target.closest?.('[data-hunt-period]');
  if(periodEl?.dataset.huntPeriod){
    const hunt = syncHuntKeywordFromInputs();
    hunt.period = periodEl.dataset.huntPeriod;
    document.querySelectorAll('.hunt-period').forEach(el=>{
      el.classList.toggle('active', el.dataset.huntPeriod === hunt.period);
    });
    const meta = document.querySelector('.card .ax-meta');
    if(meta){
      const def = huntPeriodDef(hunt.period);
      meta.innerHTML = `선택: <b>${escHtml(def.label)}</b> — ${escHtml(def.hint)}`;
    }
    return;
  }

  // 조회수 상위 개수 10/20/30/50
  const limitEl = e.target.closest?.('[data-hunt-limit]');
  if(limitEl?.dataset.huntLimit){
    const hunt = syncHuntKeywordFromInputs();
    const n = Number(limitEl.dataset.huntLimit);
    hunt.limit = [10,20,30,50].includes(n) ? n : 20;
    document.querySelectorAll('.hunt-limit').forEach(el=>{
      el.classList.toggle('active', Number(el.dataset.huntLimit) === hunt.limit);
    });
    return;
  }

  // 플랫폼 토글 (하나/여러 선택)
  const platToggleEl = e.target.closest?.('[data-hunt-plat-toggle]');
  if(platToggleEl?.dataset.huntPlatToggle){
    const hunt = syncHuntKeywordFromInputs();
    const id = platToggleEl.dataset.huntPlatToggle;
    if(!hunt.enabled) hunt.enabled = {};
    hunt.enabled[id] = !hunt.enabled[id];
    platToggleEl.classList.toggle('active', !!hunt.enabled[id]);
    return;
  }

  if(e.target.id === 'huntSelectAllPlats'){
    const hunt = syncHuntKeywordFromInputs();
    hunt.enabled = { youtube:false, coupang:true, tiktok:true, douyin:true, xhs:true };
    document.querySelectorAll('.hunt-plat-toggle').forEach(el=> el.classList.add('active'));
    return;
  }
  if(e.target.id === 'huntClearPlats'){

  if(e.target.id === 'autoSubtitleBtn'){

      const b64 = await blobToBase64(blob);
      const res = await fetch(geminiUrl('gemini-3.5-flash'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ parts:[
          { text:`이 오디오를 듣고 한국어 자막을 만들어줘. 말하는 구간마다 시작/끝 시간(초, 소수 1자리)과

          한 자막은 화면에서 2줄 안에 읽히도록 짧게 끊어줘:

          { inline_data:{ mime_type: blob.type||'audio/mp3', data: b64 } }

  {
    const selEl = e.target.closest?.('[data-select-sub]');

  if(e.target.id === 'backToEditPreview'){

  if(e.target.closest('[data-nle-panel]')){

  // 툴바 단축 버튼: 우측 속성 패널의 해당 탭/워크스페이스로 바로 이동
  if(e.target.id === 'nleSpeedBtn' || e.target.id === 'nleTransitionBtn'){

      state.selectedEdlIndex = 0;
      state.tlFocus = 'clip';

      if(!(state.subtitles && state.subtitles.length)){
        state.subtitles = computeTimelineFromEDL(state.sourceEDL, false);

    } else {

      state.selectedEdlIndex = -1;
      state.tlFocus = 'clip';
      state.tlEditMode = 'manual';

  if(e.target.dataset.tlZoom){

  if(e.target.closest('[data-seek-ruler]')){

  if(['nlePlayPause','nleSkipStart','nleSkipEnd','nleStepBack','nleStepFwd'].includes(e.target.id)){

      if(v.paused){
        v.play().then(()=>{ e.target.textContent = '⏸'; }).catch(()=>{
          // 브라우저 자동재생 정책 시 잠시 음소거 후 재생, 볼륨 UI는 유지
          const prevMuted = state.previewMuted;
          v.muted = true;
          v.play().then(()=>{
            e.target.textContent = '⏸';
            if(!prevMuted && (state.previewVolume??1) > 0){
              v.muted = false;
              applyPreviewVolume(v);
            }
          }).catch(()=>{});
        });
      } else { v.pause(); e.target.textContent = '▶'; }
    }
    if(e.target.id === 'nleSkipStart') v.currentTime = 0;
    if(e.target.id === 'nleSkipEnd') v.currentTime = v.duration || 0;
    if(e.target.id === 'nleStepBack') v.currentTime = Math.max(0, v.currentTime - 1);
    if(e.target.id === 'nleStepFwd') v.currentTime = Math.min(v.duration||0, v.currentTime + 1);
  }

  if(e.target.id === 'nleSplitBtn'){
    // 재생헤드가 걸친 클립을 두 개로 분할
    const PPSsec = state.playhead || 0;
    let target = -1, offsetInClip = 0, clipTlStart = 0;
    let packed = 0;
    for(let i=0;i<state.sourceEDL.length;i++){
      const eClip = state.sourceEDL[i];
      if((eClip.track||1) !== 1) continue;
      const dur = clipOutDur(eClip);
      const startTl = (isTlManual() && eClip.at != null) ? Number(eClip.at) : packed;
      if(PPSsec > startTl && PPSsec < startTl + dur){
        target = i; offsetInClip = PPSsec - startTl; clipTlStart = startTl; break;
      }
      if(!(isTlManual() && eClip.at != null)) packed += dur;
    }
    if(target < 0){ alert('재생헤드를 클립 위(눈금자 클릭)로 옮긴 뒤 잘라주세요.'); return; }
    const c = state.sourceEDL[target];
    const splitAt = Number((c.start + offsetInClip * (c.speed || 1)).toFixed(1));
    const firstDur = clipOutDur({ ...c, end: splitAt });
    const second = { ...c, start: splitAt, at: Number((clipTlStart + firstDur).toFixed(2)) };
    state.sourceEDL[target] = { ...c, end: splitAt, at: clipTlStart };
    state.sourceEDL.splice(target+1, 0, second);
    state.selectedEdlIndex = target;
    state.tlFocus = 'clip';
    render();
  }

    if(state.workspace === 'graphic'){

      if(!state.subtitles) state.subtitles = [];
      if(state.selectedSubIndex == null && state.subtitles.length) state.selectedSubIndex = 0;

      render();

    return;
  }
  if(e.target.id === 'inspSubPosReset'){

      warm:  { brightness:0.03,  contrast:1.05, saturation:1.15, gamma:1,    temp:0.12, tint:0 },
      cool:  { brightness:0.02,  contrast:1.05, saturation:1.05, gamma:1,    temp:-0.12,tint:0 },
      bright:{ brightness:0.12,  contrast:1.1,  saturation:1.1,  gamma:1.15, temp:0.02, tint:0 },

    };

    // AI 분석은 용량·속도 문제로 앞쪽 MAX_AI_ANALYZE개까지만 처리

    setStatus('source-analyze','loading', `영상 분석 중 (0/${targets.length})...`);
    try{

      setStatus('source-analyze','ok', '편집안 생성 완료');

    try{

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

document.addEventListener('input', (e)=>{
  if(e.target.id === 'projectName'){ state.projectName = e.target.value; return; }
  if(e.target.id === 'sourceScriptInput'){ state.sourceScript = e.target.value; return; }
  if(e.target?.dataset?.castField || e.target?.dataset?.propField){
    collectWorldAssetsFromUI();
    return;
  }
  if(e.target.id === 'castCountInput'){
    // 입력 중에는 칸 수를 바로 맞추지 않고, change에서 sync
    state.castCount = Math.max(1, Math.min(5, Number(e.target.value) || 1));
    return;
  }
  if(e.target.id === 'productBriefInput'){
    state.productDescription = e.target.value;
    // 스토리 입력과 미러링: 어느 쪽 텍스트 상자를 써도 자동 파이프라인이 같은 원본을 본다.
    if(!state.storyInput || state.storyInput === state._lastMirroredStory){
      state.storyInput = e.target.value;
      state._lastMirroredStory = e.target.value;
    }
    const empty = !state.productDescription.trim();
    const autoBtn = document.getElementById('productAutoBtn');
    const prepBtn = document.getElementById('productPrepBtn');
    if(autoBtn) autoBtn.disabled = empty;
    if(prepBtn) prepBtn.disabled = empty;
    return;
  }
  if(e.target.id === 'storyInputBox'){
    state.storyInput = e.target.value;
    if(!state.productDescription || state.productDescription === state._lastMirroredProduct){
      state.productDescription = e.target.value;
      state._lastMirroredProduct = e.target.value;
    }
    // 입력 중에는 재렌더하지 않으므로(캐럿 유지) 버튼 잠금만 즉시 풀어줌
    const empty = !state.storyInput.trim();
    const planBtn = document.getElementById('storyPlanBtn');
    const autoBtn = document.getElementById('storyAutoBtn');
    if(planBtn) planBtn.disabled = empty;
    if(autoBtn) autoBtn.disabled = empty;
    return;
  }
  if(e.target.id === 'sourceTargetDuration'){ state.sourceTargetDuration = Number(e.target.value) || state.sourceTargetDuration; return; }
  if(e.target.id === 'nlePreviewVol'){
    state.previewVolume = Math.max(0, Math.min(1, Number(e.target.value) || 0));
    if(state.previewVolume > 0) state.previewMuted = false;
    applyPreviewVolume(document.getElementById('nlePreviewVideo'));
    const label = document.querySelector('.vp-vol-label');
    if(label) label.textContent = Math.round(state.previewVolume * 100) + '%';
    const mute = document.getElementById('nleMuteBtn');
    if(mute) mute.textContent = (state.previewMuted || state.previewVolume <= 0) ? '🔇' : '🔊';
    return;
  }
  if(e.target.id === 'tlZoomSlider'){
    applyTimelineZoom('set', { value: e.target.value });
    return;
  }
  // 클립 효과 슬라이더/숫자창 (속도·색보정·변환·오디오) — 둘 중 어느 쪽을 조작해도 서로 동기화됨
  const clipProps = {
    inspSpeed:'speed', inspBrightness:'brightness',
    inspContrast:'contrast', inspSaturation:'saturation',
    inspGamma:'gamma', inspTemp:'temp', inspTint:'tint',
    inspTx:'tx', inspTy:'ty', inspScaleX:'scaleX', inspScaleY:'scaleY',
    inspRotation:'rotation', inspOpacity:'opacity', inspClipVol:'volume'
  };
  const clipLiveDisplay = {
    inspClipVol: v=> v<=-39.5 ? '-∞' : v.toFixed(1),
  };
  const syncClipCtrl = (controlId, val)=>{
    const clip = state.sourceEDL?.[state.selectedEdlIndex];
    if(!clip || !clipProps[controlId]) return false;
    // 화면엔 %(불투명도·속도)나 dB(볼륨)로 보여주고, 내부 저장은 배수로 환산
    const storeVal = controlId === 'inspClipVol' ? dbToRatio(val)
      : (controlId === 'inspOpacity' || controlId === 'inspSpeed') ? val/100
      : val;
    clip[clipProps[controlId]] = storeVal;
    // 가로 세로 비율 유지가 켜져 있으면 W을 바꿀 때 H도 같이 따라감
    if(controlId === 'inspScaleX' && clip.lockAspect){
      clip.scaleY = val;
      const hRange = document.getElementById('inspScaleY'), hNum = document.getElementById('inspScaleYNum');
      if(hRange) hRange.value = val;
      if(hNum) hNum.value = Number(val).toFixed(0);
    }
    // 슬라이더 ↔ 숫자창 값을 서로 맞춰줌 (지금 타이핑 중인 칸은 건드리지 않음)
    const rangeEl = document.getElementById(controlId), numEl = document.getElementById(controlId+'Num');
    if(rangeEl && document.activeElement !== rangeEl) rangeEl.value = val;
    if(numEl && document.activeElement !== numEl){
      numEl.value = clipLiveDisplay[controlId] ? clipLiveDisplay[controlId](val) : Number(val).toFixed(Number(numEl.dataset.decimals||0));
    }
    if(['tx','ty','scaleX','scaleY','rotation','opacity'].includes(clipProps[controlId])){
      applyXformToPreviewEl(document.getElementById('vpMediaLayer'), clip);
    }
    return true;
  };
  if(clipProps[e.target.id] && e.target.tagName === 'INPUT' && e.target.type === 'range'){
    syncClipCtrl(e.target.id, Number(e.target.value));
    return;
  }
  if(e.target.matches('input[type="number"][data-pair]')){
    const pairId = e.target.dataset.pair;
    let v = Number(e.target.value);
    if(Number.isNaN(v)) return;
    const min = Number(e.target.min), max = Number(e.target.max);
    if(min !== undefined && v < min) v = min;
    if(max !== undefined && v > max) v = max;
    syncClipCtrl(pairId, v);
    return;
  }
  // 오디오 볼륨
  if(e.target.id === 'inspVoiceVol'){
    state.voiceVolume = Number(e.target.value);
    const lb = e.target.previousElementSibling?.querySelector('b');
    if(lb) lb.textContent = `${Math.round(state.voiceVolume*100)}%`;
    return;
  }
  if(e.target.id === 'inspBgmVol'){
    state.bgmVolume = Number(e.target.value);
    const lb = e.target.previousElementSibling?.querySelector('b');
    if(lb) lb.textContent = `${Math.round(state.bgmVolume*100)}%`;
    return;
  }
  // 자막/타이틀 스타일 — 미리보기 실시간 반영
  if(e.target.dataset.styleTarget && e.target.dataset.styleProp){
    const st = e.target.dataset.styleTarget==='sub' ? state.subStyle : state.titleStyle;
    const prop = e.target.dataset.styleProp;
    if(e.target.type==='checkbox') st[prop] = e.target.checked;
    else if(e.target.type==='range' || e.target.type==='number') st[prop] = Number(e.target.value);
    else if(prop==='bold') st[prop] = e.target.value === '1';
    else st[prop] = e.target.value;
    st.activePreset = null;
    if(prop === 'position'){
      const d = defaultCaptionPos(st.position);
      st.x = d.x; st.y = d.y;
      const sub = state.subtitles?.[state.selectedSubIndex];
      if(sub){ delete sub.x; delete sub.y; }
    }
    if(prop === 'fontSize'){
      const lb = document.getElementById('styleFontSizeLabel');
      if(lb) lb.textContent = `크기 ${st.fontSize}px`;
    }
    if(prop === 'outlineWidth'){
      const lb = document.getElementById('styleOutlineLabel');
      if(lb) lb.textContent = `외곽선 두께 ${st.outlineWidth}px`;
    }
    if(prop === 'bg'){ render(); return; }
    // 배경 on/off·프리셋 카드 활성 표시 갱신
    const card = document.querySelector(`.vp-style-card.active`);
    if(card) card.classList.remove('active');
    const matched = matchStylePresetKey(st);
    if(matched) document.querySelector(`.vp-style-card[data-style-preset="${matched}"]`)?.classList.add('active');
    refreshCaptionOverlay();
    return;
  }
  if(e.target.id === 'inspSubText'){
    const sub = state.subtitles?.[state.selectedSubIndex];
    if(sub){
      sub.text = e.target.value;
      refreshCaptionOverlay();
    }
    return;
  }
  if(e.target.id === 'inspSubX' || e.target.id === 'inspSubY'){
    const sub = state.subtitles?.[state.selectedSubIndex];
    if(sub){
      const v = Math.max(4, Math.min(96, Number(e.target.value) || 50));
      if(e.target.id === 'inspSubX'){
        sub.x = v;
        const lb = document.getElementById('inspSubXLabel');
        if(lb) lb.textContent = `좌우 ${Math.round(v)}%`;
      }else{
        sub.y = v;
        const lb = document.getElementById('inspSubYLabel');
        if(lb) lb.textContent = `상하 ${Math.round(v)}%`;
      }
      refreshCaptionOverlay();
    }
    return;
  }
  if(e.target.id === 'inspSubStart' || e.target.id === 'inspSubEnd'){
    const sub = state.subtitles?.[state.selectedSubIndex];
    if(sub){
      if(e.target.id === 'inspSubStart') sub.start = Number(e.target.value) || 0;
      else sub.end = Number(e.target.value) || 0;
    }
    return;
  }
  if(e.target.id === 'in-google-tts-rate'){
    const label = document.getElementById('rateLabel');
    if(label) label.textContent = parseFloat(e.target.value).toFixed(2) + 'x';
  }
  if(!state.sourceEDL) return;
  const idx = state.selectedEdlIndex ?? 0;
  if(!state.sourceEDL[idx]) return;
  if(e.target.id === 'inspAt') state.sourceEDL[idx].at = Number(e.target.value) || 0;
  if(e.target.id === 'inspOvScale'){
    state.sourceEDL[idx].ovScale = Number(e.target.value);
    const lb = e.target.previousElementSibling?.querySelector('b');
    if(lb) lb.textContent = `${Math.round(Number(e.target.value)*100)}%`;
    return;
  }
  if(e.target.id === 'inspLine') state.sourceEDL[idx].line = e.target.value;
  if(e.target.id === 'inspStart') state.sourceEDL[idx].start = Number(e.target.value) || 0;
  if(e.target.id === 'inspEnd') state.sourceEDL[idx].end = Number(e.target.value) || 0;

  if(state.subtitles){
    if(e.target.dataset.subStart !== undefined){
      const i = Number(e.target.dataset.subStart);
      if(state.subtitles[i]) state.subtitles[i].start = Number(e.target.value) || 0;
    }
    if(e.target.dataset.subEnd !== undefined){
      const i = Number(e.target.dataset.subEnd);
      if(state.subtitles[i]) state.subtitles[i].end = Number(e.target.value) || 0;
    }
    if(e.target.dataset.subText !== undefined){
      const i = Number(e.target.dataset.subText);
      if(state.subtitles[i]){
        state.subtitles[i].text = e.target.value;
        if(state.selectedSubIndex === i) refreshCaptionOverlay();
      }
    }
  }
});

    const cast = ensureWorldAssets().cast.find(c=>c.id===id);
    if(!cast) return;
    if(cast.imageUrl?.startsWith('blob:') && cast.uploaded){
      try{ URL.revokeObjectURL(cast.imageUrl); }catch(_){}
    }
    cast.imageUrl = URL.createObjectURL(e.target.files[0]);
    cast.uploaded = true;
    cast.source = 'upload';
    cast.draw = true;
    setStatus('world-assets','ok', `수동 캐릭터 첨부: ${e.target.files[0].name}`);
    render();
    return;
  }
  if(e.target?.dataset?.propUpload && e.target.files?.length){
    const id = e.target.dataset.propUpload;
    const prop = ensureWorldAssets().props.find(p=>p.id===id);
    if(!prop) return;
    if(prop.imageUrl?.startsWith('blob:') && prop.uploaded){
      try{ URL.revokeObjectURL(prop.imageUrl); }catch(_){}

    const file = e.target.files[0];
    prop.imageUrl = URL.createObjectURL(file);

    readCastCountFromUI();

    return;

    state.genPropsWithCast = !!e.target.checked;

    state.drawHero = !!e.target.checked;

  if(e.target?.dataset?.heroField === 'source'){
    state.heroSource = e.target.value === 'upload' ? 'upload' : 'ai';

  const isClipCtrlChange = ['inspSpeed','inspBrightness','inspContrast','inspSaturation','inspGamma','inspTemp','inspTint',

  if(isClipCtrlChange){
    render(); // 드래그·타이핑을 마치면 초기화 버튼 표시 등 전체 갱신
    return;

  if(e.target.dataset.styleTarget && e.target.dataset.styleProp){
    const st = e.target.dataset.styleTarget==='sub' ? state.subStyle : state.titleStyle;
    const prop = e.target.dataset.styleProp;
    if(e.target.type==='checkbox') st[prop] = e.target.checked;
    else if(e.target.type==='range' || e.target.type==='number') st[prop] = Number(e.target.value);
    else if(prop==='bold') st[prop] = e.target.value === '1';
    else st[prop] = e.target.value;
    if(prop === 'position'){
      const d = defaultCaptionPos(st.position);
      st.x = d.x; st.y = d.y;
      const sub = state.subtitles?.[state.selectedSubIndex];
      if(sub){ delete sub.x; delete sub.y; }
    }
    if(prop === 'bg'){ render(); return; }
    refreshCaptionOverlay();
    return;
  }
  if(e.target.id === 'inspSubStart' || e.target.id === 'inspSubEnd'
    || e.target.dataset.subStart !== undefined || e.target.dataset.subEnd !== undefined){
    // 자막 시간만 변경 — 영상 EDL/길이는 절대 건드리지 않음
    if(e.target.dataset.subStart !== undefined){
      const i = Number(e.target.dataset.subStart);
      if(state.subtitles?.[i]) state.subtitles[i].start = Number(e.target.value) || 0;
    }else if(e.target.dataset.subEnd !== undefined){
      const i = Number(e.target.dataset.subEnd);
      if(state.subtitles?.[i]) state.subtitles[i].end = Number(e.target.value) || 0;
    }else{
      const sub = state.subtitles?.[state.selectedSubIndex];
      if(sub){
        if(e.target.id === 'inspSubStart') sub.start = Number(e.target.value) || 0;
        else sub.end = Number(e.target.value) || 0;
      }
    }
    render();
    return;
  }
  // 클립 인스펙터만 반영 — 자막 트랙은 절대 재생성하지 않음
  if(['inspLine','inspStart','inspEnd','inspAt'].includes(e.target.id)){
    const clip = state.sourceEDL?.[state.selectedEdlIndex];
    if(e.target.id === 'inspAt' && clip){
      clip.at = Number(e.target.value) || 0;
    }
    state.tlFocus = 'clip';
    render();
    return;
  }
  if(e.target.id === 'importKeysFile'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const loaded = JSON.parse(reader.result);
        state.keys = { ...state.keys, ...loaded };
        setStatus('import-export','ok','설정 불러오기 완료');
        render();
      }catch(err){
        setStatus('import-export','err','파일을 읽을 수 없어요 (JSON 형식 확인)');
      }
    };
    reader.readAsText(file);
    return;
  }
  if(e.target.id === 'typecastVoiceSelect' || e.target.id === 'prodTypecastVoice'
    || e.target.id === 'prodNarrationMode' || e.target.id === 'prodNarrationEmotion'
    || e.target.id === 'prodNarrationTempo'){
    if(e.target.id === 'typecastVoiceSelect' || e.target.id === 'prodTypecastVoice'){
      state.keys.selectedTypecastVoice = e.target.value;
    }
    if(e.target.id === 'prodNarrationMode') state.keys.narrationMode = e.target.value;
    if(e.target.id === 'prodNarrationEmotion') state.keys.narrationEmotion = e.target.value;
    if(e.target.id === 'prodNarrationTempo') state.keys.narrationTempo = parseFloat(e.target.value) || 1.15;
    persistNarrationSettings();
    return;
  }
  if(e.target.matches?.('[data-audio-mode],[data-line-edit]')){
    collectProductionOptionsFromUI();
    return;
  }
  if(e.target.id === 'inspVideo'){
    if(state.sourceEDL && state.sourceEDL[state.selectedEdlIndex]){
      state.sourceEDL[state.selectedEdlIndex].videoIndex = Number(e.target.value);
      render();
    }
    return;
  }
  if(e.target.id === 'burnSubtitles'){
    state.burnSubtitles = e.target.checked;
    return;
  }
  if(e.target.id === 'googleVoiceSelectVoiceStep'){
    state.keys.googleTtsVoice = e.target.value;
    return;
  }

  if(e.target.id === 'visualStyle'){
    state.visualStyle = e.target.value;
    return;
  }

  if(e.target.id === 'categoryType'){
    state.categoryType = e.target.value;
    state.productDescription = document.getElementById('productDesc')?.value || state.productDescription;
    state.reviewText = document.getElementById('reviewText')?.value || state.reviewText;
    render();
    return;
  }
  if(e.target.id === 'huntKeywordInput'){
    ensureSourceHunt().keyword = e.target.value.trim();
    return;
  }
  if(e.target.id === 'heroType'){
    state.heroType = e.target.value === 'animal' ? 'animal' : 'human';
    render();
    return;
  }
  if(e.target.id === 'heroAnimalSpecies' || e.target.id === 'heroAnimalSpeciesInline'){
    state.heroAnimalSpecies = e.target.value;
    return;
  }
  if(e.target.id === 'animalHeroPresetCheck'){
    state.heroType = e.target.checked ? 'animal' : 'human';
    render();
    return;
  }
  if(e.target.id === 'ytMaterialKw'){
    ensureYtMaterial().keyword = e.target.value.trim();
    return;
  }
  if(e.target.id === 'ytMinViews'){
    ensureYtMaterial().minViews = Number(e.target.value)||0;
    return;
  }
  if(e.target.id === 'sourceVideoInput'){
    const files = Array.from(e.target.files);
    const remaining = MAX_SOURCE_VIDEOS - state.sourceVideos.length;
    if(remaining <= 0){ alert(`최대 ${MAX_SOURCE_VIDEOS}개까지만 업로드할 수 있어요.`); return; }
    if(files.length > remaining){
      alert(`최대 ${MAX_SOURCE_VIDEOS}개까지만 가능해서 앞쪽 ${remaining}개만 추가했어요.`);
    }
    const before = state.sourceVideos.length;
    const refs = state.petSourceRefs || [];
    const usedRefIdx = new Set(refs.map((r,i)=> r._matched ? i : -1).filter(i=>i>=0));
    const pickRefForFile = (file)=>{
      // 1) 파일 이름에 참조 제목 토큰이 하나라도 들어있으면 그 참조 선택
      const nm = String(file.name||'').toLowerCase();
      for(let i=0; i<refs.length; i++){
        if(usedRefIdx.has(i)) continue;
        const title = String(refs[i].title||'').toLowerCase();
        const tokens = title.split(/\s+/).filter(t=>t.length>=3);
        if(tokens.some(t => nm.includes(t))){ usedRefIdx.add(i); return refs[i]; }
      }
      // 2) 순서 매칭 — 매칭 안 된 첫 참조
      for(let i=0; i<refs.length; i++){
        if(!usedRefIdx.has(i)){ usedRefIdx.add(i); return refs[i]; }
      }
      return null;
    };
    files.slice(0, remaining).forEach(file=>{
      const isImage = file.type.startsWith('image/');
      const ref = !isImage ? pickRefForFile(file) : null;
      const entry = { file, name: ref?.title ? ref.title.slice(0,80) : file.name, url: URL.createObjectURL(file), isImage };
      if(ref){
        entry.refUrl = ref.url;
        entry.refThumbnail = ref.thumbnail;
        entry.refPlatform = ref.platform;
        entry.refChannel = ref.channel;
        ref._matched = true;
      }
      state.sourceVideos.push(entry);
    });
    // 미디어함에만 추가 — 미리보기는 타임라인에 올린 뒤 표시
    if(state.activeSourceIndex == null && state.sourceVideos.length > before){
      state.activeSourceIndex = before;
    }
    state.previewMode = 'timeline';
    // 길이 메타데이터 미리 읽기
    for(let i = before; i < state.sourceVideos.length; i++){
      if(!state.sourceVideos[i].isImage) ensureVideoDuration(i).then(()=>{
        const badge = document.querySelector(`[data-dur-index="${i}"]`)?.parentElement?.querySelector('.vp-media-badge');
        if(badge && state.sourceDurations[i]) badge.textContent = fmtDur(state.sourceDurations[i]);
      });
    }
    render();
    return;
  }

  if(e.target.id === 'sourceBgmInput'){
    const file = e.target.files[0];
    if(!file) return;
    state.sourceBgm = { file, name: file.name, url: URL.createObjectURL(file) };
    return;
  }

  if(e.target.id === 'importSrtFile'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        state.subtitles = parseSrtContent(reader.result);
        setStatus('subtitle-io','ok', `${state.subtitles.length}개 자막 불러옴`);
        render();
        scrollSubTrackIntoView();
      }catch(err){
        setStatus('subtitle-io','err','SRT 파싱 실패 — 파일 형식을 확인해주세요');
      }
    };
    reader.readAsText(file);
    return;
  }

  if(e.target.id === 'voiceFileInput'){
    const file = e.target.files[0];
    if(!file) return;
    state.voiceUrl = URL.createObjectURL(file);
    state.done.voice = true;
    setStatus('voice','ok','녹음 파일 등록됨');
    render();
    return;
  }


  if(e.target.id === 'productAutoImageInput'){
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    let loaded = 0;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const [meta, b64] = reader.result.split(',');
        const mime = meta.match(/data:(.*);base64/)[1];
        state.productImages.push({ b64, mime });
        state.productImageUrls = [];
        loaded++;
        if(loaded === files.length) render();
      };
      reader.readAsDataURL(file);
    });
    return;
  }

  if(e.target.id === 'fileInput'){
    const files = Array.from(e.target.files);
    let loaded = 0;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const [meta, b64] = reader.result.split(',');
        const mime = meta.match(/data:(.*);base64/)[1];
        state.productImages.push({ b64, mime });
        loaded++;
        if(loaded === files.length) render();
      };
      reader.readAsDataURL(file);
    });
  }
});

/* ============================================================
   쿠팡파트너스 오픈API — HMAC-SHA256 서명 (Web Crypto API 사용)
============================================================ */
async function hmacSha256Hex(secret, message){
  if(!secret || !String(secret).trim()){
    throw new Error('쿠팡 Secret Key가 비어 있어요. API 설정 → 쿠팡파트너스에 Secret Key를 입력·저장한 뒤 다시 검색하세요.');
  }
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(String(secret).trim()), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function coupangDatetime(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  const yy = pad(d.getUTCFullYear() % 100);
  const MM = pad(d.getUTCMonth()+1);
  const dd = pad(d.getUTCDate());
  const HH = pad(d.getUTCHours());
  const mm = pad(d.getUTCMinutes());
  const ss = pad(d.getUTCSeconds());
  return `${yy}${MM}${dd}T${HH}${mm}${ss}Z`;
}

function normalizeCoupangQuery(raw){
  const t = String(raw || '').trim();
  if(!t) return { query: '' };
  if(/https?:\/\/\S*coupang\.com/i.test(t) || /link\.coupang\.com/i.test(t)){
    return { error: '쿠팡 상품 URL로는 검색할 수 없어요.\n쿠팡에서 상품 제목을 복사해 붙여넣어 주세요.' };
  }
  // 제목 앞뒤 잡텍스트 정리
  return { query: t.replace(/^["'\s]+|["'\s]+$/g, '').slice(0, 200) };
}

function titleMatchScore(query, name){
  const q = String(query||'').toLowerCase().replace(/\s+/g,' ').trim();
  const n = String(name||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(!q || !n) return 0;
  if(n === q) return 100;
  if(n.includes(q)) return 95;
  if(q.includes(n) && n.length >= 8) return 90;
  const tokens = q.split(/[\s,./\-+|()\[\]{}]+/).filter(t => t.length > 1);
  if(!tokens.length) return 0;
  const hits = tokens.filter(t => n.includes(t)).length;
  return Math.round((hits / tokens.length) * 85);
}

async function fetchImageAsBase64(imageUrl){
  if(!imageUrl) return null;
  // 1) 직접 fetch
  try{
    const res = await fetch(imageUrl, { mode:'cors' });
    if(res.ok){
      const blob = await res.blob();
      return { b64: await blobToBase64(blob), mime: blob.type || 'image/jpeg' };
    }
  }catch(_){}
  // 2) Worker 이미지 프록시
  if(state.keys.useWorkerProxy && state.keys.workerProxyUrl){
    try{
      const proxy = `${state.keys.workerProxyUrl.replace(/\/$/,'')}/image-proxy?url=${encodeURIComponent(imageUrl)}`;
      const res = await fetch(proxy);
      if(res.ok){
        const blob = await res.blob();
        return { b64: await blobToBase64(blob), mime: blob.type || 'image/jpeg' };
      }
    }catch(_){}
  }
  return null;
}

function buildCoupangProductDescription(p){
